<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle de gastos por fala. Cada pessoa com sua conta e seus dados no próprio Google Drive.">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.gate-in{margin:auto;width:100%;max-width:380px;display:flex;flex-direction:column;gap:11px;text-align:center}
.gate-in img{align-self:center}
.gate-in h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 0 0}
.gate-in p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.gate-in .btn{justify-content:center;padding:11px 16px;font-size:15px}
.gate-s{font-size:12.5px!important;color:var(--ink-3)!important}
.gate-or{font-size:12px;color:var(--ink-3);margin:2px 0}
.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.gbtn:hover{background:var(--surface-2);filter:none}
.gbtn svg{width:18px;height:18px;flex:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chipbtn i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.chipbtn.good i{background:var(--good)} .chipbtn.warn i{background:var(--warn)} .chipbtn.bad i{background:var(--bad)}
.chipbtn.busy i{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@media (max-width:520px){.chipbtn span{display:none}.chipbtn{padding:8px}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;
  font-weight:600;font-size:13px;cursor:pointer;flex:none}
</style>
<title>Caderneta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== tokens: ardósia e azul-aço. Categórica validada (ΔE adjacente 20.9 protan) ===== */
:root{
  --paper:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E2E7EE;
  --line:#D9DFE7; --line-2:#C2CAD6; --grid:#E6EBF1;
  --ink:#0F172A; --ink-2:#5A6676; --ink-3:#818C9B;
  --accent:#2563A8; --accent-soft:#E3ECF6; --accent-line:#9CBBDC;
  --good:#0F7B54; --good-soft:#DDEFE7;
  --warn:#9A6B10; --warn-soft:#F5EAD1;
  --bad:#B4342A;  --bad-soft:#F7E1DE;
  --c1:#2563A8; --c2:#B0641E; --c3:#6B4E9E;
  --on-accent:#FFFFFF; --on-c:#FFFFFF;
  --r:10px; --r-sm:7px;
  --f:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1117; --surface:#161B22; --surface-2:#1C2430; --surface-3:#242D3A;
  --line:#28323F; --line-2:#38434F; --grid:#212B36;
  --ink:#E6EDF3; --ink-2:#8B98A8; --ink-3:#6E7B8B;
  --accent:#5B9BD5; --accent-soft:#16263A; --accent-line:#2E5478;
  --good:#4ADE9E; --good-soft:#0E2A20;
  --warn:#E0B45F; --warn-soft:#2E2513;
  --bad:#F1867A;  --bad-soft:#33201D;
  --c1:#4A8AC6; --c2:#BE7A30; --c3:#9077CE;
  --on-accent:#08131F; --on-c:#08131F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#0D1117; --surface:#161B22; --surface-2:#1C2430; --surface-3:#242D3A;
  --line:#28323F; --line-2:#38434F; --grid:#212B36;
  --ink:#E6EDF3; --ink-2:#8B98A8; --ink-3:#6E7B8B;
  --accent:#5B9BD5; --accent-soft:#16263A; --accent-line:#2E5478;
  --good:#4ADE9E; --good-soft:#0E2A20;
  --warn:#E0B45F; --warn-soft:#2E2513;
  --bad:#F1867A;  --bad-soft:#33201D;
  --c1:#4A8AC6; --c2:#BE7A30; --c3:#9077CE;
  --on-accent:#08131F; --on-c:#08131F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== esqueleto ===== */
.app{display:block}
.side{display:none}
main{padding:0 16px calc(76px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:10px;height:54px;max-width:680px;margin:0 auto;padding:0 16px}
.brand{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button,.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.mnav button:hover,.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.mnav .lbl{font-family:var(--f-m);font-size:11.5px;font-weight:500;padding:0 8px;min-width:76px;
  text-align:center;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:18px 12px;
    background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  .side-brand{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:6px 10px 16px;color:var(--ink)}
  .side-brand span{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:.02em}
  .side a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);
    color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;border:0;
    background:none;width:100%;text-align:left}
  .side a:hover{background:var(--surface-2);color:var(--ink)}
  .side a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side a svg{width:17px;height:17px;flex:none}
  .side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;
    color:var(--ink-3);line-height:1.5}
  .tabs{display:none}
  main{max-width:1240px;padding:0 28px 40px}
  .top{background:var(--paper)}
  .top-in{max-width:1240px;padding:0 28px;height:62px}
  .brand{display:none}
  .top-title{display:block!important;font-size:19px;font-weight:600;letter-spacing:-.015em;flex:1}
}
.top-title{display:none}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;cursor:pointer;padding:8px 3px 9px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  border-top:2px solid transparent;margin-top:-1px}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}

.panel{padding:18px 0 8px}
.panel[hidden]{display:none}
.sec{margin:0 0 24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec-a{font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:500;padding:0}
.sec-a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:16px}
@media (min-width:960px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g23{grid-template-columns:1.5fr 1fr}
}

/* ===== figuras ===== */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
  box-shadow:var(--shadow)}
.hero-l{font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hero-v{font-size:48px;line-height:1.02;font-weight:600;letter-spacing:-.03em;display:block}
@media (min-width:960px){.hero-v{font-size:56px}}
.hero-s{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);min-width:0}
.tile-l{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.tile-v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;display:block}
.tile-d{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:5px}
.tile-d b{font-weight:600;font-family:var(--f-m);font-size:11px}
.up{color:var(--bad)} .down{color:var(--good)} .flat{color:var(--ink-3)}

/* medidor: trilho é passo claro da mesma rampa */
.meter{height:9px;border-radius:5px;background:var(--accent-soft);overflow:hidden;display:flex;
  border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter-s{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink-3);
  margin-top:6px;font-family:var(--f-m);font-variant-numeric:tabular-nums}

/* ===== gráficos ===== */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.ch-t{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ch-s{font-size:12px;color:var(--ink-3);margin-bottom:14px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;
  border-radius:var(--r-sm);font-size:12px;line-height:1.4;z-index:5;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.22);transform:translate(-50%,-100%)}
.tip[hidden]{display:none}
.tip b{font-family:var(--f-m);font-weight:600;display:block;font-size:12.5px}
.scroll{overflow-x:auto}

/* ===== insights ===== */
.ins{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
.ins-r{background:var(--surface);padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.ins-i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent)}
.ins-i.good{background:var(--good-soft);color:var(--good)}
.ins-i.warn{background:var(--warn-soft);color:var(--warn)}
.ins-i.bad{background:var(--bad-soft);color:var(--bad)}
.ins-m{flex:1;min-width:0}
.ins-t{font-size:13.5px;font-weight:600;line-height:1.35}
.ins-s{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.ins-s b{font-family:var(--f-m);font-weight:600;color:var(--ink)}

/* ===== tabela de dados ===== */
details.tv{margin-top:12px}
details.tv summary{font-size:12px;color:var(--ink-2);cursor:pointer;padding:4px 0}
details.tv summary:hover{color:var(--accent)}
table.dv{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
table.dv th,table.dv td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.dv th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
table.dv td.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums}
</style>
<style>
/* ===== lançar ===== */
.say-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow)}
#say{width:100%;border:0;background:none;padding:14px;resize:vertical;min-height:92px;font-size:16px;
  line-height:1.5;display:block;font-family:var(--f)}
#say::placeholder{color:var(--ink-3)}
#say:focus{outline:none}
.say-bar{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);
  background:var(--surface-2);flex-wrap:wrap}
.say-hint{flex:1;min-width:150px;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.say-hint kbd{font-family:var(--f);background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:0 4px;font-size:11px}
.btn{border:1px solid transparent;border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;font-size:13.5px;
  font-weight:600;background:var(--accent);color:var(--on-accent);white-space:nowrap;display:inline-flex;
  align-items:center;gap:7px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink);filter:none}
.btn.good{background:var(--good)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.rec{background:var(--bad)}
.btn.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.draft{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.draft.ent{border-left-color:var(--good)}
.draft.bad{border-left-color:var(--bad)}
.draft-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.draft-v{font-size:25px;font-weight:600;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.draft-d{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3;padding-top:3px;
  word-break:break-word}
.draft-x{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px 5px;font-size:16px;
  line-height:1;flex:none}
.draft-x:hover{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 8px;font-size:14px;width:100%;min-width:0}
.f input[inputmode="decimal"]{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.raw{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--line);word-break:break-word}
.draft-msg{font-size:12.5px;color:var(--bad);margin-top:8px;font-weight:500}

/* ===== extrato ===== */
.day{margin-bottom:16px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 6px;
  border-bottom:1px solid var(--line);margin-bottom:2px}
.day-d{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.day-t{font-family:var(--f-m);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--surface-2)}
.row:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:3px;flex:none;background:var(--ink-3)}
.row-m{flex:1;min-width:0}
.row-d{font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.row-v{font-family:var(--f-m);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-v.plus{color:var(--good)} .row-v.pay{color:var(--ink-3)}
.chip{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--line)}
.chip.p{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.chip.f{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

/* ===== contas e cartões ===== */
.acct{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left}
.acct:last-child{border-bottom:0}
.acct:hover{background:var(--surface-2)}
.acct-i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.acct-m{flex:1;min-width:0}
.acct-n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-s{font-size:11.5px;color:var(--ink-3)}
.acct-v{font-family:var(--f-m);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.acct-v.neg{color:var(--bad)}
.cardbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;
  box-shadow:var(--shadow)}
.cardbox-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cardbox-n{font-size:14.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardbox-v{font-family:var(--f-m);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.cardbox-s{font-size:11.5px;color:var(--ink-3);margin:3px 0 12px}
.cardbox-a{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}

/* ===== ajustes ===== */
.set{display:grid;gap:15px}
.set-f{display:grid;gap:5px}
.set-f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.set-f .hint{font-size:11.5px;color:var(--ink-3);font-weight:400;line-height:1.45}
.set-f input,.set-f select,.set-f textarea{background:var(--paper);border:1px solid var(--line);

/* ---- dinheiro em centavos ---- */
const BRL = new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" });
const NUM = new Intl.NumberFormat("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const INT = new Intl.NumberFormat("pt-BR", { maximumFractionDigits:0 });
const fmt  = c => BRL.format((c || 0) / 100);
const fmtN = c => NUM.format((c || 0) / 100);
const fmtK = c => { const v = (c||0)/100; return Math.abs(v) >= 1000 ? (v/1000).toFixed(Math.abs(v)>=10000?0:1).replace(".",",")+"k" : INT.format(v); };
function toCents(str){
  if (typeof str === "number") return Math.round(str * 100);
  let s = String(str || "").trim().replace(/r\$\s*/i,"").replace(/\s/g,"");
  if (!s) return 0;
  const neg = /^-/.test(s); s = s.replace(/^-/,"");
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d+\.\d{3}$/.test(s)) s = s.replace(".","");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -1 : 1) * Math.round(n * 100);
}

  {id:"din",   n:"Dinheiro",     type:"dinheiro",      closing:0, due:0, limit:0, acct:"cart", alias:"dinheiro especie"}
];

const TEM_DESTINO = {transferencia:1, pix:1};

const DEFAULTS = () => ({
  income:0, cap:0, mode:"teto", balanceGoal:0,
  cats: CATS.map(c=>({...c, limit:0})), ecats: ECATS.map(c=>({...c})),
  accounts: ACCTS.map(a=>({...a})), cards: CARDS.map(c=>({...c})), fixed:[],
  kwCat:{}, kwCard:{}, seen:false, goalName:"Reserva de emergência", goalTarget:0, deposits:[]
});
/* =================== conta, armazenamento e sincronização =================== */
/* Um app só. Cada pessoa entra com a própria conta Google; os dados dela ficam num
   arquivo no Google Drive DELA, pasta "Caderneta". Ninguém vê os dados de ninguém.
   Tudo é gravado primeiro no aparelho (funciona sem internet); quando a conexão
   volta, junta com o que está no Drive. */
const CFG=window.CADERNETA_CONFIG||{};
const SCOPE_DRIVE="https://www.googleapis.com/auth/drive.file";
const DRIVE="https://www.googleapis.com/drive/v3", UPLOAD="https://www.googleapis.com/upload/drive/v3";
const S={cfg:DEFAULTS(),months:{},ym:ymOf(todayISO()),view:"painel",drafts:[],ai:null,mode:"local",
  user:null,token:null,tokenExp:0,folderId:null,snap:null,sync:{state:"idle",last:0,err:""},dirty:false};
const K={ativa:"caderneta:ativa",contas:"caderneta:contas",dados:id=>"caderneta:dados:"+id,tk:id=>"caderneta:tk:"+id};
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };

function loadLocal(){
  S.cfg=DEFAULTS(); S.months={}; S.sync.last=0; S.dirty=false;
  if(!S.user) return;
  try{ const d=JSON.parse(lsGet(K.dados(S.user.id))||"null"); if(!d) return;
    S.cfg=Object.assign(DEFAULTS(),d.cfg||{}); S.months=d.months||{};
    S.sync.last=d.syncedAt||0; S.dirty=!!d.dirty; }catch(e){} }
function saveLocal(){
  if(!S.user) return;
  if(!lsSet(K.dados(S.user.id),JSON.stringify({cfg:S.cfg,months:S.months,syncedAt:S.sync.last,dirty:S.dirty})))
    toast("O aparelho está sem espaço para salvar."); }
function touch(){ S.dirty=true; saveLocal(); renderSyncBadge(); scheduleSync(); }
async function saveCfg(){ S.cfg.u=Date.now(); touch(); }
async function saveMonth(){ touch(); }
function warn(e){ console.warn(e); }

/* junta duas versões: lançamentos pela união; em conflito, vence o mais recente */
function mergeData(a,b){
  const out={months:{}}, A=a.months||{}, B=b.months||{};
  new Set(Object.keys(A).concat(Object.keys(B))).forEach(ym=>{
    const x=(A[ym]&&A[ym].tx)||{}, y=(B[ym]&&B[ym].tx)||{}, tx={};
    new Set(Object.keys(x).concat(Object.keys(y))).forEach(id=>{
      const p=x[id], q=y[id]; tx[id]=!p?q:!q?p:((q.u||0)>(p.u||0)?q:p); });
    out.months[ym]={tx}; });
  const ca=a.cfg||{}, cb=b.cfg||{};
  out.cfg=(cb.u||0)>(ca.u||0)?cb:ca;
  return out; }

/* ---- contas usadas neste aparelho ---- */
function knownUsers(){ try{ return JSON.parse(lsGet(K.contas)||"[]"); }catch(e){ return []; } }
function rememberUser(u){ const L=knownUsers().filter(x=>x.id!==u.id);
  L.unshift({id:u.id,email:u.email,name:u.name,kind:u.kind});
  lsSet(K.contas,JSON.stringify(L.slice(0,6))); lsSet(K.ativa,u.id); }
function useUser(u){
  S.user=u; rememberUser(u); S.token=null; S.tokenExp=0; S.folderId=null; S.snap=null;
  loadLocal(); restoreToken(); S.mode=u.kind==="google"?"nuvem":"local"; S.view="painel";
  hideGate(); render();
  if(!S.cfg.seen) setTimeout(openWelcome,300); }
function signOut(){
  if(S.user) lsDel(K.tk(S.user.id));
  lsDel(K.ativa); S.user=null; S.token=null; S.tokenExp=0; S.folderId=null; S.snap=null;
  S.cfg=DEFAULTS(); S.months={}; closeSheet(); render(); showGate(); }

/* ---- login com Google (Google Identity Services) ---- */
let tokenClient=null, tokenWait=null;
const gisReady=()=>!!(window.google&&google.accounts&&google.accounts.oauth2);
const tokenOk=()=>!!(S.token&&Date.now()<S.tokenExp-60000);
function loadGis(){ return new Promise((ok,no)=>{
  if(gisReady()) return ok();
  let s=document.getElementById("gisjs");
  if(!s){ s=document.createElement("script"); s.id="gisjs"; s.src="https://accounts.google.com/gsi/client"; s.async=true; document.head.appendChild(s); }
  s.addEventListener("load",()=>gisReady()?ok():no({code:"gis"}));
  s.addEventListener("error",()=>no({code:"gis"})); }); }
function initTokenClient(){
  if(tokenClient||!gisReady()||!CFG.googleClientId) return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CFG.googleClientId,
    scope:"openid email profile "+SCOPE_DRIVE,
    callback:r=>{ const w=tokenWait; tokenWait=null; if(!w) return;
      if(r.error) return w.no({code:"auth",msg:r.error});
      if(!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE_DRIVE)) return w.no({code:"scope"});
      S.token=r.access_token; S.tokenExp=Date.now()+(+r.expires_in||3600)*1000;
      if(S.user&&S.user.kind==="google") saveToken();
      w.ok(S.token); },
    error_callback:e=>{ const w=tokenWait; tokenWait=null; if(w) w.no({code:"auth",msg:e&&e.type}); } }); }
function ensureGis(){ return CFG.googleClientId?loadGis().then(initTokenClient):Promise.reject({code:"noclient"}); }
/* tem de ser chamado direto do toque, senão o navegador bloqueia a janela do Google */
function getToken(interactive){
  if(tokenOk()) return Promise.resolve(S.token);
  if(!CFG.googleClientId) return Promise.reject({code:"noclient"});
  if(!interactive) return Promise.reject({code:"tap"});
  if(!tokenClient) return Promise.reject({code:"gis"});
  return new Promise((ok,no)=>{ tokenWait={ok,no};
    const known=S.user&&S.user.kind==="google";
    tokenClient.requestAccessToken({prompt:known?"":"select_account",
      login_hint:known?S.user.email:undefined, hint:known?S.user.email:undefined}); }); }
function saveToken(){ if(S.user) lsSet(K.tk(S.user.id),JSON.stringify({t:S.token,e:S.tokenExp})); }
function restoreToken(){ if(!S.user) return;
  try{ const d=JSON.parse(lsGet(K.tk(S.user.id))||"null");
    if(d&&d.t&&Date.now()<d.e-60000){ S.token=d.t; S.tokenExp=d.e; } }catch(e){} }
function authMsg(e){ const c=e&&e.code;
  if(c==="noclient") return "O login com Google ainda não foi configurado neste app.";
  if(c==="gis") return "Não consegui carregar o login do Google. Verifique a internet e tente de novo.";
  if(c==="scope") return "Para guardar no Drive, marque a permissão do Google Drive na tela do Google.";
  if(c==="tap") return "Toque em Sincronizar para enviar ao Drive.";
  if(c==="other") return "Você entrou com outra conta Google ("+(e.email||"")+"). Entre com "+(S.user?S.user.email:"a sua")+".";
  if(c==="auth") return "O Google não liberou o acesso"+(e.msg?" ("+e.msg+")":"")+".";
  if(c==="http") return "O Drive respondeu com erro "+e.status+". Tente de novo em instantes.";
  return "Algo deu errado. Tente de novo."; }
async function whoAmI(){
  const r=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+S.token}});
  if(!r.ok) throw {code:"http",status:r.status};
  return r.json(); }
function googleSignIn(){
  const err=$("#gErr"); if(err) err.hidden=true;
  getToken(true).then(async()=>{
    const p=await whoAmI(), tk={t:S.token,e:S.tokenExp};
    useUser({id:"g:"+p.sub,email:p.email||"",name:p.given_name||p.name||p.email||"Você",kind:"google"});
    S.token=tk.t; S.tokenExp=tk.e; saveToken(); syncNow();
  }).catch(e=>{ if(err){ err.hidden=false; err.textContent=authMsg(e); } }); }
function syncTap(){
  if(!S.user) return;
  if(S.user.kind!=="google"){ openAccount(); return; }
  getToken(true).then(async()=>{ const p=await whoAmI();
    if("g:"+p.sub!==S.user.id){ S.token=null; lsDel(K.tk(S.user.id)); throw {code:"other",email:p.email}; }
    await syncNow();
  }).catch(e=>{ S.sync.state=e&&e.code==="tap"?"idle":"erro"; S.sync.err=authMsg(e); renderSyncBadge(); toast(authMsg(e)); }); }

/* ---- Google Drive ---- */
async function gfetch(url,opt){
  const tk=await getToken(false);
  opt=opt||{}; opt.headers=Object.assign({Authorization:"Bearer "+tk},opt.headers||{});
  const r=await fetch(url,opt);
  if(r.status===401){ S.token=null; if(S.user) lsDel(K.tk(S.user.id)); throw {code:"tap"}; }
  if(r.status===403){ const t=await r.text(); throw /insufficient|scope/i.test(t)?{code:"scope"}:{code:"http",status:403}; }
  if(!r.ok) throw {code:"http",status:r.status};
  return r; }
async function findFile(name,parent,folder){
  const q=["name='"+name+"'","trashed=false"];
  if(folder) q.push("mimeType='application/vnd.google-apps.folder'");
  if(parent) q.push("'"+parent+"' in parents");
  const r=await gfetch(DRIVE+"/files?spaces=drive&pageSize=5&fields=files(id,name)&q="+encodeURIComponent(q.join(" and ")));
  return ((await r.json()).files||[])[0]||null; }
async function ensureFolder(){
  if(S.folderId) return S.folderId;
  let f=await findFile("Caderneta",null,true);
  if(!f){ const r=await gfetch(DRIVE+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:"Caderneta",mimeType:"application/vnd.google-apps.folder"})}); f=await r.json(); }
  return (S.folderId=f.id); }
async function readJson(id){ return (await gfetch(DRIVE+"/files/"+id+"?alt=media")).json(); }
async function writeJson(name,parent,data,id){
  const body=JSON.stringify(data);
  if(id){ await gfetch(UPLOAD+"/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body}); return id; }
  const b="caderneta"+Date.now();
  const mp="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,parents:[parent],mimeType:"application/json"})+
    "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";
  const r=await gfetch(UPLOAD+"/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp});
  return (await r.json()).id; }

/* ---- sincronização ---- */
let syncTimer=null, syncing=false, syncAgain=false;
function scheduleSync(){ if(!S.user||S.user.kind!=="google") return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ if(tokenOk()) syncNow(); else renderSyncBadge(); },2000); }
async function syncNow(){
  if(!S.user||S.user.kind!=="google") return;
  if(syncing){ syncAgain=true; return; }
  if(!navigator.onLine||!tokenOk()){ renderSyncBadge(); return; }
  syncing=true; S.sync.state="sync"; renderSyncBadge();
  const who=S.user.id, marca=()=>JSON.stringify(S.months)+"|"+(S.cfg.u||0), antes=marca();
  try{
    const pasta=await ensureFolder();
    const f=await findFile("caderneta-dados.json",pasta);
    const remoto=f?await readJson(f.id):null;
    if(!S.user||S.user.id!==who) return;
    const junto=remoto?mergeData({cfg:S.cfg,months:S.months},remoto):{cfg:S.cfg,months:S.months};
    const pacote={app:"caderneta",v:2,conta:S.user.email,salvoEm:new Date().toISOString(),cfg:junto.cfg,months:junto.months};
    await writeJson("caderneta-dados.json",pasta,pacote,f&&f.id);
    const nome="backup-"+ymOf(todayISO())+".json";           /* uma cópia por mês = histórico */
    if(!S.snap||S.snap.name!==nome){ const sf=await findFile(nome,pasta); S.snap={name:nome,id:sf&&sf.id}; }
    S.snap.id=await writeJson(nome,pasta,pacote,S.snap.id);
    if(!S.user||S.user.id!==who) return;
    const mudouNoMeio=marca()!==antes;                        /* lançou algo enquanto sincronizava */
    const fim=mergeData({cfg:S.cfg,months:S.months},junto);
    const chegouNovidade=JSON.stringify(fim.months)!==JSON.stringify(S.months)||(fim.cfg.u||0)!==(S.cfg.u||0);
    S.cfg=Object.assign(DEFAULTS(),fim.cfg); S.months=fim.months;
    S.sync.last=Date.now(); S.sync.state="ok"; S.sync.err=""; S.dirty=mudouNoMeio; saveLocal();
    if(chegouNovidade) safeRender(); else renderSyncBadge();
    if(mudouNoMeio) syncAgain=true;
  }catch(e){
    S.sync.state=e&&e.code==="tap"?"idle":"erro"; S.sync.err=authMsg(e); renderSyncBadge(); console.warn("sincronização",e);
  }finally{ syncing=false; if(syncAgain){ syncAgain=false; scheduleSync(); } } }

/* =================== leitura da fala =================== */
const NW = {zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,meia:6,sete:7,oito:8,nove:9,
  dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezasseis:16,dezessete:17,
  dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,
  noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,
  quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,
  oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
const SC = {mil:1000, milhao:1e6, milhoes:1e6};
const MOEDA = /^(reais?|conto|contos|pila|pilas|mango|mangos|pratas)$/;
const CENT  = /^(centavos?)$/;
const STOP  = /^(ah|ai|ei|entao|tipo|assim|olha|opa|beleza|ok|e|de|do|da|no|na|em|com|pra|para|por|foi|um|uma|o|a|os|as|meu|minha|hoje|agora|paguei|gastei|comprei|foram|reais|real|deu|custou|ficou|la|aqui|que|se|ao|aos|recebi|recebido|recebida|caiu|entrou|depositei|ganhei|entrada)$/;
const ENTRADA = /^(recebi|recebido|recebida|receber|caiu|entrou|entrada|depositei|deposito|ganhei|salario|holerite|contracheque|freela|freelance|bolsa|estagio|reembolso|estorno|restituicao|rendimento|rendimentos|dividendo|dividendos|vendi|adiantamento|decimo|prolabore|plr)$/;

function readWords(t,i){ let total=0,cur=0,any=false,j=i;
  while(j<t.length){ const w=t[j];
    if(w==="e"&&any){ const nx=t[j+1]; if(nx&&(nx in NW||nx in SC)){ j++; continue; } break; }
    if(w in NW){ cur+=NW[w]; any=true; j++; continue; }
    if(w in SC){ total+=(cur||1)*SC[w]; cur=0; any=true; j++; continue; }
    break; }
  return any ? {v:total+cur, end:j} : null; }
function readDigits(w){ if(!/\d/.test(w)||!/^\d[\d.,]*$/.test(w)) return null;
  let s=w; if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isNaN(n)?null:n; }

function parseOne(raw,cfg){
  const original = raw.trim();
  const prep = original.replace(/R\$/gi," R$ ").replace(/(\d)\s*[xX]\b/g,"$1 vezes ");
  const orig = prep.split(/\s+/).filter(Boolean);
  const t = orig.map(w=>deacc(w.toLowerCase()).replace(/[^\w$]/g,""));
  const used = new Array(t.length).fill(false);
  const take = (a,b)=>{ for(let k=a;k<b;k++) used[k]=true; };
  const d = {id:uid(), raw:original, v:0, desc:"", cat:"", method:"", cardId:"", n:1,
             date:todayISO(), time:nowTime(), msg:"", k:"g"};

  for(let i=0;i<t.length;i++) if(ENTRADA.test(t[i])){ d.k="e"; break; }

  /* parcelas */
  for(let i=0;i<t.length;i++){
    if(!/^(vezes|parcelas|parcelado|prestacoes)$/.test(t[i])) continue;
    let found=null;
    for(let k=Math.max(0,i-4);k<i;k++){
      const dg=readDigits(t[k]);
      if(dg!==null&&dg>=2&&dg<=60) found={v:dg,a:k,b:k+1};
      else { const w=readWords(t,k); if(w&&w.end===i&&w.v>=2&&w.v<=60) found={v:w.v,a:k,b:w.end}; } }
    if(!found) for(let k=i+1;k<Math.min(t.length,i+4);k++){
      const dg=readDigits(t[k]); if(dg!==null&&dg>=2&&dg<=60){ found={v:dg,a:k,b:k+1}; break; }
      const w=readWords(t,k); if(w&&w.v>=2&&w.v<=60){ found={v:w.v,a:k,b:w.end}; break; } }
    if(found){ d.n=found.v; take(found.a,found.b); take(i,i+1);
      if(found.a>0&&/^(em|de)$/.test(t[found.a-1])) take(found.a-1,found.a); break; } }

  /* forma de pagamento */
  for(let i=0;i<t.length;i++){
    if(used[i]) continue;
    let m="";
    if(/^credito$/.test(t[i])) m="credito";
    else if(/^debito$/.test(t[i])) m="debito";
    else if(/^(dinheiro|especie|vivo)$/.test(t[i])) m="dinheiro";
    else if(/^pix$/.test(t[i])) m="pix";
    else if(/^(transferencia|transferi|transferir|transferido|ted|doc)$/.test(t[i])) m="transferencia";
    else if(/^boleto$/.test(t[i])) m="boleto";
    if(!m) continue;
    d.method=m; take(i,i+1);
    let k=i-1;
    while(k>=0&&/^(de|do|da|no|na|em|o|a)$/.test(t[k])){ take(k,k+1); k--; }
    if(k>=0&&/^(cartao|cartoes)$/.test(t[k])){ take(k,k+1); k--;
      while(k>=0&&/^(no|na|em|o|do)$/.test(t[k])){ take(k,k+1); k--; } }
    break; }

  /* cartão / bandeira */
  const aliasMap=[];
  cfg.cards.forEach(c=>norm(c.alias+" "+c.n).split(" ").filter(w=>w.length>2).forEach(w=>aliasMap.push({w,id:c.id})));
  Object.keys(cfg.kwCard||{}).forEach(w=>aliasMap.push({w:deacc(w), id:cfg.kwCard[w]}));
  const hits={}, cardIdx=[];
  for(let i=0;i<t.length;i++){
    if(used[i]||t[i].length<3) continue;
    const m=aliasMap.filter(a=>a.w===t[i]); if(!m.length) continue;
    m.forEach(a=>{ hits[a.id]=(hits[a.id]||0)+1; }); take(i,i+1); cardIdx.push(i); }
  const best=Object.keys(hits).sort((a,b)=>hits[b]-hits[a])[0];
  if(best){ d.cardId=best; const c=cfg.cards.find(x=>x.id===best); if(c&&!d.method) d.method=c.type;
    const nx=Math.max.apply(null,cardIdx)+1;
    const ban=/^(credito|debito|dinheiro|especie|pix|boleto|cartao|cartoes|vezes|parcelas|reais?)$/;
    if(nx<t.length&&!used[nx]&&t[nx].length>2&&!(t[nx] in NW)&&!(t[nx] in SC)&&!ban.test(t[nx])){
      let tail=true; for(let k=nx+1;k<t.length;k++) if(!used[k]&&t[k]){ tail=false; break; }
      if(tail){ take(nx,nx+1); d.alias=t[nx]; } } }
  if(!d.method) d.method = d.k==="e" ? "pix" : "credito";
  if(!d.cardId){ const c=cfg.cards.find(x=>x.type===d.method); if(c) d.cardId=c.id; }
  if(d.k==="e"){ d.n=1; d.acct=acctOf(d.cardId); }

  /* valor */
  let cand=null;
  for(let i=0;i<t.length;i++){
    if(used[i]) continue;
    let v=null,a=i,b=i;
    const dg=readDigits(t[i]);
    if(dg!==null){ v=dg; b=i+1; } else { const w=readWords(t,i); if(w){ v=w.v; b=w.end; } }
    if(v===null) continue;
    let score=1,end=b;
    if(b<t.length&&MOEDA.test(t[b])){ score=10; end=b+1; }
    if(a>0&&t[a-1]==="r$"){ score=10; a=a-1; }
    if(score===10&&end<t.length){ let k=end; if(t[k]==="e") k++;
      const cw = readDigits(t[k])!==null ? {v:readDigits(t[k]), end:k+1} : readWords(t,k);
      if(cw&&cw.v<100&&CENT.test(t[cw.end]||"")){ v+=cw.v/100; end=cw.end+1; } }
    const sc=score-i*0.001;
    if(!cand||sc>cand.score) cand={v,a,b:end,score:sc}; }
  if(cand){ d.v=Math.round(cand.v*100); take(cand.a,cand.b); }

  /* pra quem */
  if(TEM_DESTINO[d.method]&&d.k==="g"){
    const exigeNome = d.method!=="transferencia";
    for(let i=0;i<t.length;i++){
      if(used[i]||!/^(para|pra|pro|pros|pras)$/.test(t[i])) continue;
      const idx=[],nome=[]; let k=i+1;
      while(k<t.length&&!used[k]&&nome.length<3){
        if(/^(o|a|os|as|meu|minha|seu|sua|um|uma)$/.test(t[k])){ idx.push(k); k++; continue; }
        const w=orig[k]; nome.push(w.replace(/^[,;:.\-]+|[,;:.\-]+$/g,"")); idx.push(k); k++;
        if(/[,;.]$/.test(w)) break; }
      if(!nome.length) break;
      if(exigeNome&&!/^[A-ZÁÀÂÃÉÊÍÓÔÕÚÜÇ]/.test(nome[0])) break;
      idx.forEach(x=>take(x,x+1)); take(i,i+1); d.to=nome.join(" "); break; } }

  /* descrição */
  const rest=[];
  for(let i=0;i<orig.length;i++){
    if(used[i]) continue;
    const c=orig[i].replace(/^[,;:.\-]+|[,;:.\-]+$/g,""); if(!c) continue;
    if(rest.length===0&&STOP.test(t[i])) continue;
    rest.push(c); }
  while(rest.length&&STOP.test(deacc(rest[rest.length-1].toLowerCase()))) rest.pop();
  d.desc=rest.join(" ").replace(/\s+([,;])/g,"$1").trim();
  if(d.desc) d.desc=d.desc.charAt(0).toUpperCase()+d.desc.slice(1);
  if(!d.desc&&d.to) d.desc=(d.method==="pix"?"Pix para ":"Transferência para ")+d.to;
  d.cat=guessCat(d.desc||original,cfg,d.k);
  if(!d.v) d.msg="Não achei o valor. Preencha abaixo.";
  else if(!d.desc) d.msg="Faltou dizer o que foi.";
  return d;
}
function guessCat(text,cfg,kind){
  const isE = kind==="e";
  const dict = isE?EKW:KW, list = isE?(cfg.ecats||ECATS):cfg.cats;
  const s=" "+norm(text)+" "; let best=null;
  const consider=(id,kw,boost)=>{ const p=s.indexOf(" "+kw+" "); if(p<0) return;
    const sc=1000-p*3+kw.length*2+boost; if(!best||sc>best.score) best={id,score:sc}; };
  if(!isE) Object.keys(cfg.kwCat||{}).forEach(w=>consider(cfg.kwCat[w],deacc(w.toLowerCase()),5000));
  Object.keys(dict).forEach(cid=>{ if(!list.some(c=>c.id===cid)) return;
    dict[cid].split(" ").forEach(w=>{ if(w.length>2) consider(cid,w,0); }); });
  return best?best.id:(isE?"outrae":"outros"); }
function splitUtterance(raw){
  return raw.replace(/(\d)[.](\d)/g,"$1$2").split(/[.;\n]+/).map(s=>s.trim())
    .filter(s=>s.length>2&&/\d|\b(um|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|duzentos|trezentos|quatrocentos|quinhentos|seiscentos|setecentos|oitocentos|novecentos|mil)\b/i.test(deacc(s))); }
/* =================== gravação =================== */
function txMonth(dateISO,cardId,offset){
  const card=S.cfg.cards.find(c=>c.id===cardId);
  let ym=ymOf(dateISO); const day=+dateISO.slice(8,10);
  if(card&&card.type==="credito"&&card.closing>0&&day>card.closing) ym=ymShift(ym,1);
  return ymShift(ym,offset||0); }
function splitCents(total,n){ const base=Math.floor(total/n),out=[]; let rest=total-base*n;
  for(let i=0;i<n;i++){ out.push(base+(rest>0?1:0)); if(rest>0) rest--; } return out; }
const firstOfMonth=(ym,src)=>ym+"-"+pad(Math.min(+src.slice(8,10),daysIn(ym)));

async function commit(d){
  const kind=d.k||"g";
  const n=kind==="g"?Math.max(1,Math.min(60,+d.n||1)):1;
  const total=Math.abs(d.v); if(!total) return false;
  const parts=splitCents(total,n); const planId=n>1?uid():"";
  const touched=new Set();
  for(let i=0;i<n;i++){
    const ym = kind==="g" ? txMonth(d.date,d.cardId,i) : ymOf(d.date);
    if(!S.months[ym]) S.months[ym]={tx:{}};
    if(!S.months[ym].tx) S.months[ym].tx={};
    S.months[ym].tx[n>1?planId+"-"+(i+1):d.id]={
      d:i===0?d.date:firstOfMonth(ym,d.date), t:d.time, v:parts[i],
      desc:d.desc||"Sem descrição", cat:d.cat||(kind==="e"?"outrae":"outros"),
      method:d.method, card:d.cardId, raw:i===0?d.raw:"", plan:planId, i:i+1, n:n, total:total,
      fix:d.fix||"", k:kind, acct:d.acct||acctOf(d.cardId), acct2:d.acct2||"", ref:d.ref||"", to:d.to||"", u:Date.now() };
    touched.add(ym); }
  if(kind==="g") learn(d);
  for(const ym of touched) await saveMonth(ym);
  return true; }
function learn(d){
  if(!d.desc) return;
  const words=norm(d.desc).split(" ").filter(w=>w.length>3); if(!words.length) return;
  let ch=false;
  if(d.cat&&d.cat!=="outros"&&guessCat(d.desc,S.cfg,"g")!==d.cat){ S.cfg.kwCat[words[0]]=d.cat; ch=true; }
  if(d.alias&&d.cardId&&S.cfg.kwCard[d.alias]!==d.cardId){ S.cfg.kwCard[d.alias]=d.cardId; ch=true; }
  if(ch) saveCfg(); }
async function removeTx(ym,id,wholePlan){
  const m=S.months[ym]; if(!m||!m.tx||!m.tx[id]) return;
  const tx=m.tx[id];
  if(wholePlan&&tx.plan){
    Object.keys(S.months).forEach(k=>Object.keys(S.months[k].tx||{}).forEach(i=>{
      if(S.months[k].tx[i].plan===tx.plan) S.months[k].tx[i]={del:1,u:Date.now()}; }));
    for(const k of Object.keys(S.months)) await saveMonth(k);
  } else { m.tx[id]={del:1,u:Date.now()}; await saveMonth(ym); } }

/* =================== consultas =================== */
function txOf(ym){ const m=S.months[ym]; if(!m||!m.tx) return [];
  return Object.keys(m.tx).map(id=>Object.assign({id,ym,k:"g"},m.tx[id]))
    .filter(x=>!x.del&&x.v).sort((a,b)=>(b.d+(b.t||"")).localeCompare(a.d+(a.t||""))); }
function allTx(){ const out=[]; Object.keys(S.months).forEach(ym=>txOf(ym).forEach(t=>out.push(t))); return out; }
function acctOf(cardId){
  const A=S.cfg.accounts||[]; const c=S.cfg.cards.find(x=>x.id===cardId);
  if(c&&c.acct&&A.some(a=>a.id===c.acct)) return c.acct;
  if(c&&c.type==="dinheiro"){ const w=A.find(a=>a.type==="carteira"); if(w) return w.id; }
  return (A[0]||{}).id||"cc"; }
function balanceOf(acctId,upto){
  const a=(S.cfg.accounts||[]).find(x=>x.id===acctId); if(!a) return 0;
  let bal=a.opening||0;
  allTx().forEach(t=>{
    if(upto&&t.d>upto) return;
    if(a.openDate&&t.d<a.openDate) return;
    if(t.k==="t"){ if(t.acct===acctId) bal-=t.v; else if(t.acct2===acctId) bal+=t.v; return; }
    if((t.acct||acctOf(t.card))!==acctId) return;
    if(t.k==="e") bal+=t.v;
    else if(t.k==="p") bal-=t.v;
    else if(t.method!=="credito") bal-=t.v; });
  return bal; }
const totalBalance=upto=>(S.cfg.accounts||[]).reduce((s,a)=>s+balanceOf(a.id,upto),0);
function cardOwed(cardId){ let o=0;
  allTx().forEach(t=>{ if(t.card!==cardId) return;
    if(t.k==="g"&&t.method==="credito") o+=t.v; else if(t.k==="p") o-=t.v; });
  return o; }
function cardInvoice(cardId,ym){ let total=0,paid=0;
  txOf(ym).forEach(t=>{ if(t.card===cardId&&t.k==="g"&&t.method==="credito") total+=t.v; });
  allTx().forEach(t=>{ if(t.k==="p"&&t.card===cardId&&t.ref===ym) paid+=t.v; });
  return {total,paid,open:total-paid}; }
const creditCards=()=>(S.cfg.cards||[]).filter(c=>c.type==="credito");
function fixedFor(ym){ const done=new Set(txOf(ym).map(t=>t.fix).filter(Boolean));
  return (S.cfg.fixed||[]).filter(f=>f.amount&&!done.has(f.id))
    .map(f=>Object.assign({},f,{day:Math.min(f.day||1,daysIn(ym))})); }

function monthStats(ym){
  const all=txOf(ym), gastos=all.filter(t=>t.k==="g"), entradas=all.filter(t=>t.k==="e");
  const today=todayISO(), isCur=ym===ymOf(today), dim=daysIn(ym);
  const dayNow=isCur?+today.slice(8,10):(ym<ymOf(today)?dim:0);
  let spent=0,future=0;
  gastos.forEach(t=>{ if(isCur&&t.d>today) future+=t.v; else spent+=t.v; });
  const income=entradas.reduce((s,t)=>s+t.v,0);
  const fixPend=fixedFor(ym).reduce((s,f)=>s+f.amount,0);
  const commitV=future+((isCur||ym>ymOf(today))?fixPend:0);
  const cap=S.cfg.cap||0, avail=cap-spent-commitV;
  const left=Math.max(0,dim-dayNow), perDay=left>0?avail/left:0;
  const pace=dayNow>0?(spent/dayNow)*dim+commitV:commitV;
  const should=cap*(dayNow/dim);
  const byCat={}; gastos.forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+t.v; });
  if(isCur||ym>ymOf(today)) fixedFor(ym).forEach(f=>{ byCat[f.cat]=(byCat[f.cat]||0)+f.amount; });
  return {all,gastos,entradas,income,spent,commit:commitV,avail,cap,dim,dayNow,left,perDay,pace,should,byCat,isCur,fixPend}; }

function projectMonth(ym){
  const st=monthStats(ym), last=ym+"-"+pad(daysIn(ym));
  const hoje=totalBalance(todayISO()), naData=totalBalance(last);
  const faturas=creditCards().reduce((s,c)=>s+Math.max(0,cardInvoice(c.id,ym).open),0);
  const rendaFalta=(st.isCur||ym>ymOf(todayISO()))?Math.max(0,(S.cfg.income||0)-st.income):0;
  return {hoje,naData,faturas,rendaFalta,fixPend:st.fixPend,fim:naData+rendaFalta-st.fixPend-faturas,goal:S.cfg.balanceGoal||0}; }

function futureMonths(n,startYm){
  const out=[], cur=startYm||ymOf(todayISO());
  for(let i=0;i<n;i++){ const ym=ymShift(cur,i); let parc=0,once=0;
    txOf(ym).filter(t=>t.k==="g").forEach(t=>{ if(t.n>1) parc+=t.v; else once+=t.v; });
    const fx=fixedFor(ym).reduce((s,f)=>s+f.amount,0);
    out.push({ym,parc,once,fix:fx,total:parc+once+fx}); }
  return out; }
function pastMonths(n){
  const out=[], cur=ymOf(todayISO());
  for(let i=n-1;i>=0;i--){ const ym=ymShift(cur,-i); const st=monthStats(ym);
    out.push({ym,gasto:st.spent+((ym===cur)?st.commit:0),renda:st.income,cap:S.cfg.cap||0}); }
  return out; }
function openPlans(){
  const map={}, cur=ymOf(todayISO());
  Object.keys(S.months).forEach(ym=>txOf(ym).forEach(t=>{ if(!t.plan) return;
    if(!map[t.plan]) map[t.plan]={plan:t.plan,desc:t.desc,n:t.n,total:t.total,cat:t.cat,card:t.card,parts:[]};
    map[t.plan].parts.push({ym,i:t.i,v:t.v,id:t.id}); }));
  return Object.values(map).map(p=>{ p.parts.sort((a,b)=>a.i-b.i);
    p.paid=p.parts.filter(x=>x.ym<cur).length;
    p.rest=p.parts.filter(x=>x.ym>=cur).reduce((s,x)=>s+x.v,0);
    p.last=p.parts.length?p.parts[p.parts.length-1].ym:cur; return p; })
    .filter(p=>p.parts.some(x=>x.ym>=cur)).sort((a,b)=>b.rest-a.rest); }

const catName=id=>(S.cfg.cats.find(c=>c.id===id)||{n:"Outros"}).n;
const ecatName=id=>((S.cfg.ecats||ECATS).find(c=>c.id===id)||{n:"Entrada"}).n;
const catLabel=t=>t.k==="e"?ecatName(t.cat):catName(t.cat);
const cardName=id=>(S.cfg.cards.find(c=>c.id===id)||{n:""}).n;
const acctName=id=>((S.cfg.accounts||[]).find(a=>a.id===id)||{n:"—"}).n;
const catLimit=id=>((S.cfg.cats.find(c=>c.id===id)||{}).limit)||0;

/* =================== insights =================== */
function buildInsights(ym){
  const st=monthStats(ym), out=[];
  const ents=Object.keys(st.byCat).map(id=>({id,v:st.byCat[id]})).sort((a,b)=>b.v-a.v);
  const tot=ents.reduce((s,e)=>s+e.v,0);
  if(!tot){ return [{tone:"", t:"Sem gastos em "+ymLabel(ym), s:"Assim que você lançar, os padrões aparecem aqui."}]; }

  const top=ents[0];
  out.push({tone:"", t:catName(top.id)+" lidera o mês",
    s:"Levou <b>"+fmt(top.v)+"</b>, ou <b>"+Math.round(top.v/tot*100)+"%</b> de tudo que saiu."});

  /* comparação com a média dos 3 meses anteriores */
  const prev=[1,2,3].map(i=>monthStats(ymShift(ym,-i))).filter(x=>x.spent>0);
  if(prev.length>=2){
    const med={}; prev.forEach(p=>Object.keys(p.byCat).forEach(c=>{ med[c]=(med[c]||0)+p.byCat[c]/prev.length; }));
    let worst=null;
    ents.forEach(e=>{ const base=med[e.id]||0; if(base<5000) return;
      const dif=(e.v-base)/base; if(dif>0.25&&(!worst||dif>worst.dif)) worst={id:e.id,dif,base,v:e.v}; });
    if(worst) out.push({tone:"warn", t:catName(worst.id)+" subiu "+Math.round(worst.dif*100)+"%",
      s:"Média dos últimos meses: <b>"+fmt(Math.round(worst.base))+"</b>. Neste: <b>"+fmt(worst.v)+"</b>."});
    let bestDrop=null;
    ents.forEach(e=>{ const base=med[e.id]||0; if(base<5000) return;
      const dif=(e.v-base)/base; if(dif<-0.25&&(!bestDrop||dif<bestDrop.dif)) bestDrop={id:e.id,dif,base,v:e.v}; });
    if(bestDrop) out.push({tone:"good", t:catName(bestDrop.id)+" caiu "+Math.round(-bestDrop.dif*100)+"%",
      s:"De <b>"+fmt(Math.round(bestDrop.base))+"</b> na média para <b>"+fmt(bestDrop.v)+"</b>."}); }

  /* maior lançamento único */
  const big=st.gastos.slice().sort((a,b)=>b.v-a.v)[0];
  if(big) out.push({tone:"", t:"Maior lançamento: "+big.desc,
    s:"<b>"+fmt(big.v)+"</b> em "+big.d.slice(8,10)+" de "+MESL[+big.d.slice(5,7)-1]+
      (big.n>1?" — parcela "+big.i+" de "+big.n:"")+"."});

  /* ritmo x teto */
  if(st.cap&&st.isCur&&st.dayNow>0){
    const diario=st.spent/st.dayNow;
    if(diario>0){
      const diaEstoura=Math.ceil((st.cap-st.commit)/diario);
      if(diaEstoura<st.dim) out.push({tone:"bad", t:"No ritmo atual, o teto acaba no dia "+diaEstoura,
        s:"Você gasta <b>"+fmt(Math.round(diario))+"</b> por dia e o mês tem "+st.dim+" dias."});
      else out.push({tone:"good", t:"O ritmo cabe no teto",
        s:"A <b>"+fmt(Math.round(diario))+"</b> por dia, o mês fecha em <b>"+fmt(Math.round(st.pace))+"</b>."}); } }

  /* categorias com limite estourado */
  const furados=ents.filter(e=>catLimit(e.id)>0&&e.v>catLimit(e.id));
  if(furados.length) out.push({tone:"bad", t:furados.length===1?"1 categoria passou do limite":furados.length+" categorias passaram do limite",
    s:furados.slice(0,3).map(e=>catName(e.id)+" <b>"+fmt(e.v)+"</b> de "+fmt(catLimit(e.id))).join(" · ")});

  /* parcelas comprometendo o futuro */
  const fut=futureMonths(6,ymShift(ymOf(todayISO()),1));
  const parcFut=fut.reduce((s,f)=>s+f.parc,0);
  if(parcFut>0) out.push({tone:"warn", t:"Parcelas já comprometem os próximos 6 meses",
    s:"<b>"+fmt(parcFut)+"</b> reservados antes de você gastar qualquer coisa."});

  /* forma de pagamento dominante */
  const byM={}; st.gastos.forEach(t=>{ byM[t.method]=(byM[t.method]||0)+t.v; });
  const mTop=Object.keys(byM).sort((a,b)=>byM[b]-byM[a])[0];
  if(mTop&&byM[mTop]/tot>0.5) out.push({tone:"", t:"Quase tudo no "+(METODOS[mTop]||mTop).toLowerCase(),
    s:"<b>"+Math.round(byM[mTop]/tot*100)+"%</b> dos gastos passaram por aí."});
  return out; }
/* =================== gráficos =================== */
function niceMax(v){ if(v<=0) return 100;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }
function ticks(max,n){ const out=[]; for(let i=0;i<=n;i++) out.push(max*i/n); return out; }
/* ponta arredondada só no fim do dado; base quadrada */
function pathRight(x,y,w,h,r){ r=Math.min(r,h/2,Math.max(0,w));
  if(w<=r) return "M"+x+" "+y+"h"+w+"v"+h+"h"+(-w)+"z";
  return "M"+x+" "+y+"h"+(w-r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-2*r)+"a"+r+" "+r+" 0 0 1 "+(-r)+" "+r+"h"+(-(w-r))+"z"; }
function pathTop(x,y,w,h,r){ r=Math.min(r,w/2,Math.max(0,h));
  if(h<=r) return "M"+x+" "+(y+h)+"v"+(-h)+"h"+w+"v"+h+"z";
  return "M"+x+" "+(y+h)+"v"+(-(h-r))+"a"+r+" "+r+" 0 0 1 "+r+" "+(-r)+"h"+(w-2*r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-r)+"z"; }

/* barras horizontais, uma cor só: comprimento já codifica magnitude */
function chartBarsH(rows,opt){
  opt=opt||{}; const W=560, RH=38, PAD=2;
  if(!rows.length) return '<div class="empty"><b>Nada para mostrar</b>Lance alguns gastos primeiro.</div>';

    const y=i*RH+PAD, bw=Math.max(2,(r.v/max)*W);

    s+='<text x="'+W+'" y="'+(y+11)+'" text-anchor="end" style="fill:var(--ink-2);font:500 12px var(--f-m);font-variant-numeric:tabular-nums">'+fmtN(r.v)+(r.pct!=null?'  <tspan style="fill:var(--ink-3)">'+r.pct+'%</tspan>':'')+'</text>';
    s+='<rect x="0" y="'+(y+18)+'" width="'+W+'" height="12" rx="4" style="fill:var(--surface-2)"/>';
    s+='<path d="'+pathRight(0,y+18,bw,12,4)+'" style="fill:var(--accent)"/>';

      s+='<rect x="'+(lx-1)+'" y="'+(y+15)+'" width="2" height="18" style="fill:var(--ink-3)"/>'; }
    s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+RH+'" style="fill:transparent" data-tip="'+esc(r.tip||(r.label+" — "+fmt(r.v)))+'"/>'; });
  return s+'</svg>'; }

/* linha: acumulado real contra o ritmo que cabe no teto */
function chartPace(ym){
  const st=monthStats(ym), W=560, H=190, L=44, B=24, T=8;
  const dim=st.dim, cap=st.cap||0;
  const byDay=new Array(dim+1).fill(0);
  st.gastos.forEach(t=>{ const d=+t.d.slice(8,10); if(d>=1&&d<=dim) byDay[d]+=t.v; });
  const acc=[]; let run=0;
  const lastDay=st.isCur?st.dayNow:(ym<ymOf(todayISO())?dim:0);
  for(let d=1;d<=dim;d++){ run+=byDay[d]; if(d<=lastDay||!st.isCur) acc.push({d,v:run}); }
  if(!acc.length) return '<div class="empty"><b>Sem lançamentos ainda</b>A curva aparece no primeiro gasto do mês.</div>';
  const max=niceMax(Math.max(cap,run)||1);
  const X=d=>L+((d-1)/(dim-1))*(W-L-6);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto acumulado contra o ritmo do teto">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  [1,Math.round(dim/2),dim].forEach(d=>{
    s+='<text x="'+X(d)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+d+'</text>'; });
  if(cap>0) s+='<line x1="'+X(1)+'" y1="'+Y(cap/dim)+'" x2="'+X(dim)+'" y2="'+Y(cap)+'" style="stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;opacity:.55"/>';
  const dpath=acc.map((p,i)=>(i?"L":"M")+X(p.d)+" "+Y(p.v)).join(" ");
  s+='<path d="'+dpath+" L"+X(acc[acc.length-1].d)+" "+Y(0)+" L"+X(acc[0].d)+" "+Y(0)+'z" style="fill:var(--accent);opacity:.1"/>';
  s+='<path d="'+dpath+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
  const last=acc[acc.length-1];
  s+='<circle cx="'+X(last.d)+'" cy="'+Y(last.v)+'" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>';
  s+='<text x="'+Math.min(W-4,X(last.d)+10)+'" y="'+(Y(last.v)-9)+'" text-anchor="'+(X(last.d)>W-90?"end":"start")+'" style="fill:var(--ink);font:600 11.5px var(--f-m)">'+fmtN(last.v)+'</text>';
  acc.forEach(p=>{ const bw=(W-L-6)/dim;
    s+='<rect x="'+(X(p.d)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="Dia '+p.d+" — acumulado "+fmt(p.v)+(cap?" · ritmo "+fmt(Math.round(cap*p.d/dim)):"")+'"/>'; });
  return s+'</svg>'; }

/* colunas com linha de referência do teto */
function chartCols(rows,opt){
  opt=opt||{}; const W=560,H=180,L=44,B=26,T=10,n=rows.length;
  const ref=opt.ref||0;
  const max=niceMax(Math.max(ref,Math.max.apply(null,rows.map(r=>r.v)))||1);
  const band=(W-L-6)/n, bw=Math.min(24,band-10);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.alt||"Histórico")+'">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  rows.forEach((r,i)=>{
    const cx=L+band*i+band/2, h=Math.max(1,(r.v/max)*(H-T-B)), y=Y(r.v);
    s+='<path d="'+pathTop(cx-bw/2,y,bw,h,4)+'" style="fill:'+(r.color||"var(--accent)")+'"/>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+esc(r.label)+'</text>';
    s+='<rect x="'+(cx-band/2)+'" y="'+T+'" width="'+band+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="'+esc(r.tip||(r.label+" — "+fmt(r.v)))+'"/>'; });
  if(ref>0){ const y=Y(ref);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--bad);stroke-width:2;stroke-linecap:round"/>';
    s+='<text x="'+W+'" y="'+(y-6)+'" text-anchor="end" style="fill:var(--ink-2);font:600 10.5px var(--f)">teto '+fmtK(ref)+'</text>'; }
  return s+'</svg>'; }

/* colunas empilhadas: ordem fixa azul -> cobre -> roxo (cobre separa o par que colapsa sob CVD) */
function chartStack(rows,series,opt){
  opt=opt||{}; const W=560,H=190,L=44,B=26,T=10,n=rows.length,GAP=2;
  const ref=opt.ref||0;
  const tot=r=>series.reduce((s,k)=>s+(r[k.key]||0),0);
  const max=niceMax(Math.max(ref,Math.max.apply(null,rows.map(tot)))||1);
  const band=(W-L-6)/n, bw=Math.min(24,band-10);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.alt||"Comprometido")+'">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  rows.forEach((r,i)=>{
    const cx=L+band*i+band/2; let acc=0;
    const parts=series.map(k=>({k,v:r[k.key]||0})).filter(p=>p.v>0);
    parts.forEach((p,j)=>{
      const h=(p.v/max)*(H-T-B); const yTop=Y(acc+p.v); const isTop=j===parts.length-1;
      const hh=Math.max(1,h-(j<parts.length-1?GAP:0));
      s+= isTop ? '<path d="'+pathTop(cx-bw/2,yTop,bw,Math.max(1,h),4)+'" style="fill:'+p.k.color+'"/>'
                : '<rect x="'+(cx-bw/2)+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" style="fill:'+p.k.color+'"/>';
      acc+=p.v; });
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+esc(r.label)+'</text>';
    const tip=esc(r.label)+" — "+fmt(tot(r))+"|"+series.map(k=>esc(k.n)+" "+fmtN(r[k.key]||0)).join(" · ");
    s+='<rect x="'+(cx-band/2)+'" y="'+T+'" width="'+band+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="'+tip+'"/>'; });
  if(ref>0){ const y=Y(ref);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--bad);stroke-width:2;stroke-linecap:round"/>';
    s+='<text x="'+W+'" y="'+(y-6)+'" text-anchor="end" style="fill:var(--ink-2);font:600 10.5px var(--f)">teto '+fmtK(ref)+'</text>'; }
  return s+'</svg>'; }

/* dica flutuante */
function bindTips(root){
  $$(".chart",root).forEach(box=>{
    let tip=box.querySelector(".tip");
    if(!tip){ tip=document.createElement("div"); tip.className="tip"; tip.hidden=true; box.appendChild(tip); }
    const show=ev=>{ const el=ev.target.closest("[data-tip]"); if(!el){ tip.hidden=true; return; }
      const parts=el.getAttribute("data-tip").split("|");
      tip.innerHTML="<b>"+parts[0]+"</b>"+(parts[1]?parts[1]:"");
      const r=box.getBoundingClientRect(), b=el.getBoundingClientRect();
      tip.style.left=Math.max(60,Math.min(r.width-60,b.left+b.width/2-r.left))+"px";
      tip.style.top=Math.max(30,b.top-r.top)+"px"; tip.hidden=false; };
    box.addEventListener("mousemove",show);
    box.addEventListener("mouseleave",()=>{ tip.hidden=true; });
    box.addEventListener("touchstart",show,{passive:true}); }); }

function renderDrafts(){
  const box=$("#drafts"); if(!box) return;
  $("#draftSec").hidden=!S.drafts.length;
  if(!S.drafts.length){ box.innerHTML=""; return; }
  const opt=(arr,sel)=>arr.map(o=>'<option value="'+o.id+'"'+(o.id===sel?" selected":"")+">"+esc(o.n)+"</option>").join("");
  box.innerHTML=S.drafts.map((d,i)=>
    '<div class="draft'+(d.v?(d.k==="e"?" ent":""):" bad")+'" data-i="'+i+'"><div class="draft-top">'+
    '<span class="draft-v"'+(d.k==="e"?' style="color:var(--good)"':'')+'>'+(d.v?(d.k==="e"?"+":"")+fmt(d.v):"—")+'</span>'+
    '<span class="draft-d">'+esc(d.desc||"Sem descrição")+'</span>'+
    '<button class="draft-x" data-x="'+i+'" aria-label="Remover">✕</button></div><div class="fields">'+
    '<div class="f"><label>Tipo</label><select data-k="k"><option value="g"'+(d.k!=="e"?" selected":"")+
    '>Gasto</option><option value="e"'+(d.k==="e"?" selected":"")+'>Entrada</option></select></div>'+
    '<div class="f"><label>Valor</label><input inputmode="decimal" data-k="v" value="'+(d.v?fmtN(d.v):"")+'"></div>'+
    '<div class="f"><label>Descrição</label><input data-k="desc" value="'+esc(d.desc)+'"></div>'+
    '<div class="f"><label>Categoria</label><select data-k="cat">'+opt(d.k==="e"?(S.cfg.ecats||ECATS):S.cfg.cats,d.cat)+'</select></div>'+
    (d.k==="e"
      ? '<div class="f"><label>Cai em qual conta</label><select data-k="acct">'+opt(S.cfg.accounts||[],d.acct||acctOf(d.cardId))+'</select></div>'
      : '<div class="f"><label>Pagamento</label><select data-k="cardId">'+opt(S.cfg.cards,d.cardId)+'</select></div>'+
        (TEM_DESTINO[d.method]?'<div class="f"><label>Para quem</label><input data-k="to" value="'+esc(d.to||"")+'"></div>':'')+
        '<div class="f"><label>Parcelas</label><input inputmode="numeric" data-k="n" value="'+d.n+'"></div>')+
    '<div class="f"><label>Data</label><input type="date" data-k="date" value="'+d.date+'"></div></div>'+
    (d.msg?'<div class="draft-msg">'+esc(d.msg)+'</div>':'')+
    (d.raw?'<div class="raw">“'+esc(d.raw)+'”</div>':'')+'</div>').join("");
  $$(".draft",box).forEach(el=>{ const i=+el.dataset.i;
    $$("[data-k]",el).forEach(inp=>inp.oninput=()=>{
      const k=inp.dataset.k, d=S.drafts[i];
      if(k==="k"){ d.k=inp.value; d.cat=guessCat(d.desc||d.raw,S.cfg,d.k);
        if(d.k==="e"){ d.n=1; d.acct=d.acct||acctOf(d.cardId); } renderDrafts(); return; }
      if(k==="cardId"){ d.cardId=inp.value; const c=S.cfg.cards.find(x=>x.id===inp.value);
        if(c) d.method=c.type; renderDrafts(); return; }
      if(k==="v") d.v=toCents(inp.value);
      else if(k==="n") d.n=Math.max(1,Math.min(60,parseInt(inp.value)||1));
      else d[k]=inp.value;
      if(k==="v"||k==="desc"){
        $(".draft-v",el).textContent=d.v?((d.k==="e"?"+":"")+fmt(d.v)):"—";
        $(".draft-d",el).textContent=d.desc||"Sem descrição";
        el.classList.toggle("bad",!d.v); } }); });
  $$("[data-x]",box).forEach(b=>b.onclick=()=>{ S.drafts.splice(+b.dataset.x,1); renderDrafts(); }); }

function readInput(){
  const raw=$("#say").value.trim();
  if(!raw){ toast("Fale ou escreva alguma coisa primeiro."); return; }
  const parts=splitUtterance(raw);
  S.drafts=(parts.length?parts:[raw]).map(s=>parseOne(s,S.cfg));
  const bad=S.drafts.filter(d=>!d.v).length;
  const st=$("#parseStatus"); st.hidden=false;
  st.innerHTML=S.drafts.length+" lançamento"+(S.drafts.length>1?"s lidos":" lido")+(bad?" · "+bad+" sem valor":"");
  renderDrafts(); $("#draftSec").scrollIntoView({behavior:"smooth",block:"start"}); }
async function saveDrafts(){
  const ok=S.drafts.filter(d=>d.v);
  if(!ok.length){ toast("Nenhum lançamento com valor."); return; }
  $("#dSave").disabled=true;
  for(const d of ok) await commit(d);
  S.drafts=[]; render();
  toast(ok.length+(ok.length>1?" lançamentos salvos":" lançamento salvo")); }

async function lancarFixos(){
  const pend=fixedFor(S.ym); if(!pend.length) return;
  for(const f of pend) await commit({id:uid(),raw:"",v:f.amount,desc:f.name,cat:f.cat,

    date:S.ym+"-"+pad(f.day),time:"",fix:f.id,k:"g"});
  render(); toast(pend.length+" gastos fixos lançados"); }

function openTx(ym,id){
  const t=(S.months[ym]||{tx:{}}).tx[id]; if(!t) return;
  const kind=t.k||"g", A=S.cfg.accounts||[];
  const catList=kind==="e"?(S.cfg.ecats||ECATS):S.cfg.cats;
  sheet(kind==="e"?"Entrada":kind==="p"?"Pagamento de fatura":kind==="t"?"Transferência entre contas"
      :(t.n>1?"Parcela "+t.i+" de "+t.n:"Lançamento"),
    '<div class="set"><div class="set-f"><label>Descrição</label><input id="tD" value="'+esc(t.desc)+'"></div>'+
    '<div class="two"><div class="set-f"><label>Valor</label><input id="tV" inputmode="decimal" value="'+fmtN(t.v)+'"></div>'+
    '<div class="set-f"><label>Quando</label><input id="tDt" type="date" value="'+t.d+'"></div></div>'+
    (kind==="t"
      ? '<div class="two"><div class="set-f"><label>Sai de</label><select id="tA">'+optId(A,t.acct)+'</select></div>'+
        '<div class="set-f"><label>Vai para</label><select id="tB">'+optId(A,t.acct2)+'</select></div></div>'
      : '<div class="two">'+
        (kind==="p"?"":'<div class="set-f"><label>Categoria</label><select id="tC">'+optId(catList,t.cat)+'</select></div>')+
        (kind==="g"
          ? '<div class="set-f"><label>Pagamento</label><select id="tP">'+optId(S.cfg.cards,t.card)+'</select></div>'
          : '<div class="set-f"><label>'+(kind==="e"?"Cai na conta":"Sai da conta")+'</label><select id="tA">'+optId(A,t.acct||acctOf(t.card))+'</select></div>')+
        '</div>'+
        (kind==="g"&&TEM_DESTINO[t.method]?'<div class="set-f"><label>Para quem</label><input id="tTo" value="'+esc(t.to||"")+'"></div>':''))+
    (t.n>1?'<div class="set-f"><span class="hint">Compra de '+fmt(t.total)+' em '+t.n+'x. Mudar o valor aqui muda só esta parcela.</span></div>':'')+
    (t.raw?'<div class="raw">“'+esc(t.raw)+'”</div>':'')+'</div>',
    '<button class="btn danger" id="tKill">'+(t.n>1?"Excluir compra":"Excluir")+'</button><button class="btn" id="tOk">Salvar</button>');
  $("#tOk").onclick=async()=>{
    const nd=$("#tDt").value||t.d;
    const patch={desc:$("#tD").value.trim()||t.desc, v:toCents($("#tV").value)};
    if($("#tC")) patch.cat=$("#tC").value;
    if($("#tP")){ patch.card=$("#tP").value; const c=S.cfg.cards.find(x=>x.id===patch.card);
      if(c) patch.method=c.type; patch.acct=acctOf(patch.card); }
    if($("#tA")) patch.acct=$("#tA").value;
    if($("#tB")) patch.acct2=$("#tB").value;
    if($("#tTo")) patch.to=$("#tTo").value.trim();
    const newYm=ymOf(nd);
    if(newYm!==ym){ S.months[ym].tx[id]={del:1,u:Date.now()};
      if(!S.months[newYm]) S.months[newYm]={tx:{}};
      S.months[newYm].tx[id]=Object.assign({},t,patch,{d:nd,u:Date.now()});
      await saveMonth(ym); await saveMonth(newYm); }
    else { Object.assign(S.months[ym].tx[id],patch,{d:nd,u:Date.now()}); await saveMonth(ym); }
    closeSheet(); render(); toast("Salvo"); };
  $("#tKill").onclick=async()=>{ await removeTx(ym,id,t.n>1); closeSheet(); render();
    toast(t.n>1?"Compra e parcelas excluídas":"Excluído"); }; }

/* lançamento manual: é aqui que o salário entra sem falar nada */
function openManual(kind){
  const A=S.cfg.accounts||[], isE=kind==="e";
  const catList=isE?(S.cfg.ecats||ECATS):S.cfg.cats;
  sheet(isE?"Nova entrada":"Novo gasto",
    '<div class="set">'+
    '<div class="two"><div class="set-f"><label>Valor</label><input id="mV" inputmode="decimal" placeholder="0,00"></div>'+
    '<div class="set-f"><label>Quando</label><input id="mDt" type="date" value="'+todayISO()+'"></div></div>'+
    '<div class="set-f"><label>Descrição</label><input id="mD" placeholder="'+(isE?"Salário de setembro":"Almoço")+'"></div>'+
    '<div class="two"><div class="set-f"><label>Categoria</label><select id="mC">'+optId(catList,isE?"sal":"outros")+'</select></div>'+
    (isE?'<div class="set-f"><label>Cai em qual conta</label><select id="mA">'+optId(A,(A[0]||{}).id)+'</select></div>'
       :'<div class="set-f"><label>Pagamento</label><select id="mP">'+optId(S.cfg.cards,(S.cfg.cards[0]||{}).id)+'</select></div>')+
    '</div>'+
    (isE?'':'<div class="set-f"><label>Parcelas</label><input id="mN" inputmode="numeric" value="1"></div>')+
    (isE?'<div class="note"><b>Entrada é dinheiro chegando</b>Ela soma no saldo da conta e nunca conta no teto de gastos. Falando, basta dizer “caiu o salário, dezesseis mil” — as palavras recebi, caiu, salário, freela, reembolso já viram entrada sozinhas.</div>':'')+
    '</div>',
    '<button class="btn ghost" id="mX">Cancelar</button><button class="btn'+(isE?" good":"")+'" id="mOk">Salvar</button>');
  $("#mX").onclick=closeSheet;
  $("#mOk").onclick=async()=>{
    const v=toCents($("#mV").value);
    if(!v){ toast("Coloque o valor."); return; }
    const cardId=isE?((S.cfg.cards.find(c=>c.type==="pix")||S.cfg.cards[0]).id):$("#mP").value;
    const c=S.cfg.cards.find(x=>x.id===cardId);
    await commit({id:uid(),raw:"",v,desc:$("#mD").value.trim()||(isE?"Entrada":"Gasto"),
      cat:$("#mC").value, method:isE?"pix":(c?c.type:"credito"), cardId,
      acct:isE?$("#mA").value:acctOf(cardId),
      n:isE?1:Math.max(1,Math.min(60,parseInt($("#mN").value)||1)),
      date:$("#mDt").value||todayISO(), time:nowTime(), k:isE?"e":"g"});
    closeSheet(); render(); toast(isE?"Entrada lançada":"Gasto lançado"); }; }

function openAcct(id){
  const A=S.cfg.accounts||[];
  const a=A.find(x=>x.id===id)||{id:uid(),n:"",type:"corrente",opening:0,openDate:"",adjust:[]};
  const isNew=!A.some(x=>x.id===a.id);
  const bal=isNew?0:balanceOf(a.id,todayISO());
  sheet(isNew?"Nova conta":a.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="aN" value="'+esc(a.n)+'" placeholder="Banco do Brasil"></div>'+
    '<div class="set-f"><label>Tipo</label><select id="aT">'+
    Object.keys(ACCT_TIPO).map(k=>'<option value="'+k+'"'+(k===a.type?" selected":"")+'>'+ACCT_TIPO[k]+'</option>').join("")+'</select></div>'+
    (isNew
      ? '<div class="set-f"><label>Quanto tem nela hoje</label><input id="aB" inputmode="decimal" placeholder="0,00">'+
        '<span class="hint">A partir daqui o app soma as entradas e subtrai os gastos sozinho.</span></div>'
      : '<div class="set-f"><label>Saldo calculado hoje</label><input id="aB" inputmode="decimal" value="'+fmtN(bal)+'">'+
        '<span class="hint">Se o app do banco mostra outro número, corrija aqui — a diferença fica registrada como acerto e o saldo volta a bater.</span></div>')+
    (!isNew&&(a.adjust||[]).length
      ? '<div class="set-f"><span class="hint">Últimos acertos: '+a.adjust.slice(-3).reverse()
          .map(x=>x.d.slice(8,10)+"/"+x.d.slice(5,7)+" "+(x.delta>=0?"+":"")+fmtN(x.delta)).join(" · ")+'</span></div>' : '')+
    '</div>',
    (isNew?"":'<button class="btn danger" id="aKill">Excluir</button>')+'<button class="btn" id="aOk">Salvar</button>');
  $("#aOk").onclick=()=>{
    const nm=$("#aN").value.trim(); if(!nm){ toast("Dê um nome."); return; }
    const novo=toCents($("#aB").value);
    if(isNew) A.push({id:a.id,n:nm,type:$("#aT").value,opening:novo,openDate:"",adjust:[]});
    else { const r=A.find(x=>x.id===a.id); r.n=nm; r.type=$("#aT").value;
      const delta=novo-bal;
      if(delta!==0){ r.opening=(r.opening||0)+delta;
        r.adjust=(r.adjust||[]).concat([{d:todayISO(),delta}]).slice(-20); } }
    S.cfg.accounts=A; saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#aKill");
  if(k) k.onclick=()=>{ if(A.length<=1){ toast("Precisa de pelo menos uma conta."); return; }
    S.cfg.accounts=A.filter(x=>x.id!==a.id); saveCfg(); closeSheet(); render(); toast("Excluída"); }; }

function openPay(cardId){
  const c=S.cfg.cards.find(x=>x.id===cardId); if(!c) return;
  const inv=cardInvoice(cardId,S.ym), A=S.cfg.accounts||[];
  if(!A.length){ toast("Cadastre uma conta antes."); return; }
  sheet("Pagar fatura · "+c.n,
    '<div class="set"><div class="set-f"><label>Valor</label><input id="yV" inputmode="decimal" value="'+fmtN(inv.open)+'"></div>'+
    '<div class="two"><div class="set-f"><label>Sai de qual conta</label><select id="yA">'+optId(A,acctOf(cardId))+'</select></div>'+
    '<div class="set-f"><label>Quando</label><input id="yD" type="date" value="'+todayISO()+'"></div></div>'+
    '<div class="note"><b>Isso não é um gasto novo</b>Tira o dinheiro da conta e abate a fatura de '+esc(ymLabel(S.ym))+
    '. As compras já foram contadas no teto quando você comprou.</div></div>',
    '<button class="btn ghost" id="yX">Cancelar</button><button class="btn" id="yOk">Pagar</button>');
  $("#yX").onclick=closeSheet;
  $("#yOk").onclick=async()=>{ const v=toCents($("#yV").value);
    if(!v){ toast("Coloque o valor."); return; }
    await commit({id:uid(),raw:"",v,desc:"Fatura "+c.n+" · "+ymLabel(S.ym),cat:"outros",method:"debito",
      cardId,acct:$("#yA").value,n:1,date:$("#yD").value||todayISO(),time:nowTime(),k:"p",ref:S.ym});
    closeSheet(); render(); toast("Fatura paga"); }; }

function openTransfer(){
  const A=S.cfg.accounts||[];
  if(A.length<2){ toast("Precisa de duas contas."); return; }
  sheet("Transferir entre contas",
    '<div class="set"><div class="set-f"><label>Quanto</label><input id="xV" inputmode="decimal" placeholder="0,00"></div>'+
    '<div class="two"><div class="set-f"><label>Sai de</label><select id="xA">'+optId(A,A[0].id)+'</select></div>'+
    '<div class="set-f"><label>Vai para</label><select id="xB">'+optId(A,A[1].id)+'</select></div></div>'+
    '<div class="two"><div class="set-f"><label>Quando</label><input id="xD" type="date" value="'+todayISO()+'"></div>'+
    '<div class="set-f"><label>Anotação</label><input id="xN" placeholder="para a poupança"></div></div>'+
    '<div class="note"><b>Só muda o dinheiro de lugar</b>Não conta como gasto. Para mandar dinheiro a outra pessoa, lance como gasto com a forma de pagamento Transferência.</div></div>',
    '<button class="btn ghost" id="xX">Cancelar</button><button class="btn" id="xOk">Transferir</button>');
  $("#xX").onclick=closeSheet;
  $("#xOk").onclick=async()=>{
    const v=toCents($("#xV").value), a=$("#xA").value, b=$("#xB").value;
    if(!v){ toast("Coloque o valor."); return; }
    if(a===b){ toast("Escolha contas diferentes."); return; }
    await commit({id:uid(),raw:"",v,desc:$("#xN").value.trim()||"Transferência entre contas",cat:"outros",
      method:"transferencia",cardId:"transf",acct:a,acct2:b,n:1,date:$("#xD").value||todayISO(),time:nowTime(),k:"t"});
    closeSheet(); render(); toast("Transferido"); }; }

function openCard(id){
  const c=S.cfg.cards.find(x=>x.id===id)||{id:uid(),n:"",type:"credito",closing:0,due:0,limit:0,acct:(S.cfg.accounts[0]||{}).id,alias:""};
  const isNew=!S.cfg.cards.some(x=>x.id===c.id);
  sheet(isNew?"Nova forma de pagamento":c.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="cN" value="'+esc(c.n)+'" placeholder="Elo Nubank"></div>'+
    '<div class="two"><div class="set-f"><label>Tipo</label><select id="cT">'+
    Object.keys(METODOS).map(k=>'<option value="'+k+'"'+(k===c.type?" selected":"")+'>'+METODOS[k]+'</option>').join("")+'</select></div>'+
    '<div class="set-f"><label>Dia do fechamento</label><input id="cF" inputmode="numeric" value="'+(c.closing||"")+'" placeholder="0 = não usar"></div></div>'+
    '<div class="two"><div class="set-f"><label>Dia do vencimento</label><input id="cV" inputmode="numeric" value="'+(c.due||"")+'" placeholder="0 = não usar"></div>'+
    '<div class="set-f"><label>Limite</label><input id="cL" inputmode="decimal" value="'+(c.limit?fmtN(c.limit):"")+'" placeholder="0,00"></div></div>'+
    '<div class="set-f"><label>Sai de qual conta</label><select id="cC">'+optId(S.cfg.accounts||[],c.acct||acctOf(c.id))+'</select>'+
    '<span class="hint">No crédito é a conta de onde sai o pagamento da fatura. No débito, pix, transferência ou dinheiro é a conta que o gasto tira na hora.</span></div>'+
    '<div class="set-f"><label>Como você chama falando</label><input id="cA" value="'+esc(c.alias)+'" placeholder="elo nubank roxinho">'+
    '<span class="hint">Palavras separadas por espaço. Se você disser qualquer uma delas, o lançamento cai aqui.</span></div>'+
    '<div class="set-f"><span class="hint">O dia do fechamento joga as compras feitas depois dele para a fatura do mês seguinte — é o que faz o teto bater com o que sai da conta.</span></div></div>',
    (isNew?"":'<button class="btn danger" id="cKill">Excluir</button>')+'<button class="btn" id="cOk">Salvar</button>');
  $("#cOk").onclick=()=>{
    const n=$("#cN").value.trim(); if(!n){ toast("Dê um nome."); return; }
    const obj={id:c.id,n,type:$("#cT").value,
      closing:Math.max(0,Math.min(31,parseInt($("#cF").value)||0)),
      due:Math.max(0,Math.min(31,parseInt($("#cV").value)||0)),
      limit:toCents($("#cL").value), acct:$("#cC").value, alias:$("#cA").value.trim()||norm(n)};
    const i=S.cfg.cards.findIndex(x=>x.id===c.id);
    if(i<0) S.cfg.cards.push(obj); else S.cfg.cards[i]=obj;
    saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#cKill");
  if(k) k.onclick=()=>{ S.cfg.cards=S.cfg.cards.filter(x=>x.id!==c.id); saveCfg(); closeSheet(); render(); toast("Excluído"); }; }

function openCat(id){
  const c=S.cfg.cats.find(x=>x.id===id)||{id:"c"+uid(),n:"",limit:0};
  const isNew=!S.cfg.cats.some(x=>x.id===c.id);
  sheet(isNew?"Nova categoria":c.n,
