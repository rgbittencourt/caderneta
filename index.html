        if(d.k==="p"){ d.n=1; d.method="debito"; if(!creditCards().some(c=>c.id===d.cardId)) d.cardId=(creditCards()[0]||{}).id; d.acct=d.acct||acctOf(""); d.ref=d.ref||ymShift(ymOf(d.date||todayISO()),-1); }
        if(d.k==="t"){ d.n=1; d.method="transferencia"; d.acct=d.acct||acctOf(d.cardId); d.acct2=d.acct2||""; }
        renderDrafts(); return; }
      if(k==="cardId"){ d.cardId=inp.value; const c=S.cfg.cards.find(x=>x.id===inp.value);
        if(c&&d.k!=="p") d.method=c.type; renderDrafts(); return; }
      if(k==="v") d.v=toCents(inp.value);
      else if(k==="n") d.n=Math.max(1,Math.min(60,parseInt(inp.value)||1));
      else d[k]=inp.value;
      if(k==="v"||k==="desc"){
        $(".draft-v",el).textContent=d.v?((d.k==="e"?"+":"")+fmt(d.v)):"—";

function readInput(){
  const raw=$("#say").value.trim();
  if(!raw){ toast("Fale ou escreva alguma coisa primeiro."); return; }
  const parts=splitUtterance(raw);
  S.drafts=(parts.length?parts:[raw]).map(s=>parseOne(s,S.cfg));
  const bad=S.drafts.filter(d=>!d.v).length;
  const st=$("#parseStatus"); st.hidden=false;
  st.innerHTML=S.drafts.length+" lançamento"+(S.drafts.length>1?"s lidos":" lido")+(bad?" · "+bad+" sem valor":"");
  renderDrafts(); $("#draftSec").scrollIntoView({behavior:"smooth",block:"start"}); }
async function saveDrafts(){
  const ok=S.drafts.filter(d=>d.v&&d.incluir!==false); let fixos=0, acertadas=0, empurradas=0;
  for(const d of S.drafts) if(d.dupAuto&&d.dup&&(d.ajustarValor||d.moverPara)){ await ajustarParcelaReservada(d); acertadas++; }
  /* uma fatura inteira acabou de ser lida: as parcelas que ela não traz vão para a fatura seguinte */
  const fatDoc=[...new Set(S.drafts.filter(d=>d.origem==="fatura"&&d.cardId&&d.ym).map(d=>d.cardId+"|"+d.ym))];
  for(const chave of fatDoc){ const [cid,ym]=chave.split("|"); empurradas+=await empurrarParcelasNaoCobradas(cid,ym,S.drafts); }
  /* fatura que veio do documento do banco: o app sabe o valor de verdade e pode cobrar vencimento */
  registrarDocumentos(S.drafts);
  registrarDocumentos(S.drafts);
  if(!ok.length){ S.drafts=[]; render();
    toast(acertadas?acertadas+(acertadas>1?" parcelas acertadas":" parcela acertada")+" pelo valor da fatura; nada novo para lançar.":"Nada novo para lançar: tudo já estava lançado.");
    return; }
  $("#dSave").disabled=true;
  for(const d of ok){ if(d.fixo&&d.k!=="e"&&(+d.n||1)<=1){ const fx={id:uid(),name:d.desc||"Gasto fixo",amount:d.v,day:+String(d.date).slice(8,10)||1,cat:d.cat,card:d.cardId}; (S.cfg.fixed=S.cfg.fixed||[]).push(fx); d.fix=fx.id; fixos++; } await commit(d); } if(fixos) await saveCfg();
  /* carga de extratos chegou ao mês atual: o salário automático volta */
  if(S.cfg.salPausa&&ok.some(d=>d.origem==="extrato"&&String(d.date)>=ymOf(todayISO())+"-01")){ S.cfg.salPausa=false; saveCfg(); }
  const religados=ok.some(d=>d.origem==="fatura")?await religarPagamentos():0;
  S.drafts=[]; render();
  toast(ok.length+(ok.length>1?" lançamentos salvos":" lançamento salvo")+(fixos?" · "+fixos+" como fixo todo mês":"")+
    (acertadas?" · "+acertadas+(acertadas>1?" parcelas acertadas":" parcela acertada")+" pelo valor da fatura":"")+
    (empurradas?" · "+empurradas+(empurradas>1?" parcelas ainda não cobradas foram":" parcela ainda não cobrada foi")+" para a fatura seguinte":"")+
    (religados?" · "+religados+(religados>1?" pagamentos do extrato ligados ao cartão":" pagamento do extrato ligado ao cartão"):""));
  /* aplicação automática: quando o banco resgata mais do que aplicou, a diferença é o rendimento */
  const invs=[...new Set(ok.filter(d=>d.k==="t").map(d=>d.acct).concat(ok.filter(d=>d.k==="t").map(d=>d.acct2)))]
    .filter(id=>id&&((S.cfg.accounts||[]).find(a=>a.id===id)||{}).type==="invest");
  const datas=ok.map(d=>d.date).filter(Boolean).sort(), ate=datas[datas.length-1]||todayISO();
  const sd=S.docSaldo; S.docSaldo=null;
  if(sd&&sd.conta&&sd.saldo){ setTimeout(()=>openAcerto(sd.conta,sd.saldo,()=>perguntarRendimento(invs,ate)),700); return; }
  if(perguntarRendimento(invs,ate)) return;
  /* acabou de importar uma fatura: o pagamento dela pode já ter vindo do extrato do banco */
  const fat=ok.filter(d=>d.origem==="fatura"&&d.cardId&&d.ym);
  for(const d of fat) if(perguntarPagamentoDaFatura(d.cardId,d.ym)) break; }

/* pergunta antes de deixar a fatura "a pagar" quando o pagamento já saiu da conta pelo extrato */
function perguntarPagamentoDaFatura(cardId,ym){
  const inv=cardInvoice(cardId,ym); if(inv.open<=0) return false;
  const t=pagamentoJaLancado(cardId,ym,inv.open); if(!t) return false;
  setTimeout(()=>sheet("Esta fatura já foi paga?",
    '<div class="set"><div class="note"><b>'+esc(cardName(cardId))+' · fatura de '+esc(ymLabel(ym))+'</b>Falta pagar '+fmt(inv.open)+
    ', e já existe um pagamento de '+fmt(t.v)+' em '+diaMesAno(t.d)+', saindo de '+esc(acctName(t.acct||acctOf(t.card)))+
    (semCartaoCerto(t)?' — o extrato do banco não diz de qual cartão é, só "pagamento de fatura"'
      :(t.card&&t.card!==cardId?' (lançado no '+esc(cardName(t.card))+')':''))+'. Se for desta fatura, ligo os dois'+
    (t.v<inv.open?': ela fica com pagamento parcial de '+fmt(t.v)+', faltando '+fmt(inv.open-t.v)+'.':': o dinheiro não sai de novo da conta.')+'</div></div>',
    '<button class="btn ghost" id="pfN">Não é esta fatura</button><button class="btn" id="pfS">Sim, é esta</button>'),500);
  setTimeout(()=>{ const n=$("#pfN"), y=$("#pfS"); if(!n||!y) return;
    n.onclick=closeSheet;
    y.onclick=async()=>{ await ligarPagamento(t,cardId,ym); closeSheet(); render();
      toast("Fatura de "+ymLabel(ym)+" marcada como paga pelo lançamento de "+diaMesAno(t.d)+"."); }; },620);
  return true; }

function closeSheet(){ $("#scrim").hidden=true; $("#sheet").innerHTML=""; }
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeSheet(); };
const optId=(arr,sel)=>arr.map(o=>'<option value="'+o.id+'"'+(o.id===sel?" selected":"")+">"+esc(o.n)+"</option>").join("");

function openTx(ym,id){
  const t=(S.months[ym]||{tx:{}}).tx[id]; if(!t) return;
  const kind=t.k||"g", A=S.cfg.accounts||[];
  const catList=kind==="e"?(S.cfg.ecats||ECATS):S.cfg.cats;
  sheet(t.aj?(kind==="t"?"Acerto de saldo":"Acerto da fatura"):kind==="e"?"Entrada":kind==="p"?"Pagamento de fatura":kind==="t"?"Transferência entre contas"
      :(t.n>1?"Parcela "+t.i+" de "+t.n:"Lançamento"),

      ? '<div class="two"><div class="set-f"><label>Sai de</label><select id="tA"><option value="">Fora do app</option>'+optId(A,t.acct||"")+'</select></div>'+

        (kind==="g"
          ? '<div class="set-f"><label>Pagamento</label><select id="tP">'+optId(S.cfg.cards,t.card)+'</select></div>'
          : '<div class="set-f"><label>'+(kind==="e"?"Cai na conta":"Sai da conta")+'</label><select id="tA">'+optId(A,t.acct||acctOf(t.card))+'</select></div>')+
        '</div>'+
        (kind==="g"&&TEM_DESTINO[t.method]?'<div class="set-f"><label>Para quem</label><input id="tTo" value="'+esc(t.to||"")+'"></div>':'')+
        /* pagamento de fatura: dá para corrigir a qual cartão e a qual fatura ele pertence */
        (kind==="p"?'<div class="two"><div class="set-f"><label for="tPC">De qual cartão</label>'+
          '<select id="tPC"><option value="">A confirmar</option>'+optId(creditCards(),t.card)+'</select></div>'+
          '<div class="set-f"><label for="tPR">Abate a fatura de</label>'+
          '<input id="tPR" type="month" value="'+(t.ref||ym)+'"></div></div>'+
          '<div class="set-f"><span class="hint">É assim que se conserta um pagamento que o app ligou ao cartão errado: escolha o cartão certo e o mês da fatura. O dinheiro não sai de novo da conta.</span></div>':''))+
    (t.n>1?'<div class="set-f"><span class="hint">Compra de '+fmt(t.total)+' em '+t.n+'x. Mudar o valor aqui muda só esta parcela.</span></div>':'')+
    (t.raw?'<div class="raw">“'+esc(t.raw)+'”</div>':'')+'</div>',
    (kind==="g"&&(+t.n||1)<=1&&!t.fix?'<button class="btn ghost" id="tFix">Tornar fixo</button>':'')+'<button class="btn danger" id="tKill">'+(t.n>1?"Excluir compra":"Excluir")+'</button><button class="btn" id="tOk">Salvar</button>');
  $("#tOk").onclick=async()=>{
    const nd=$("#tDt").value||t.d;
    const patch={desc:$("#tD").value.trim()||t.desc, v:toCents($("#tV").value)};
    if($("#tC")) patch.cat=$("#tC").value;
    if($("#tP")){ patch.card=$("#tP").value; const c=S.cfg.cards.find(x=>x.id===patch.card);
      if(c) patch.method=c.type; patch.acct=acctOf(patch.card); }
    if($("#tA")) patch.acct=$("#tA").value;
    if($("#tPC")!==null&&kind==="p"){ patch.card=$("#tPC").value;
      patch.raw=patch.card?"Extrato · pagamento de fatura":"Extrato · pagamento de fatura — cartão a confirmar"; }
    if($("#tPR")&&kind==="p"&&$("#tPR").value) patch.ref=$("#tPR").value;
    if($("#tB")) patch.acct2=$("#tB").value;
    if($("#tTo")) patch.to=$("#tTo").value.trim();
    /* compra no crédito continua na mesma fatura quando muda a data; virou crédito agora: a fatura sai do dia e do fechamento */
    if((patch.method||t.method)==="credito"&&!t.fat) patch.fat=t.method==="credito"?ym:txMonth(nd,patch.card||t.card,0);
    const newYm=ymOf(nd);
    if(newYm!==ym){ S.months[ym].tx[id]={del:1,u:Date.now()};
      if(!S.months[newYm]) S.months[newYm]={tx:{}};
      S.months[newYm].tx[id]=Object.assign({},t,patch,{d:nd,u:Date.now()});
      await saveMonth(ym); await saveMonth(newYm); }
    else { Object.assign(S.months[ym].tx[id],patch,{d:nd,u:Date.now()}); await saveMonth(ym); }
    closeSheet(); render(); toast("Salvo"); };
  const tf=$("#tFix"); if(tf) tf.onclick=async()=>{ const fx={id:uid(),name:t.desc,amount:t.v,day:+t.d.slice(8,10)||1,cat:t.cat,card:t.card}; (S.cfg.fixed=S.cfg.fixed||[]).push(fx); S.months[ym].tx[id].fix=fx.id; S.months[ym].tx[id].u=Date.now(); await saveCfg(); await saveMonth(ym); closeSheet(); render(); toast("Agora é fixo todo mês. Aparece em Ajustes, em Gastos fixos."); };
  $("#tKill").onclick=async()=>{ await removeTx(ym,id,t.n>1); closeSheet(); render();
    toast(t.n>1?"Compra e parcelas excluídas":"Excluído"); }; }

      n:isE?1:Math.max(1,Math.min(60,parseInt($("#mN").value)||1)),
      date:$("#mDt").value||todayISO(), time:nowTime(), k:isE?"e":"g"});
    closeSheet(); render(); toast(isE?"Entrada lançada":"Gasto lançado"); }; }

function openAcct(id){
  const A=S.cfg.accounts||[];
  const a=A.find(x=>x.id===id)||{id:uid(),n:"",type:"corrente",opening:0,openDate:"",adjust:[]};
  const isNew=!A.some(x=>x.id===a.id);
  sheet(isNew?"Nova conta":a.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="aN" value="'+esc(a.n)+'" placeholder="Banco do Brasil"></div>'+
    '<div class="set-f"><label>Tipo</label><select id="aT">'+
    Object.keys(ACCT_TIPO).map(k=>'<option value="'+k+'"'+(k===a.type?" selected":"")+'>'+ACCT_TIPO[k]+'</option>').join("")+'</select></div>'+
    (isNew
      ? '<div class="set-f"><label>Quanto tem nela hoje</label><input id="aB" inputmode="decimal" placeholder="0,00">'+
        '<span class="hint">A partir daqui o app soma as entradas e subtrai os gastos sozinho. Para carregar extratos antigos, use depois <b>Saldo inicial</b>.</span></div>'
      : '<div class="set-f"><span class="hint">O saldo se acerta nos botões <b>Saldo inicial</b> e <b>Corrigir saldo</b>, ao lado do nome da conta.</span></div>')+
    '</div>',
    (isNew?'<button class="btn ghost" id="aX">Cancelar</button>':'<button class="btn danger" id="aKill">Excluir</button>')+'<button class="btn" id="aOk">Salvar</button>');
  const x=$("#aX"); if(x) x.onclick=closeSheet;
  $("#aOk").onclick=()=>{
    const nm=$("#aN").value.trim(); if(!nm){ toast("Dê um nome."); return; }
    if(isNew) A.push({id:a.id,n:nm,type:$("#aT").value,opening:toCents($("#aB").value),openDate:"",adjust:[]});
    else { const r=A.find(x=>x.id===a.id); r.n=nm; r.type=$("#aT").value; }
    S.cfg.accounts=A; saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#aKill");
  if(k) k.onclick=()=>{ if(A.length<=1){ toast("Precisa de pelo menos uma conta."); return; }
    /* excluir fica no lugar do "Cancelar" das outras fichas: pede um segundo toque */
    const resto=A.filter(x=>x.id!==a.id), destino=resto[0];
    const nTx=allTx().filter(t=>t.acct===a.id||t.acct2===a.id).length;
    if(!k.dataset.certeza){ k.dataset.certeza="1"; k.textContent="Excluir mesmo?";
      toast((nTx?nTx+" lançamentos e os ":"Os ")+"cartões desta conta passam para "+destino.n+". Toque de novo para excluir."); return; }
    (S.cfg.cards||[]).forEach(x=>{ if(x.acct===a.id) x.acct=destino.id; });
    const meses=new Set();
    Object.keys(S.months).forEach(ym=>{ const tx=(S.months[ym]||{}).tx||{};
      Object.keys(tx).forEach(id=>{ const t=tx[id]; if(!t||t.del) return;
        if(t.acct===a.id){ t.acct=destino.id; t.u=Date.now(); meses.add(ym); }
        if(t.acct2===a.id){ t.acct2=destino.id; t.u=Date.now(); meses.add(ym); } }); });
    destino.opening=(destino.opening||0)+(a.opening||0);
    S.cfg.accounts=resto; saveCfg(); meses.forEach(ym=>saveMonth(ym));
    closeSheet(); render(); toast("Excluída. Cartões e lançamentos foram para "+destino.n+"."); }; }

/* saldo inicial: a data do primeiro extrato e o saldo anterior impresso nele. Antes dessa data, nada conta no saldo. */

    '<div class="set-f"><span class="hint">Saldo negativo leva o sinal de menos: -1.250,00. No Banco do Brasil, some o que estava no BB Rende Fácil.</span></div></div>',

    toast("Saldo de "+fmt(v)+" em "+diaMesAno(diaAnterior(dt))+". Os lançamentos contam a partir de "+diaMesAno(dt)+"."); }; }

/* acerto de saldo: numa data antes do início da conta, muda o saldo inicial; depois, vira o lançamento "Acerto de saldo"
   naquele dia, entre a conta e "fora do app". Não conta como gasto nem como renda e só mexe no saldo dali em diante. */
async function acertarSaldo(acctId,dia,valor,comoGasto){
  const a=(S.cfg.accounts||[]).find(x=>x.id===acctId); if(!a) return 0;
  const delta=valor-balanceOf(acctId,dia); if(!delta) return 0;
  /* na carteira, o que sumiu foi gasto em dinheiro: entra como gasto, para contar no teto e nas análises */
  if(comoGasto&&delta<0){
    const din=(S.cfg.cards.find(c=>c.type==="dinheiro")||{}).id||"";
    await commit({id:uid(),raw:"",v:-delta,desc:"Gastos em dinheiro",cat:"outros",method:"dinheiro",cardId:din,
      acct:acctId,n:1,date:dia,time:"23:59",k:"g"});
    return delta; }
  if(a.openDate&&dia<a.openDate){ a.opening=(a.opening||0)+delta; a.adjust=(a.adjust||[]).concat([{d:dia,delta}]).slice(-20); await saveCfg(); return delta; }
  await commit({id:uid(),raw:"",v:Math.abs(delta),desc:"Acerto de saldo",cat:"outros",method:"transferencia",cardId:"transf",
    acct:delta<0?acctId:"",acct2:delta>0?acctId:"",n:1,date:dia,time:"23:59",k:"t",aj:1});
  return delta; }
/* acerto da fatura: a diferença entra na própria fatura como gasto no crédito (negativo, se o banco cobrou menos) */
async function acertarFatura(cid,ym,valor){
  const c=creditCards().find(x=>x.id===cid); if(!c) return 0;
  const delta=valor-cardInvoice(cid,ym).total; if(!delta) return 0;
  const dia=ym+"-"+pad(Math.min(c.closing||daysIn(ym),daysIn(ym)));
  if(!S.months[ym]) S.months[ym]={tx:{}};
  if(!S.months[ym].tx) S.months[ym].tx={};
  S.months[ym].tx[uid()]={d:dia,t:"23:59",v:delta,desc:"Acerto da fatura",cat:"outros",method:"credito",card:cid,raw:"",plan:"",i:1,n:1,total:delta,
    fix:"",k:"g",acct:acctOf(cid),acct2:"",ref:"",to:"",u:Date.now(),fat:ym,aj:1};
  await saveMonth(ym); return delta; }
const mesAtual=()=>ymOf(todayISO());
const diaDoAcerto=ym=>ym>=mesAtual()?todayISO():ym+"-"+pad(daysIn(ym));
function acertosDe(filtro){
  const L=allTx().filter(t=>t.aj&&filtro(t)).sort((x,y)=>y.d.localeCompare(x.d)).slice(0,3);
  return L.length?'<div class="set-f"><span class="hint">Últimos acertos: '+L.map(t=>diaMesAno(t.d)+" "+(t.k==="t"?(t.acct2?"+":"−")+fmtN(t.v):(t.v>0?"+":"")+fmtN(t.v))).join(" · ")+
    '. Para desfazer, toque no acerto no extrato da aba Contas.</span></div>':''; }

/* corrigir: o saldo que o banco (ou a carteira) mostra no fim de um mês, para o mês seguinte já começar certo */
function openCorrigirSaldo(id){
  const a=(S.cfg.accounts||[]).find(x=>x.id===id); if(!a) return;
  const carteira=a.type==="carteira", ym0=S.ym>mesAtual()?mesAtual():S.ym;
  sheet("Corrigir saldo · "+a.n,
    '<div class="set"><div class="set-f"><label for="scM">Mês</label><input id="scM" type="month" max="'+mesAtual()+'" value="'+ym0+'">'+
    '<span class="hint">O saldo é o do último dia do mês (no mês atual, o de hoje). Acertando um mês, o seguinte já começa certo.</span></div>'+
    '<div class="linkrow"><div class="m"><div class="t" id="scRot"></div><div class="s">saldo inicial, mais entradas, menos saídas</div></div><span class="row-v" id="scCalc"></span></div>'+
    '<div class="set-f"><label for="scV" id="scLbl"></label><input id="scV" inputmode="decimal">'+
    (carteira?'<div style="margin-top:6px"><button class="mini" id="scZero">Não sobrou nada: zerar</button></div>':'')+
    '<span class="hint">'+(carteira?'Conte o dinheiro que está na carteira. O que faltar entra como <b>gasto em dinheiro</b>, na categoria Outros — depois dá para trocar a categoria tocando no lançamento. ':'No Banco do Brasil, some o saldo da conta com o do BB Rende Fácil. ')+
    'Antes, veja se falta lançar ou importar algo daquele mês: a diferença pode ser só isso. O acerto aparece no extrato como <b>Acerto de saldo</b> e não conta como gasto nem como renda.</span></div>'+
    acertosDe(t=>t.acct===a.id||t.acct2===a.id)+'</div>',
    '<button class="btn ghost" id="scX">Cancelar</button><button class="btn" id="scOk">Corrigir</button>');
  const mes=()=>{ const v=$("#scM").value||ym0; return v>mesAtual()?mesAtual():v; };
  const atualiza=()=>{ const ym=mes(), dia=diaDoAcerto(ym), hoje=ym===mesAtual(), calc=balanceOf(a.id,dia);
    $("#scRot").textContent="A Caderneta calcula "+(hoje?"hoje":"em "+diaMesAno(dia));
    $("#scCalc").textContent=fmtN(calc);
    $("#scLbl").textContent=(carteira?(hoje?"Tenho hoje":"Tinha em "+diaMesAno(dia)):(hoje?"O banco mostra hoje":"Saldo do banco em "+diaMesAno(dia)));
    $("#scV").value=fmtN(calc); };
  $("#scM").onchange=atualiza; atualiza();
  $("#scX").onclick=closeSheet;
  const z=$("#scZero"); if(z) z.onclick=()=>{ $("#scV").value=fmtN(0); };
  $("#scOk").onclick=async()=>{ const ym=mes(), dia=diaDoAcerto(ym);
    const delta=await acertarSaldo(a.id,dia,toCents($("#scV").value),carteira);
    closeSheet(); render();
    toast(delta?(carteira&&delta<0?"Lançado "+fmt(-delta)+" de gasto em dinheiro em "+diaMesAno(dia)
      :"Saldo de "+diaMesAno(dia)+" corrigido em "+(delta>0?"+":"")+fmt(delta)):"O saldo já batia"); }; }

/* corrigir a fatura de um cartão: o total do banco para as compras e encargos daquele mês */
function openCorrigirFatura(cid){
  const c=creditCards().find(x=>x.id===cid); if(!c) return;
  sheet("Corrigir fatura · "+c.n,
    '<div class="set"><div class="set-f"><label for="cfM">Fatura de</label><input id="cfM" type="month" value="'+S.ym+'"></div>'+
    '<div class="linkrow"><div class="m"><div class="t">A Caderneta soma</div><div class="s" id="cfS"></div></div><span class="row-v" id="cfCalc"></span></div>'+
    '<div class="set-f"><label for="cfV">Total do banco nesta fatura</label><input id="cfV" inputmode="decimal">'+
    '<span class="hint">Some, no resumo da fatura, as compras, tarifas e encargos do período — sem o saldo da fatura anterior e sem pagamentos. '+
    'A diferença entra na fatura como <b>Acerto da fatura</b>: conta como gasto daquele mês, ou abate, se o banco cobrou menos. Não mexe na conta corrente.</span></div>'+
    acertosDe(t=>t.card===cid&&t.k==="g")+'</div>',
    '<button class="btn danger" id="cfDel">Apagar esta fatura</button><button class="btn" id="cfOk">Corrigir</button>');
  const atualiza=()=>{ const ym=$("#cfM").value||S.ym, inv=cardInvoice(cid,ym), n=comprasDaFatura(cid,ym).length;
    const del=$("#cfDel"); if(del){ delete del.dataset.certeza; del.textContent="Apagar esta fatura"; }
    $("#cfS").textContent=n+(n===1?" lançamento":" lançamentos")+" na fatura de "+ymLabel(ym);
    $("#cfCalc").textContent=fmtN(inv.total); $("#cfV").value=fmtN(inv.total); };
  $("#cfM").onchange=atualiza; atualiza();
  /* fatura importada no mês errado: apaga só os lançamentos dela (com as parcelas seguintes), sem tocar no pagamento */
  $("#cfDel").onclick=async()=>{ const ym=$("#cfM").value||S.ym, L=comprasDaFatura(cid,ym);
    if(!L.length){ toast("Não há lançamentos nesta fatura."); return; }
    const del=$("#cfDel");
    if(!del.dataset.certeza){ del.dataset.certeza="1"; del.textContent="Apagar mesmo?";
      toast(L.length+(L.length>1?" lançamentos":" lançamento")+" da fatura de "+ymLabel(ym)+(L.some(t=>t.plan)?", com as parcelas seguintes":"")+". Toque de novo para apagar."); return; }
    /* de uma compra parcelada saem esta parcela e as seguintes; as anteriores, que estão em faturas já conferidas, ficam */
    const fora=[];
    L.forEach(t=>{ if(!t.plan){ fora.push(t); return; }
      allTx().forEach(x=>{ if(x.plan===t.plan&&x.i>=t.i&&!fora.some(y=>y.id===x.id)) fora.push(x); }); });
    for(const t of fora) await removeTx(t.ym,t.id,false);
    closeSheet(); render();
    toast(fora.length+(fora.length>1?" lançamentos apagados":" lançamento apagado")+" da fatura de "+ymLabel(ym)+". Importe o arquivo de novo."); };
  $("#cfOk").onclick=async()=>{ const ym=$("#cfM").value||S.ym, delta=await acertarFatura(cid,ym,toCents($("#cfV").value));
    closeSheet(); render(); toast(delta?"Fatura de "+ymLabel(ym)+" corrigida em "+(delta>0?"+":"")+fmt(delta):"A fatura já batia"); }; }

/* o pagamento desta fatura pode já ter saído da conta pelo extrato do banco, com outro nome, em outro cartão ou
   com o mês errado. Procura um pagamento perto do vencimento que ainda não está contado nesta fatura. */
/* pagamento vindo do extrato sem o nome do cartão: o cartão que estiver ali é palpite, não informação */
const semCartaoCerto=t=>!t.card||/confira o cart|cart.o a confirmar/.test(t.raw||"");
function pagamentoJaLancado(cardId,ym,valor){
  const c=creditCards().find(x=>x.id===cardId)||{};
  const venc=c.due&&(!c.closing||c.due<c.closing)?ymShift(ym,1):ym;
  const alvo=Date.parse(venc+"-"+pad(Math.min(c.due||daysIn(venc),daysIn(venc)))+"T12:00:00");
  const perto=t=>Math.abs(Date.parse(t.d+"T12:00:00")-alvo)<=25*86400000;
  /* só entram pagamentos que ainda não têm dono: sem cartão, ou com cartão que o próprio app chutou,
     ou já deste cartão em outro mês. Pagamento de outro cartão não pode ser oferecido como se fosse
     desta fatura — era o que acontecia: o pagamento do Visa aparecia como "parte" da fatura do Elo. */
  const livre=t=>semCartaoCerto(t)||t.card===cardId;
  const cand=allTx().filter(t=>t.k==="p"&&!(t.card===cardId&&t.ref===ym)&&perto(t)&&livre(t))
    .map(t=>({t,dif:Math.abs(t.v-valor),parcial:t.v<valor&&t.v>=Math.round(valor*0.15)}))
    .filter(x=>x.dif<=1||(valor>0&&x.dif<=Math.round(valor*0.02))||x.parcial)   /* o banco pode ter pago só um pedaço */
    .sort((a,b)=>a.dif-b.dif||Math.abs(Date.parse(a.t.d)-alvo)-Math.abs(Date.parse(b.t.d)-alvo));
  return cand.length?cand[0].t:null; }
async function ligarPagamento(t,cardId,ym){
  const m=S.months[t.ym]; if(!m||!m.tx||!m.tx[t.id]) return;
  Object.assign(m.tx[t.id],{card:cardId, ref:ym, raw:"Extrato · pagamento de fatura", u:Date.now()});
  await saveMonth(t.ym); }

/* guarda que o documento foi lido — mesmo quando ele não acrescenta nada, porque tudo já estava lançado */
function registrarDocumentos(drafts){
  let mudou=false;
  const fa=S.cfg.faturasLidas=S.cfg.faturasLidas||{}, ex=S.cfg.extratosLidos=S.cfg.extratosLidos||{};
  [...new Set((drafts||[]).filter(d=>d.origem==="fatura"&&d.cardId&&d.ym).map(d=>d.cardId+"|"+d.ym))]
    .forEach(k=>{ if(fa[k]!==todayISO()){ fa[k]=todayISO(); mudou=true; } });
  const porMes={};
  (drafts||[]).filter(d=>d.origem==="extrato"&&d.contaDoc&&d.date).forEach(d=>{ const k=d.contaDoc+"|"+ymOf(d.date); porMes[k]=(porMes[k]||0)+1; });
  Object.keys(porMes).forEach(k=>{ if(porMes[k]>=3&&fa[k]!==todayISO()&&ex[k]!==todayISO()){ ex[k]=todayISO(); mudou=true; } });
  if(mudou) saveCfg();
  return mudou; }

/* o que já foi importado, mês a mês. A lista é do ano corrente (pedido do dono, 26/09/2026); em janeiro, o ano
   anterior continua à vista, para não perder de vista o que ficou faltando; de fevereiro em diante, só o ano novo. */
function mesesDoQuadro(){
  const cur=ymOf(todayISO()), ano=+cur.slice(0,4), mes=+cur.slice(5,7), out=[];
  for(let m=mes;m>=1;m--) out.push(ano+"-"+pad(m));
  if(mes===1) for(let m=12;m>=1;m--) out.push((ano-1)+"-"+pad(m));
  return out; }
function mesesComDados(){
  const A=S.cfg.accounts||[], cur=ymOf(todayISO());
  let ini=cur;
  A.forEach(a=>{ if(a.openDate&&ymOf(a.openDate)<ini) ini=ymOf(a.openDate); });
  Object.keys(S.months||{}).forEach(ym=>{ if(txOf(ym).length&&ym<ini) ini=ym; });
  Object.keys(S.cfg.faturasLidas||{}).concat(Object.keys(S.cfg.extratosLidos||{}))
    .forEach(k=>{ const m=k.split("|")[1]; if(m&&m<ini) ini=m; });
  const out=[]; let ym=cur;
  while(ym>=ini&&out.length<60){ out.push(ym); ym=ymShift(ym,-1); }
  return out; }
function htmlImportacoes(){
  const ex=S.cfg.extratosLidos||{}, fa=S.cfg.faturasLidas||{}, cur=ymOf(todayISO());
  const temImport=(mapa,id)=>Object.keys(mapa).some(k=>k.indexOf(id+"|")===0);
  /* toda conta de banco tem extrato: entram corrente e poupança, mais qualquer uma que já teve extrato importado.
     Ficam de fora só a carteira (dinheiro) e a conta da aplicação automática, que não têm extrato próprio. */
  const A=S.cfg.accounts||[];
  let contas=A.filter(a=>a.type==="corrente"||a.type==="poupanca"||temImport(ex,a.id));
  if(!contas.length) contas=A.filter(a=>a.type!=="carteira"&&a.type!=="invest");
  const cartoes=creditCards();
  if(!contas.length&&!cartoes.length) return "";
  const todos=mesesComDados(), meses=mesesDoQuadro();
  /* de quando cobrar cada documento: da abertura da conta (ou do primeiro mês com movimento) e, no cartão,
     do primeiro mês em que ele teve fatura */
  const desdeConta={}, desdeCartao={};
  contas.forEach(a=>{ let d=a.openDate?ymOf(a.openDate):"";
    Object.keys(ex).forEach(k=>{ const [id,m]=k.split("|"); if(id===a.id&&(!d||m<d)) d=m; });
    todos.forEach(m=>{ if((!d||m<d)&&movsConta(a.id,m).length) d=m; });
    desdeConta[a.id]=d||todos[todos.length-1]||cur; });
  cartoes.forEach(c=>{ let d="";
    Object.keys(fa).forEach(k=>{ const [id,m]=k.split("|"); if(id===c.id&&(!d||m<d)) d=m; });
    todos.forEach(m=>{ if(cardInvoice(c.id,m).total&&(!d||m<d)) d=m; });
    desdeCartao[c.id]=d; });
  const docsDoMes=ym=>{ const out=[];
    contas.forEach(a=>{ if(desdeConta[a.id]&&ym<desdeConta[a.id]) return;
      /* só cobra extrato de conta corrente ou de conta que você já importou alguma vez: poupança fica no quadro,
         mas não entra na conta do que falta enquanto você não importar a primeira */
      const cobra=ym<=cur&&(a.type==="corrente"||temImport(ex,a.id));
      out.push({lido:!!ex[a.id+"|"+ym], nome:a.n, quando:ex[a.id+"|"+ym], cobra, chave:"e|"+a.id+"|"+ym}); });
    cartoes.forEach(c=>{ const d=desdeCartao[c.id]; if(!d||ym<d) return;
      out.push({lido:!!fa[c.id+"|"+ym], nome:c.n, quando:fa[c.id+"|"+ym], cobra:ym<=cur, chave:"f|"+c.id+"|"+ym}); });
    return out; };
  let faltam=0;
  const linhas=meses.map(ym=>{ const L=docsDoMes(ym); if(!L.length) return "";
    const chips=L.map(x=>{ if(!x.lido&&x.cobra) faltam++;
      const quando=x.quando==="auto"?"reconhecido pelos lançamentos do documento"
        :x.quando==="manual"?"marcado por você":"importado em "+diaMesAno(x.quando);
      return '<button class="chip '+(x.lido?"ok":"")+'" data-marca="'+x.chave+'" title="'+(x.lido?quando+" · toque para desmarcar":"ainda não importado · toque para marcar como já importado")+'">'+
        (x.lido?"✓ ":"")+esc(x.nome)+'</button>'; }).join("");
    return '<div class="linkrow wrap"><div class="m"><div class="t">'+esc(ymLabel(ym))+'</div>'+
      '<div class="s" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">'+chips+'</div></div></div>'; }).join("");
  /* o que ficou faltando em anos que saíram da lista */
  let antes=0;
  todos.filter(m=>meses.indexOf(m)<0).forEach(m=>docsDoMes(m).forEach(x=>{ if(!x.lido&&x.cobra) antes++; }));
  const ano=cur.slice(0,4), janeiro=+cur.slice(5,7)===1;
  return '<div class="sec"><div class="sec-h"><h2 class="sec-t">O que já foi importado · '+ano+(janeiro?" e "+(+ano-1):"")+'</h2>'+
    '<span class="day-t">'+(faltam?faltam+(faltam>1?" documentos faltando":" documento faltando"):"tudo em dia")+'</span></div>'+
    '<div class="card pad">'+
    '<div class="say-hint" style="margin-bottom:8px">Verde é o que já entrou; cinza é o que falta — <b>toque num selo</b> para marcar ou desmarcar à mão. O extrato se importa em Lançar → Importar extrato da conta; a fatura, em Importar fatura do cartão. A lista mostra o ano corrente — em janeiro, o ano anterior continua aqui.</div>'+
    linhas+
    (antes?'<div class="say-hint" style="margin-top:10px">Ainda faltam '+antes+(antes>1?" documentos de anos anteriores":" documento de anos anteriores")+'. Eles saíram da lista, mas continuam podendo ser importados: basta escolher o arquivo em Lançar.</div>':"")+
    '</div></div>'; }

/* =================== consulta =================== */
/* procurar gastos por categoria e período, com data e forma de pagamento em cada linha */
/* "mês" e "mês anterior" seguem o mês que está na barra de cima, como o resto do app */
/* o dia de referência da Consulta é o mês da barra de cima: hoje, quando o mês é o atual;
   o último dia do mês, quando é um mês passado; o dia 1º, quando é um mês futuro. */
const refDia=()=>{ const hoje=todayISO(), atual=ymOf(hoje);
  if(S.ym===atual) return hoje;
  return S.ym>atual ? S.ym+"-01" : S.ym+"-"+pad(daysIn(S.ym)); };
const rotuloPeriodos=()=>{ const hoje=todayISO(), atual=S.ym===ymOf(hoje), ref=diaMes(refDia());
  return [["hoje",atual?"Hoje":"Dia "+ref],["semana",atual?"Esta semana":"Semana até "+ref],
    ["mes",atual?"Este mês":ymLabel(S.ym)],["anterior",ymLabel(ymShift(S.ym,-1))],
    ["30",atual?"Últimos 30 dias":"30 dias até "+ref],
    ["ano",S.ym.slice(0,4)===hoje.slice(0,4)?"Este ano":S.ym.slice(0,4)],
    ["tudo","Tudo"],["livre","Escolher datas"]]; };
function periodoDatas(p){
  const hoje=todayISO(), ref=refDia();
  const dia=n=>new Date(Date.parse(ref+"T12:00:00")+n*86400000).toISOString().slice(0,10);
  if(p==="hoje") return [ref,ref];
  if(p==="semana"){ const d=new Date(Date.parse(ref+"T12:00:00")).getDay(); return [dia(-((d+6)%7)),ref]; }
  if(p==="mes") return [S.ym+"-01", S.ym+"-"+pad(daysIn(S.ym))];
  if(p==="anterior"){ const a=ymShift(S.ym,-1); return [a+"-01", a+"-"+pad(daysIn(a))]; }
  if(p==="30") return [dia(-29),ref];
  if(p==="ano"){ const a=S.ym.slice(0,4); return [a+"-01-01", a+"-12-31"]; }
  if(p==="tudo") return ["2000-01-01", Math.max(+hoje.slice(0,4),+S.ym.slice(0,4))+"-12-31"];
  return null; }
function consultaAchados(c){
  c=c||S.consulta;
  const [de,ate]=c.periodo==="livre"?[c.de,c.ate]:periodoDatas(c.periodo);
  if(!de||!ate||de>ate) return {de,ate,linhas:[]};
  const out=[];
  let ym=ymOf(de); const fim=ymOf(ate);
  while(ym<=fim){ txOf(ym).forEach(t=>{
      if(t.d<de||t.d>ate) return;
      const k=t.k||"g";
      if(c.tipo!=="tudo"&&k!==c.tipo) return;
      if(c.tipo==="tudo"&&k!=="g"&&k!=="e") return;
      if(c.cats.length&&c.cats.indexOf(t.cat)<0) return;
      if(c.formas.length&&c.formas.indexOf(t.card||t.method)<0) return;
      out.push(t); });
    ym=ymShift(ym,1); }
  out.sort((a,b)=>(b.d+(b.t||"")).localeCompare(a.d+(a.t||"")));
  return {de,ate,linhas:out}; }
/* calendarinho: marca a data tocando no dia, sem digitar nada.
   (campo type=date obrigava a digitar o ano dígito a dígito e a tela se redesenhava no meio.) */

function renderConsulta(){

  const r=consultaAchados(c), L=r.linhas;

    else {

    const quanto=noAno===emTudo
      ? emTudo+(emTudo>1?" lançamentos, todos neste ano":" lançamento, neste ano")

    dica=emTudo
      ? '<div class="note" style="margin-top:12px"><b>Nada neste período</b>Com os filtros de agora há '+quanto+

        (noAno?'<button class="mini" data-per="ano" style="margin-right:6px">Este ano</button>':'')+
        '<button class="mini" data-per="tudo">Tudo</button></div>'
      : '<div class="note" style="margin-top:12px"><b>Nada encontrado</b>Não há lançamentos com esses filtros em nenhum período. Desmarque alguma categoria ou forma de pagamento.</div>'; } }
  const total=L.reduce((s,t)=>s+(t.k==="e"?-t.v:t.v),0);
  const soma={}, porForma={};
  L.forEach(t=>{ soma[t.cat]=(soma[t.cat]||0)+t.v; const f=t.card||t.method; porForma[f]=(porForma[f]||0)+t.v; });
  const selo=(on,rot,attr)=>'<button class="chip'+(on?" on":"")+'" '+attr+'>'+esc(rot)+'</button>';
  const cats=(c.tipo==="e"?(S.cfg.ecats||ECATS):S.cfg.cats);
  const formas=S.cfg.cards;
  const linha=t=>'<button class="row" data-ym="'+t.ym+'" data-id="'+t.id+'"><span class="ext-d">'+diaMes(t.d)+'</span>'+
    '<span class="row-m"><span class="row-d">'+esc(t.desc)+'</span><span class="row-s"><span>'+esc(catLabel(t))+'</span><span>·</span>'+
    '<span>'+esc(cardName(t.card)||METODOS[t.method]||"—")+'</span>'+(t.n>1?'<span class="chip p">'+t.i+"/"+t.n+'</span>':'')+
    (t.k==="g"&&t.method==="credito"?'<span class="chip c">crédito</span>':'')+'</span></span>'+
    '<span class="ext-v"><span class="row-v'+(t.k==="e"?" plus":"")+'">'+(t.k==="e"?"+":"")+fmtN(t.v)+'</span></span></button>';
  const resumoCat=Object.keys(soma).sort((a,b)=>soma[b]-soma[a]).map(id=>
    '<div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(c.tipo==="e"?ecatName(id):catName(id))+'</span>'+
    '<b style="font-family:var(--f-m);font-weight:600">'+fmtN(soma[id])+'</b></div>').join("");
  const resumoForma=Object.keys(porForma).sort((a,b)=>porForma[b]-porForma[a]).map(id=>
    '<div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(cardName(id)||METODOS[id]||id)+'</span>'+
    '<b style="font-family:var(--f-m);font-weight:600">'+fmtN(porForma[id])+'</b></div>').join("");
  $("#p-consulta").innerHTML=
    '<div class="sec"><div class="card pad">'+
    '<div class="tile-l">Período</div>'+
    '<div class="segs" style="margin-top:8px">'+rotuloPeriodos().map(p=>selo(c.periodo===p[0],p[1],'data-per="'+p[0]+'"')).join("")+'</div>'+
    '<div class="say-hint" style="margin-top:6px">'+(S.ym===ymOf(todayISO())
      ?'Tudo aqui vem do mês da barra de cima: mude ali para consultar outro mês.'
      :'O mês da barra de cima é '+ymLabel(S.ym)+', então o dia de referência é '+diaMesAno(refDia())+
       ' — a semana e os 30 dias terminam nele, e o ano é '+S.ym.slice(0,4)+'. Para um período qualquer, use Escolher datas.')+'</div>'+
    (c.periodo==="livre"?'<div class="two" style="margin-top:8px">'+
      '<button class="btn ghost sm" id="cqDe">De '+diaMesAno(c.de)+'</button>'+
      '<button class="btn ghost sm" id="cqAte">Até '+diaMesAno(c.ate)+'</button></div>'+
      '<div class="say-hint" style="margin-top:6px">Toque em cada botão e marque o dia no calendário.</div>':'')+
    '<div class="tile-l" style="margin-top:14px">O que mostrar</div>'+
    '<div class="segs" style="margin-top:8px">'+[["g","Gastos"],["e","Entradas"],["tudo","Tudo"]].map(x=>selo(c.tipo===x[0],x[1],'data-tipo="'+x[0]+'"')).join("")+'</div>'+
    '<div class="tile-l" style="margin-top:14px">Categorias <span style="text-transform:none;letter-spacing:0">'+(c.cats.length?"("+c.cats.length+" marcadas)":"(todas)")+'</span></div>'+
    '<div class="segs" style="margin-top:8px">'+selo(!c.cats.length,"Todas",'data-cat=""')+cats.map(x=>selo(c.cats.indexOf(x.id)>=0,x.n,'data-cat="'+x.id+'"')).join("")+'</div>'+
    '<div class="tile-l" style="margin-top:14px">Forma de pagamento '+(c.formas.length?'<span style="text-transform:none;letter-spacing:0">('+c.formas.length+" marcadas)"+'</span>':'<span style="text-transform:none;letter-spacing:0">(todas)</span>')+'</div>'+
    '<div class="segs" style="margin-top:8px">'+selo(!c.formas.length,"Todas",'data-forma=""')+formas.map(x=>selo(c.formas.indexOf(x.id)>=0,x.n,'data-forma="'+x.id+'"')).join("")+'</div>'+
    '</div></div>'+

    '<div class="sec"><div class="grid g2">'+
    '<div class="card pad"><div class="tile-l">'+(c.tipo==="e"?"Entrou":c.tipo==="tudo"?"Gastos menos entradas":"Gasto no período")+'</div>'+
    '<span class="tile-v" style="font-size:30px">'+fmt(Math.abs(total))+'</span>'+
    '<div class="tile-s">'+L.length+(L.length===1?" lançamento":" lançamentos")+' · de '+diaMesAno(r.de)+' a '+diaMesAno(r.ate)+'</div>'+
    dica+
    (resumoCat?'<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:13px;color:var(--ink-2)">'+resumoCat+'</div>':'')+
    '</div>'+
    '<div class="card pad"><div class="tile-l">Por forma de pagamento</div>'+
    (resumoForma?'<div style="margin-top:10px;display:grid;gap:7px;font-size:13px;color:var(--ink-2)">'+resumoForma+'</div>'
      :'<div class="tile-s">Nada no período.</div>')+
    '<div class="cardbox-a" style="margin-top:14px"><button class="btn ghost sm" id="cqCopiar">Copiar para planilha</button>'+
    (L.length&&c.tipo!=="tudo"?'<button class="btn ghost sm" id="cqMover">Mudar a categoria</button>':'')+'</div>'+
    '</div></div></div>'+

    '<div class="sec"><div class="sec-h"><h2 class="sec-t">Lançamentos</h2><span class="day-t">'+(L.length?fmt(Math.abs(total)):"")+'</span></div>'+
    '<div class="card pad">'+(L.length?L.map(linha).join("")
      :'<div class="empty"><b>Nada encontrado</b>Mude o período ou desmarque alguma categoria.</div>')+'</div></div>';
  bindRows($("#p-consulta"));
  /* escolher datas: primeiro o início, depois o fim — um calendário de cada vez */
  const escolheAte=()=>openCalendario({titulo:"Data do fim", valor:c.ate, min:c.de,
    dica:"O período vai de "+diaMesAno(c.de)+" até o dia que você marcar.",
    onPick:d=>{ c.ate=d; if(c.de>c.ate) c.de=c.ate; renderConsulta(); }});
  const escolheDe=emSeguida=>openCalendario({titulo:"Data de início", valor:c.de,
    dica:emSeguida?"Depois o app abre o calendário do dia final.":"",
    onPick:d=>{ c.de=d; if(c.ate<c.de) c.ate=c.de; renderConsulta(); if(emSeguida) escolheAte(); }});
  $$("[data-per]").forEach(b=>b.onclick=()=>{ const p=b.dataset.per, era=c.periodo; c.periodo=p; renderConsulta();
    if(p==="livre"&&era!=="livre") escolheDe(true); });
  $$("[data-tipo]").forEach(b=>b.onclick=()=>{ c.tipo=b.dataset.tipo; c.cats=[]; renderConsulta(); });
  $$("[data-cat]").forEach(b=>b.onclick=()=>{ const id=b.dataset.cat;
    if(!id) c.cats=[]; else { const i=c.cats.indexOf(id); if(i>=0) c.cats.splice(i,1); else c.cats.push(id); }
    renderConsulta(); });
  $$("[data-so]").forEach(b=>b.onclick=()=>{ const id=b.dataset.so;
    c.formas=[]; c.cats=id?[id]:[]; renderConsulta(); });
  $$("[data-forma]").forEach(b=>b.onclick=()=>{ const id=b.dataset.forma;
    if(!id) c.formas=[]; else { const i=c.formas.indexOf(id); if(i>=0) c.formas.splice(i,1); else c.formas.push(id); }
    renderConsulta(); });
  const de=$("#cqDe"), ate=$("#cqAte");
  if(de) de.onclick=()=>escolheDe(false);
  if(ate) ate.onclick=()=>escolheAte();
  $("#cqCopiar").onclick=()=>{
    const linhas=[["Data","Descrição","Categoria","Forma de pagamento","Valor"]].concat(
      L.map(t=>[t.d, t.desc, catLabel(t), cardName(t.card)||METODOS[t.method]||"", (t.k==="e"?"":"-")+(t.v/100).toFixed(2).replace(".",",")]));
    copyText(linhas.map(l=>l.join(";")).join("\n"), L.length+" lançamentos copiados. Cole numa planilha."); };
  const mv=$("#cqMover"); if(mv) mv.onclick=()=>openMoverLinhas(L,c.tipo); }

/* =================== ajuda =================== */
/* o app não tem IA embutida (não há servidor nem chave): a ajuda é busca no próprio conteúdo, e para
   perguntar ao Claude o app prepara o texto e abre a conversa. */
const AJUDA=[
 /* começar */
  {g:"Conta e saldo",t:"Cliquei em Backup completo e só apareceu \u201ccopiado\u201d. Onde está o arquivo?",
  c:"Em nenhum lugar ainda: Copiar joga o backup na área de transferência, e ele só existe depois que você colar em algum lugar — um e-mail para você mesmo, uma nota. Para ter um arquivo de verdade, use o botão ao lado, Salvar arquivo: ele gera o caderneta-backup-DD-MM-AAAA.json, que no computador cai na pasta de downloads e no celular abre o menu de compartilhar, para você escolher onde guardar. O mesmo vale para Levar para uma planilha.",a:"dados"},
 {g:"Conta e saldo",t:"O que é aquilo no alto do menu, com o ícone e o meu nome?",
  c:"É a marca da Caderneta com a sua assinatura embaixo: o nome do app em letra serifada e, miúdo, o seu primeiro e último nome. O app guarda o nome completo da sua conta Google, mas mostra ali só os dois — os do meio saem, para caber na linha (Maria Aparecida de Souza Lima aparece como Maria Lima). Tocando nesse canto abre a ficha da sua conta, com o e-mail, a última sincronização e os botões de sair. O mesmo nome aparece no pé do menu, junto com onde os seus dados estão guardados. Se aparecer só o primeiro nome, é porque você já estava logado antes desta versão: o app busca o nome completo sozinho na próxima sincronização — ou você escreve como quiser na ficha da conta, no campo Como o seu nome aparece no app.",a:"dados"},
 {g:"Conta e saldo",t:"Como saio da conta ou fecho o app?",
  c:"Toque na marca no alto do menu — o ícone com o nome Caderneta, no canto superior esquerdo (no celular, no alto da tela). Abre a ficha da sua conta, com dois botões: Sair desta conta desconecta (pede confirmação; entrando de novo com a mesma conta Google, tudo volta do Drive), e Sair da Caderneta fecha o app. O fechar só funciona na janela do app instalado — numa aba comum do navegador, a página não pode se fechar sozinha, e o próprio app explica isso. Fechar o app não desconecta: ao abrir de novo, você entra direto.",a:"dados"},
 {g:"Conta e saldo",t:"Reinstalei o app e perdi cartões e configurações. E agora?",
  c:"Os lançamentos e a configuração ficam também no seu Google Drive, então dá para trazer de volta. Entre com o Google e espere sincronizar: num aparelho zerado o app adota o que está no Drive. Se ainda faltar alguma coisa — os dias de fechamento dos cartões, por exemplo —, vá em Ajustes, em Dados, e toque em Restaurar de um backup: a lista mostra as cópias mensais guardadas no seu Drive; escolha a de um mês anterior. Restaurar não apaga lançamento nenhum, porque as listas se juntam.",a:"dados"},
 {g:"Começar",t:"Onde baixo o manual em PDF?",
  c:"Na aba Ajuda, no cartão do manual, botão Baixar em PDF — ou direto em rgbittencourt.github.io/caderneta/manual.pdf. São 59 páginas em A4, com todas as telas; dá para guardar no celular e ler sem internet, ou mandar para outra pessoa.",a:"ajuda"},
 {g:"Começar",t:"Qual é o ícone do app no celular?",
  c:"Uma caderneta de capa preta com a fita marcadora dourada, e o nome Caderneta embaixo — é o mesmo desenho da capa do manual. Na aba do navegador ele aparece pequenininho, do lado do título da página, e dentro do app ele fica no alto do menu, antes do nome.",a:"comecar"},
{g:"Começar",t:"Como abro e instalo o app?",
  c:"O endereço é rgbittencourt.github.io/caderneta. No iPhone: Safari → Compartilhar → Adicionar à Tela de Início. No Android: Chrome → Instalar app. No computador: ícone de instalar na barra de endereço.",a:"comecar"},
 {g:"Começar",t:"Meus dados ficam onde? Alguém mais vê?",
  c:"No aparelho e no seu Google Drive, numa pasta chamada Caderneta. Não existe servidor. Cada pessoa da família entra com a própria conta e só enxerga os próprios dados. Os PDFs e fotos que você lê não saem do aparelho.",a:"dados"},
 {g:"Começar",t:"Não vejo uma opção nova no app",
  c:"Confira a versão em Ajustes → Dados → Versão do app. Se estiver atrasada, feche o app por completo e abra de novo; se precisar, use Procurar atualização.",a:"comecar"},
 {g:"Começar",t:"Quero recomeçar do zero",
  c:"Ajustes → Dados → Recomeçar os lançamentos. O app sincroniza, guarda um backup no seu Drive e só então apaga. Contas, cartões, categorias, renda e metas continuam.",a:"carregar"},

 /* lançar */
 {g:"Lançar",t:"Como lanço um gasto falando?",
  c:"Aba Lançar, toque no microfone do teclado e fale: \"vinte e três reais, almoço no IFSC, cartão de crédito Visa\". Separe vários lançamentos com ponto final e confira antes de salvar.",a:"fala"},
 {g:"Lançar",t:"Como agendo um pagamento para depois?",
  c:"Diga quando: \"mil e duzentos reais, aluguel, dia 10\", \"internet amanhã\", \"dia 5 de outubro\". Sem dizer o mês, \"dia 10\" é o próximo dia 10. Fica com a marca agendado até chegar o dia.",a:"agendar"},
 {g:"Lançar",t:"Li um boleto: dá para agendar o pagamento?",

 {g:"Lançar",t:"A fala saiu repetida e o valor ficou gigante",

 {g:"Lançar",t:"O app botou a categoria errada",

 /* importar */
 {g:"Importar",t:"Onde importo o extrato do banco?",
  c:"Aba Lançar, em Importar extrato da conta. Escolha a conta e o PDF baixado do app do banco (OFX e CSV também servem). Importe do mês mais antigo para o mais novo.",a:"extrato"},
 {g:"Importar",t:"Onde importo a fatura do cartão?",
  c:"Aba Lançar, em Importar fatura do cartão, canhoto ou boleto. O mês não se escolhe: vale o fechamento impresso na fatura.",a:"fatura"},
 {g:"Importar",t:"Se eu lançar por voz e depois importar, vai duplicar?",
  c:"Não. Cada linha do documento é comparada com o que já existe: mesmo tipo, valor (até um centavo) e data (até três dias). O que já está lançado vem desmarcado, com os dois lado a lado. Mesmo que você tenha dito o cartão errado, ele reconhece quando a descrição bate.",a:"conferencia"},
 {g:"Importar",t:"Importo extrato e fatura: o gasto conta duas vezes?",
  c:"Não. As compras vêm da fatura e não tiram dinheiro da conta; o pagamento da fatura vem do extrato, sai da conta e não conta como gasto. Pode importar todos os extratos primeiro e as faturas depois.",a:"carregar"},
 {g:"Importar",t:"Como sei quais extratos e faturas já importei?",
  c:"Em Ajustes, no quadro O que já foi importado: cada mês mostra o extrato de cada conta e a fatura de cada cartão — verde é o que já entrou, cinza é o que falta. No alto aparece quantos documentos ainda faltam. A lista é do ano corrente; em janeiro, o ano anterior continua à vista, e de fevereiro em diante fica só o ano novo — o que ficou faltando de anos anteriores aparece resumido no rodapé e pode ser importado a qualquer momento. O que você importou antes de o quadro existir também aparece: o app reconhece pelos lançamentos que vieram do documento. E dá para <b>tocar num selo</b> para marcar ou desmarcar à mão, quando você sabe que já leu aquele documento.",a:"carregar"},
 {g:"Importar",t:"Importei a fatura e o mês continua cinza",
  c:"Isso acontecia quando a importação não acrescentava nada — tudo já estava lançado, ou a fatura só trazia parcelas que o app já tinha reservado. A partir da versão 44 o documento fica registrado mesmo assim. Nos meses antigos, toque no selo para marcar à mão.",a:"carregar"},
 {g:"Importar",t:"O quadro conta o que lancei por voz?",
  c:"Não. Ele marca só o que veio de documento: extrato do banco ou fatura do cartão. Lançamento por fala ou na mão não marca o mês — é justamente para você saber se o documento daquele mês já foi conferido.",a:"carregar"},
 {g:"Importar",t:"O PDF do meu banco não foi lido",

 {g:"Importar",t:"Escolhi o leitor errado (extrato no lugar da fatura)",
  c:"O app percebe e pergunta se quer ler no lugar certo, sem precisar escolher o arquivo de novo.",a:"extrato"},

 /* conta e saldo */
 {g:"Conta e saldo",t:"Quanto tenho no banco?",

 {g:"Conta e saldo",t:"Meu saldo está diferente do banco",

 {g:"Conta e saldo",t:"Como informo o saldo inicial de uma conta?",

 {g:"Conta e saldo",t:"Faltou pouco dinheiro e não sei de onde veio",

 {g:"Conta e saldo",t:"O que é a conta BB Rende Fácil que apareceu?",

 {g:"Conta e saldo",t:"Minha conta corrente sumiu da lista",

 /* cartões */
 {g:"Cartões",t:"Quanto já gastei em cada cartão?",
  c:"No Painel, em Lançado nos cartões: a fatura do mês de cada cartão, o total em aberto (com as parcelas futuras) e o limite livre. Em Contas, Ver fatura mostra compra por compra.",a:"painel"},
 {g:"Cartões",t:"Qual cartão é melhor usar hoje?",
  c:"O app calcula e mostra no alto do Painel e da aba Lançar: é o cartão cuja compra de hoje demora mais para ser cobrada. Ele diz em que fatura a compra entra, quando essa fatura fecha, quando vence e quantos dias faltam até o dinheiro sair da conta — e lista os outros cartões em ordem.",a:"cartoes"},
 {g:"Cartões",t:"O app diz \"falta o fechamento\" nos cartões",
  c:"Informe o dia de fechamento e o de vencimento de cada cartão em Ajustes → Formas de pagamento. Sem eles, o app não tem como calcular o prazo. Ao importar uma fatura, ele aprende essas datas sozinho.",a:"cartoes"},
 {g:"Cartões",t:"As datas do cartão mudam de um mês para o outro?",
  c:"Mudam: o banco ajusta o fechamento pelos dias úteis — no Ourocard, por exemplo, fechou dia 6 em janeiro e dia 4 em fevereiro. Cada fatura traz impressas a data do próximo fechamento e a melhor data de compra, e o app guarda as duas ao importar. Enquanto essa data não chega, é ela que manda; depois, ele volta a estimar pelo dia do mês, que erra no máximo um ou dois dias.",a:"cartoes"},
 {g:"Cartões",t:"Só vou saber a data exata quando importar a fatura?",

 {g:"Cartões",t:"A compra no cartão sai da minha conta?",
  c:"Não. Ela conta como gasto no mês em que foi feita e entra nas análises, mas o dinheiro só sai quando a fatura é paga. Cada linha mostra a marca crédito · não sai da conta.",a:"cartoes"},
 {g:"Cartões",t:"O banco já descontou, mas a fatura continua pedindo Pagar fatura",
  c:"Pode clicar em Pagar fatura sem medo: ele não desconta nada sozinho, abre uma tela. Se o app achar o pagamento que veio do extrato, aparece o aviso \u201cEsse pagamento já parece ter saído da conta\u201d e o botão É este pagamento — toque nele: a fatura fica paga e o dinheiro não sai de novo. O outro botão, Pagar mesmo assim, é que cria um pagamento novo. Se o aviso não aparecer, o pagamento ficou preso em outro cartão: abra o extrato da conta, toque nesse pagamento e corrija De qual cartão e Abate a fatura de. E se sobrar um resto pequeno, confira antes as Compras sem descrição, em Ajustes → Dados: linha de câmbio lida como compra deixa a fatura do app maior que a do banco.",a:"cartoes"},
 {g:"Cartões",t:"A fatura do app ficou maior que a do banco. Por quê?",
  c:"Se a diferença for de poucos reais e você tiver compra internacional na fatura, era a linha de câmbio: embaixo da compra o banco imprime algo como \u201c*** 9,99 DOLAR AMERICANO\u201d, que é o valor em dólar, não uma cobrança a mais. Versões antigas do app liam essa linha como compra, sem descrição e com data trocada. A partir da v67 ela é ignorada. Para limpar o que já entrou: Ajustes, em Dados, toque em Revisar, na linha Compras sem descrição — ele lista esses lançamentos e você apaga.",a:"cartoes"},
 {g:"Cartões",t:"Paguei a fatura duas vezes. Como conserto?",
  c:"Abra Contas, escolha a conta corrente e toque em Repetidos, no alto do extrato: o app mostra os pagamentos parecidos e você escolhe qual apagar. Dá para apagar também pelo próprio extrato, tocando no pagamento errado e escolhendo Excluir. Apagar um pagamento não mexe nas compras da fatura.",a:"cartoes"},
 {g:"Cartões",t:"A fatura aparece atrasada, mas eu paguei",
  c:"O pagamento provavelmente não está ligado a ela. Em Contas, toque em Pagar fatura: se o app achar o pagamento que já saiu da conta, ele oferece É este pagamento — e o dinheiro não sai de novo.",a:"cartoes"},
 {g:"Cartões",t:"O pagamento da fatura saiu duas vezes da conta",

 {g:"Entender os números",t:"O que a aba Análises mostra?",

 {g:"Entender os números",t:"A Consulta mostrou R$ 0,00",
  c:"É porque não há lançamentos naquele período com os filtros marcados. O app explica qual dos dois é o caso: se o período tem movimento e são as categorias que não batem, ele lista o que existe ali (com o valor de cada categoria) e você toca para ver; se o período está mesmo vazio, ele diz quantos lançamentos existem no ano e no total e oferece o atalho para Este ano ou Tudo.",a:"consulta"},
 {g:"Entender os números",t:"Como escolho um período com datas?",
  c:"Na Consulta, toque em Escolher datas: abre um calendário para marcar o dia de início e, logo depois, outro para o dia do fim — é só tocar no dia, não se digita nada. Depois, os botões De e Até mostram as datas escolhidas e reabrem o calendário daquela ponta quando você toca neles. As setas mudam de mês (‹ ›) e de ano (« »), e o botão Hoje marca a data de hoje. No calendário do fim, os dias anteriores ao início ficam apagados, para o período não sair invertido.",a:"consulta"},
 {g:"Entender os números",t:"A Consulta é de qual mês?",

 {g:"No dia a dia",t:"O que é aquela bolha que aparece quando paro o mouse?",

 {g:"Entender os números",t:"Não sei ler os gráficos. O app explica?",

 {g:"Lançar",t:"Falei \u201ctrinta e nove e noventa\u201d. Ele entende os centavos?",

 {g:"No dia a dia",t:"Quero reorganizar as categorias. Vou bagunçar o que já lancei?",

 {g:"No dia a dia",t:"Como divido uma categoria em duas ou três?",

 {g:"Dívidas",t:"Financiamento do carro é dívida ou gasto com carro?",

 {g:"Entender os números",t:"Como informo que guardei um dinheiro — e tiro da conta?",

 {g:"Entender os números",t:"Quero juntar um valor até uma data. Como faço?",

 {g:"Entender os números",t:"O plano manda cortar de onde? Isso é chute?",

 {g:"Entender os números",t:"O plano disse que não dá para juntar tudo. E agora?",

const ajudaLinha=x=>'<div class="linkrow wrap"><div class="m"><div class="t">'+esc(x.t)+'</div>'+
  '<div class="s" style="white-space:normal">'+esc(x.c)+'</div></div>'+
  '<div class="acts"><a class="mini" href="manual.html#'+x.a+'" target="_blank" rel="noopener">No manual</a></div></div>';
function ajudaLista(L){ let h="", g="";
  L.forEach(x=>{ if(x.g!==g){ g=x.g; h+='<div class="tile-l" style="margin:16px 0 2px">'+esc(g)+'</div>'; } h+=ajudaLinha(x); });
  return h||'<div class="empty" style="padding:18px"><b>Nada encontrado</b>Tente outra palavra, ou pergunte ao Claude.</div>'; }

    '<button class="btn ghost sm" id="ajClaude">Perguntar ao Claude</button></div>'+
    '<div class="say-hint" style="margin-top:10px">O app não tem inteligência artificial por dentro — é isso que o mantém sem servidor, sem custo e com os seus dados só no seu aparelho e no seu Drive. Para dúvidas mais longas, ou para pedir mudanças, fale com o Claude.</div></div>'+
    '</div></div>'+
    '<div class="sec"><div class="sec-h"><h2 class="sec-t">Perguntas e respostas</h2><span class="day-t" id="ajTot"></span></div>'+
    '<div class="card pad" id="ajLista">'+ajudaLista(AJUDA)+'</div></div>';
  const filtra=()=>{ const q=norm($("#ajQ").value);
    const L=q?AJUDA.filter(x=>norm(x.t+" "+x.c+" "+x.g).indexOf(q)>=0):AJUDA;
    $("#ajLista").innerHTML=ajudaLista(L);
    $("#ajTot").textContent=q?(L.length+(L.length===1?" resposta":" respostas")):""; };
  $("#ajQ").oninput=filtra;
  $("#ajClaude").onclick=async()=>{
    const q=$("#ajQ").value.trim();
    const txt="Dúvida sobre a Caderneta (app em https://rgbittencourt.github.io/caderneta/): "+(q||"…")+
      "\n\nContexto: "+(S.cfg.accounts||[]).length+" contas, "+creditCards().length+" cartões, mês na tela "+ymLabel(S.ym)+".";
    try{ await navigator.clipboard.writeText(txt); toast("Pergunta copiada. É só colar na conversa."); }
    catch(e){ toast("Copie a sua pergunta e cole na conversa."); }
    window.open("https://claude.ai/new","_blank","noopener"); }; }

/* a versão instalada é o nome do cache que o service worker criou (caderneta-vNN) */
async function mostrarVersao(){
  const el=$("#verApp"); if(!el) return;
  try{
    const ks=await caches.keys();
    const v=ks.filter(k=>/^caderneta-v\d+$/.test(k)).sort((a,b)=>(+a.slice(11))-(+b.slice(11))).pop();
    el.textContent=v?v+" · para atualizar, feche e abra o app":"sem cópia offline ainda";
  }catch(e){ el.textContent="—"; } }

  sheet(isNew?"Nova forma de pagamento":c.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="cN" value="'+esc(c.n)+'" placeholder="Elo Nubank"></div>'+
    '<div class="two"><div class="set-f"><label>Tipo</label><select id="cT">'+
    Object.keys(METODOS).map(k=>'<option value="'+k+'"'+(k===c.type?" selected":"")+'>'+METODOS[k]+'</option>').join("")+'</select></div>'+
    '<div class="set-f"><label>Dia do fechamento</label><input id="cF" inputmode="numeric" value="'+(c.closing||"")+'" placeholder="0 = não usar"></div></div>'+
    '<div class="two"><div class="set-f"><label>Dia do vencimento</label><input id="cV" inputmode="numeric" value="'+(c.due||"")+'" placeholder="0 = não usar"></div>'+
    '<div class="set-f"><label>Limite</label><input id="cL" inputmode="decimal" value="'+(c.limit?fmtN(c.limit):"")+'" placeholder="0,00"></div></div>'+
    '<div class="set-f"><label>Sai de qual conta</label><select id="cC">'+optId(S.cfg.accounts||[],c.acct||acctOf(c.id))+'</select>'+
    '<span class="hint">No crédito é a conta de onde sai o pagamento da fatura. No débito, pix, transferência ou dinheiro é a conta que o gasto tira na hora.</span></div>'+
    '<div class="set-f"><label>Como você chama falando</label><input id="cA" value="'+esc(c.alias)+'" placeholder="elo nubank roxinho">'+
    '<span class="hint">Palavras separadas por espaço. Se você disser qualquer uma delas, o lançamento cai aqui.</span></div>'+
    '<div class="set-f"><span class="hint">O dia do fechamento joga as compras feitas depois dele para a fatura do mês seguinte — é o que faz o teto bater com o que sai da conta.</span></div></div>',
    (isNew?"":'<button class="btn danger" id="cKill">Excluir</button>')+'<button class="btn" id="cOk">Salvar</button>');
  $("#cOk").onclick=()=>{
    const n=$("#cN").value.trim(); if(!n){ toast("Dê um nome."); return; }
    const obj={id:c.id,n,type:$("#cT").value,
      closing:Math.max(0,Math.min(31,parseInt($("#cF").value)||0)),
      due:Math.max(0,Math.min(31,parseInt($("#cV").value)||0)),
      limit:toCents($("#cL").value), acct:$("#cC").value, alias:$("#cA").value.trim()||norm(n)};
    const i=S.cfg.cards.findIndex(x=>x.id===c.id);
    if(i<0) S.cfg.cards.push(obj); else S.cfg.cards[i]=obj;
    saveCfg(); closeSheet(); render(); toast("Salvo"); };

/* reorganizar categorias sem perder o que já foi lançado: quem manda é o id, não o nome.
   Renomear não mexe em nada; excluir e dividir precisam levar os lançamentos para outro lugar. */
function usosDaCategoria(id){
  let n=0; const meses=[];
  Object.keys(S.months||{}).forEach(ym=>{ const q=txOf(ym).filter(t=>t.cat===id).length; if(q){ n+=q; meses.push(ym); } });
  meses.sort();
  return {n, meses, fix:(S.cfg.fixed||[]).filter(f=>f.cat===id).length,
    kw:Object.keys(S.cfg.kwCat||{}).filter(w=>S.cfg.kwCat[w]===id).length}; }
async function moverLancamentos(L,para){
  let n=0;
  L.forEach(t=>{ const m=S.months[t.ym], x=m&&m.tx&&m.tx[t.id];
    if(x&&x.cat!==para){ x.cat=para; x.u=Date.now(); n++; } });
  if(n) await saveMonth();
  return n; }
async function moverCategoria(de,para){
  const L=[]; Object.keys(S.months||{}).forEach(ym=>txOf(ym).forEach(t=>{ if(t.cat===de) L.push(t); }));
  const n=await moverLancamentos(L,para);
  (S.cfg.fixed||[]).forEach(f=>{ if(f.cat===de) f.cat=para; });
  Object.keys(S.cfg.kwCat||{}).forEach(w=>{ if(S.cfg.kwCat[w]===de) S.cfg.kwCat[w]=para; });
  await saveCfg();
  return n; }
/* sheet que troca a categoria de uma lista de lançamentos (usada na Consulta) */
function openMoverLinhas(L,tipo){
  if(!L.length){ toast("Nada para mudar."); return; }
  const lista=(tipo==="e"?(S.cfg.ecats||ECATS):S.cfg.cats);
  const quantos=L.length+(L.length>1?" lançamentos":" lançamento");
  sheet("Mudar a categoria",
    '<div class="set"><div class="note"><b>'+quantos+'</b>São os que estão na lista da Consulta agora, de '+diaMesAno(L[L.length-1].d)+' a '+diaMesAno(L[0].d)+
    '. Só a categoria muda: valor, data e forma de pagamento ficam como estão.</div>'+
    '<div class="set-f"><label for="mvC">Nova categoria</label><select id="mvC">'+
    lista.map(x=>'<option value="'+x.id+'">'+esc(x.n)+'</option>').join("")+'</select>'+
    '<span class="hint">Se a categoria nova ainda não existe, crie em Ajustes, em Categorias, e volte aqui.</span></div></div>',
    '<button class="btn" id="mvOk">Mudar os '+L.length+'</button>');
  $("#mvOk").onclick=async()=>{
    const n=await moverLancamentos(L,$("#mvC").value);
    closeSheet(); render(); toast(n?n+(n>1?" lançamentos mudaram de categoria.":" lançamento mudou de categoria."):"Já estavam nessa categoria."); }; }
/* sheet que exclui uma categoria levando embora o que estava nela */
function openApagarCat(c,u){
  const destinos=S.cfg.cats.filter(x=>x.id!==c.id);
  const detalhe=[u.n?u.n+(u.n>1?" lançamentos":" lançamento"):"", u.fix?u.fix+(u.fix>1?" gastos fixos":" gasto fixo"):"",
    u.kw?u.kw+(u.kw>1?" palavras aprendidas":" palavra aprendida"):""].filter(Boolean).join(" · ");
  sheet("Excluir "+c.n,
    '<div class="set"><div class="note"><b>'+detalhe+'</b>'+
    (u.meses.length?"De "+ymLabel(u.meses[0])+" a "+ymLabel(u.meses[u.meses.length-1])+". ":"")+
    'Nada é apagado: tudo isso passa para a categoria que você escolher aqui, e só depois a categoria '+esc(c.n)+' sai da lista.</div>'+
    '<div class="set-f"><label for="kMv">Levar tudo para</label><select id="kMv">'+
    destinos.map(x=>'<option value="'+x.id+'">'+esc(x.n)+'</option>').join("")+'</select></div></div>',
    '<button class="btn danger" id="kMvOk">Mover e excluir</button>');
  $("#kMvOk").onclick=async()=>{
    const para=$("#kMv").value, n=await moverCategoria(c.id,para);
    S.cfg.cats=S.cfg.cats.filter(x=>x.id!==c.id); await saveCfg();
    closeSheet(); render(); toast(n?n+(n>1?" lançamentos foram para ":" lançamento foi para ")+catName(para)+".":"Categoria excluída."); }; }
function openCat(id){
  const c=S.cfg.cats.find(x=>x.id===id)||{id:"c"+uid(),n:"",limit:0};
  const isNew=!S.cfg.cats.some(x=>x.id===c.id);
  sheet(isNew?"Nova categoria":c.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="kN" value="'+esc(c.n)+'"></div>'+
    '<div class="set-f"><label>Limite por mês</label><input id="kL" inputmode="decimal" value="'+(c.limit?fmtN(c.limit):"")+'" placeholder="0,00 = sem limite">'+
    '<span class="hint">Aparece como um traço na barra da categoria e vira alerta no Painel quando estoura.</span></div>'+'<div class="set-f"><label>No método 50-30-20</label><select id="kG">'+opcoesGrupo(grupoDe(c.id))+'</select></div></div>',
    (isNew?"":'<button class="btn danger" id="kKill">Excluir</button>')+'<button class="btn" id="kOk">Salvar</button>');
  $("#kOk").onclick=()=>{
    const n=$("#kN").value.trim(); if(!n){ toast("Dê um nome."); return; }
    const i=S.cfg.cats.findIndex(x=>x.id===c.id);
    if(i<0) S.cfg.cats.push({id:c.id,n,limit:toCents($("#kL").value),grupo:$("#kG").value});
    else { S.cfg.cats[i].n=n; S.cfg.cats[i].limit=toCents($("#kL").value); S.cfg.cats[i].grupo=$("#kG").value; }
    saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#kKill");
  if(k) k.onclick=()=>{ if(S.cfg.cats.length<=2){ toast("Precisa de pelo menos duas categorias."); return; }
    if(c.id==="divida"){ toast("Esta é a categoria das dívidas e consignados: o app lança nela sozinho. Dá para renomear, não para excluir."); return; }
    if(c.id==="outros"){ toast("Outros é a categoria de reserva: cai aqui o que o app não consegue classificar. Dá para renomear, não para excluir."); return; }
    const u=usosDaCategoria(c.id);
    if(u.n||u.fix||u.kw){ openApagarCat(c,u); return; }
    S.cfg.cats=S.cfg.cats.filter(x=>x.id!==c.id); saveCfg(); closeSheet(); render(); toast("Excluída"); }; }

function parseStatement(text,sign){
  const out=[];
  if(/<STMTTRN>|<OFX>/i.test(text)){
    text.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const g=re=>{ const m=b.match(re); return m?m[1].trim():""; };
      const dt=g(/<DTPOSTED>([^<\s]+)/i), amt=parseFloat(g(/<TRNAMT>([^<\s]+)/i));
      const memo=g(/<MEMO>([^<\n\r]*)/i)||g(/<NAME>([^<\n\r]*)/i);
      if(!dt||isNaN(amt)) return;
      const d=dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8);
      if(sign==="neg"&&amt>=0) return;
      out.push({d,desc:memo||"Sem descrição",v:Math.round(Math.abs(amt)*100),k:amt>0?"e":"g"}); });
    return out; }
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cells=line.includes(";")?line.split(";"):(line.includes("\t")?line.split("\t"):line.split(","));
    if(cells.length<2) return;
    let d="",desc="",v=null;
    cells.forEach(raw=>{
      const c=raw.trim().replace(/^"|"$/g,""); if(!c) return;
      const md=c.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})$/), mi=c.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(mi&&!d){ d=mi[0]; return; }
      if(md&&!d){ const y=md[3].length===2?"20"+md[3]:md[3]; d=y+"-"+md[2]+"-"+md[1]; return; }
      if(/^-?\s*R?\$?\s*-?[\d.]+,\d{2}$/.test(c)||/^-?\d+\.\d{2}$/.test(c)){ if(v===null) v=toCents(c); return; }
      if(c.length>desc.length&&!/^\d+$/.test(c)) desc=c; });
    if(!d||v===null||v===0) return;
    if(sign==="neg"&&v>=0) return;
    out.push({d,desc:desc||"Sem descrição",v:Math.abs(v),k:v>0?"e":"g"}); });
  return out; }

function copyText(t,ok){ if(!navigator.clipboard){ toast("Este navegador não permite copiar."); return; }
  navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(()=>toast("Não consegui copiar.")); }
/* guarda o texto num arquivo de verdade: no celular abre o menu de compartilhar (e-mail, Arquivos,
   WhatsApp); no computador cai na pasta de downloads. "Copiar" continua existindo, para colar à mão. */
async function salvarArquivo(nome,texto,tipo){
  const blob=new Blob([texto],{type:(tipo||"text/plain")+";charset=utf-8"});
  try{
    const f=new File([blob],nome,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:nome});
      toast("Escolha onde guardar: e-mail, Arquivos, o que preferir."); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Arquivo salvo: "+nome); }

      t.n>1?t.i+"/"+t.n:"",fmtN(t.v)])));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
  if(exportCSV.copiar){ exportCSV.copiar=false; copyText(csv,"CSV copiado. Cole numa planilha."); return; }

/* =================== microfone =================== */
/* o ditado entrega a frase em pedaços, e cada navegador faz de um jeito: uns mandam só o trecho novo, outros
   repetem a frase inteira crescendo. Somar tudo virava "325 pago325 pago para325 pago para manutenção…". */
function textoDaFala(results){
  const junta=(acc,txt)=>{ txt=String(txt||"").trim(); if(!txt) return acc; if(!acc) return txt;
    if(txt.indexOf(acc)===0) return txt;                                   /* repetiu tudo e cresceu */
    if(acc.length>=txt.length&&acc.slice(-txt.length)===txt) return acc;   /* repetiu o mesmo pedaço */
    return acc+" "+txt; };
  let fim="", parcial="";
  for(let i=0;i<results.length;i++){ const r=results[i], t=r&&r[0]?r[0].transcript:"";
    if(r.isFinal) fim=junta(fim,t); else parcial=t; }
  return junta(fim,parcial); }

function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$("#micBtn"); if(!SR||!btn) return;
  btn.hidden=false;
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on&&rec){ rec.stop(); return; }
    try{
      rec=new SR(); rec.lang="pt-BR"; rec.continuous=true; rec.interimResults=true;
      const base=$("#say").value?$("#say").value.trim()+" ":"";
      rec.onstart=()=>{ on=true; btn.classList.add("rec"); btn.textContent="Parar"; };
      rec.onresult=e=>{ $("#say").value=base+textoDaFala(e.results); };
      rec.onerror=ev=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
          $("#sayHint").innerHTML="O microfone do app está bloqueado aqui. Use o <kbd>🎤</kbd> do teclado — funciona igual.";
          btn.hidden=true; } };
      rec.onend=()=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if($("#say").value.trim()) readInput(); };
      rec.start();
    }catch(e){ btn.hidden=true; } }; }

/* =================== meta de poupança =================== */
const savedTotal=()=>(S.cfg.deposits||[]).reduce((s,x)=>s+x.v,0);

/* =================== plano para juntar um montante até uma data ===================
   Pedido do dono (27/09/2026): "digo quanto quero juntar e até quando, e você analisa
   meus gastos não fixos e os ganhos e diz onde economizar — e se eu realmente consigo
   cortar aquilo, olhando o que já gastei". Depois: "levar em consideração as dívidas
   (pagamentos) e as contas parceladas". Por isso o cálculo é mês a mês: parcela que
   termina no meio do caminho libera dinheiro nos meses seguintes. */

/* meses do plano, com a fração de cada um (o mês atual começa hoje; o último termina na data) */
function mesesPlano(ate){
  const hoje=todayISO(), out=[]; if(!ate||ate<=hoje) return out;
  const fimYm=ymOf(ate); let ym=ymOf(hoje);
  while(ym<=fimYm&&out.length<120){ const dim=daysIn(ym);
    const ini=ym===ymOf(hoje)?+hoje.slice(8,10):0, fim=ym===fimYm?+ate.slice(8,10):dim;
    const f=Math.max(0,fim-ini)/dim; if(f>0) out.push({ym,frac:f});
    ym=ymShift(ym,1); }
  return out; }

/* o que ainda está marcado para sair da conta naquele mês: parcelas e dívidas lançadas,
   agendados e gastos fixos (o consignado não entra: sai da folha, não da conta).
   `de` corta o que já saiu (mês corrente) e `ate` corta o que cai depois da data do plano. */
function comprometidoDoMes(ym,de,ate){
  let lanc=0;
  txOf(ym).forEach(t=>{ if(t.cons) return; if((t.k||"g")!=="g") return;
    if(de&&t.d<de) return; if(ate&&t.d>ate) return;
    if(t.fix||t.n>1||t.cat==="divida") lanc+=t.v; });
  return lanc+fixedFor(ym).filter(f=>!f.cons&&(!ate||ym+"-"+pad(Math.min(f.day||1,daysIn(ym)))<=ate))
    .reduce((s,f)=>s+f.amount,0); }

/* histórico dos meses fechados: quanto entrou, quanto saiu e quanto de cada categoria
   é gasto solto (sem fixo, sem parcela, sem dívida) — é só isso que dá para cortar */
function historicoPlano(){
  const cur=ymOf(todayISO());
  const meses=Object.keys(S.months||{}).filter(ym=>ym<cur&&txOf(ym).some(t=>(t.k||"g")==="g")).sort().slice(-6);
  const cats={}, gasto={}, renda={};
  meses.forEach(ym=>{ gasto[ym]=0; renda[ym]=0;
    txOf(ym).forEach(t=>{ if(t.cons) return; const k=t.k||"g";
      if(k==="e"){ if(t.cat!=="emprest") renda[ym]+=t.v; return; }
      if(k!=="g") return;
      gasto[ym]+=t.v;
      const preso=!!(t.fix||t.n>1)||t.cat==="divida";
      const c=cats[t.cat]||(cats[t.cat]={flex:{}});
      if(!preso) c.flex[ym]=(c.flex[ym]||0)+t.v; }); });
  const media=o=>meses.length?meses.reduce((s,ym)=>s+(o[ym]||0),0)/meses.length:0;
  const lista=Object.keys(cats).map(id=>{
    const f=cats[id].flex, vals=meses.map(ym=>f[ym]||0);
    const med=media(f), min=Math.min.apply(null,vals), pior=Math.max.apply(null,vals);
    const mesMin=meses[vals.indexOf(min)];
    return {id, media:med, melhor:min, pior, mesMelhor:mesMin, vals, grupo:grupoDe(id)}; })
    .filter(x=>x.media>0);
  return {meses, n:meses.length, gastoMedio:media(gasto), rendaMedia:media(renda), cats:lista}; }

/* quanto dá para cortar de uma categoria por mês, com prova no próprio histórico:
   nunca abaixo do melhor mês dele, e dentro de um limite por grupo do 50-30-20 */
const CORTE={des:{piso:.25,teto:.60}, nec:{piso:.05,teto:.20}, fut:{piso:0,teto:0}};
function corteDaCategoria(c,nMeses){
  const lim=CORTE[c.grupo]||CORTE.des;
  if(!lim.teto||c.media<4000) return 0;                      /* menos de R$ 40 por mês: não vale mexer */
  const porHistorico=nMeses>=2?Math.max(0,c.media-c.melhor):0;
  const piso=c.media*lim.piso, teto=c.media*lim.teto;
  return Math.round(Math.min(teto,Math.max(piso,porHistorico))); }

function calcularPlano(){
  const p=S.cfg.plano; if(!p||!p.v||!p.ate) return null;
  const hoje=todayISO(), criado=p.criado||hoje;
  /* o que ele já separou depois de montar o plano — é isso que faz a projeção andar sozinha */
  const porMesGuardado={}; let guardado=0;
  (S.cfg.deposits||[]).forEach(x=>{ if(x.d>=criado){ guardado+=x.v; porMesGuardado[ymOf(x.d)]=(porMesGuardado[ymOf(x.d)]||0)+x.v; } });
  const base=p.usaGuardado?Math.max(0,savedTotal()-guardado):0;
  const jaTem=base+guardado, falta=Math.max(0,p.v-jaTem);
  const MS=mesesPlano(p.ate), eq=MS.reduce((s,m)=>s+m.frac,0);
  const passados=[]; let ym=ymOf(criado);
  while(ym<ymOf(hoje)&&passados.length<60){ passados.push({ym, guardado:porMesGuardado[ym]||0}); ym=ymShift(ym,1); }
  if(!MS.length) return {vencido:true, alvo:p.v, ate:p.ate, jaTem, guardado, falta, passados};
  const h=historicoPlano();
  const flexMedio=h.cats.reduce((s,c)=>s+c.media,0);
  /* cada mês tem a sua folga: parcela que termina no caminho libera dinheiro nos meses seguintes */
  const fimYm=ymOf(p.ate), curYm=ymOf(hoje);
  const linhas=MS.map(m=>{
    /* o comprometido não se divide por fração: o que ainda vai sair, sai inteiro.
       No mês corrente conta só o que falta sair; no último, só o que cai até a data. */
    const comp=comprometidoDoMes(m.ym, m.ym===curYm?hoje:"", m.ym===fimYm?p.ate:"");
    const renda=rendaPrevista(m.ym)*m.frac, flex=flexMedio*m.frac;
    return {ym:m.ym, frac:m.frac, renda, comp, flex, sem:renda-comp-flex, guardado:porMesGuardado[m.ym]||0}; });
  const renda=linhas.reduce((s,l)=>s+l.renda,0), comp=linhas.reduce((s,l)=>s+l.comp,0), flex=linhas.reduce((s,l)=>s+l.flex,0);
  const sobra=renda-comp-flex, precisa=falta-sobra;
  const cortes=h.cats.map(c=>Object.assign({},c,{corte:corteDaCategoria(c,h.n)}))
    .filter(c=>c.corte>0).sort((a,b)=>b.corte-a.corte);
  const maxMes=cortes.reduce((s,c)=>s+c.corte,0), maxPeriodo=maxMes*eq;
  const usadas=[]; let resta=Math.max(0,precisa);
  for(const c of cortes){ if(resta<=0) break;
    const noPeriodo=c.corte*eq, usa=Math.min(noPeriodo,resta);
    usadas.push(Object.assign({},c,{usaMes:usa/eq, usaPeriodo:usa})); resta-=usa; }
  const corteMes=usadas.reduce((s,c)=>s+c.usaMes,0);
  linhas.forEach(l=>{ l.corte=corteMes*l.frac; l.pode=Math.max(0,l.sem+l.corte); });
  const somaPode=linhas.reduce((s,l)=>s+l.pode,0);
  /* o alvo de cada mês acompanha a folga daquele mês: mês apertado pede menos, mês folgado pede mais */
  linhas.forEach(l=>{ l.alvo=somaPode>0?Math.min(l.pode,falta*(l.pode/somaPode)):0; });
  const total=jaTem+Math.min(falta,somaPode);
  const porMes=eq>0?falta/eq:falta, ritmoMax=eq>0?somaPode/eq:0;
  let quando="";
  if(ritmoMax>0&&total<p.v){ const d=new Date(Date.parse(hoje+"T12:00:00")+Math.ceil(falta/ritmoMax*30.44)*86400000);
    quando=d.toISOString().slice(0,10); }
  return {alvo:p.v, ate:p.ate, criado, jaTem, base, guardado, falta, eq, porMes, renda, comp, flex, sobra, precisa,
    cortes, usadas, corteMes, maxMes, maxPeriodo, somaPode, total, ritmoMax, quando, h, linhas, passados,
    veredito: sobra>=falta ? "folgado" : (somaPode>=falta ? "comCortes" : (somaPode>0 ? "parcial" : "travado")) }; }

/* o plano na tela: veredito, mês a mês, e onde cortar (com a prova no histórico) */

function openDeposit(id){
  const D=S.cfg.deposits||(S.cfg.deposits=[]), A=S.cfg.accounts||[];
  const x=D.find(y=>y.id===id);
  /* de onde sai e para onde vai: o padrão é da conta corrente para a poupança,
     porque separar de verdade é tirar da conta — senão o dinheiro é gasto sem perceber */
  const padraoDe=(A.find(a=>a.type==="corrente")||A[0]||{}).id||"";
  const padraoPara=(A.find(a=>a.type==="poupanca")||A.find(a=>a.id!==padraoDe)||{}).id||"";
  const move=x?!!x.tx:A.length>1;
  sheet(x?"Depósito":"Guardei um dinheiro",
    '<div class="set"><div class="two"><div class="set-f"><label for="pV">Quanto você separou</label>'+
    '<input id="pV" inputmode="decimal" value="'+(x?fmtN(x.v):"")+'" placeholder="200,00"></div>'+
    '<div class="set-f"><label for="pD">Quando</label><input id="pD" type="date" value="'+(x?x.d:todayISO())+'"></div></div>'+
    '<div class="set-f"><label for="pN">Anotação</label><input id="pN" value="'+esc(x?(x.note||""):"")+'" placeholder="sobra do mês"></div>'+
    (A.length>1?'<div class="set-f"><label style="display:flex;align-items:center;gap:9px;font-weight:500">'+
      '<input type="checkbox" id="pMove" style="width:20px;height:20px"'+(move?" checked":"")+'>'+
      'Tirar o dinheiro da conta agora</label>'+
      '<span class="hint">Marcado, o app faz a transferência: sai da conta do dia a dia e fica guardado na outra. Assim o saldo do Painel já não conta com ele, e você não gasta sem querer o que separou.</span></div>'+
      '<div class="two" id="pContas"'+(move?'':' hidden')+'><div class="set-f"><label for="pA">Sai de</label><select id="pA">'+
      optId(A,(x&&x.de)||padraoDe)+'</select></div>'+
      '<div class="set-f"><label for="pB">Fica em</label><select id="pB">'+optId(A,(x&&x.para)||padraoPara)+'</select></div></div>'
      :'<div class="note"><b>Isso marca o quanto você já juntou</b>Para o dinheiro sair mesmo da conta, cadastre uma segunda conta (Poupança) em Ajustes.</div>')+
    '</div>',
    (x?'<button class="btn danger" id="pKill">Excluir</button>':'<button class="btn ghost" id="pX">Cancelar</button>')+
    '<button class="btn good" id="pOk">'+(x?"Salvar":"Guardar")+'</button>');
  const c=$("#pX"); if(c) c.onclick=closeSheet;
  const mv=$("#pMove"); if(mv) mv.onchange=()=>{ const box=$("#pContas"); if(box) box.hidden=!mv.checked; };
  /* a transferência acompanha o depósito: se o valor ou a data mudam, ela é refeita */
  const tiraTx=async y=>{ if(y&&y.tx&&y.ym){ await removeTx(y.ym,y.tx); y.tx=""; y.ym=""; } };
  $("#pOk").onclick=async()=>{ const v=toCents($("#pV").value);
    if(!v){ toast("Coloque o valor."); return; }
    const d=$("#pD").value||todayISO(), nota=$("#pN").value.trim();
    const quer=mv?mv.checked:false, de=$("#pA")?$("#pA").value:"", para=$("#pB")?$("#pB").value:"";
    if(quer&&de===para){ toast("Escolha contas diferentes."); return; }
    const y=x||{id:uid()};
    await tiraTx(y);
    y.d=d; y.v=v; y.note=nota; y.de=quer?de:""; y.para=quer?para:"";
    if(quer){ const tid=uid();
      await commit({id:tid,raw:"",v,desc:nota||"Separado para "+(S.cfg.goalName||"a meta"),cat:"outros",
        method:"transferencia",cardId:"transf",acct:de,acct2:para,n:1,date:d,time:nowTime(),k:"t"});
      y.tx=tid; y.ym=ymOf(d); }
    if(!x) D.push(y);
    await saveCfg(); closeSheet(); render();
    toast(quer?"Guardado e tirado da conta. Bom trabalho.":(x?"Salvo":"Guardado. Bom trabalho.")); };
  const k=$("#pKill");
  if(k) k.onclick=async()=>{ await tiraTx(x); S.cfg.deposits=D.filter(y=>y.id!==id); await saveCfg(); closeSheet(); render();
    toast(x&&x.de?"Excluído; o dinheiro voltou para a conta.":"Excluído"); }; }
