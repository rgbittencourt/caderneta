/* =================== importar =================== */
function parseStatement(text,sign){
  const out=[];
  if(/<STMTTRN>|<OFX>/i.test(text)){
    text.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const g=re=>{ const m=b.match(re); return m?m[1].trim():""; };
      const dt=g(/<DTPOSTED>([^<\s]+)/i), amt=parseFloat(g(/<TRNAMT>([^<\s]+)/i));
      const memo=g(/<MEMO>([^<\n\r]*)/i)||g(/<NAME>([^<\n\r]*)/i);
      if(!dt||isNaN(amt)) return;
      const d=dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8);
      if(sign==="neg"&&amt>=0) return;
      out.push({d,desc:memo||"Sem descrição",v:Math.round(Math.abs(amt)*100),k:amt>0?"e":"g"}); });
    return out; }
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cells=line.includes(";")?line.split(";"):(line.includes("\t")?line.split("\t"):line.split(","));
    if(cells.length<2) return;
    let d="",desc="",v=null;
    cells.forEach(raw=>{
      const c=raw.trim().replace(/^"|"$/g,""); if(!c) return;
      const md=c.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})$/), mi=c.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(mi&&!d){ d=mi[0]; return; }
      if(md&&!d){ const y=md[3].length===2?"20"+md[3]:md[3]; d=y+"-"+md[2]+"-"+md[1]; return; }
      if(/^-?\s*R?\$?\s*-?[\d.]+,\d{2}$/.test(c)||/^-?\d+\.\d{2}$/.test(c)){ if(v===null) v=toCents(c); return; }
      if(c.length>desc.length&&!/^\d+$/.test(c)) desc=c; });
    if(!d||v===null||v===0) return;
    if(sign==="neg"&&v>=0) return;
    out.push({d,desc:desc||"Sem descrição",v:Math.abs(v),k:v>0?"e":"g"}); });
  return out; }

function runImport(){
  const text=$("#impText").value;
  if(!text.trim()){ toast("Cole o extrato primeiro."); return; }
  const sign=$("#impSign").value;
  let rows=parseStatement(text,sign);
  if(sign==="all") rows=rows.map(r=>Object.assign({},r,{k:"g"}));
  const out=$("#impOut");
  if(!rows.length){ out.innerHTML='<div class="empty"><b>Não reconheci nenhuma linha</b>Preciso de data, descrição e valor na mesma linha. CSV com ponto e vírgula, ou arquivo OFX, funcionam bem.</div>'; return; }
  const cardId=$("#impCard").value;
  const parsed=rows.map(r=>Object.assign({},r,{cat:guessCat(r.desc,S.cfg,r.k)}));
  const gastos=parsed.filter(r=>r.k==="g"), ents=parsed.filter(r=>r.k==="e");
  const tot=gastos.reduce((s,r)=>s+r.v,0), totE=ents.reduce((s,r)=>s+r.v,0);
  const byCat={}; gastos.forEach(r=>{ byCat[r.cat]=(byCat[r.cat]||0)+r.v; });
  const ord=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  out.innerHTML='<div style="margin-top:16px"><div class="sec-h"><h2 class="sec-t">'+parsed.length+' linhas · '+
    fmt(tot)+' em gastos'+(totE?" · +"+fmt(totE)+" em entradas":"")+'</h2></div>'+
    '<div class="chart">'+chartBarsH(ord.slice(0,8).map(id=>({label:catName(id),v:byCat[id],
      pct:tot?Math.round(byCat[id]/tot*100):0,tip:catName(id)+" — "+fmt(byCat[id])})),{alt:"Prévia por categoria"})+'</div>'+
    '<div class="sheet-acts" style="max-width:420px"><button class="btn ghost" id="impX">Descartar</button>'+
    '<button class="btn" id="impGo">Gravar '+parsed.length+' lançamentos</button></div></div>';
  bindTips(out.closest(".panel"));
  $("#impX").onclick=()=>{ out.innerHTML=""; };
  $("#impGo").onclick=async()=>{
    $("#impGo").disabled=true;
    const card=S.cfg.cards.find(c=>c.id===cardId)||{};
    for(const r of parsed) await commit({id:"imp"+uid(),raw:"",v:r.v,desc:r.desc,cat:r.cat,
      method:r.k==="e"?"pix":(card.type||"credito"),cardId:r.k==="e"?cardId:cardId,
      acct:acctOf(cardId),n:1,date:r.d,time:"",k:r.k});
    out.innerHTML=""; $("#impText").value="";
    render(); toast(parsed.length+" lançamentos gravados"); }; }

async function aiParse(){
  if(!S.ai) return;
  const raw=$("#say").value.trim(); if(!raw) return;
  const b=$("#aiBtn"); b.textContent="Pensando…"; b.disabled=true;
  const prompt="Você extrai lançamentos financeiros de uma fala em português do Brasil.\n"+
    "Categorias de GASTO (id=nome): "+S.cfg.cats.map(c=>c.id+"="+c.n).join("; ")+"\n"+
    "Categorias de ENTRADA (id=nome): "+(S.cfg.ecats||ECATS).map(c=>c.id+"="+c.n).join("; ")+"\n"+
    "Pagamentos (id=nome): "+S.cfg.cards.map(c=>c.id+"="+c.n).join("; ")+
    '\nResponda SOMENTE um array JSON. Cada item: {"tipo":"gasto" ou "entrada","valor":number em reais,'+
    '"descricao":string curta,"categoria":id da lista do tipo,"cartao":id do pagamento,'+
    '"para":nome de quem recebeu se for pix ou transferência (senão ""),"parcelas":inteiro}.\n'+
    'Exemplo: [{"tipo":"gasto","valor":23,"descricao":"Almoço no IFSC","categoria":"alim","cartao":"visa","para":"","parcelas":1}]\n\nFala:\n'+raw.slice(0,3000);
  try{
    const arr=await S.ai.json(prompt,{modelTier:"quick",cache:false});
    if(!Array.isArray(arr)||!arr.length) throw {code:"invalid_json"};
    S.drafts=arr.map(o=>{
      const k=String(o.tipo||"").toLowerCase().indexOf("entrada")>=0?"e":"g";
      const lista=k==="e"?(S.cfg.ecats||ECATS):S.cfg.cats;
      const cardId=S.cfg.cards.some(c=>c.id===o.cartao)?o.cartao:S.cfg.cards[0].id;
      return {id:uid(),raw,k,v:toCents(Number(o.valor)||0),desc:String(o.descricao||"").slice(0,80),
        cat:lista.some(c=>c.id===o.categoria)?o.categoria:guessCat(String(o.descricao||""),S.cfg,k),
        cardId, method:(S.cfg.cards.find(c=>c.id===cardId)||S.cfg.cards[0]).type,
        to:String(o.para||"").slice(0,60), acct:acctOf(cardId),
        n:k==="e"?1:Math.max(1,Math.min(60,parseInt(o.parcelas)||1)),
        date:todayISO(),time:nowTime(),msg:""}; });
    renderDrafts();
  }catch(e){ const c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"){ b.hidden=true; toast("IA não liberada nesta conta."); }
    else if(c==="rate_limited") toast("Muitos pedidos à IA. Tente daqui a pouco.");
    else toast("A IA não conseguiu ler. Ajuste os campos na mão."); }
  b.textContent="Usar IA"; b.disabled=false; }

function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$("#micBtn"); if(!SR||!btn) return;
  btn.hidden=false;
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on&&rec){ rec.stop(); return; }
    try{
      rec=new SR(); rec.lang="pt-BR"; rec.continuous=true; rec.interimResults=true;
      const base=$("#say").value?$("#say").value.trim()+" ":"";
      rec.onstart=()=>{ on=true; btn.classList.add("rec"); btn.textContent="Parar"; };
      rec.onresult=e=>{ let s=""; for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript;
        $("#say").value=base+s; };
      rec.onerror=ev=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
          $("#sayHint").innerHTML="O microfone do app está bloqueado aqui. Use o <kbd>🎤</kbd> do teclado — funciona igual.";
          btn.hidden=true; } };
      rec.onend=()=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if($("#say").value.trim()) readInput(); };
      rec.start();
    }catch(e){ btn.hidden=true; } }; }

    saveCfg(); closeSheet(); render(); toast(x?"Salvo":"Guardado. Bom trabalho."); };
  const k=$("#pKill");
  if(k) k.onclick=()=>{ S.cfg.deposits=D.filter(y=>y.id!==id); saveCfg(); closeSheet(); render(); toast("Excluído"); }; }

/* =================== partida =================== */
$("#mPrev").onclick=()=>{ S.ym=ymShift(S.ym,-1); render(); };
$("#mNext").onclick=()=>{ S.ym=ymShift(S.ym,1); render(); };
loadLocal();
render();
boot();
</script>
</body>
