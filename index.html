/* =================== fichas =================== */
function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ el.hidden=true; },2700); }
function sheet(title,body,acts){
  $("#sheet").innerHTML='<div class="sheet-h"><span class="sheet-t">'+esc(title)+
    '</span><button class="icon-btn" id="shX" aria-label="Fechar">✕</button></div>'+body+
    '<div class="sheet-acts">'+(acts||"")+'</div>';
  $("#scrim").hidden=false; $("#shX").onclick=closeSheet; }
function closeSheet(){ $("#scrim").hidden=true; $("#sheet").innerHTML=""; }
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeSheet(); };
const optId=(arr,sel)=>arr.map(o=>'<option value="'+o.id+'"'+(o.id===sel?" selected":"")+">"+esc(o.n)+"</option>").join("");

function openTx(ym,id){
  const t=(S.months[ym]||{tx:{}}).tx[id]; if(!t) return;
  const kind=t.k||"g", A=S.cfg.accounts||[];
  const catList=kind==="e"?(S.cfg.ecats||ECATS):S.cfg.cats;
  sheet(kind==="e"?"Entrada":kind==="p"?"Pagamento de fatura":kind==="t"?"Transferência entre contas"
      :(t.n>1?"Parcela "+t.i+" de "+t.n:"Lançamento"),
    '<div class="set"><div class="set-f"><label>Descrição</label><input id="tD" value="'+esc(t.desc)+'"></div>'+
    '<div class="two"><div class="set-f"><label>Valor</label><input id="tV" inputmode="decimal" value="'+fmtN(t.v)+'"></div>'+
    '<div class="set-f"><label>Quando</label><input id="tDt" type="date" value="'+t.d+'"></div></div>'+
    (kind==="t"
      ? '<div class="two"><div class="set-f"><label>Sai de</label><select id="tA">'+optId(A,t.acct)+'</select></div>'+
        '<div class="set-f"><label>Vai para</label><select id="tB">'+optId(A,t.acct2)+'</select></div></div>'
      : '<div class="two">'+
        (kind==="p"?"":'<div class="set-f"><label>Categoria</label><select id="tC">'+optId(catList,t.cat)+'</select></div>')+
        (kind==="g"
          ? '<div class="set-f"><label>Pagamento</label><select id="tP">'+optId(S.cfg.cards,t.card)+'</select></div>'
          : '<div class="set-f"><label>'+(kind==="e"?"Cai na conta":"Sai da conta")+'</label><select id="tA">'+optId(A,t.acct||acctOf(t.card))+'</select></div>')+
        '</div>'+
        (kind==="g"&&TEM_DESTINO[t.method]?'<div class="set-f"><label>Para quem</label><input id="tTo" value="'+esc(t.to||"")+'"></div>':''))+
    (t.n>1?'<div class="set-f"><span class="hint">Compra de '+fmt(t.total)+' em '+t.n+'x. Mudar o valor aqui muda só esta parcela.</span></div>':'')+
    (t.raw?'<div class="raw">“'+esc(t.raw)+'”</div>':'')+'</div>',
    (kind==="g"&&(+t.n||1)<=1&&!t.fix?'<button class="btn ghost" id="tFix">Tornar fixo</button>':'')+'<button class="btn danger" id="tKill">'+(t.n>1?"Excluir compra":"Excluir")+'</button><button class="btn" id="tOk">Salvar</button>');
  $("#tOk").onclick=async()=>{
    const nd=$("#tDt").value||t.d;
    const patch={desc:$("#tD").value.trim()||t.desc, v:toCents($("#tV").value)};
    if($("#tC")) patch.cat=$("#tC").value;
    if($("#tP")){ patch.card=$("#tP").value; const c=S.cfg.cards.find(x=>x.id===patch.card);
      if(c) patch.method=c.type; patch.acct=acctOf(patch.card); }
    if($("#tA")) patch.acct=$("#tA").value;
    if($("#tB")) patch.acct2=$("#tB").value;
    if($("#tTo")) patch.to=$("#tTo").value.trim();
    const newYm=ymOf(nd);
    if(newYm!==ym){ S.months[ym].tx[id]={del:1,u:Date.now()};
      if(!S.months[newYm]) S.months[newYm]={tx:{}};
      S.months[newYm].tx[id]=Object.assign({},t,patch,{d:nd,u:Date.now()});
      await saveMonth(ym); await saveMonth(newYm); }
    else { Object.assign(S.months[ym].tx[id],patch,{d:nd,u:Date.now()}); await saveMonth(ym); }
    closeSheet(); render(); toast("Salvo"); };
  const tf=$("#tFix"); if(tf) tf.onclick=async()=>{ const fx={id:uid(),name:t.desc,amount:t.v,day:+t.d.slice(8,10)||1,cat:t.cat,card:t.card}; (S.cfg.fixed=S.cfg.fixed||[]).push(fx); S.months[ym].tx[id].fix=fx.id; S.months[ym].tx[id].u=Date.now(); await saveCfg(); await saveMonth(ym); closeSheet(); render(); toast("Agora é fixo todo mês. Aparece em Ajustes, em Gastos fixos."); };
  $("#tKill").onclick=async()=>{ await removeTx(ym,id,t.n>1); closeSheet(); render();
    toast(t.n>1?"Compra e parcelas excluídas":"Excluído"); }; }

/* lançamento manual: é aqui que o salário entra sem falar nada */
function openManual(kind){
  const A=S.cfg.accounts||[], isE=kind==="e";
  const catList=isE?(S.cfg.ecats||ECATS):S.cfg.cats;
  sheet(isE?"Nova entrada":"Novo gasto",
    '<div class="set">'+
    '<div class="two"><div class="set-f"><label>Valor</label><input id="mV" inputmode="decimal" placeholder="0,00"></div>'+
    '<div class="set-f"><label>Quando</label><input id="mDt" type="date" value="'+todayISO()+'"></div></div>'+
    '<div class="set-f"><label>Descrição</label><input id="mD" placeholder="'+(isE?"Salário de setembro":"Almoço")+'"></div>'+
    '<div class="two"><div class="set-f"><label>Categoria</label><select id="mC">'+optId(catList,isE?"sal":"outros")+'</select></div>'+
    (isE?'<div class="set-f"><label>Cai em qual conta</label><select id="mA">'+optId(A,(A[0]||{}).id)+'</select></div>'
       :'<div class="set-f"><label>Pagamento</label><select id="mP">'+optId(S.cfg.cards,(S.cfg.cards[0]||{}).id)+'</select></div>')+
    '</div>'+
    (isE?'':'<div class="set-f"><label>Parcelas</label><input id="mN" inputmode="numeric" value="1"></div>')+
    (isE?'<div class="note"><b>Entrada é dinheiro chegando</b>Ela soma no saldo da conta e nunca conta no teto de gastos. Falando, basta dizer “caiu o salário, dezesseis mil” — as palavras recebi, caiu, salário, freela, reembolso já viram entrada sozinhas.</div>':'')+
    '</div>',
    '<button class="btn ghost" id="mX">Cancelar</button><button class="btn'+(isE?" good":"")+'" id="mOk">Salvar</button>');
  $("#mX").onclick=closeSheet;
  $("#mOk").onclick=async()=>{
    const v=toCents($("#mV").value);
    if(!v){ toast("Coloque o valor."); return; }
    const cardId=isE?((S.cfg.cards.find(c=>c.type==="pix")||S.cfg.cards[0]).id):$("#mP").value;
    const c=S.cfg.cards.find(x=>x.id===cardId);
    await commit({id:uid(),raw:"",v,desc:$("#mD").value.trim()||(isE?"Entrada":"Gasto"),
      cat:$("#mC").value, method:isE?"pix":(c?c.type:"credito"), cardId,
      acct:isE?$("#mA").value:acctOf(cardId),
      n:isE?1:Math.max(1,Math.min(60,parseInt($("#mN").value)||1)),
      date:$("#mDt").value||todayISO(), time:nowTime(), k:isE?"e":"g"});
    closeSheet(); render(); toast(isE?"Entrada lançada":"Gasto lançado"); }; }

function openAcct(id){
  const A=S.cfg.accounts||[];
  const a=A.find(x=>x.id===id)||{id:uid(),n:"",type:"corrente",opening:0,openDate:"",adjust:[]};
  const isNew=!A.some(x=>x.id===a.id);
  const bal=isNew?0:balanceOf(a.id,todayISO());
  sheet(isNew?"Nova conta":a.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="aN" value="'+esc(a.n)+'" placeholder="Banco do Brasil"></div>'+
    '<div class="set-f"><label>Tipo</label><select id="aT">'+
    Object.keys(ACCT_TIPO).map(k=>'<option value="'+k+'"'+(k===a.type?" selected":"")+'>'+ACCT_TIPO[k]+'</option>').join("")+'</select></div>'+
    (isNew
      ? '<div class="set-f"><label>Quanto tem nela hoje</label><input id="aB" inputmode="decimal" placeholder="0,00">'+
        '<span class="hint">A partir daqui o app soma as entradas e subtrai os gastos sozinho.</span></div>'
      : '<div class="set-f"><label>Saldo calculado hoje</label><input id="aB" inputmode="decimal" value="'+fmtN(bal)+'">'+
        '<span class="hint">Se o app do banco mostra outro número, corrija aqui — a diferença fica registrada como acerto e o saldo volta a bater.</span></div>')+
    (!isNew&&(a.adjust||[]).length
      ? '<div class="set-f"><span class="hint">Últimos acertos: '+a.adjust.slice(-3).reverse()
          .map(x=>x.d.slice(8,10)+"/"+x.d.slice(5,7)+" "+(x.delta>=0?"+":"")+fmtN(x.delta)).join(" · ")+'</span></div>' : '')+
    '<div class="set-f"><label style="display:flex;align-items:center;gap:9px;font-weight:500;color:var(--ink)"><input type="checkbox" id="aIni" style="width:20px;height:20px"'+(a.openDate?" checked":"")+'>Começar a contar de uma data</label>'+
    '<span class="hint">Para carregar extratos antigos: a data do primeiro extrato e o saldo anterior que aparece nele.</span></div>'+
    '<div class="two" id="aIniF"><div class="set-f"><label for="aID">Começa em</label><input id="aID" type="date" value="'+(a.openDate||(new Date().getFullYear()+"-01-01"))+'"></div>'+
    '<div class="set-f"><label for="aIV">Saldo no dia anterior</label><input id="aIV" inputmode="decimal" value="'+(a.openDate?fmtN(a.opening||0):"")+'" placeholder="0,00"></div></div>'+
    '</div>',
    (isNew?"":'<button class="btn danger" id="aKill">Excluir</button>')+'<button class="btn" id="aOk">Salvar</button>');
  const ini=()=>{ const on=$("#aIni").checked; $("#aIniF").hidden=!on; $("#aB").closest(".set-f").hidden=on; };
  $("#aIni").onchange=ini; ini();
  $("#aOk").onclick=()=>{
    const nm=$("#aN").value.trim(); if(!nm){ toast("Dê um nome."); return; }
    if($("#aIni").checked){ const dt=$("#aID").value; if(!dt){ toast("Informe a data de início."); return; }
      const v=toCents($("#aIV").value), r=isNew?{id:a.id}:A.find(x=>x.id===a.id);
      Object.assign(r,{n:nm,type:$("#aT").value,opening:v,openDate:dt,adjust:[]}); if(isNew) A.push(r);
      S.cfg.accounts=A; saveCfg(); closeSheet(); render();
      toast("Saldo de "+fmt(v)+" em "+diaMesAno(diaAnterior(dt))+". Os lançamentos contam a partir de "+diaMesAno(dt)+"."); return; }
    const novo=toCents($("#aB").value);
    if(isNew) A.push({id:a.id,n:nm,type:$("#aT").value,opening:novo,openDate:"",adjust:[]});
    else { const r=A.find(x=>x.id===a.id); r.n=nm; r.type=$("#aT").value;
      const delta=novo-bal;
      if(delta!==0){ r.opening=(r.opening||0)+delta;
        r.adjust=(r.adjust||[]).concat([{d:todayISO(),delta}]).slice(-20); } }
    S.cfg.accounts=A; saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#aKill");
  if(k) k.onclick=()=>{ if(A.length<=1){ toast("Precisa de pelo menos uma conta."); return; }
    S.cfg.accounts=A.filter(x=>x.id!==a.id); saveCfg(); closeSheet(); render(); toast("Excluída"); }; }

function openPay(cardId){
  const c=S.cfg.cards.find(x=>x.id===cardId); if(!c) return;
  const inv=cardInvoice(cardId,S.ym), A=S.cfg.accounts||[];
  if(!A.length){ toast("Cadastre uma conta antes."); return; }
  sheet("Pagar fatura · "+c.n,
    '<div class="set"><div class="set-f"><label>Valor</label><input id="yV" inputmode="decimal" value="'+fmtN(inv.open)+'"></div>'+
    '<div class="two"><div class="set-f"><label>Sai de qual conta</label><select id="yA">'+optId(A,acctOf(cardId))+'</select></div>'+
    '<div class="set-f"><label>Quando</label><input id="yD" type="date" value="'+todayISO()+'"></div></div>'+
    '<div class="note"><b>Isso não é um gasto novo</b>Tira o dinheiro da conta e abate a fatura de '+esc(ymLabel(S.ym))+
    '. As compras já foram contadas no teto quando você comprou.</div></div>',
    '<button class="btn ghost" id="yX">Cancelar</button><button class="btn" id="yOk">Pagar</button>');
  $("#yX").onclick=closeSheet;
  $("#yOk").onclick=async()=>{ const v=toCents($("#yV").value);
    if(!v){ toast("Coloque o valor."); return; }
    await commit({id:uid(),raw:"",v,desc:"Fatura "+c.n+" · "+ymLabel(S.ym),cat:"outros",method:"debito",
      cardId,acct:$("#yA").value,n:1,date:$("#yD").value||todayISO(),time:nowTime(),k:"p",ref:S.ym});
    closeSheet(); render(); toast("Fatura paga"); }; }

function openTransfer(){
  const A=S.cfg.accounts||[];
  if(A.length<2){ toast("Precisa de duas contas."); return; }
  sheet("Transferir entre contas",
    '<div class="set"><div class="set-f"><label>Quanto</label><input id="xV" inputmode="decimal" placeholder="0,00"></div>'+
    '<div class="two"><div class="set-f"><label>Sai de</label><select id="xA">'+optId(A,A[0].id)+'</select></div>'+
    '<div class="set-f"><label>Vai para</label><select id="xB">'+optId(A,A[1].id)+'</select></div></div>'+
    '<div class="two"><div class="set-f"><label>Quando</label><input id="xD" type="date" value="'+todayISO()+'"></div>'+
    '<div class="set-f"><label>Anotação</label><input id="xN" placeholder="para a poupança"></div></div>'+
    '<div class="note"><b>Só muda o dinheiro de lugar</b>Não conta como gasto. Para mandar dinheiro a outra pessoa, lance como gasto com a forma de pagamento Transferência.</div></div>',
    '<button class="btn ghost" id="xX">Cancelar</button><button class="btn" id="xOk">Transferir</button>');
  $("#xX").onclick=closeSheet;
  $("#xOk").onclick=async()=>{
    const v=toCents($("#xV").value), a=$("#xA").value, b=$("#xB").value;
    if(!v){ toast("Coloque o valor."); return; }
    if(a===b){ toast("Escolha contas diferentes."); return; }
    await commit({id:uid(),raw:"",v,desc:$("#xN").value.trim()||"Transferência entre contas",cat:"outros",
      method:"transferencia",cardId:"transf",acct:a,acct2:b,n:1,date:$("#xD").value||todayISO(),time:nowTime(),k:"t"});
    closeSheet(); render(); toast("Transferido"); }; }

/* =================== ajustes =================== */
function linkrow(t,s,attr){ return '<div class="linkrow"><div class="m"><div class="t">'+esc(t)+
  '</div><div class="s">'+esc(s)+'</div></div><button class="mini" '+attr+'>Editar</button></div>'; }

function openCard(id){

  const isNew=!S.cfg.cards.some(x=>x.id===c.id);
  sheet(isNew?"Nova forma de pagamento":c.n,
    '<div class="set"><div class="set-f"><label>Nome</label><input id="cN" value="'+esc(c.n)+'" placeholder="Elo Nubank"></div>'+
    '<div class="two"><div class="set-f"><label>Tipo</label><select id="cT">'+
    Object.keys(METODOS).map(k=>'<option value="'+k+'"'+(k===c.type?" selected":"")+'>'+METODOS[k]+'</option>').join("")+'</select></div>'+
    '<div class="set-f"><label>Dia do fechamento</label><input id="cF" inputmode="numeric" value="'+(c.closing||"")+'" placeholder="0 = não usar"></div></div>'+
    '<div class="two"><div class="set-f"><label>Dia do vencimento</label><input id="cV" inputmode="numeric" value="'+(c.due||"")+'" placeholder="0 = não usar"></div>'+
    '<div class="set-f"><label>Limite</label><input id="cL" inputmode="decimal" value="'+(c.limit?fmtN(c.limit):"")+'" placeholder="0,00"></div></div>'+
    '<div class="set-f"><label>Sai de qual conta</label><select id="cC">'+optId(S.cfg.accounts||[],c.acct||acctOf(c.id))+'</select>'+
    '<span class="hint">No crédito é a conta de onde sai o pagamento da fatura. No débito, pix, transferência ou dinheiro é a conta que o gasto tira na hora.</span></div>'+
    '<div class="set-f"><label>Como você chama falando</label><input id="cA" value="'+esc(c.alias)+'" placeholder="elo nubank roxinho">'+
    '<span class="hint">Palavras separadas por espaço. Se você disser qualquer uma delas, o lançamento cai aqui.</span></div>'+
    '<div class="set-f"><span class="hint">O dia do fechamento joga as compras feitas depois dele para a fatura do mês seguinte — é o que faz o teto bater com o que sai da conta.</span></div></div>',
    (isNew?"":'<button class="btn danger" id="cKill">Excluir</button>')+'<button class="btn" id="cOk">Salvar</button>');
  $("#cOk").onclick=()=>{
    const n=$("#cN").value.trim(); if(!n){ toast("Dê um nome."); return; }
    const obj={id:c.id,n,type:$("#cT").value,
      closing:Math.max(0,Math.min(31,parseInt($("#cF").value)||0)),
      due:Math.max(0,Math.min(31,parseInt($("#cV").value)||0)),
      limit:toCents($("#cL").value), acct:$("#cC").value, alias:$("#cA").value.trim()||norm(n)};
    const i=S.cfg.cards.findIndex(x=>x.id===c.id);
    if(i<0) S.cfg.cards.push(obj); else S.cfg.cards[i]=obj;
    saveCfg(); closeSheet(); render(); toast("Salvo"); };
  const k=$("#cKill");
  if(k) k.onclick=()=>{ S.cfg.cards=S.cfg.cards.filter(x=>x.id!==c.id); saveCfg(); closeSheet(); render(); toast("Excluído"); }; }

    '<div class="set-f"><label>Limite por mês</label><input id="kL" inputmode="decimal" value="'+(c.limit?fmtN(c.limit):"")+'" placeholder="0,00 = sem limite">'+

    const n=$("#kN").value.trim(); if(!n){ toast("Dê um nome."); return; }

    if(i<0) S.cfg.cats.push({id:c.id,n,limit:toCents($("#kL").value),grupo:$("#kG").value});

function parseStatement(text,sign){
  const out=[];
  if(/<STMTTRN>|<OFX>/i.test(text)){
    text.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const g=re=>{ const m=b.match(re); return m?m[1].trim():""; };
      const dt=g(/<DTPOSTED>([^<\s]+)/i), amt=parseFloat(g(/<TRNAMT>([^<\s]+)/i));
      const memo=g(/<MEMO>([^<\n\r]*)/i)||g(/<NAME>([^<\n\r]*)/i);
      if(!dt||isNaN(amt)) return;
      const d=dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8);
      if(sign==="neg"&&amt>=0) return;
      out.push({d,desc:memo||"Sem descrição",v:Math.round(Math.abs(amt)*100),k:amt>0?"e":"g"}); });
    return out; }
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cells=line.includes(";")?line.split(";"):(line.includes("\t")?line.split("\t"):line.split(","));
    if(cells.length<2) return;
    let d="",desc="",v=null;
    cells.forEach(raw=>{
      const c=raw.trim().replace(/^"|"$/g,""); if(!c) return;
      const md=c.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})$/), mi=c.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(mi&&!d){ d=mi[0]; return; }
      if(md&&!d){ const y=md[3].length===2?"20"+md[3]:md[3]; d=y+"-"+md[2]+"-"+md[1]; return; }
      if(/^-?\s*R?\$?\s*-?[\d.]+,\d{2}$/.test(c)||/^-?\d+\.\d{2}$/.test(c)){ if(v===null) v=toCents(c); return; }
      if(c.length>desc.length&&!/^\d+$/.test(c)) desc=c; });
    if(!d||v===null||v===0) return;
    if(sign==="neg"&&v>=0) return;
    out.push({d,desc:desc||"Sem descrição",v:Math.abs(v),k:v>0?"e":"g"}); });
  return out; }

function copyText(t,ok){ if(!navigator.clipboard){ toast("Este navegador não permite copiar."); return; }
  navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(()=>toast("Não consegui copiar.")); }
function exportCSV(){
  const TIPO={g:"gasto",e:"entrada",p:"pagamento de fatura",t:"entre contas"};
  const rows=[["data","hora","tipo","descricao","categoria","pagamento","para quem","conta","parcela","valor"]];
  Object.keys(S.months).sort().forEach(ym=>txOf(ym).slice().reverse().forEach(t=>
    rows.push([t.d,t.t||"",TIPO[t.k]||"gasto",t.desc,catLabel(t),cardName(t.card),t.to||"",
      acctName(t.acct||acctOf(t.card))+(t.acct2?" -> "+acctName(t.acct2):""),
      t.n>1?t.i+"/"+t.n:"",fmtN(t.v)])));
  copyText(rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n"),"CSV copiado."); }

  const prompt="Você extrai lançamentos financeiros de uma fala em português do Brasil.\n"+
    "Categorias de GASTO (id=nome): "+S.cfg.cats.map(c=>c.id+"="+c.n).join("; ")+"\n"+
    "Categorias de ENTRADA (id=nome): "+(S.cfg.ecats||ECATS).map(c=>c.id+"="+c.n).join("; ")+"\n"+
    "Pagamentos (id=nome): "+S.cfg.cards.map(c=>c.id+"="+c.n).join("; ")+
    '\nResponda SOMENTE um array JSON. Cada item: {"tipo":"gasto" ou "entrada","valor":number em reais,'+
    '"descricao":string curta,"categoria":id da lista do tipo,"cartao":id do pagamento,'+
    '"para":nome de quem recebeu se for pix ou transferência (senão ""),"parcelas":inteiro}.\n'+
    'Exemplo: [{"tipo":"gasto","valor":23,"descricao":"Almoço no IFSC","categoria":"alim","cartao":"visa","para":"","parcelas":1}]\n\nFala:\n'+raw.slice(0,3000);
  try{
    const arr=await S.ai.json(prompt,{modelTier:"quick",cache:false});
    if(!Array.isArray(arr)||!arr.length) throw {code:"invalid_json"};
    S.drafts=arr.map(o=>{
      const k=String(o.tipo||"").toLowerCase().indexOf("entrada")>=0?"e":"g";
      const lista=k==="e"?(S.cfg.ecats||ECATS):S.cfg.cats;
      const cardId=S.cfg.cards.some(c=>c.id===o.cartao)?o.cartao:S.cfg.cards[0].id;
      return {id:uid(),raw,k,v:toCents(Number(o.valor)||0),desc:String(o.descricao||"").slice(0,80),
        cat:lista.some(c=>c.id===o.categoria)?o.categoria:guessCat(String(o.descricao||""),S.cfg,k),
        cardId, method:(S.cfg.cards.find(c=>c.id===cardId)||S.cfg.cards[0]).type,
        to:String(o.para||"").slice(0,60), acct:acctOf(cardId),
        n:k==="e"?1:Math.max(1,Math.min(60,parseInt(o.parcelas)||1)),
        date:todayISO(),time:nowTime(),msg:""}; });
    renderDrafts();
  }catch(e){ const c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"){ b.hidden=true; toast("IA não liberada nesta conta."); }
    else if(c==="rate_limited") toast("Muitos pedidos à IA. Tente daqui a pouco.");
    else toast("A IA não conseguiu ler. Ajuste os campos na mão."); }
  b.textContent="Usar IA"; b.disabled=false; }

/* =================== microfone =================== */
function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$("#micBtn"); if(!SR||!btn) return;
  btn.hidden=false;
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on&&rec){ rec.stop(); return; }
    try{
      rec=new SR(); rec.lang="pt-BR"; rec.continuous=true; rec.interimResults=true;
      const base=$("#say").value?$("#say").value.trim()+" ":"";
      rec.onstart=()=>{ on=true; btn.classList.add("rec"); btn.textContent="Parar"; };
      rec.onresult=e=>{ let s=""; for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript;
        $("#say").value=base+s; };
      rec.onerror=ev=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
          $("#sayHint").innerHTML="O microfone do app está bloqueado aqui. Use o <kbd>🎤</kbd> do teclado — funciona igual.";
          btn.hidden=true; } };
      rec.onend=()=>{ on=false; btn.classList.remove("rec"); btn.textContent="Microfone";
        if($("#say").value.trim()) readInput(); };
      rec.start();
    }catch(e){ btn.hidden=true; } }; }

/* =================== método 50-30-20 =================== */
const NOMES_GRUPO={nec:"Necessidades",des:"Desejos",fut:"Futuro"};
const GRUPO_PADRAO={merc:"nec",comb:"nec",carro:"nec",transp:"nec",medic:"nec",saude:"nec",casa:"nec",educ:"nec",
  assin:"nec",pet:"nec",imposto:"nec",divida:"fut"};
const grupoDe=id=>{ const c=(S.cfg.cats||[]).find(x=>x.id===id); return (c&&c.grupo)||GRUPO_PADRAO[id]||"des"; };
const opcoesGrupo=sel=>Object.keys(NOMES_GRUPO).map(g=>'<option value="'+g+'"'+(g===sel?" selected":"")+'>'+NOMES_GRUPO[g]+'</option>').join("");

/* acrescenta o que as versões novas trazem, sem desfazer escolhas antigas */
function migrarCfg(){
  const c=S.cfg; if(!c) return; migrar2(c);
  if(!c.rendas) c.rendas=+c.income>0?[{desde:"2000-01",v:+c.income}]:[];     /* renda com histórico */
  if(c.m1) return;
  c.cats=c.cats||[]; c.cards=c.cards||[];
  if(!c.cats.some(x=>x.id==="divida")){ const i=c.cats.findIndex(x=>x.id==="outros");
    c.cats.splice(i<0?c.cats.length:i,0,{id:"divida",n:"Dívidas e empréstimos",limit:0,grupo:"fut"}); }
  if(!c.cards.some(x=>x.type==="boleto"))
    c.cards.push({id:"boleto",n:"Boleto",type:"boleto",closing:0,due:0,limit:0,acct:((c.accounts||[])[0]||{}).id||"cc",alias:"boleto"});
  if(!c.metodo) c.metodo={nec:50,des:30,fut:20};
  c.m1=true; }

function resumo5030(ym){
  const st=monthStats(ym), m=S.cfg.metodo||{nec:50,des:30,fut:20};
  const base=st.income>0?st.income:rendaPrevista(ym), baseDe=st.income>0?"renda lançada no mês":"renda prevista";
  const g={nec:0,des:0,fut:0};
  Object.keys(st.byCat).forEach(id=>{ g[grupoDe(id)]+=st.byCat[id]; });
  const tipoConta=id=>((S.cfg.accounts||[]).find(a=>a.id===id)||{}).type||"";
  const transf=st.all.filter(t=>t.k==="t"&&/poupanca|invest/.test(tipoConta(t.acct2))).reduce((s,t)=>s+t.v,0);
  const guardou=(S.cfg.deposits||[]).filter(x=>ymOf(x.d)===ym).reduce((s,x)=>s+x.v,0);
  g.fut+=Math.max(transf,guardou);    /* "guardei" e a transferência para a poupança costumam ser o mesmo dinheiro */
  return {g,m,base,baseDe}; }

/* setor de anel: ângulos em graus, 0 = topo, sentido horário */
function arco(cx,cy,ri,ro,a0,a1){
  a1=Math.min(a1,a0+359.9);
  const p=(r,a)=>{ const t=(a-90)*Math.PI/180; return (cx+r*Math.cos(t)).toFixed(2)+" "+(cy+r*Math.sin(t)).toFixed(2); };
  const L=(a1-a0)>180?1:0;
  return "M"+p(ro,a0)+" A"+ro+" "+ro+" 0 "+L+" 1 "+p(ro,a1)+" L"+p(ri,a1)+" A"+ri+" "+ri+" 0 "+L+" 0 "+p(ri,a0)+" Z"; }
/* rosca do 50-30-20: anel fino de fora = meta; anel grosso de dentro = para onde a renda foi.
   O entalhe fixo no topo impede que o azul e o roxo se encostem (ficam iguais sob deuteranopia). */
function chartDonut5030(g,m,base){
  const W=240, C=120, NOTCH=5, GAP=1.6, span=360-NOTCH;
  const cor={nec:"var(--c1)",des:"var(--c2)",fut:"var(--c3)"}, ks=["nec","des","fut"];
  const usado=g.nec+g.des+g.fut, total=Math.max(base,usado,1);
  let s='<svg viewBox="0 0 '+W+' '+W+'" role="img" aria-label="Método 50-30-20: meta e realizado" style="max-width:260px">';
  let a=NOTCH/2;
  ks.forEach(k=>{ const d=span*m[k]/100;
    if(d>GAP) s+='<path d="'+arco(C,C,104,112,a+GAP/2,a+d-GAP/2)+'" style="fill:'+cor[k]+';opacity:.38" data-tip="Meta de '+NOMES_GRUPO[k]+': '+m[k]+'%"/>';
    a+=d; });
  a=NOTCH/2;
  ks.forEach(k=>{ const d=span*g[k]/total;
    if(d>GAP) s+='<path d="'+arco(C,C,60,94,a+GAP/2,a+d-GAP/2)+'" style="fill:'+cor[k]+'" data-tip="'+NOMES_GRUPO[k]+' — '+fmt(g[k])+'|'+(base?Math.round(g[k]/base*100):0)+'% da renda · meta '+m[k]+'%"/>';
    a+=d; });
  const livre=Math.max(0,base-usado);
  if(livre>0){ const d=span*livre/total;
    if(d>GAP) s+='<path d="'+arco(C,C,60,94,a+GAP/2,a+d-GAP/2)+'" style="fill:var(--surface-3)" data-tip="Sem destino ainda — '+fmt(livre)+'"/>'; }
  const pct=base?Math.round(usado/base*100):0, over=usado>base;
  s+='<text x="'+C+'" y="'+(C+2)+'" text-anchor="middle" style="fill:'+(over?'var(--bad)':'var(--ink)')+';font:600 30px var(--f)">'+pct+'%</text>';
  s+='<text x="'+C+'" y="'+(C+21)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+(over?'acima da':'da renda')+'</text>';
  s+='<text x="'+C+'" y="'+(C+34)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+(over?'renda':'com destino')+'</text>';
  return s+'</svg>'; }

function render5030(){
  const box=$("#m5030"); if(!box) return;
  const {g,m,base,baseDe}=resumo5030(S.ym), st=monthStats(S.ym);
  const cor={nec:"var(--c1)",des:"var(--c2)",fut:"var(--c3)"};
  const linha=k=>{
    const alvo=Math.round(base*m[k]/100), real=g[k], piso=k==="fut";
    const fill=alvo?Math.min(100,real/alvo*100):0;
    const estado=piso?(real>=alvo?"good":"warn"):(real>alvo?"bad":real>alvo*0.9?"warn":"");
    const msg=piso?(real>=alvo?"meta atingida":"faltam "+fmt(alvo-real)):(real>alvo?"passou "+fmt(real-alvo):"sobram "+fmt(alvo-real));
    return '<div style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+
      '<span style="font-weight:600;display:flex;align-items:center;gap:7px"><span class="sw" style="background:'+cor[k]+'"></span>'+NOMES_GRUPO[k]+
      ' <span style="color:var(--ink-3);font-weight:400">· meta '+m[k]+'%</span></span>'+
      '<span style="font-family:var(--f-m);font-variant-numeric:tabular-nums">'+fmtN(real)+' <span style="color:var(--ink-3)">de '+fmtN(alvo)+'</span></span></div>'+
      '<div class="meter" style="margin-top:6px"><i class="'+(estado==="good"?"":estado)+'" style="width:'+fill+'%'+(estado==="good"?';background:var(--good)':'')+'"></i></div>'+
      '<div class="meter-s"><span>'+(base?Math.round(real/base*100):0)+'% da renda</span><span>'+msg+'</span></div></div>'; };
  const cats={nec:[],des:[],fut:[]};
  Object.keys(st.byCat).forEach(id=>cats[grupoDe(id)].push({id,v:st.byCat[id]}));
  const guardado=g.fut-cats.fut.reduce((s,x)=>s+x.v,0);
  const detalhe=k=>{
    const L=cats[k].sort((a,b)=>b.v-a.v), tot=g[k];
    const top=st.gastos.filter(t=>grupoDe(t.cat)===k).sort((a,b)=>b.v-a.v).slice(0,5);
    const linhaCat=(nome,v)=>'<div class="linkrow"><div class="m"><div class="t">'+esc(nome)+'</div><div class="s">'+(tot?Math.round(v/tot*100):0)+'% do grupo</div></div><span class="row-v">'+fmtN(v)+'</span></div>';
    const vazio=!L.length&&!(k==="fut"&&guardado>0);
    return '<details class="grp"><summary><span class="sw" style="background:'+cor[k]+'"></span>'+NOMES_GRUPO[k]+'<span class="v">'+fmtN(tot)+'</span></summary><div class="in">'+
      (vazio?'<div class="empty" style="padding:12px">Nada neste grupo em '+esc(ymLabel(S.ym))+'.</div>'
        : L.map(x=>linhaCat(catName(x.id),x.v)).join("")+(k==="fut"&&guardado>0?linhaCat("Guardado ou transferido para poupança",guardado):"")+
          (top.length?'<div class="sec-t" style="margin:14px 0 4px">Maiores lançamentos</div>'+top.map(rowHTML).join(""):""))+
      '</div></details>'; };
  box.innerHTML='<div class="sec-h"><h2 class="sec-t">Método 50-30-20 · '+esc(ymLabel(S.ym))+'</h2><button class="sec-a" id="m5030Aj">Ajustar</button></div>'+
    (base
      ? '<div class="grid g2" style="align-items:stretch"><div class="card pad chart" style="display:grid;place-items:center;gap:6px">'+chartDonut5030(g,m,base)+
        '<div class="legend" style="justify-content:center;margin-top:4px">'+["nec","des","fut"].map(k=>'<span class="lg"><i style="background:'+cor[k]+'"></i>'+NOMES_GRUPO[k]+'</span>').join("")+
        '<span class="lg"><i style="background:var(--surface-3);border:1px solid var(--line-2)"></i>Sem destino</span></div>'+
        '<div class="tile-d" style="justify-content:center;text-align:center">Anel de fora: a meta. Anel de dentro: para onde a renda foi.</div></div>'+
        '<div class="card pad"><div class="tile-d" style="margin:0 0 14px">Sobre '+fmt(base)+' ('+baseDe+'). Necessidades e Desejos são tetos; Futuro é piso.</div>'+
        linha("nec")+linha("des")+linha("fut")+'</div></div>'+
        '<div class="sec-h" style="margin:18px 0 10px"><h2 class="sec-t">O que tem em cada grupo</h2></div>'+
        detalhe("nec")+detalhe("des")+detalhe("fut")+
        tableView(["Grupo","Realizado","% da renda","Meta"],["nec","des","fut"].map(k=>[NOMES_GRUPO[k],fmtN(g[k]),(base?Math.round(g[k]/base*100):0)+"%",m[k]+"%"]))
      : '<div class="card pad"><div class="empty"><b>Falta a renda</b>Informe sua renda líquida em Ajustes, ou lance a entrada do salário, para dividir em 50-30-20.</div></div>');
  $("#m5030Aj").onclick=openMetodo; bindRows(box); }

  sheet("Método 50-30-20",
    '<div class="set"><div class="set-f"><span class="hint">Quanto da renda líquida vai para cada grupo. O método é um guia, não uma prisão: ajuste à sua realidade. A soma precisa dar 100%.</span></div>'+

    '<div class="set-f"><label>Em qual grupo entra cada categoria</label><div class="card pad">'+

async function lerDoc(arquivo,senha,anexar){
  const st=$("#docStatus"), tipo=$("#docTipo").value, mes=$("#docMes").value||S.ym;
  if(!window.Leitor){ toast("O leitor não carregou. Recarregue o app."); return; }
  const pdf=/pdf/i.test(arquivo.type||"")||/\.pdf$/i.test(arquivo.name||"");
  const btns=$$("#docCamBtn,#docArqBtn"); btns.forEach(b=>b.disabled=true); st.textContent="abrindo…";
  let r=null;
  try{
    r=ehArquivoTexto(arquivo)?await lerArquivoTexto(arquivo,tipo):await Leitor.ler(arquivo,{tipo,mes,senha,onProgress:(p,etapa)=>{ st.textContent=(etapa||"lendo")+(p?" "+p+"%":""); }});
    st.textContent="";
    if(!r.linhas.length){
      if(r.tipo==="boleto"){ openLinhaBoleto(r.erro); return; }
      if(r.tipo==="cupom"&&!pdf){ toast(r.erro||"Não achei o valor nessa foto. Tente com mais luz e o papel reto."); return; }
      diagnosticoDoc(arquivo,r,null); return; }
    mostrarLidos(r,{mes,card:$("#docCard").value,conta:$("#docConta").value,pago:$("#docPago").value},anexar);
  }catch(e){
    st.textContent="";
    if(e&&e.senha){ pedirSenhaPdf(arquivo,!!e.errada,anexar); return; }
    console.warn(e); diagnosticoDoc(arquivo,r,e); }
  finally{ btns.forEach(b=>b.disabled=false); } }

/* amostra do formato, sem os dados: números viram 9 e o que não é termo bancário vira x */
const TERMOS_BANCO=/^(saldo|anterior|final|atual|dia|total|pix|ted|doc|tev|compra|compras|pagamento|pagto|fatura|vencimento|parcela|parc|credito|debito|data|historico|valor|lancamento|lancamentos|descricao|documento|extrato|conta|corrente|periodo|juros|iof|tarifa|estorno|recebido|recebida|enviado|enviada|transferencia|deposito|saque|salario|agencia|limite|minimo|entrada|entradas|saida|saidas|nacional|internacional|de|a|o|e|em|do|da|no|na|para|d|c|r|us|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez|seg|ter|qua|qui|sex|sab|dom)$/;
function amostraSemDados(texto){
  return String(texto||"").split(/\r?\n/).filter(l=>l.trim()).slice(0,45)
    .map(l=>l.replace(/\d/g,"9").replace(/[A-Za-zÀ-ÿ]+/g,w=>TERMOS_BANCO.test(deacc(w.toLowerCase()))?w:"x".repeat(Math.min(w.length,6))))
    .join("\n"); }
function diagnosticoDoc(arquivo,r,e){
  const pdf=/pdf/i.test(arquivo.type||"")||/\.pdf$/i.test(arquivo.name||"");
  const texto=(r&&r.texto)||"", nLinhas=texto.split(/\r?\n/).filter(l=>l.trim()).length;
  const msgErro=e?((e.name&&e.name!=="Error"?e.name+": ":"")+(e.message||String(e))):"";
  let titulo, explica;
  if(e&&/baixar o leitor|fetch|network|load failed/i.test(msgErro)){ titulo="Não consegui baixar o leitor de PDF"; explica="Confira a internet e tente de novo. Depois da primeira vez, ele fica guardado no aparelho."; }
  else if(e){ titulo="Não consegui abrir esse arquivo"; explica="O leitor parou com um erro. A amostra abaixo diz qual foi."; }
  else if(nLinhas<3){ titulo="Não achei texto nesse "+(pdf?"PDF":"arquivo");
    explica=pdf?"Ele parece ser uma imagem (documento escaneado) e o reconhecimento não conseguiu ler. Tente o PDF baixado direto do app do banco.":"Tente de novo com mais luz, com o papel reto ocupando a tela."; }
  else { titulo="Li o texto, mas não reconheci os lançamentos";
    explica="O jeito que esse banco organiza "+(r.tipo==="fatura"?"a fatura":"o extrato")+" é diferente do que o app conhece. Confira se o tipo escolhido está certo; se estiver, mande a amostra."; }
  const tec=["arquivo: "+(pdf?"PDF":(arquivo.type||"?"))+", "+Math.round((arquivo.size||0)/1024)+" KB","tipo: "+((r&&r.tipo)||$("#docTipo").value),
    "linhas de texto: "+nLinhas, msgErro?"erro: "+msgErro:"", "navegador: "+navigator.userAgent.replace(/\d+[._\d]*/g,"").replace(/\s+/g," ").slice(0,90)]
    .filter(Boolean).join("\n");
  const amostra=tec+"\n---\n"+amostraSemDados(texto);
  sheet(titulo,
    '<div class="set"><div class="note"><b>O que aconteceu</b>'+esc(explica)+'</div>'+
    '<div class="set-f"><label for="dgA">Amostra sem seus dados</label><textarea id="dgA" rows="9" readonly>'+esc(amostra)+'</textarea>'+
    '<span class="hint">Números viram 9 e nomes viram x: sobra só o formato do documento. Copie e mande na conversa com o Claude para ele ajustar o leitor ao seu banco.</span></div></div>',
    '<button class="btn ghost" id="dgX">Fechar</button><button class="btn" id="dgC">Copiar amostra</button>');
  $("#dgX").onclick=closeSheet;
  $("#dgC").onclick=async()=>{ try{ await navigator.clipboard.writeText(amostra); }catch(_){ const t=$("#dgA"); t.select(); document.execCommand("copy"); } toast("Amostra copiada"); }; }

function rascunhosDoc(r,op){
  op=op||{}; const hoje=todayISO();
  const debitoDaConta=conta=>S.cfg.cards.find(c=>c.type==="debito"&&(!conta||c.acct===conta))||S.cfg.cards.find(c=>c.type==="debito");
  const porBandeira=b=>{ if(!b) return null; const w=b.indexOf("master")===0?"master":b;
    return S.cfg.cards.find(c=>c.type==="credito"&&norm(c.alias+" "+c.n).split(" ").indexOf(w)>=0); };
  const boletoCard=S.cfg.cards.find(c=>c.type==="boleto"), pagoCom=op.pago?S.cfg.cards.find(c=>c.id===op.pago):null;
  const mesFat=r.tipo==="fatura"?mesDaFatura(r,op.mes||S.ym):"";
  return r.linhas.map(l=>{
    const d={id:uid(), raw:"", v:l.v, desc:l.desc, k:l.k||"g", n:l.n||1, i0:l.i0||1, date:l.d||hoje, time:"", msg:"", origem:r.tipo, incluir:true};
    if(r.tipo==="fatura"){ d.cardId=op.card; d.method="credito"; d.ym=mesFat; d.porParcela=d.n>1;
      d.raw="Fatura de "+ymLabel(d.ym)+(d.i0>1?" · parcela "+d.i0+" de "+d.n+" — as seguintes já ficam reservadas":""); }
    else if(r.tipo==="extrato"){ const c=debitoDaConta(op.conta); d.cardId=c?c.id:(S.cfg.cards[0]||{}).id;
      d.method=d.k==="e"?"pix":"debito"; d.acct=op.conta||acctOf(d.cardId); d.raw="Extrato"; classificarLinhaExtrato(d); }
    else if(r.tipo==="boleto"){ const c=pagoCom||boletoCard||debitoDaConta(); d.cardId=c?c.id:(S.cfg.cards[0]||{}).id; d.method=pagoCom?pagoCom.type:"boleto"; d.date=hoje;
      d.raw=l.vencimento?"Vence em "+l.vencimento.split("-").reverse().join("/"):"Boleto"; }
    else { const c=pagoCom||porBandeira(l.bandeira)||S.cfg.cards.find(x=>x.type===(l.metodo||"credito"))||S.cfg.cards[0];
      d.cardId=c.id; d.method=c.type; d.raw="Canhoto"; }
    d.cat=(l.cat&&S.cfg.cats.some(c=>c.id===l.cat))?l.cat:guessCat(d.desc,S.cfg,d.k);
    const rep=pareceRepetido(d);
    if(rep){ d.incluir=false; d.dup={ym:rep.ym,id:rep.id,desc:rep.desc,d:rep.d,v:rep.v,card:rep.card||"",k:rep.k};
      /* parcela que o app já reservou quando importou a fatura em que a compra começou: mesmo número, mesmo valor, mesmo cartão */
      const reservada=d.i0>1&&txOf(d.ym||ymOf(d.date)).find(t=>t.plan&&t.i===d.i0&&Math.abs(t.v-d.v)<=1&&(!d.cardId||t.card===d.cardId));
      if(reservada){ d.dup={ym:reservada.ym,id:reservada.id,desc:reservada.desc,d:reservada.d,v:reservada.v,card:reservada.card||"",k:reservada.k}; d.dupResp=1; d.dupAuto=1; } }
    return d; }); }

/* o mesmo gasto já lançado por voz ou por outro documento: mesmo valor, mesma data (±3 dias) */
function pareceRepetido(d){
  const alvo=d.ym||ymOf(d.date), dia=s=>Date.parse(s+"T12:00:00");
  for(const ym of [ymShift(alvo,-1),alvo,ymShift(alvo,1)]) for(const t of txOf(ym)){
    if(t.k!==d.k||Math.abs(t.v-d.v)>1) continue;
    if(d.i0>1&&t.plan&&t.i===d.i0&&ym===alvo) return t;
    if(d.method==="credito"&&t.card&&d.cardId&&t.card!==d.cardId) continue;
    if(Math.abs(dia(t.d)-dia(d.date))<=3*86400000) return t; }
  return null; }

/* o diagnóstico: cada achado tem gravidade, explicação e, quando dá, uma ação */
function diagnostico(ym){
  const st=monthStats(ym), out=[], renda=(st.income>0?st.income:rendaPrevista(ym))||0;
  const add=(tone,t,s,acoes)=>out.push({tone,t,s,acoes});
  const irPara=id=>()=>{ const el=$("#"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); };
  if(st.cap&&st.dayNow>0){
    if(!st.isCur){ const tot=st.spent;
      if(tot>st.cap) add("bad","O mês fechou "+fmt(tot-st.cap)+" acima do teto","Gastos de <b>"+fmt(tot)+"</b> para um teto de <b>"+fmt(st.cap)+"</b>.");
      else add("good","O mês fechou dentro do teto","Gastos de <b>"+fmt(tot)+"</b>; sobraram <b>"+fmt(st.cap-tot)+"</b> do teto."); }
    else if(st.pace>st.cap) add("bad","No ritmo atual, o mês fecha "+fmt(Math.round(st.pace-st.cap))+" acima do teto",
      "Fora fixos e parcelas, você está gastando <b>"+fmt(Math.round((st.spent-st.rigid)/st.dayNow))+"</b> por dia. "+(st.perDay>0?"Para caber, o limite é <b>"+fmt(Math.round(st.perDay))+"</b> por dia até o fim do mês."
        :"O teto já foi todo usado, contando os fixos e as parcelas que ainda vêm."));
    else add("good","O mês cabe no teto","Projeção de <b>"+fmt(Math.round(st.pace))+"</b> para um teto de <b>"+fmt(st.cap)+"</b>."); }
  if(renda){
    const {g,m}=resumo5030(ym), cats={};
    Object.keys(st.byCat).forEach(id=>{ const k=grupoDe(id); (cats[k]=cats[k]||[]).push({id,v:st.byCat[id]}); });
    const top=k=>(cats[k]||[]).sort((a,b)=>b.v-a.v).slice(0,2).map(x=>esc(catName(x.id))+" <b>"+fmt(x.v)+"</b>").join(" e ");
    const ver=[{rotulo:"Ver 50-30-20",fn:()=>setView("meta")}];
    ["nec","des"].forEach(k=>{ const alvo=renda*m[k]/100;
      if(g[k]>alvo) add(k==="des"?"warn":"bad",NOMES_GRUPO[k]+" em "+Math.round(g[k]/renda*100)+"% da renda (meta "+m[k]+"%)",
        "Passou <b>"+fmt(Math.round(g[k]-alvo))+"</b>. Os maiores: "+top(k)+".",ver); });
    const alvoF=renda*m.fut/100;
    if(g.fut<alvoF){ const falta=Math.round(alvoF-g.fut), folga=Math.max(0,Math.round(renda*m.des/100-g.des));
      add("warn","Futuro em "+Math.round(g.fut/renda*100)+"% da renda (meta "+m.fut+"%)",

    if(u>0.8) add(u>0.95?"bad":"warn",c.n+" com "+Math.round(u*100)+"% do limite usado","Livre: <b>"+fmt(Math.max(0,c.limit-o))+"</b>, já contando as parcelas futuras."); } });
  const ds=(S.cfg.dividas||[]).map(dv=>({dv,e:estadoDivida(dv)})).filter(x=>x.e.n>0&&x.e.i>0).sort((a,b)=>b.e.i-a.e.i);

  const ordem={bad:0,warn:1,"":2,good:3};

const TIPOS_DIVIDA={pessoal:"Empréstimo pessoal",consignado:"Consignado",financiamento:"Financiamento",cartao:"Parcelamento do cartão",cheque:"Cheque especial",outro:"Outro"};
/* tabela Price: com juros, o saldo é o valor presente das parcelas que faltam */
function saldoPrice(P,i,n){ if(n<=0) return 0; return Math.round(i>0?P*(1-Math.pow(1+i,-n))/i:P*n); }
/* quantos meses e quanto de juros até quitar pagando Q por mês */
function quitar(saldo,Q,i){
  if(saldo<=0) return {meses:0,juros:0};
  if(i<=0) return {meses:Math.ceil(saldo/Q),juros:0};
  if(saldo*i>=Q) return null;
  const m=-Math.log(1-saldo*i/Q)/Math.log(1+i);
  return {meses:Math.ceil(m-1e-9),juros:Math.max(0,Math.round(Q*m-saldo))}; }
/* parcela k vence em inicio + (k-1) meses, no dia informado; a que já venceu conta como paga.
   Assim consignado e débito automático andam sozinhos, sem precisar lançar cada parcela. */
function normDivida(dv){
  if(!dv.total&&dv.restantes){ dv.total=+dv.restantes; dv.inicio=dv.desde; }   /* formato da primeira versão */
  if(!dv.inicio) dv.inicio=ymOf(todayISO());
  return dv; }
function vencDivida(dv,k){ const ym=ymShift(dv.inicio,k-1); return ym+"-"+pad(Math.min(+dv.dia||1,daysIn(ym))); }
function estadoDivida(dv){
  normDivida(dv);
  if(ehConsSal(dv)) return estadoCons(dv);
  const total=+dv.total||0, P=+dv.parcela||0, i=(+dv.juros||0)/100, hoje=todayISO();
  let pagas=0; while(pagas<total&&vencDivida(dv,pagas+1)<=hoje) pagas++;
  const n=total-pagas, saldo=saldoPrice(P,i,n);
  return {n,i,P,saldo,jurosRest:Math.max(0,P*n-saldo),pagas,total,fim:ymShift(dv.inicio,Math.max(1,total)-1),
    prox:n>0?{k:pagas+1,d:vencDivida(dv,pagas+1)}:null}; }
/* parcela de consignado no mês (descontada ou prevista); nas dívidas antigas em folha, pelo calendário */
function consignadoNoMes(ym){
  return (S.cfg.dividas||[]).filter(dv=>dv.folha||dv.tipo==="consignado").reduce((s,dv)=>{ normDivida(dv);
    if(ehConsSal(dv)) return s+(consDoMes(ym).some(x=>x.dv.id===dv.id)?(+dv.parcela||0):0);
    return s+(dv.inicio<=ym&&ym<=ymShift(dv.inicio,(+dv.total||1)-1)?(+dv.parcela||0):0); },0); }
/* adiantar 20% da parcela (mínimo R$ 50): quantos meses antes termina e quanto economiza */
function simulacao(e){
  if(!e||!e.n||e.i<=0) return null;
  const E=Math.max(5000,Math.round(e.P*0.2/1000)*1000);
  const base=quitar(e.saldo,e.P,e.i), com=quitar(e.saldo,e.P+E,e.i);
  if(!base||!com) return null;
  const meses=base.meses-com.meses, economia=base.juros-com.juros;
  return (meses<1||economia<1000)?null:{E,meses,economia}; }

    const tot=parseInt($(cons?"#dvTotC":"#dvTot").value)||0;
    if(!nome||!P||tot<1||tot>480){ toast("Preencha nome, valor da parcela e número de parcelas."); return; }
    const jt=String($("#dvJ").value).trim().replace(",","."), J=jt===""?"":Math.max(0,Math.min(30,parseFloat(jt)||0));
    const F=S.cfg.fixed||(S.cfg.fixed=[]);
    if(cons){
      const V=toCents($("#dvV").value), data=$("#dvDt").value||hoje, conta=$("#dvCt").value;
      const jd=Math.max(0,Math.min(tot,parseInt($("#dvJD").value)||0));
      if(!V&&!jd){ toast("Informe o valor do empréstimo."); return; }
      if(dv.fixId){ S.cfg.fixed=F.filter(f=>f.id!==dv.fixId); dv.fixId=""; }
      Object.assign(dv,{nome,tipo:"consignado",modo:"salario",parcela:P,total:tot,valor:V,data,conta,jaDesc:jd,juros:J,folha:true,criado:dv.criado||hoje});
      ["restantes","desde","inicio","dia"].forEach(k=>delete dv[k]);
      if(nova) L.push(dv);
      /* o depósito do empréstimo: entra na conta, fora da renda */
      const antigo=dv.depId?allTx().find(t=>t.id===dv.depId):null;
      if($("#dvDep").checked&&V>0){
        if(antigo) await removeTx(antigo.ym,antigo.id,false);
        const idDep=uid(); dv.depId=idDep;
        await commit({id:idDep,raw:"",v:V,desc:"Empréstimo · "+nome,cat:"emprest",method:"transferencia",cardId:"",acct:conta,n:1,date:data,time:"",k:"e",emp:dv.id}); }
      else if(antigo){ await removeTx(antigo.ym,antigo.id,false); dv.depId=""; }
      saveCfg(); closeSheet(); render();
      const e=estadoCons(dv);
      toast(e.n?"Consignado salvo. A próxima parcela sai do salário de "+ymLabel(e.start)+".":"Consignado salvo: todas as parcelas já foram descontadas.");
      return; }
    let inicio, dia;
    if($("#dvS").value==="vai"){ const d=$("#dvI").value;
      if(!d){ toast("Informe a data da 1ª parcela."); return; }
      inicio=ymOf(d); dia=+d.slice(8,10)||1; }
    else { const a=parseInt($("#dvA").value)||0;
      if(a<1||a>tot){ toast("A parcela de "+ymLabel(cur)+" tem que estar entre 1 e "+tot+"."); return; }
      inicio=ymShift(cur,-(a-1)); dia=Math.max(1,Math.min(31,parseInt($("#dvD").value)||1)); }
    const ate=ymShift(inicio,tot-1);
    Object.assign(dv,{nome,tipo:$("#dvT").value,parcela:P,total:tot,inicio,dia,juros:J,folha:false,card:$("#dvC").value});
    ["restantes","desde","modo","valor","data","conta","jaDesc","criado","depId"].forEach(k=>delete dv[k]);

  const k=$("#dvKill");
  if(k) k.onclick=()=>{ S.cfg.dividas=L.filter(x=>x.id!==dv.id); S.cfg.fixed=(S.cfg.fixed||[]).filter(f=>f.id!==dv.fixId);
    saveCfg(); closeSheet(); render(); toast("Dívida excluída. O que já foi lançado continua no extrato."); }; }

/* gastos que se repetem todo mês com o mesmo valor e ainda não estão como fixos */
function recorrentes(){
  const cur=ymOf(todayISO()), meses=[ymShift(cur,-2),ymShift(cur,-1),cur];
  const chave=d=>norm(d).split(" ").filter(w=>w.length>2).slice(0,2).join(" ");
  const jaFixo=new Set((S.cfg.fixed||[]).map(f=>chave(f.name))), mapa={};
  meses.forEach((ym,mi)=>txOf(ym).forEach(t=>{
    if(t.k!=="g"||t.fix||(+t.n||1)>1) return;
    const c=chave(t.desc); if(c.length<3||jaFixo.has(c)) return;
    const e=mapa[c]||(mapa[c]={}); (e[mi]=e[mi]||[]).push(t); }));
  const out=[];
  Object.keys(mapa).forEach(c=>{ const e=mapa[c], ms=Object.keys(e);
    if(ms.length<2||ms.some(i=>e[i].length>1)) return;
    const vs=ms.map(i=>e[i][0].v), media=vs.reduce((a,b)=>a+b,0)/vs.length;
    if(vs.every(v=>Math.abs(v-media)<=media*0.15)) out.push({t:e[ms[ms.length-1]][0],meses:ms.length,media:Math.round(media)}); });
  return out.sort((a,b)=>b.media-a.media); }
function tornarFixo(t){
  const fx={id:uid(),name:t.desc,amount:t.v,day:+t.d.slice(8,10)||1,cat:t.cat,card:t.card};
  (S.cfg.fixed=S.cfg.fixed||[]).push(fx);
  const m=S.months[t.ym]; if(m&&m.tx&&m.tx[t.id]){ m.tx[t.id].fix=fx.id; m.tx[t.id].u=Date.now(); saveMonth(t.ym); }
  saveCfg(); render(); toast(t.desc+" agora é fixo todo mês."); }

/* =================== extrato por conta =================== */
/* como o do banco: saldo anterior, cada movimento com o saldo depois dele e o saldo final.
   Mesmas regras de balanceOf. No cartão de crédito, a fatura do mês. */
function movsConta(acctId,ym){
  const a=(S.cfg.accounts||[]).find(x=>x.id===acctId); if(!a) return [];
  const out=[];
  txOf(ym).forEach(t=>{
    if(a.openDate&&t.d<a.openDate) return;
    let v=0;
    if(t.k==="t"){ if(t.acct===acctId) v=-t.v; else if(t.acct2===acctId) v=t.v; }
    else if((t.acct||acctOf(t.card))===acctId){ if(t.k==="e") v=t.v; else if(t.k==="p"||(t.method!=="credito"&&t.method!=="folha")) v=-t.v; }
    if(v) out.push({t,v}); });
  return out.sort((x,y)=>(x.t.d+(x.t.t||"")).localeCompare(y.t.d+(y.t.t||""))); }
const diaMes=s=>s.slice(8,10)+"/"+s.slice(5,7);
function linhaExt(t,v,saldo,hoje){
  const sub=[t.k==="t"?"Entre contas":t.k==="p"?"Pagamento de fatura":catLabel(t),t.to?"para "+t.to:"",t.n>1?"parcela "+t.i+"/"+t.n:""].filter(Boolean).join(" · ");
  return '<button class="row" data-ym="'+t.ym+'" data-id="'+t.id+'"><span class="ext-d">'+diaMes(t.d)+'</span>'+
    '<span class="row-m"><span class="row-d">'+esc(t.desc)+'</span><span class="row-s"><span>'+esc(sub)+'</span>'+(t.d>hoje?'<span class="chip">agendado</span>':'')+'</span></span>'+
    '<span class="ext-v"><span class="row-v'+(v>0?' plus':'')+'">'+(v>0?"+":"−")+fmtN(Math.abs(v))+'</span>'+(saldo!=null?'<span class="ext-s">'+fmtN(saldo)+'</span>':'')+'</span></button>'; }
function htmlExtrato(){
  const ops=(S.cfg.accounts||[]).map(a=>({id:a.id,n:a.n})).concat(creditCards().map(c=>({id:"card:"+c.id,n:c.n})));
  if(!ops.length) return "";
  if(!S.ext||!ops.some(o=>o.id===S.ext)) S.ext=ops[0].id;
  const ym=S.ym, hoje=todayISO(), fimMes=ym+"-"+pad(daysIn(ym)), cartao=S.ext.indexOf("card:")===0;
  const linhaSaldo=(rot,v,fim)=>'<div class="ext-h'+(fim?' fim':'')+'"><span>'+rot+'</span><b'+(v<0?' style="color:var(--bad)"':'')+'>'+fmtN(v)+'</b></div>';
  let corpo;
  if(cartao){
    const cid=S.ext.slice(5), inv=cardInvoice(cid,ym);
    const L=txOf(ym).filter(t=>t.card===cid&&t.k==="g"&&t.method==="credito").reverse();
    const pg=allTx().filter(t=>t.k==="p"&&t.card===cid&&t.ref===ym);
    corpo=linhaSaldo("Fatura de "+esc(ymLabel(ym)),inv.total)+
      (L.length?L.map(t=>linhaExt(t,-t.v,null,hoje)).join(""):'<div class="empty" style="padding:14px">Nenhuma compra nesta fatura.</div>')+
      pg.map(t=>linhaExt(t,t.v,null,hoje)).join("")+
      linhaSaldo(inv.open>0?"Falta pagar":"Fatura paga",Math.max(0,inv.open),true);
  } else {
    const ant=ymShift(ym,-1), ini=balanceOf(S.ext,ant+"-31"), M=movsConta(S.ext,ym); let s=ini;
    const agendado=M.some(m=>m.t.d>hoje);
    const rotFim=fimMes<hoje?"Saldo em "+diaMes(fimMes):(ym>ymOf(hoje)||agendado)?"Saldo previsto em "+diaMes(fimMes):"Saldo hoje";
    corpo=linhaSaldo("Saldo em "+diaMes(ant+"-"+pad(daysIn(ant))),ini)+
      (M.length?M.map(m=>{ s+=m.v; return linhaExt(m.t,m.v,s,hoje); }).join(""):'<div class="empty" style="padding:14px">Nenhum movimento nesta conta em '+esc(ymLabel(ym))+'.</div>')+
      linhaSaldo(rotFim,s,true);
    const pend=fimMes>=hoje?fixedFor(ym).filter(f=>acctOf(f.card)===S.ext&&(S.cfg.cards.find(c=>c.id===f.card)||{}).type!=="credito"):[];
    if(pend.length) corpo+='<div class="ext-p">Fixos ainda não lançados: '+pend.map(f=>esc(f.name)+" "+fmtN(f.amount)+" (dia "+f.day+")").join(" · ")+'</div>';
  }
  return '<div class="sec" id="extSec"><div class="sec-h"><h2 class="sec-t">Extrato de '+esc(ymLabel(ym))+'</h2>'+
    '<span class="sec-as">'+(cartao?'':'<button class="sec-a" id="extAj">Corrigir saldo</button>')+'<button class="sec-a" id="extImp">Importar '+(cartao?'fatura':'extrato')+'</button><button class="sec-a" id="extDup">Repetidos</button></span></div>'+
    '<div class="card pad"><div class="segs">'+ops.map(o=>'<button class="seg'+(o.id===S.ext?' on':'')+'" data-ext="'+o.id+'">'+esc(o.n)+'</button>').join("")+'</div>'+
    corpo+'</div></div>'; }

  const aj=$("#extAj"); if(aj) aj.onclick=()=>openAcct(S.ext);

/* o saldo impresso no extrato vira acerto da conta */
function saldoDoDoc(r,drafts){

  if(s.final&&(s.final.d||datas.length)) return {v:s.final.v, d:s.final.d||datas[datas.length-1]};
  if(s.anterior){
    if(s.anterior.d) return {v:s.anterior.v, d:s.anterior.d};
    if(datas.length) return {v:s.anterior.v, d:new Date(Date.parse(datas[0]+"T12:00:00")-86400000).toISOString().slice(0,10)}; }

function openAcerto(acctId,s){

    '<button class="mini" data-dupd="'+i+'">São diferentes — lançar</button></div></div>'; }

/* já lançados: dois iguais no mesmo lugar, com até 3 dias de diferença */
function repetidosDe(alvo,ym){
  const cartao=alvo.indexOf("card:")===0, cid=cartao?alvo.slice(5):"";
  const L=txOf(ym).filter(t=>cartao?(t.card===cid&&t.k==="g"&&t.method==="credito")
    :((t.acct||acctOf(t.card))===alvo||t.acct2===alvo)).slice().sort((a,b)=>a.d.localeCompare(b.d));
  const pares=[], usado={};
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i], b=L[j];
    if(usado[a.id]||usado[b.id]) continue;
    if(a.k!==b.k||Math.abs(a.v-b.v)>1) continue;
    if(a.plan||b.plan||a.cons||b.cons||a.emp||b.emp) continue;                       /* parcela pertence a uma compra: nunca é repetida */
    if((a.card||"")!==(b.card||"")) continue;
    if(Math.abs(Date.parse(a.d+"T12:00:00")-Date.parse(b.d+"T12:00:00"))>3*86400000) continue;
    const pa=norm(a.desc).split(" ").filter(w=>w.length>3), pb=norm(b.desc).split(" ").filter(w=>w.length>3);
    if(a.cat!==b.cat&&!pa.some(w=>pb.indexOf(w)>=0)) continue;   /* mesma categoria, ou alguma palavra em comum */
    pares.push([a,b]); usado[a.id]=usado[b.id]=1; }
  return pares; }
function procurarRepetidos(){
  const pares=repetidosDe(S.ext,S.ym);
  if(!pares.length){ toast("Nenhum lançamento repetido em "+ymLabel(S.ym)+"."); return; }
  openRepetido(pares,0); }
function openRepetido(pares,i){
  if(i>=pares.length){ closeSheet(); render(); toast("Conferência dos repetidos terminada."); return; }
  const par=pares[i], a=par[0], b=par[1];
  const linha=(rot,t)=>'<div class="dup-l"><b>'+rot+':</b> '+esc(t.desc)+' · '+diaMesAno(t.d)+' · '+fmtN(t.v)+' · '+esc(catLabel(t))+
    (t.card?' · '+esc(cardName(t.card)):'')+(t.n>1?' · parcela '+t.i+'/'+t.n:'')+'</div>';
  sheet("Parecem o mesmo lançamento ("+(i+1)+" de "+pares.length+")",
    '<div class="set"><div class="dup">'+linha("Primeiro",a)+linha("Segundo",b)+'</div>'+
    '<div class="set-f"><span class="hint">Se foram duas compras de verdade, no mesmo valor e quase no mesmo dia, escolha <b>São diferentes</b>. Só apague se for a mesma coisa lançada duas vezes.</span></div></div>',
    '<button class="btn ghost" id="rpN">São diferentes</button><button class="btn danger" id="rpD">Apagar o segundo</button>');
  $("#rpN").onclick=()=>openRepetido(pares,i+1);
  $("#rpD").onclick=async()=>{ await removeTx(b.ym,b.id,false); toast("Apagado: "+b.desc); openRepetido(pares,i+1); }; }

/* =================== contas a pagar do mês =================== */
/* tudo que vence no mês, em ordem de data: gastos fixos, parcelas de dívidas,
   consignado descontado em folha e a fatura de cada cartão. */
function contasDoMes(ym){
  const out=[], hoje=todayISO(), dim=daysIn(ym), diaDoMes=d=>ym+"-"+pad(Math.max(1,Math.min(+d||1,dim)));
  const feito={}; txOf(ym).forEach(t=>{ if(t.fix) feito[t.fix]=t; });
  (S.cfg.fixed||[]).forEach(f=>{
    if(!f.amount) return;
    if((f.ate&&ym>f.ate)||(f.desde&&ym<f.desde)) return;
    const t=feito[f.id], forma=cardName(f.card)||METODOS[(S.cfg.cards.find(c=>c.id===f.card)||{}).type]||"";
    out.push({tipo:"fixo", id:f.id, nome:f.name, v:t?t.v:f.amount, d:t?t.d:diaDoMes(f.day), pago:!!t,
      sub:(f.divida?"Parcela de dívida":"Gasto fixo")+(forma?" · "+forma:"")}); });
  (S.cfg.dividas||[]).filter(dv=>dv.folha||dv.tipo==="consignado").forEach(dv=>{ normDivida(dv);
    if(ehConsSal(dv)){ const t=txOf(ym).find(x=>x.cons===dv.id);
      if(t) out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:t.v, d:t.d, pago:true, sub:"Descontado do salário"});
      else if(consDoMes(ym).some(x=>x.dv.id===dv.id)) out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:+dv.parcela||0, d:primeiroDiaUtil(ym), pago:false, sub:"Sai do salário do mês"});
      return; }
    if(ym<dv.inicio||ym>ymShift(dv.inicio,Math.max(1,+dv.total||1)-1)) return;
    const d=diaDoMes(dv.dia);
    out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:+dv.parcela||0, d, pago:d<=hoje, sub:"Descontado do salário"}); });
  creditCards().forEach(c=>{
    const inv=cardInvoice(c.id,ym); if(!inv.total) return;
    const outroMes=c.due&&c.closing&&c.due<c.closing, prox=ymShift(ym,1);
    const venc=outroMes?prox+"-"+pad(Math.min(c.due,daysIn(prox))):diaDoMes(c.due||dim);
    out.push({tipo:"fatura", id:c.id, nome:"Fatura "+c.n, v:inv.open>0?inv.open:inv.total, d:venc, pago:inv.open<=0,
      sub:"Fatura de "+ymLabel(ym)+(c.due?" · vence "+venc.slice(8,10)+"/"+venc.slice(5,7):" · sem data de vencimento")+
        (inv.paid>0&&inv.open>0?" · já pagou "+fmtN(inv.paid):"")}); });
  return out.sort((a,b)=>a.d.localeCompare(b.d)||b.v-a.v); }

function linhaConta(x,hoje){
  const atrasada=!x.pago&&x.d<hoje&&x.tipo!=="folha";
  const acao=x.pago?"":x.tipo==="fixo"?'<button class="mini" data-pagafixo="'+x.id+'">Lançar</button>'
    :x.tipo==="fatura"?'<button class="mini" data-pagafat="'+x.id+'">Pagar</button>':"";
  const chip=x.pago?'<span class="chip ok">'+(x.tipo==="folha"?"descontado":"pago")+'</span>'
    :atrasada?'<span class="chip atraso">atrasada</span>':x.d===hoje?'<span class="chip hoje">vence hoje</span>':"";
  return '<div class="cta'+(x.pago?" pago":"")+'" data-cta="'+x.tipo+":"+x.id+'">'+
    '<span class="cta-d">'+x.d.slice(8,10)+"/"+x.d.slice(5,7)+'</span>'+
    '<span class="row-m"><span class="row-d">'+esc(x.nome)+'</span>'+
    '<span class="row-s"><span>'+esc(x.sub)+'</span>'+chip+'</span></span>'+
    '<span class="cta-v"><span class="row-v'+(x.pago?" pay":"")+'">'+fmtN(x.v)+'</span>'+
    (acao?'<span class="cta-a">'+acao+'</span>':'')+'</span></div>'; }

function htmlContas(ym){
  const L=contasDoMes(ym), hoje=todayISO();
  if(!L.length) return '<div class="sec" id="ctaSec"><div class="sec-h"><h2 class="sec-t">Contas a pagar de '+esc(ymLabel(ym))+'</h2></div>'+

/* =================== salário e consignado =================== */
/* A renda líquida de Ajustes cai no primeiro dia útil do mês. Consignado: o empréstimo cai na conta no dia
   (fora da renda) e, a partir do salário seguinte, o salário entra com a parcela descontada. A parcela vai para
   Dívidas e empréstimos com o método "folha", que não tira dinheiro da conta de novo. Uma por mês. */
const ehConsSal=dv=>!!dv&&dv.tipo==="consignado"&&dv.modo==="salario";
const pctBR=i=>(Math.round(i*10000)/100).toString().replace(".",",")+"%";
const diaAnterior=s=>new Date(Date.parse(s+"T12:00:00")-86400000).toISOString().slice(0,10);
function pascoa(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const x=h+l-7*m+114; return Date.UTC(y,Math.floor(x/31)-1,(x%31)+1); }
/* feriados nacionais e bancários: os de data fixa, carnaval, sexta-feira santa e Corpus Christi */
function feriado(iso){
  if(["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"].indexOf(iso.slice(5))>=0) return true;
  const dif=Math.round((Date.parse(iso+"T00:00:00Z")-pascoa(+iso.slice(0,4)))/86400000);
  return dif===-48||dif===-47||dif===-2||dif===60; }
function primeiroDiaUtil(ym){
  for(let d=1;d<=10;d++){ const iso=ym+"-"+pad(d), w=new Date(iso+"T12:00:00").getDay();
    if(w!==0&&w!==6&&!feriado(iso)) return iso; }
  return ym+"-01"; }
function contaDoSalario(){ const A=S.cfg.accounts||[]; return (A.find(a=>a.id===S.cfg.salConta)||A.find(a=>a.type==="corrente")||A[0]||{}).id||"cc"; }

/* juro ao mês: o informado, ou o que faz as parcelas pagarem o valor recebido (tabela Price) */
function consJuros(dv){
  if(dv.juros!==""&&dv.juros!=null) return +dv.juros||0;
  const V=+dv.valor||0, P=+dv.parcela||0, n=+dv.total||0;
  if(!V||!P||!n||P*n<=V) return 0;
  const pv=i=>P*(1-Math.pow(1+i,-n))/i; let lo=1e-7, hi=1;
  for(let k=0;k<80;k++){ const m=(lo+hi)/2; if(pv(m)>V) lo=m; else hi=m; }
  return Math.round((lo+hi)/2*10000)/100; }
function estadoCons(dv){
  const deds=allTx().filter(t=>t.cons===dv.id).sort((a,b)=>a.d.localeCompare(b.d)), meses={};
  deds.forEach(t=>{ meses[t.ym]=1; });
  const total=+dv.total||0, P=+dv.parcela||0, jd=+dv.jaDesc||0;
  const pagas=Math.min(total,jd+deds.length), n=total-pagas;
  const i=consJuros(dv)/100, saldo=saldoPrice(P,i,n);
  /* primeiro desconto: o salário seguinte ao empréstimo; se já vinha sendo descontado, o salário do mês do cadastro */
  const base=dv.data||dv.criado||todayISO(), bm=ymOf(base);
  const primeiro=jd>0?ymOf(dv.criado||todayISO()):(base<primeiroDiaUtil(bm)?bm:ymShift(bm,1));
  const ult=deds.length?deds[deds.length-1].ym:"";
  const start=ult&&ymShift(ult,1)>primeiro?ymShift(ult,1):primeiro;
  const fim=n>0?ymShift(start,n-1):(ult||primeiro);
  return {n,i,P,saldo,jurosRest:Math.max(0,P*n-saldo),pagas,total,fim,start,meses,
    prox:n>0?{k:pagas+1,d:primeiroDiaUtil(start)}:null}; }
/* consignados com parcela no mês: já descontada ou ainda por descontar */
function consDoMes(ym){
  return (S.cfg.dividas||[]).filter(ehConsSal).map(dv=>({dv,e:estadoCons(dv)}))
    .filter(x=>x.e.meses[ym]||(x.e.n>0&&ym>=x.e.start&&ym<=x.e.fim)); }
function rendaPrevista(ym){ return Math.max(0,rendaDoMes(ym)-consDoMes(ym).reduce((s,x)=>s+(+x.dv.parcela||0),0)); }
/* parcela prevista no mês, enquanto não foi lançada: entra como gasto fixo */
function consVirtuais(ym){
  return consDoMes(ym).filter(x=>!x.e.meses[ym]).map(x=>({id:"cons:"+x.dv.id, name:x.dv.nome, amount:+x.dv.parcela||0,
    day:+primeiroDiaUtil(ym).slice(8,10), cat:"divida", card:"", cons:x.dv.id, acct:contaDoSalario()})); }
const idDesconto=(dvId,ym)=>"cons-"+dvId+"-"+ym;
/* a chave existe, mesmo apagada (lápide): não recria o que o dono apagou */
const jaTemChave=(ym,id)=>{ const t=S.months[ym]&&S.months[ym].tx&&S.months[ym].tx[id]; return !!t&&!(t.del&&t.zerado); };   /* lápide de Recomeçar não conta */
async function lancarDesconto(dv,ym,e,data){
  const id=idDesconto(dv.id,ym); if(jaTemChave(ym,id)||e.meses[ym]) return false;
  await commit({id,raw:"",v:+dv.parcela||0,desc:dv.nome+" · parcela "+(e.pagas+1)+"/"+dv.total,cat:"divida",method:"folha",cardId:"",
    acct:contaDoSalario(),n:1,date:data,time:"08:00",fix:"cons:"+dv.id,cons:dv.id,k:"g"});
  return true; }
function lancamentoDoFixo(f,ym){
  if(f.cons){ const dv=(S.cfg.dividas||[]).find(x=>x.id===f.cons), e=dv?estadoCons(dv):{pagas:0};
    return {id:idDesconto(f.cons,ym),raw:"",v:f.amount,desc:f.name+" · parcela "+(e.pagas+1)+"/"+((dv&&dv.total)||"?"),cat:"divida",
      method:"folha",cardId:"",acct:contaDoSalario(),n:1,date:primeiroDiaUtil(ym),time:"08:00",fix:f.id,cons:f.cons,k:"g"}; }
  return {id:uid(),raw:"",v:f.amount,desc:f.name,cat:f.cat,method:(S.cfg.cards.find(c=>c.id===f.card)||{}).type||"debito",
    cardId:f.card,n:1,date:ym+"-"+pad(f.day),time:"",fix:f.id,k:"g"}; }

/* todo mês, a partir do primeiro dia útil: o salário de Ajustes, já sem as parcelas do consignado.
   Chave fixa por mês ("sal-AAAA-MM"): dois aparelhos criam o mesmo lançamento, e a junção fica com um só. */
let salarioRodando=false;
async function garantirSalario(){
  const c=S.cfg; if(salarioRodando||!c||!(+c.income>0||(c.rendas||[]).some(r=>r.v>0))||c.salAuto===false||c.salPausa) return;
  if(S.mode!=="local"&&!S.sincronizado) return;   /* conta Google: só depois de juntar com o Drive, senão duplicaria um salário lançado em outro aparelho */
  const hoje=todayISO(), cur=ymOf(hoje);
  salarioRodando=true;
  try{
    if(!c.salDesde){ c.salDesde=cur; saveCfg(); }
    let criou=false;
    for(const ym of [ymShift(cur,-1),cur]){
      if(ym<c.salDesde||!(rendaDoMes(ym)>0)) continue;
      const dia=primeiroDiaUtil(ym); if(dia>hoje) continue;
      const id="sal-"+ym;
      if(jaTemChave(ym,id)) continue;
      if(txOf(ym).some(t=>t.k==="e"&&t.cat==="sal")) continue;      /* já lançado à mão ou pelo extrato */
      const L=consDoMes(ym), P=L.reduce((s,x)=>s+(+x.dv.parcela||0),0);
      await commit({id,raw:"",v:Math.max(0,rendaDoMes(ym)-P),desc:"Salário",cat:"sal",method:"transferencia",cardId:"",
        acct:contaDoSalario(),n:1,date:dia,time:"08:00",k:"e",auto:1});
      for(const x of L) await lancarDesconto(x.dv,ym,x.e,dia);
      criou=true; }
    if(criou) setTimeout(render,0);
  } finally { salarioRodando=false; } }
/* salário lançado à mão ou pelo extrato: desconta o consignado do mês, se ainda não foi descontado */
async function descontarConsignados(ym,txId){
  const m=S.months[ym], sal=m&&m.tx&&m.tx[txId]; if(!sal||sal.del) return;
  const L=consDoMes(ym).filter(x=>x.e.n>0&&!x.e.meses[ym]&&!jaTemChave(ym,idDesconto(x.dv.id,ym)));
  if(!L.length) return;
  const P=L.reduce((s,x)=>s+(+x.dv.parcela||0),0), liq=rendaDoMes(ym);
  /* veio o valor cheio da renda? tira a parcela. Se já veio com o desconto, fica como está. */
  const cheio=liq>0&&Math.abs(sal.v-liq)<Math.abs(sal.v-(liq-P));
  if(cheio){ sal.v=Math.max(0,sal.v-P); sal.u=Date.now(); await saveMonth(ym); }
  for(const x of L) await lancarDesconto(x.dv,ym,x.e,sal.d);
  const msg="Salário de "+fmt(sal.v)+", já sem o consignado de "+fmt(P)+" — a parcela foi para Dívidas e empréstimos";
  setTimeout(()=>toast(msg),2900); }

/* versões anteriores: consignado contado pelo calendário passa a ser descontado no salário */
function migrar2(c){
  if(c.m2) return;
  c.ecats=c.ecats||ECATS.map(x=>({...x}));
  if(!c.ecats.some(x=>x.id==="emprest")){ const i=c.ecats.findIndex(x=>x.id==="outrae"); c.ecats.splice(i<0?c.ecats.length:i,0,{id:"emprest",n:"Empréstimo recebido"}); }
  let mudou=false;
  const hoje=todayISO(), cur=ymOf(hoje), contas=c.accounts||[], cc=(contas.find(a=>a.type==="corrente")||contas[0]||{}).id||"";
  (c.dividas||[]).forEach(dv=>{
    if(dv.tipo!=="consignado"||dv.modo==="salario") return;
    normDivida(dv);
    let antes=0; while(antes<(+dv.total||0)&&ymShift(dv.inicio,antes)<cur) antes++;      /* parcelas de meses anteriores */
    if(dv.fixId){ c.fixed=(c.fixed||[]).filter(f=>f.id!==dv.fixId); dv.fixId=""; }
    Object.assign(dv,{modo:"salario",jaDesc:antes,criado:hoje,conta:dv.conta||cc,valor:+dv.valor||0,
      data:dv.data||(antes?"":diaAnterior(dv.inicio+"-01")),folha:true});
    mudou=true; });
  c.m2=true;
  if(mudou) setTimeout(()=>saveCfg(),0); }

/* =================== importar meses anteriores =================== */
/* No extrato da conta, pagamento de fatura não é gasto (as compras já vêm da fatura do cartão), e aplicação ou
   resgate é dinheiro mudando de lugar. Os dois viram movimento que não conta como gasto nem como renda. */
function classificarLinhaExtrato(d){
  const s=norm(d.desc), C=creditCards();
  if(d.k!=="e"&&/\b(pagamento|pagto|pgto|pag)\b.{0,16}\b(fatura|cartao|cartoes)\b|\bfatura\b.{0,16}\b(cartao|visa|master|mastercard|elo)\b|\bcartao de credito\b/.test(s)){
    const palavras=s.split(" ");
    const c=C.find(x=>norm(x.n+" "+(x.alias||"")).split(" ").some(w=>w.length>2&&palavras.indexOf(w)>=0))||(C.length===1?C[0]:null);
    const ym=ymOf(d.date);
    d.k="p"; d.method="debito"; d.n=1; d.cardId=(c||C[0]||{}).id||d.cardId;
    d.ref=c&&c.due&&c.closing&&c.due>c.closing?ym:ymShift(ym,-1);      /* paga em setembro a fatura de agosto */
    d.raw="Extrato · pagamento de fatura"+(c?"":" — confira o cartão"); return; }
  if(/\b(aplic\w*|resgate\w*|poupanca|investimento\w*|rdb|cdb|lci|lca|tesouro|caixinha\w*|cofrinho\w*|porquinho\w*)\b/.test(s)){
    const A=S.cfg.accounts||[], inv=A.find(a=>a.type==="invest")||A.find(a=>a.type==="poupanca");
    const conta=d.acct, entra=d.k==="e"||/\bresgate/.test(s);
    d.k="t"; d.method="transferencia"; d.n=1;
    d.acct=entra?(inv?inv.id:""):conta; d.acct2=entra?conta:(inv?inv.id:"");
    d.raw="Extrato · "+(entra?"resgate":"aplicação")+", movimento entre contas"; } }

/* a fatura vai para o mês da compra mais recente (fora as parcelas de compras antigas), seja qual for o mês na tela */
function mesDaFatura(r,padrao){

/* =================== recomeçar os lançamentos =================== */
/* Apaga os lançamentos para carregar os extratos do zero, sem mexer na configuração. A exclusão é por lápide
   marcada "zerado" (chega aos outros aparelhos e não impede o app de recriar salário e consignado).
   Antes de apagar, guarda um backup completo — no Drive, em conta Google. */
function ehDinheiro(t){
  const A=S.cfg.accounts||[], card=S.cfg.cards.find(c=>c.id===t.card);
  return (t.k||"g")==="g"&&(t.method==="dinheiro"||(!!card&&card.type==="dinheiro")||((A.find(a=>a.id===t.acct)||{}).type==="carteira")); }
async function backupAntesDeRecomecar(){

  const nome="backup-antes-de-recomecar-"+todayISO()+".json";

    catch(e){ toast("Não consegui guardar o backup no Drive. Nada foi apagado."); return false; } }
  try{ await navigator.clipboard.writeText(JSON.stringify(pacote)); return "copiado para a área de transferência"; }
  catch(e){ toast("Não consegui copiar o backup. Use Backup completo em Ajustes antes. Nada foi apagado."); return false; } }

    (nFix?caixa("rcFix","Apagar também "+(nFix===1?"o gasto fixo":"os "+nFix+" gastos fixos"),true,"Depois, marque como fixo na conferência dos extratos o que se repete."):'')+

    (din?caixa("rcDin","Manter "+(din===1?"o gasto pago":"os "+din+" gastos pagos")+" em dinheiro",false,"Eles não aparecem em nenhum extrato."):'')+
    '<div class="set-f"><label for="rcDesde">Vou carregar os extratos a partir de</label><input id="rcDesde" type="date" value="'+inicio+'">'+
    '<span class="hint">O saldo de cada conta passa a contar desta data. O salário automático fica pausado até você importar o extrato deste mês.</span></div>'+
    A.map(a=>'<div class="set-f"><label for="rcS_'+a.id+'">Saldo de '+esc(a.n)+' em <span class="rcDia">'+diaMesAno(diaAnterior(inicio))+'</span></label>'+
      '<input id="rcS_'+a.id+'" inputmode="decimal" placeholder="em branco: acertar depois"></div>').join("")+
    '<div class="set-f"><span class="hint">É o <b>saldo anterior</b> que aparece no primeiro extrato. Em branco, o app oferece o acerto quando você importar esse extrato.</span></div>'+
    '<div class="set-f"><label for="rcOk">Para confirmar, escreva APAGAR</label><input id="rcOk" autocomplete="off" autocapitalize="characters"></div></div>',
    '<button class="btn ghost" id="rcX">Cancelar</button><button class="btn danger" id="rcGo">Recomeçar</button>');
  $("#rcX").onclick=closeSheet;
  $("#rcDesde").onchange=()=>{ const v=$("#rcDesde").value; if(v) $$(".rcDia").forEach(s=>s.textContent=diaMesAno(diaAnterior(v))); };
  $("#rcGo").onclick=async()=>{
    if($("#rcOk").value.trim().toUpperCase()!=="APAGAR"){ toast("Escreva APAGAR para confirmar."); return; }
    const desde=$("#rcDesde").value; if(!desde){ toast("Informe a data de início."); return; }
    const marcado=id=>!!($("#"+id)&&$("#"+id).checked);
    const manter=marcado("rcDin"), tiraFix=marcado("rcFix"), tiraDiv=marcado("rcDiv"), saldos={};
    A.forEach(a=>{ const v=$("#rcS_"+a.id).value.trim(); if(v) saldos[a.id]=toCents(v); });
    const bt=$("#rcGo"), volta=msg=>{ toast(msg); bt.disabled=false; bt.textContent="Recomeçar"; };
    bt.disabled=true;
    if(google){ bt.textContent="Sincronizando…"; if(!await sincronizarAgora()) return volta("Não consegui sincronizar com o Drive. Toque em Sincronizar no topo e tente de novo. Nada foi apagado."); }
    bt.textContent="Guardando o backup…";
    const bk=await backupAntesDeRecomecar();
    if(bk===false) return volta("Nada foi apagado.");
    const agora=Date.now(); let apagados=0;
    Object.keys(S.months).forEach(ym=>{ const tx=(S.months[ym]||{}).tx||{};
      Object.keys(tx).forEach(id=>{ const t=tx[id]; if(!t||t.del) return;
        if(manter&&ehDinheiro(t)) return;
        tx[id]={del:1,u:agora,zerado:1}; apagados++; }); });
    if(tiraFix) S.cfg.fixed=[];
    if(tiraDiv) S.cfg.dividas=[];
    A.forEach(a=>{ a.openDate=desde; if(saldos[a.id]!=null){ a.opening=saldos[a.id]; a.adjust=[]; } });
    S.cfg.deposits=[]; S.cfg.salPausa=true; S.drafts=[];
    await saveCfg(); for(const ym of Object.keys(S.months)) await saveMonth(ym);
    if(google) sincronizarAgora();
    closeSheet(); render();
    const ficou=allTx().length;
    sheet("Pronto para carregar os extratos",
      '<div class="set"><div class="note"><b>Apagado</b>'+apagados+' lançamentos'+(tiraFix?', os gastos fixos':'')+(tiraDiv?', as dívidas e consignados':'')+'. '+
      (ficou?'Ficaram '+ficou+' gastos pagos em dinheiro, como você pediu.':'Não sobrou nenhum lançamento.')+'</div>'+
      '<div class="set-f"><span class="hint">Backup: '+esc(bk)+'. Nos outros aparelhos, abra o app com internet para a exclusão chegar lá.</span></div></div>',
      '<button class="btn ghost" id="rcFim">Fechar</button><button class="btn" id="rcContas">Ir para Contas</button>');
    $("#rcFim").onclick=closeSheet; $("#rcContas").onclick=()=>{ closeSheet(); setView("contas"); }; }; }

/* restaurar: backups do Drive com um toque, ou colando o texto */
function openRestore(){
  const google=S.user&&S.user.kind==="google";
  sheet("Restaurar de um backup",
    '<div class="set">'+
    (google?'<div class="set-f"><label>Backups no seu Google Drive</label><div id="rDrive" class="hint">Procurando…</div></div>':'')+
    '<div class="set-f"><label for="rT">'+(google?'Ou cole um backup aqui':'Cole o backup aqui')+'</label><textarea id="rT" rows="6"></textarea>'+
    '<span class="hint">Os lançamentos do backup se juntam aos que já estão aqui. Contas, cartões e categorias passam a ser as do backup.</span></div></div>',
    '<button class="btn ghost" id="rX">Cancelar</button><button class="btn danger" id="rOk">Restaurar</button>');
  $("#rX").onclick=closeSheet;
  $("#rOk").onclick=async()=>{ let d=null; try{ d=JSON.parse($("#rT").value); }catch(e){} await restaurarPacote(d); };
  if(google) listarBackupsDrive(); }
async function listarBackupsDrive(){
  if(!$("#rDrive")) return;
  if(!navigator.onLine||!tokenOk()){ $("#rDrive").textContent="Toque em Sincronizar no topo para ver os backups do Drive."; return; }
  try{
    const pasta=await ensureFolder();
    const q=encodeURIComponent("'"+pasta+"' in parents and name contains 'backup' and trashed=false");
    const r=await gfetch(DRIVE+"/files?q="+q+"&orderBy="+encodeURIComponent("modifiedTime desc")+"&pageSize=12&fields="+encodeURIComponent("files(id,name,modifiedTime)"));
    const L=((await r.json()).files)||[], box=$("#rDrive"); if(!box) return;
    box.innerHTML=L.length?L.map(f=>'<div class="linkrow"><div class="m"><div class="t">'+esc(f.name.replace(/\.json$/,""))+'</div>'+
      '<div class="s">'+esc(new Date(f.modifiedTime).toLocaleString("pt-BR"))+'</div></div><button class="mini" data-bk="'+f.id+'">Restaurar</button></div>').join("")
      :"Nenhum backup no Drive ainda.";
    $$("[data-bk]",box).forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent="…";
      try{ await restaurarPacote(await readJson(b.dataset.bk)); }catch(e){ toast("Não consegui abrir esse backup."); b.disabled=false; b.textContent="Restaurar"; } });
  }catch(e){ if($("#rDrive")) $("#rDrive").textContent="Não consegui listar os backups agora."; } }
async function restaurarPacote(d){
  if(!d||!/^(caderneta|caderneta-casa|meu-caixa)$/.test(d.app)||!d.cfg){ toast("Não reconheci esse backup. Confira se copiou inteiro."); return; }
  const agora=Date.now();
  /* backup de antes de recomeçar: os lançamentos voltam por cima das exclusões */
  if(d.antesDeRecomecar) Object.values(d.months||{}).forEach(m=>Object.values((m&&m.tx)||{}).forEach(t=>{ if(t&&!t.del) t.u=agora; }));
  const m=mergeData({cfg:S.cfg,months:S.months},{cfg:Object.assign({},d.cfg,{u:agora}),months:d.months||{}});
  S.cfg=Object.assign(DEFAULTS(),m.cfg); S.months=m.months; migrarCfg();
  await saveCfg(); for(const ym of Object.keys(S.months)) await saveMonth(ym);
  closeSheet(); render(); toast("Backup restaurado"); }

/* =================== OFX e CSV =================== */
/* arquivos exportados pelo banco: passam pela mesma conferência do PDF e da foto */
const ehArquivoTexto=f=>/\.(ofx|csv|txt)$/i.test(f.name||"")||/^text\/|ofx/i.test(f.type||"");
async function lerArquivoTexto(arquivo,tipo){
  const texto=await arquivo.text(), ofx=/<OFX>|<STMTTRN>/i.test(texto);
  let t=tipo&&tipo!=="auto"?tipo:(/<CCSTMTRS>|CREDITCARDMSGSRS/i.test(texto)?"fatura":"extrato");
  if(t!=="fatura"&&t!=="extrato") t="extrato";
  let rows=parseStatement(texto,"both");
  if(t==="fatura"){
    /* na fatura só entram as compras. No OFX elas vêm negativas; no CSV o sinal muda de banco para banco: vale o da maioria */
    const compra=ofx?"g":(rows.filter(x=>x.k==="e").length>rows.filter(x=>x.k==="g").length?"e":"g");
    rows=rows.filter(x=>x.k===compra).map(x=>Object.assign({},x,{k:"g"})); }
  const linhas=rows.map(x=>{
    const l={d:x.d, desc:String(x.desc).replace(/\s+/g," ").trim(), v:x.v, k:x.k, i0:1, n:1};
    if(t==="fatura"){ const pm=l.desc.match(/\b(?:parc(?:ela)?\.?\s*)?(\d{1,2})\s?(?:\/|de)\s?(\d{1,2})\b/i);
      if(pm&&+pm[2]>=2&&+pm[2]<=48&&+pm[1]>=1&&+pm[1]<=+pm[2]){ l.i0=+pm[1]; l.n=+pm[2]; l.desc=l.desc.replace(pm[0]," ").replace(/\s+/g," ").trim(); } }
    return l; });
  return {linhas, tipo:t, texto, saldos:null}; }

/* =================== renda com histórico =================== */
/* A renda líquida muda com aumentos e correções: cada valor vale a partir de um mês. Meses anteriores e salários
   já lançados ficam com o valor antigo. cfg.rendas = [{desde:"AAAA-MM", v}]; "2000-01" é o valor inicial. */
function rendaDoMes(ym){
  let v=null, d="";
  (S.cfg.rendas||[]).forEach(r=>{ if(r.desde<=ym&&r.desde>=d){ d=r.desde; v=+r.v||0; } });
  return v==null?(+S.cfg.income||0):v; }
function definirRenda(desde,v,antes){
  let L=(S.cfg.rendas||[]).slice();
  if(!L.length&&antes>0) L.push({desde:"2000-01",v:antes});
  L=L.filter(r=>r.desde!==desde).concat([{desde,v}]).sort((a,b)=>a.desde.localeCompare(b.desde));
  S.cfg.rendas=L; S.cfg.income=rendaDoMes(ymOf(todayISO()));
  saveCfg(); }
function perguntarDataRenda(v,antes){
  const cur=ymOf(todayISO()), jaEntrou=txOf(cur).some(t=>t.k==="e"&&t.cat==="sal"), padrao=jaEntrou?ymShift(cur,1):cur;
  sheet("Novo valor da renda",
    '<div class="set"><div class="note"><b>'+fmt(antes)+' → '+fmt(v)+'</b>Os meses anteriores continuam com o valor antigo, e salário já lançado não muda.</div>'+
    '<div class="set-f"><label for="rdDesde">Vale a partir de</label><input id="rdDesde" type="month" value="'+padrao+'">'+
    (jaEntrou?'<span class="hint">O salário de '+esc(ymLabel(cur))+' já entrou; por isso a sugestão é o mês que vem.</span>':'')+'</div></div>',
    '<button class="btn ghost" id="rdX">Cancelar</button><button class="btn" id="rdOk">Salvar</button>');
  $("#rdX").onclick=()=>{ S.cfg.income=antes; closeSheet(); render(); };
  $("#rdOk").onclick=()=>{ const m=$("#rdDesde").value; if(!m){ toast("Escolha o mês."); return; }
    definirRenda(m,v,antes); closeSheet(); render(); toast("Renda de "+fmt(v)+" a partir de "+ymLabel(m)+"."); }; }
function historicoRendaHTML(){
  const L=(S.cfg.rendas||[]).slice().sort((a,b)=>a.desde.localeCompare(b.desde));
  if(L.length<2) return "";
  return '<span class="hint">'+L.map(r=>'<span style="white-space:nowrap">'+fmt(r.v)+' '+(r.desde==="2000-01"?"no início":"a partir de "+esc(ymLabel(r.desde)))+
    (r.desde!=="2000-01"?' <button class="mini" data-rdel="'+r.desde+'" style="padding:1px 6px">tirar</button>':'')+'</span>').join(" · ")+'</span>'; }

/* =================== partida =================== */
$("#mPrev").onclick=()=>{ S.ym=ymShift(S.ym,-1); render(); };
$("#mNext").onclick=()=>{ S.ym=ymShift(S.ym,1); render(); };
loadLocal();
render();
boot();
