const NOMES_GRUPO={nec:"Necessidades",des:"Desejos",fut:"Futuro"};
const GRUPO_PADRAO={merc:"nec",comb:"nec",carro:"nec",transp:"nec",medic:"nec",saude:"nec",casa:"nec",educ:"nec",
  assin:"nec",pet:"nec",imposto:"nec",divida:"fut"};
const grupoDe=id=>{ const c=(S.cfg.cats||[]).find(x=>x.id===id); return (c&&c.grupo)||GRUPO_PADRAO[id]||"des"; };
const opcoesGrupo=sel=>Object.keys(NOMES_GRUPO).map(g=>'<option value="'+g+'"'+(g===sel?" selected":"")+'>'+NOMES_GRUPO[g]+'</option>').join("");

/* acrescenta o que as versões novas trazem, sem desfazer escolhas antigas */
/* conta apagada sem querer: cartões e lançamentos continuam apontando para ela, e o app passaria a somar tudo na
   primeira conta da lista. Aqui ela volta, vazia, e o dono é avisado para conferir o saldo. */
function repararContas(){
  const c=S.cfg; if(!c) return "";
  const A=c.accounts=c.accounts||[], tem=id=>A.some(a=>a.id===id);
  const faltando={};
  (c.cards||[]).forEach(x=>{ if(x.acct&&!tem(x.acct)) faltando[x.acct]=(faltando[x.acct]||0)+1; });
  Object.keys(S.months||{}).forEach(ym=>{ const tx=(S.months[ym]||{}).tx||{};
    Object.keys(tx).forEach(id=>{ const t=tx[id]; if(!t||t.del) return;
      [t.acct,t.acct2].forEach(a=>{ if(a&&!tem(a)) faltando[a]=(faltando[a]||0)+1; }); }); });
  const ids=Object.keys(faltando); if(!ids.length) return "";
  const nomes=[];
  ids.forEach(id=>{ const corrente=id==="cc"||!A.some(a=>a.type==="corrente");
    const nova={id, n:corrente?"Conta corrente":"Conta recuperada", type:corrente?"corrente":"poupanca", opening:0, openDate:"", adjust:[]};
    if(corrente) A.unshift(nova); else A.push(nova); nomes.push(nova.n); });
  return nomes.join(" e "); }

function migrarCfg(){
  const c=S.cfg; if(!c) return; migrar2(c);
  const volta=repararContas();
  /* extrato e fatura importados antes de o app registrar isso (v40): reconhece pelos próprios lançamentos */
  /* base ainda vazia (aparelho novo ou dados limpos): não marca nada e, principalmente, não carimba
     `cfg.u`, senão a configuração em branco ficaria "mais nova" que a do Drive e venceria na união. */
  if(!c.m4&&Object.keys(S.months||{}).length){ c.m4=true;
    const ex=c.extratosLidos=c.extratosLidos||{}, fa=c.faturasLidas=c.faturasLidas||{};
    Object.keys(S.months||{}).forEach(ym=>{
      const contas={}, cards={};
      txOf(ym).forEach(t=>{
        if(/^Extrato/.test(t.raw||"")){ const a=t.acct||t.acct2||acctOf(t.card); if(a) contas[a]=(contas[a]||0)+1; }
        if(/^Fatura de/.test(t.raw||"")&&t.card) cards[t.card+"|"+(t.fat||t.ym)]=(cards[t.card+"|"+(t.fat||t.ym)]||0)+1; });
      Object.keys(contas).forEach(a=>{ if(contas[a]>=3&&!ex[a+"|"+ym]) ex[a+"|"+ym]="auto"; });
      Object.keys(cards).forEach(k=>{ if(!fa[k]) fa[k]="auto"; }); });
    setTimeout(()=>saveCfg(),0); }
  if(!c.m3){ c.m3=true;
    const car=(c.accounts||[]).find(a=>a.type==="carteira"), meses=new Set(); let n=0;
    Object.keys(S.months||{}).forEach(ym=>{ const tx=(S.months[ym]||{}).tx||{};
      Object.keys(tx).forEach(id=>{ const t=tx[id];
        if(!t||t.del||(t.k||"g")!=="g"||!/^Extrato/.test(t.raw||"")||!/^saque\b/.test(norm(t.desc||""))) return;
        Object.assign(t,{k:"t",method:"transferencia",acct:t.acct||acctOf(t.card),acct2:car?car.id:"",raw:"Extrato · saque, vai para a carteira",u:Date.now()});
        meses.add(ym); n++; }); });
    if(n) setTimeout(()=>{ saveCfg(); meses.forEach(ym=>saveMonth(ym)); render();
      toast(n+(n>1?" saques do extrato viraram":" saque do extrato virou")+" transferência para a Carteira."); },500); }
  if(volta){ setTimeout(()=>{ saveCfg(); render();
    sheet("A "+volta+" voltou",
      '<div class="set"><div class="note"><b>Ela tinha sido excluída</b>Cartões e lançamentos continuavam ligados a ela, e o saldo estava sendo somado na primeira conta da lista. O app trouxe a conta de volta, vazia.</div>'+
      '<div class="set-f"><span class="hint">Confira em <b>Ajustes → Saldo de cada conta</b>: informe o <b>Saldo inicial</b> (a data do primeiro extrato e o saldo anterior dele) ou <b>Corrigir saldo</b> com o valor que o banco mostra hoje. Veja também se algum lançamento foi parar na conta errada.</span></div></div>',
      '<button class="btn ghost" id="rcvX">Fechar</button><button class="btn" id="rcvIr">Ir para os saldos</button>');
    $("#rcvX").onclick=closeSheet;
    $("#rcvIr").onclick=()=>{ closeSheet(); setView("ajustes"); }; },400); }
  if(!c.rendas) c.rendas=+c.income>0?[{desde:"2000-01",v:+c.income}]:[];     /* renda com histórico */
  if(c.m1) return;
  c.cats=c.cats||[]; c.cards=c.cards||[];
  if(!c.cats.some(x=>x.id==="divida")){ const i=c.cats.findIndex(x=>x.id==="outros");
    c.cats.splice(i<0?c.cats.length:i,0,{id:"divida",n:"Dívidas e empréstimos",limit:0,grupo:"fut"}); }
  if(!c.cards.some(x=>x.type==="boleto"))
    c.cards.push({id:"boleto",n:"Boleto",type:"boleto",closing:0,due:0,limit:0,acct:((c.accounts||[])[0]||{}).id||"cc",alias:"boleto"});
  if(!c.metodo) c.metodo={nec:50,des:30,fut:20};
  c.m1=true; }

function resumo5030(ym){
  const st=monthStats(ym), m=S.cfg.metodo||{nec:50,des:30,fut:20};
  const base=st.income>0?st.income:rendaPrevista(ym), baseDe=st.income>0?"renda lançada no mês":"renda prevista";
  const g={nec:0,des:0,fut:0};
  Object.keys(st.byCat).forEach(id=>{ g[grupoDe(id)]+=st.byCat[id]; });
  const tipoConta=id=>((S.cfg.accounts||[]).find(a=>a.id===id)||{}).type||"";
  const transf=st.all.filter(t=>t.k==="t"&&/poupanca|invest/.test(tipoConta(t.acct2))).reduce((s,t)=>s+t.v,0);
  const guardou=(S.cfg.deposits||[]).filter(x=>ymOf(x.d)===ym).reduce((s,x)=>s+x.v,0);
  g.fut+=Math.max(transf,guardou);    /* "guardei" e a transferência para a poupança costumam ser o mesmo dinheiro */
  return {g,m,base,baseDe}; }

/* setor de anel: ângulos em graus, 0 = topo, sentido horário */
function arco(cx,cy,ri,ro,a0,a1){
  a1=Math.min(a1,a0+359.9);
  const p=(r,a)=>{ const t=(a-90)*Math.PI/180; return (cx+r*Math.cos(t)).toFixed(2)+" "+(cy+r*Math.sin(t)).toFixed(2); };
  const L=(a1-a0)>180?1:0;
  return "M"+p(ro,a0)+" A"+ro+" "+ro+" 0 "+L+" 1 "+p(ro,a1)+" L"+p(ri,a1)+" A"+ri+" "+ri+" 0 "+L+" 0 "+p(ri,a0)+" Z"; }
/* rosca do 50-30-20: anel fino de fora = meta; anel grosso de dentro = para onde a renda foi.
   O entalhe fixo no topo impede que o azul e o roxo se encostem (ficam iguais sob deuteranopia). */
function chartDonut5030(g,m,base){
  const W=240, C=120, NOTCH=5, GAP=1.6, span=360-NOTCH;
  const cor={nec:"var(--c1)",des:"var(--c2)",fut:"var(--c3)"}, ks=["nec","des","fut"];
  const usado=g.nec+g.des+g.fut, total=Math.max(base,usado,1);
  let s='<svg viewBox="0 0 '+W+' '+W+'" role="img" aria-label="Método 50-30-20: meta e realizado" style="max-width:260px">';
  let a=NOTCH/2;
  ks.forEach(k=>{ const d=span*m[k]/100;
    if(d>GAP) s+='<path d="'+arco(C,C,104,112,a+GAP/2,a+d-GAP/2)+'" style="fill:'+cor[k]+';opacity:.38" data-tip="Meta de '+NOMES_GRUPO[k]+': '+m[k]+'%"/>';
    a+=d; });
  a=NOTCH/2;
  ks.forEach(k=>{ const d=span*g[k]/total;
    if(d>GAP){ const alvo=Math.round(base*m[k]/100), piso=k==="fut";
      const f=[NOMES_GRUPO[k]+" somam "+fmt(g[k])+" neste mês"+(base?", "+Math.round(g[k]/base*100)+"% da renda de "+fmtN(base):"")+"."];
      f.push("A meta é "+m[k]+"% ("+fmtN(alvo)+"), que "+(piso?"é um piso: quanto mais, melhor.":"é um teto: o ideal é ficar abaixo."));
      f.push(piso
        ? (g[k]>=alvo?"Você está "+fmtN(g[k]-alvo)+" acima do piso — está guardando mais do que a meta.":"Faltam "+fmtN(alvo-g[k])+" para cumprir o piso deste mês.")
        : (g[k]>alvo?"Passou do teto em "+fmtN(g[k]-alvo)+".":"Está "+fmtN(alvo-g[k])+" dentro do teto."));
      f.push("Entram aqui as categorias marcadas como "+NOMES_GRUPO[k]+" em Ajustes — dá para mudar o grupo de qualquer categoria por lá.");
      s+='<path d="'+arco(C,C,60,94,a+GAP/2,a+d-GAP/2)+'" style="fill:'+cor[k]+';cursor:pointer" data-tip="'+NOMES_GRUPO[k]+' — '+fmt(g[k])+'|'+(base?Math.round(g[k]/base*100):0)+'% da renda · meta '+m[k]+'%" data-leitura="'+esc(f.join(" "))+'" data-lt="'+NOMES_GRUPO[k]+' em '+esc(ymLabel(S.ym))+'"/>'; }
    a+=d; });
  const livre=Math.max(0,base-usado);
  if(livre>0){ const d=span*livre/total;
    if(d>GAP) s+='<path d="'+arco(C,C,60,94,a+GAP/2,a+d-GAP/2)+'" style="fill:var(--surface-3);cursor:pointer" data-tip="Sem destino ainda — '+fmt(livre)+'" data-lt="O que ainda não tem destino" data-leitura="'+
      esc("Dos "+fmt(base)+" de renda do mês, "+fmt(livre)+" ainda não foram gastos nem guardados. Esse é o pedaço que dá para mandar para o Futuro — guardar, investir ou adiantar dívida — antes que vire gasto sem querer.")+'"/>'; }
  const pct=base?Math.round(usado/base*100):0, over=usado>base;
  s+='<text x="'+C+'" y="'+(C+2)+'" text-anchor="middle" style="fill:'+(over?'var(--bad)':'var(--ink)')+';font:600 30px var(--f)">'+pct+'%</text>';
  s+='<text x="'+C+'" y="'+(C+21)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+(over?'acima da':'da renda')+'</text>';
  s+='<text x="'+C+'" y="'+(C+34)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+(over?'renda':'com destino')+'</text>';
  return s+'</svg>'; }

function render5030(){
  const box=$("#m5030"); if(!box) return;
  const {g,m,base,baseDe}=resumo5030(S.ym), st=monthStats(S.ym);
  const cor={nec:"var(--c1)",des:"var(--c2)",fut:"var(--c3)"};
  const linha=k=>{
    const alvo=Math.round(base*m[k]/100), real=g[k], piso=k==="fut";
    const fill=alvo?Math.min(100,real/alvo*100):0;
    const estado=piso?(real>=alvo?"good":"warn"):(real>alvo?"bad":real>alvo*0.9?"warn":"");
    const msg=piso?(real>=alvo?"meta atingida":"faltam "+fmt(alvo-real)):(real>alvo?"passou "+fmt(real-alvo):"sobram "+fmt(alvo-real));
    return '<div style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+

      '<span style="font-family:var(--f-m);font-variant-numeric:tabular-nums">'+fmtN(real)+' <span style="color:var(--ink-3)">de '+fmtN(alvo)+'</span></span></div>'+
      '<div class="meter" style="margin-top:6px"><i class="'+(estado==="good"?"":estado)+'" style="width:'+fill+'%'+(estado==="good"?';background:var(--good)':'')+'"></i></div>'+
      '<div class="meter-s"><span>'+(base?Math.round(real/base*100):0)+'% da renda</span><span>'+msg+'</span></div></div>'; };
  const cats={nec:[],des:[],fut:[]};
  Object.keys(st.byCat).forEach(id=>cats[grupoDe(id)].push({id,v:st.byCat[id]}));
  const guardado=g.fut-cats.fut.reduce((s,x)=>s+x.v,0);
  const detalhe=k=>{
    const L=cats[k].sort((a,b)=>b.v-a.v), tot=g[k];

    const vazio=!L.length&&!(k==="fut"&&guardado>0);
    return '<details class="grp"><summary><span class="sw" style="background:'+cor[k]+'"></span>'+NOMES_GRUPO[k]+'<span class="v">'+fmtN(tot)+'</span></summary><div class="in">'+
      (vazio?'<div class="empty" style="padding:12px">Nada neste grupo em '+esc(ymLabel(S.ym))+'.</div>'
        : L.map(x=>linhaCat(catName(x.id),x.v)).join("")+(k==="fut"&&guardado>0?linhaCat("Guardado ou transferido para poupança",guardado):"")+
          (top.length?'<div class="sec-t" style="margin:14px 0 4px">Maiores lançamentos</div>'+top.map(rowHTML).join(""):""))+
      '</div></details>'; };
  box.innerHTML='<div class="sec-h"><h2 class="sec-t">Método 50-30-20 · '+esc(ymLabel(S.ym))+'</h2><button class="sec-a" id="m5030Aj">Ajustar</button></div>'+
    (base
      ? '<div class="grid g2" style="align-items:stretch"><div class="card pad chart" style="display:grid;place-items:center;gap:6px">'+chartDonut5030(g,m,base)+
        '<div class="legend" style="justify-content:center;margin-top:4px">'+["nec","des","fut"].map(k=>'<span class="lg"><i style="background:'+cor[k]+'"></i>'+NOMES_GRUPO[k]+'</span>').join("")+
        '<span class="lg"><i style="background:var(--surface-3);border:1px solid var(--line-2)"></i>Sem destino</span></div>'+
        '<div class="tile-d" style="justify-content:center;text-align:center">Anel de fora: a meta. Anel de dentro: para onde a renda foi.</div></div>'+
        '<div class="card pad"><div class="tile-d" style="margin:0 0 14px">Sobre '+fmt(base)+' ('+baseDe+'). Necessidades e Desejos são tetos; Futuro é piso.</div>'+
        linha("nec")+linha("des")+linha("fut")+'</div></div>'+
        '<div class="sec-h" style="margin:18px 0 10px"><h2 class="sec-t">O que tem em cada grupo</h2></div>'+
        detalhe("nec")+detalhe("des")+detalhe("fut")+
        tableView(["Grupo","Realizado","% da renda","Meta"],["nec","des","fut"].map(k=>[NOMES_GRUPO[k],fmtN(g[k]),(base?Math.round(g[k]/base*100):0)+"%",m[k]+"%"]))
      : '<div class="card pad"><div class="empty"><b>Falta a renda</b>Informe sua renda líquida em Ajustes, ou lance a entrada do salário, para dividir em 50-30-20.</div></div>');
  $("#m5030Aj").onclick=openMetodo; bindRows(box); }

function montarLeitorDoc(){
  $$("[data-leitor]").forEach(box=>{
    const extrato=box.dataset.leitor==="extrato", arq=$(".docArq",box), cam=$(".docCam",box);
    const opcoes=()=>({box, tipo:extrato?"extrato":$(".docTipo",box).value,
      conta:extrato?$(".docConta",box).value:"",
      card:extrato?"":(($(".docCard",box)||{}).value||""),
      pago:extrato?"":(($(".docPago",box)||{}).value||""),
      quando:extrato?"":(($(".docQuando",box)||{}).value||"venc")});
    $(".docArqBtn",box).onclick=()=>arq.click();
    $(".docCamBtn",box).onclick=()=>cam.click();
    arq.onchange=cam.onchange=async e=>{ const fs=[...(e.target.files||[])]; e.target.value=""; const mais=!!S.docMais; S.docMais=false;
      for(let i=0;i<fs.length;i++) await lerDoc(fs[i],Object.assign(opcoes(),{anexar:mais||i>0})); };
    const lb=$(".docLinhaBtn",box); if(lb) lb.onclick=()=>openLinhaBoleto("");
    const tp=$(".docTipo",box);
    if(tp){ const mostra=()=>$$("[data-doc]",box).forEach(f=>{ f.hidden=f.dataset.doc.split(" ").indexOf(tp.value)<0; });
      tp.onchange=mostra; mostra(); }
    const pg=$(".docPago",box); if(pg) pg.onchange=e=>{ S.docPago=e.target.value; }; }); }

async function lerDoc(arquivo,op){
  op=op||{}; const tipo=op.tipo||"extrato", box=op.box||document, mes=S.ym;
  const st=$(".docStatus",box)||{};
  if(!window.Leitor){ toast("O leitor não carregou. Recarregue o app."); return; }
  const pdf=/pdf/i.test(arquivo.type||"")||/\.pdf$/i.test(arquivo.name||"");
  const btns=$$(".docArqBtn,.docCamBtn",box); btns.forEach(b=>b.disabled=true); st.textContent="abrindo…";
  let r=null;
  try{
    r=ehArquivoTexto(arquivo)?await lerArquivoTexto(arquivo,tipo):await Leitor.ler(arquivo,{tipo,mes,senha:op.senha,onProgress:(p,etapa)=>{ st.textContent=(etapa||"lendo")+(p?" "+p+"%":""); }});
    st.textContent="";
    /* escolheu o leitor errado: pergunta antes de ler a fatura como extrato, ou o contrário */
    if(!op.mesmoAssim&&!op.anexar&&!ehArquivoTexto(arquivo)&&(tipo==="fatura"||tipo==="extrato")){
      const outro=Leitor.adivinharTipo(r.texto||"");
      if((tipo==="fatura"&&outro==="extrato")||(tipo==="extrato"&&outro==="fatura")){ docNoLeitorErrado(arquivo,op,tipo,outro); return; } }
    if(!r.linhas.length){
      if(r.tipo==="boleto"){ openLinhaBoleto(r.erro); return; }
      if(r.tipo==="cupom"&&!pdf){ toast(r.erro||"Não achei o valor nessa foto. Tente com mais luz e o papel reto."); return; }
      if(r.tipo==="fatura"&&(r.anulados||r.estornos)){ toast("Nada para lançar: nesta fatura só há "+(r.anulados?"cobrança e desconto que se anulam":"créditos e estornos")+"."); return; }
      diagnosticoDoc(arquivo,r,null,tipo); return; }
    mostrarLidos(r,{mes,card:op.card,conta:op.conta,pago:op.pago,quando:op.quando,box},op.anexar);
  }catch(e){
    st.textContent="";
    if(e&&e.senha){ pedirSenhaPdf(arquivo,!!e.errada,op); return; }
    console.warn(e); diagnosticoDoc(arquivo,r,e,tipo); }
  finally{ btns.forEach(b=>b.disabled=false); } }

/* o documento parece ser do outro leitor: pergunta, e lê no lugar certo com os campos daquele cartão */
function docNoLeitorErrado(arquivo,op,tipo,outro){
  const box=$('[data-leitor="'+(outro==="extrato"?"extrato":"gastos")+'"]');
  sheet(outro==="extrato"?"Isso parece extrato da conta":"Isso parece fatura do cartão",
    '<div class="set"><div class="note"><b>'+(outro==="extrato"?"Ler como extrato da conta":"Ler como fatura do cartão")+'</b>'+
    (outro==="extrato"
      ? "No extrato, o app confere o saldo da conta, separa o pagamento da fatura (que não é gasto) e a aplicação automática do saldo."
      : "Na fatura, as compras vão para o cartão, no mês em que foram feitas, sem tirar dinheiro da conta.")+'</div></div>',
    '<button class="btn ghost" id="abX">Ler como '+(tipo==="fatura"?"fatura":"extrato")+' mesmo</button>'+
    '<button class="btn" id="abIr">Ler como '+(outro==="extrato"?"extrato":"fatura")+'</button>');
  $("#abX").onclick=()=>{ closeSheet(); lerDoc(arquivo,Object.assign({},op,{mesmoAssim:true})); };

    if(outro==="fatura"&&box){ const t=$(".docTipo",box); if(t){ t.value="fatura"; t.onchange(); } }

      conta:outro==="extrato"?(($(".docConta",box)||{}).value||""):"",
      card:outro==="fatura"?(($(".docCard",box)||{}).value||""):"",
      pago:""}:Object.assign({},op,{tipo:outro});
    lerDoc(arquivo,Object.assign(novo,{mesmoAssim:true,senha:op.senha})); }; }

/* PDF protegido: pede a senha aqui mesmo. Ela só abre o arquivo no aparelho — não é guardada nem enviada. */

    '<button class="btn ghost" id="pdfX">Cancelar</button><button class="btn" id="pdfOk">Abrir</button>');

/* amostra do formato, sem os dados: números viram 9 e o que não é termo bancário vira x */
const TERMOS_BANCO=/^(saldo|anterior|final|atual|dia|total|pix|ted|doc|tev|compra|compras|pagamento|pagto|fatura|vencimento|parcela|parc|credito|debito|data|historico|valor|lancamento|lancamentos|descricao|documento|extrato|conta|corrente|periodo|juros|iof|tarifa|estorno|recebido|recebida|enviado|enviada|transferencia|deposito|saque|salario|agencia|limite|minimo|entrada|entradas|saida|saidas|nacional|internacional|de|a|o|e|em|do|da|no|na|para|d|c|r|us|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez|seg|ter|qua|qui|sex|sab|dom)$/;
function amostraSemDados(texto){
  return String(texto||"").split(/\r?\n/).filter(l=>l.trim()).slice(0,45)
    .map(l=>l.replace(/\d/g,"9").replace(/[A-Za-zÀ-ÿ]+/g,w=>TERMOS_BANCO.test(deacc(w.toLowerCase()))?w:"x".repeat(Math.min(w.length,6))))
    .join("\n"); }
function diagnosticoDoc(arquivo,r,e,tipo){
  const pdf=/pdf/i.test(arquivo.type||"")||/\.pdf$/i.test(arquivo.name||"");
  const texto=(r&&r.texto)||"", nLinhas=texto.split(/\r?\n/).filter(l=>l.trim()).length;
  const msgErro=e?((e.name&&e.name!=="Error"?e.name+": ":"")+(e.message||String(e))):"";
  let titulo, explica;
  if(e&&/baixar o leitor|fetch|network|load failed/i.test(msgErro)){ titulo="Não consegui baixar o leitor de PDF"; explica="Confira a internet e tente de novo. Depois da primeira vez, ele fica guardado no aparelho."; }
  else if(e){ titulo="Não consegui abrir esse arquivo"; explica="O leitor parou com um erro. A amostra abaixo diz qual foi."; }
  else if(nLinhas<3){ titulo="Não achei texto nesse "+(pdf?"PDF":"arquivo");
    explica=pdf?"Ele parece ser uma imagem (documento escaneado) e o reconhecimento não conseguiu ler. Tente o PDF baixado direto do app do banco.":"Tente de novo com mais luz, com o papel reto ocupando a tela."; }
  else { titulo="Li o texto, mas não reconheci os lançamentos";
    explica="O jeito que esse banco organiza "+(r.tipo==="fatura"?"a fatura":"o extrato")+" é diferente do que o app conhece. Confira se o tipo escolhido está certo; se estiver, mande a amostra."; }
  const tec=["arquivo: "+(pdf?"PDF":(arquivo.type||"?"))+", "+Math.round((arquivo.size||0)/1024)+" KB","tipo: "+((r&&r.tipo)||tipo||"?"),
    "linhas de texto: "+nLinhas, msgErro?"erro: "+msgErro:"", "navegador: "+navigator.userAgent.replace(/\d+[._\d]*/g,"").replace(/\s+/g," ").slice(0,90)]
    .filter(Boolean).join("\n");
  const amostra=tec+"\n---\n"+amostraSemDados(texto);
  sheet(titulo,
    '<div class="set"><div class="note"><b>O que aconteceu</b>'+esc(explica)+'</div>'+
    '<div class="set-f"><label for="dgA">Amostra sem seus dados</label><textarea id="dgA" rows="9" readonly>'+esc(amostra)+'</textarea>'+
    '<span class="hint">Números viram 9 e nomes viram x: sobra só o formato do documento. Copie e mande na conversa com o Claude para ele ajustar o leitor ao seu banco.</span></div></div>',
    '<button class="btn ghost" id="dgX">Fechar</button><button class="btn" id="dgC">Copiar amostra</button>');
  $("#dgX").onclick=closeSheet;
  $("#dgC").onclick=async()=>{ try{ await navigator.clipboard.writeText(amostra); }catch(_){ const t=$("#dgA"); t.select(); document.execCommand("copy"); } toast("Amostra copiada"); }; }

  op=op||{};

  if(r.tipo==="extrato"&&r.saldos&&op.conta){ const s=saldoDoDoc(r,S.drafts);
    if(s&&!(S.docSaldo&&S.docSaldo.saldo&&S.docSaldo.saldo.d>s.d)) S.docSaldo={conta:op.conta,saldo:s}; }
  const rep=S.drafts.filter(d=>d.incluir===false).length, n=S.drafts.length;
  const de={fatura:"da fatura",extrato:"do extrato",cupom:"do canhoto",boleto:"do boleto"}[r.tipo]||"do documento";

    (r.aplicacoes?" · "+r.aplicacoes+(r.aplicacoes>1?" movimentos":" movimento")+" da aplicação automática do saldo, entre a conta e a conta da aplicação":"")+
    (S.contaCriada?" · criei a conta "+S.contaCriada+" para o dinheiro aplicado":"")+
    (S.fechamentoAprendido?" · anotei que o "+S.fechamentoAprendido:"")+
    (r.anteriorFalta?" · faltaram "+fmt(r.anteriorFalta)+" da fatura anterior"+(r.anteriorNaApp?", que já aparecem nela como a pagar":", lançados nesta fatura"):"")+
    (r.cartaoDoc?" · cartão no documento: "+r.cartaoDoc:"")+

  if(r.tipo==="fatura"||r.tipo==="extrato"){ const b=document.createElement("button"); b.className="mini"; b.style.marginLeft="8px";

    if(cam){ b.textContent="Fotografar mais uma página"; b.onclick=()=>{ S.docMais=true; cam.click(); }; st.appendChild(b); } }
  S.contaCriada=""; S.fechamentoAprendido="";
  renderDrafts(); $("#draftSec").scrollIntoView({behavior:"smooth",block:"start"}); }

function rascunhosDoc(r,op){
  op=op||{}; const hoje=todayISO();
  const debitoDaConta=conta=>S.cfg.cards.find(c=>c.type==="debito"&&(!conta||c.acct===conta))||S.cfg.cards.find(c=>c.type==="debito");
  const porBandeira=b=>{ if(!b) return null; const w=b.indexOf("master")===0?"master":b;
    return S.cfg.cards.find(c=>c.type==="credito"&&norm(c.alias+" "+c.n).split(" ").indexOf(w)>=0); };
  const boletoCard=S.cfg.cards.find(c=>c.type==="boleto"), pagoCom=op.pago?S.cfg.cards.find(c=>c.id===op.pago):null;
  const mesFat=r.tipo==="fatura"?mesDaFatura(r,op.mes||S.ym):"";
  /* a fatura diz de qual cartão é ("OUROCARD MASTERCARD final 1234"): vale o documento, se ele bater com um cartão cadastrado */
  let cardFat=op.card;
  if(r.tipo==="fatura"&&r.cartao){
    const w=norm(r.cartao).split(" "), nomes=c=>norm(c.n+" "+(c.alias||"")).split(" ");
    const fim=(w[w.length-1]||"").length===4?w[w.length-1]:"", band=w.find(x=>/^(visa|master|mastercard|elo|amex|hipercard|diners)$/.test(x));
    const bate=c=>{ const ns=nomes(c); return (fim&&ns.indexOf(fim)>=0)||(band&&ns.some(x=>x===band||(band.indexOf("master")===0&&x.indexOf("master")===0))); };
    const escolhido=creditCards().find(c=>c.id===op.card), doc=creditCards().find(c=>fim&&nomes(c).indexOf(fim)>=0)||creditCards().find(bate);
    if(doc&&!(escolhido&&bate(escolhido))) cardFat=doc.id;
    r.cartaoDoc=r.cartao.toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase())+(doc?" ("+doc.n+")":" — confira o cartão"); }
  /* a fatura ensina as datas do cartão. O banco muda o dia a cada mês, então vale a fatura mais recente já lida,
     e a data exata do próximo fechamento ("Fechamento da próxima fatura") entra no cálculo do melhor cartão. */
  if(r.tipo==="fatura"&&cardFat&&(r.fechada||r.proxFechamento)){
    const c=creditCards().find(x=>x.id===cardFat);
    if(c&&r.fechada&&(!c.fatLida||r.fechada>=c.fatLida)){
      let mudou=false; c.fatLida=r.fechada;
      const d=+r.fechada.slice(8,10)||0; if(d&&d!==c.closing){ c.closing=d; mudou=true; }
      const v=r.vencimento?+r.vencimento.slice(8,10):0; if(v&&v!==c.due){ c.due=v; mudou=true; }
      if(r.proxFechamento&&r.proxFechamento>todayISO()){ c.proxFecha=r.proxFechamento; mudou=true; }
      if(r.melhorCompra&&r.melhorCompra>todayISO()){ c.melhorDia=r.melhorCompra; mudou=true; }
      if(mudou){ S.fechamentoAprendido=c.n+" fecha dia "+c.closing+(c.due?" e vence dia "+c.due:""); saveCfg(); } } }
  /* o que faltou pagar da fatura anterior volta cobrado nesta. Só entra quando a fatura anterior não está no app —
     se estiver, ela mesma já mostra o que falta pagar, e lançar de novo contaria o gasto duas vezes. */
  const extras=[];
  if(r.tipo==="fatura"){
    const falta=Math.round((r.saldoAnterior||0)-(r.pagoAnterior||0));
    r.anteriorFalta=falta>1?falta:0; r.anteriorNaApp=false;
    if(falta>1){
      if(cardInvoice(cardFat,ymShift(mesFat,-1)).total) r.anteriorNaApp=true;
      else extras.push({id:uid(), raw:"Fatura de "+ymLabel(mesFat)+" · o que faltou pagar da fatura anterior", v:falta,
        desc:"Saldo da fatura anterior", k:"g", n:1, i0:1, date:r.fechada||(mesFat+"-01"), time:"", msg:"", origem:"fatura",
        incluir:true, cardId:cardFat, method:"credito", ym:mesFat, cat:"outros"}); } }
  return r.linhas.map(l=>{
    const d={id:uid(), raw:"", v:l.v, desc:l.desc, k:l.k||"g", n:l.n||1, i0:l.i0||1, date:l.d||hoje, time:"", msg:"", origem:r.tipo, incluir:true};
    if(r.tipo==="fatura"){ d.cardId=cardFat; d.method="credito"; d.ym=mesFat; d.porParcela=d.n>1;
      d.raw="Fatura de "+ymLabel(d.ym)+(d.i0>1?" · parcela "+d.i0+" de "+d.n+" — as seguintes já ficam reservadas":""); }
    else if(r.tipo==="extrato"){ const c=debitoDaConta(op.conta); d.cardId=c?c.id:(S.cfg.cards[0]||{}).id;
      d.method=d.k==="e"?"pix":"debito"; d.acct=op.conta||acctOf(d.cardId); d.raw="Extrato";
      if(l.aplic) d.aplic=l.aplic;
      d.contaDoc=op.conta||d.acct;
      classificarLinhaExtrato(d); }
    else if(r.tipo==="boleto"){ const c=pagoCom||boletoCard||debitoDaConta(); d.cardId=c?c.id:(S.cfg.cards[0]||{}).id; d.method=pagoCom?pagoCom.type:"boleto";
      /* boleto lido para pagar depois: já entra agendado no vencimento */
      const agendar=op.quando!=="hoje"&&l.vencimento&&l.vencimento>hoje;
      d.date=agendar?l.vencimento:hoje;
      d.raw=l.vencimento?(agendar?"Agendado para o vencimento, "+diaMesAno(l.vencimento):"Vence em "+diaMesAno(l.vencimento)):"Boleto"; }
    else { const c=pagoCom||porBandeira(l.bandeira)||S.cfg.cards.find(x=>x.type===(l.metodo||"credito"))||S.cfg.cards[0];
      d.cardId=c.id; d.method=c.type; d.raw="Canhoto"; }
    d.cat=(l.cat&&S.cfg.cats.some(c=>c.id===l.cat))?l.cat:guessCat(d.desc,S.cfg,d.k);
    /* parcela que o app já reservou quando importou a fatura em que a compra começou. O banco arredonda os centavos
       de cada parcela e às vezes cobra numa fatura diferente da prevista: a reservada vale, e é ela que se acerta. */
    const reservada=d.i0>1?parcelaReservada(d):null;
    if(reservada){
      d.incluir=false; d.dupResp=1; d.dupAuto=1;
      d.dup={ym:reservada.ym,id:reservada.id,desc:reservada.desc,d:reservada.d,v:reservada.v,card:reservada.card||"",k:reservada.k};
      if(reservada.v!==d.v) d.ajustarValor=1;
      if(faturaDe(reservada)!==(d.ym||ymOf(d.date))) d.moverPara=d.ym||ymOf(d.date); }
    else { const rep=pareceRepetido(d);
      if(rep){ d.incluir=false; d.dup={ym:rep.ym,id:rep.id,desc:rep.desc,d:rep.d,v:rep.v,card:rep.card||"",k:rep.k}; } }
    return d; }).concat(extras); }

/* a parcela k de um plano já lançado, em qualquer mês: o banco muda centavos entre parcelas (232,00 vira 231,98) */
function parcelaReservada(d){
  const tol=Math.max(100,Math.round(d.v*0.02));
  return allTx().find(t=>t.plan&&t.k==="g"&&t.i===d.i0&&t.n===d.n&&Math.abs(t.v-d.v)<=tol&&(!d.cardId||t.card===d.cardId))||null; }

/* a fatura chegou sem uma parcela que o app tinha reservado nela: o banco ainda não cobrou (costuma cair na seguinte).
   Empurra essa parcela e as seguintes do mesmo plano um mês para a frente, para a fatura fechar com a do banco. */
async function empurrarParcelasNaoCobradas(cardId,ym,drafts){
  const confirmadas=new Set(drafts.filter(d=>d.dupAuto&&d.dup).map(d=>d.dup.id));
  const pend=allTx().filter(t=>t.plan&&t.i>1&&t.card===cardId&&faturaDe(t)===ym&&!confirmadas.has(t.id));
  if(!pend.length) return 0;
  const desde={}; pend.forEach(t=>{ if(desde[t.plan]==null||t.i<desde[t.plan]) desde[t.plan]=t.i; });
  const mover=allTx().filter(t=>t.plan&&desde[t.plan]!=null&&t.i>=desde[t.plan]).sort((a,b)=>b.ym.localeCompare(a.ym));
  const meses=new Set();
  for(const t of mover){
    const ymNovo=ymShift(t.ym,1), novo=Object.assign({},t,{fat:ymShift(faturaDe(t),1),d:firstOfMonth(ymNovo,t.d),u:Date.now()});
    delete novo.id; delete novo.ym;
    S.months[t.ym].tx[t.id]={del:1,u:Date.now()};
    if(!S.months[ymNovo]) S.months[ymNovo]={tx:{}};
    if(!S.months[ymNovo].tx) S.months[ymNovo].tx={};
    S.months[ymNovo].tx[t.id]=novo; meses.add(t.ym); meses.add(ymNovo); }
  for(const m of meses) await saveMonth(m);
  return pend.length; }

/* acerta a parcela reservada com o que o banco cobrou: valor e, se for o caso, a fatura em que ela caiu */
const mesesEntre=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
async function ajustarParcelaReservada(d){
  const m=S.months[d.dup.ym], t=m&&m.tx&&m.tx[d.dup.id]; if(!t||t.del) return;
  const delta=d.moverPara?mesesEntre(t.fat||d.dup.ym,d.moverPara):0;
  const novo=Object.assign({},t,{v:d.v,u:Date.now()});
  if(delta){ novo.fat=d.moverPara; }
  const ym=delta?ymShift(d.dup.ym,delta):d.dup.ym;
  if(ym!==d.dup.ym){
    novo.d=firstOfMonth(ym,t.d);
    m.tx[d.dup.id]={del:1,u:Date.now()};
    if(!S.months[ym]) S.months[ym]={tx:{}};
    if(!S.months[ym].tx) S.months[ym].tx={};
    S.months[ym].tx[d.dup.id]=novo;
    await saveMonth(d.dup.ym); await saveMonth(ym); }
  else { Object.assign(t,novo); await saveMonth(ym); } }

/* o mesmo gasto já lançado por voz ou por outro documento: mesmo valor, mesma data (±3 dias) */
function pareceRepetido(d){
  /* a compra no crédito fica no mês do dia da compra, que pode ser até dois meses antes da fatura */
  const alvo=d.ym||ymOf(d.date), base=ymOf(d.date||todayISO()), dia=s=>Date.parse(s+"T12:00:00");
  const meses=[...new Set([ymShift(alvo,-2),ymShift(alvo,-1),alvo,ymShift(base,-1),base,ymShift(base,1)])];
  for(const ym of meses) for(const t of txOf(ym)){
    if(t.k!==d.k||Math.abs(t.v-d.v)>1) continue;
    if(d.i0>1&&t.plan&&t.i===d.i0&&faturaDe(t)===alvo) return t;
    /* cartão diferente: só é o mesmo gasto se a descrição também bate (na fala é fácil dizer o cartão errado) */
    if(d.method==="credito"&&t.card&&d.cardId&&t.card!==d.cardId){
      const pa=norm(t.desc).split(" ").filter(w=>w.length>3), pb=norm(d.desc).split(" ").filter(w=>w.length>3);
      if(!pa.length||!pa.some(w=>pb.indexOf(w)>=0)) continue; }
    if(Math.abs(dia(t.d)-dia(d.date))<=(d.k==="p"?6:3)*86400000) return t; }
  return null; }

function diagHTML(list){
  ACOES={};

    bad:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>',"":'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'};

/* o diagnóstico: cada achado tem gravidade, explicação e, quando dá, uma ação */
function diagnostico(ym){
  const st=monthStats(ym), out=[], renda=(st.income>0?st.income:rendaPrevista(ym))||0;
  const add=(tone,t,s,acoes)=>out.push({tone,t,s,acoes});
  const irPara=id=>()=>{ const el=$("#"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); };
  if(st.cap&&st.dayNow>0){
    if(!st.isCur){ const tot=st.spent;
      if(tot>st.cap) add("bad","O mês fechou "+fmt(tot-st.cap)+" acima do teto","Gastos de <b>"+fmt(tot)+"</b> para um teto de <b>"+fmt(st.cap)+"</b>.");
      else add("good","O mês fechou dentro do teto","Gastos de <b>"+fmt(tot)+"</b>; sobraram <b>"+fmt(st.cap-tot)+"</b> do teto."); }
    else if(st.pace>st.cap) add("bad","No ritmo atual, o mês fecha "+fmt(Math.round(st.pace-st.cap))+" acima do teto",
      "Fora fixos e parcelas, você está gastando <b>"+fmt(Math.round((st.spent-st.rigid)/st.dayNow))+"</b> por dia. "+(st.perDay>0?"Para caber, o limite é <b>"+fmt(Math.round(st.perDay))+"</b> por dia até o fim do mês."
        :"O teto já foi todo usado, contando os fixos e as parcelas que ainda vêm."));
    else add("good","O mês cabe no teto","Projeção de <b>"+fmt(Math.round(st.pace))+"</b> para um teto de <b>"+fmt(st.cap)+"</b>."); }
  if(renda){
    const {g,m}=resumo5030(ym), cats={};
    Object.keys(st.byCat).forEach(id=>{ const k=grupoDe(id); (cats[k]=cats[k]||[]).push({id,v:st.byCat[id]}); });
    const top=k=>(cats[k]||[]).sort((a,b)=>b.v-a.v).slice(0,2).map(x=>esc(catName(x.id))+" <b>"+fmt(x.v)+"</b>").join(" e ");
    const ver=[{rotulo:"Ver 50-30-20",fn:()=>setView("meta")}];
    ["nec","des"].forEach(k=>{ const alvo=renda*m[k]/100;
      if(g[k]>alvo) add(k==="des"?"warn":"bad",NOMES_GRUPO[k]+" em "+Math.round(g[k]/renda*100)+"% da renda (meta "+m[k]+"%)",
        "Passou <b>"+fmt(Math.round(g[k]-alvo))+"</b>. Os maiores: "+top(k)+".",ver); });
    const alvoF=renda*m.fut/100;
    if(g.fut<alvoF){ const falta=Math.round(alvoF-g.fut), folga=Math.max(0,Math.round(renda*m.des/100-g.des));
      add("warn","Futuro em "+Math.round(g.fut/renda*100)+"% da renda (meta "+m.fut+"%)",
        "Faltam <b>"+fmt(falta)+"</b> para guardar este mês."+(folga>0?" A folga que ainda existe em Desejos (<b>"+fmt(folga)+"</b>) cobre "+(folga>=falta?"tudo":Math.round(folga/falta*100)+"% disso")+".":""),ver); }
    else add("good","Futuro no alvo","Você destinou <b>"+fmt(g.fut)+"</b> ("+Math.round(g.fut/renda*100)+"% da renda) para guardar ou pagar dívidas.");
    const parc=st.gastos.filter(t=>+t.n>1).reduce((s,t)=>s+t.v,0);
    const fixos=(S.cfg.fixed||[]).filter(f=>f.amount&&(!f.ate||ym<=f.ate)&&(!f.desde||ym>=f.desde)).reduce((s,f)=>s+f.amount,0);
    const folha=consignadoNoMes(ym), c=(parc+fixos+folha)/(renda+folha);   /* a renda já vem sem o consignado */
    if(c>0) add(c>0.5?"bad":c>0.3?"warn":"good",Math.round(c*100)+"% da renda já sai comprometida todo mês",
      "Parcelas <b>"+fmt(parc)+"</b> + gastos fixos e dívidas <b>"+fmt(fixos)+"</b>"+(folha?" + consignado <b>"+fmt(folha)+"</b>":"")+"."+(c>0.3?" Acima de 30%, sobra pouco para imprevistos.":"")); }
  const fut=futureMonths(13,ymOf(todayISO())), planos=openPlans();
  for(let k=1;k<fut.length;k++){ const cai=fut[k-1].parc-fut[k].parc;
    if(cai>=Math.max(5000,fut[k-1].parc*0.1)){ const fim=planos.filter(p=>p.last===fut[k-1].ym).map(p=>p.desc);
      add("","Em "+ymLabel(fut[k].ym)+" sobram "+fmt(cai)+" por mês",
        "É quando termina"+(fim.length>1?"m":"")+" "+(fim.length?esc(fim.slice(0,3).join(", ")):"parte das parcelas")+".",[{rotulo:"Ver parcelados",fn:irPara("an-parc")}]); break; } }
  recorrentes().slice(0,3).forEach(r=>add("","Parece gasto fixo: "+r.t.desc,
    "Apareceu em "+r.meses+" meses seguidos, sempre perto de <b>"+fmt(r.media)+"</b>. Como fixo, ele entra no teto dos próximos meses.",
    [{rotulo:"Marcar como fixo",fn:()=>tornarFixo(r.t)}]));
  const ass=st.byCat.assin||0;
  if(ass>0) add("","Assinaturas e telefone: "+fmt(ass*12)+" por ano","<b>"+fmt(ass)+"</b> neste mês. Vale revisar o que não usa.");
  creditCards().forEach(c=>{ if(c.limit>0){ const o=cardOwed(c.id), u=o/c.limit;
    if(u>0.8) add(u>0.95?"bad":"warn",c.n+" com "+Math.round(u*100)+"% do limite usado","Livre: <b>"+fmt(Math.max(0,c.limit-o))+"</b>, já contando as parcelas futuras."); } });
  const ds=(S.cfg.dividas||[]).map(dv=>({dv,e:estadoDivida(dv)})).filter(x=>x.e.n>0&&x.e.i>0).sort((a,b)=>b.e.i-a.e.i);
  if(ds.length){ const x=ds[0], sim=simulacao(x.e);
    add(x.e.i>=0.08?"bad":x.e.i>=0.03?"warn":"",x.dv.nome+": juros de "+pctBR(x.e.i)+" ao mês",
      "Faltam <b>"+fmt(x.e.jurosRest)+"</b> só de juros."+(ds.length>1?" É a mais cara: dinheiro adiantado nela economiza mais do que nas outras.":"")+
      (sim?" Adiantando <b>"+fmt(sim.E)+"</b> por mês, economiza <b>"+fmt(sim.economia)+"</b>.":""),[{rotulo:"Ver dívidas",fn:irPara("an-div")}]); }
  const tres=[2,1,0].map(i=>monthStats(ymShift(ym,-i)).byCat);
  Object.keys(tres[2]).forEach(id=>{ const a=tres[0][id]||0, b=tres[1][id]||0, c=tres[2][id]||0;
    if(a>0&&b>a*1.1&&c>b*1.1&&c>=10000) add("warn",catName(id)+" sobe há 3 meses","De <b>"+fmt(a)+"</b> para <b>"+fmt(b)+"</b> e agora <b>"+fmt(c)+"</b>."); });
  const ordem={bad:0,warn:1,"":2,good:3};
  return out.sort((a,b)=>ordem[a.tone||""]-ordem[b.tone||""]); }

/* =================== dívidas =================== */
const TIPOS_DIVIDA={pessoal:"Empréstimo pessoal",consignado:"Consignado",financiamento:"Financiamento",cartao:"Parcelamento do cartão",cheque:"Cheque especial",outro:"Outro"};
/* tabela Price: com juros, o saldo é o valor presente das parcelas que faltam */
function saldoPrice(P,i,n){ if(n<=0) return 0; return Math.round(i>0?P*(1-Math.pow(1+i,-n))/i:P*n); }
/* quantos meses e quanto de juros até quitar pagando Q por mês */
function quitar(saldo,Q,i){
  if(saldo<=0) return {meses:0,juros:0};
  if(i<=0) return {meses:Math.ceil(saldo/Q),juros:0};
  if(saldo*i>=Q) return null;
  const m=-Math.log(1-saldo*i/Q)/Math.log(1+i);
  return {meses:Math.ceil(m-1e-9),juros:Math.max(0,Math.round(Q*m-saldo))}; }
/* parcela k vence em inicio + (k-1) meses, no dia informado; a que já venceu conta como paga.
   Assim consignado e débito automático andam sozinhos, sem precisar lançar cada parcela. */
function normDivida(dv){
  if(!dv.total&&dv.restantes){ dv.total=+dv.restantes; dv.inicio=dv.desde; }   /* formato da primeira versão */
  if(!dv.inicio) dv.inicio=ymOf(todayISO());
  return dv; }
function vencDivida(dv,k){ const ym=ymShift(dv.inicio,k-1); return ym+"-"+pad(Math.min(+dv.dia||1,daysIn(ym))); }
function estadoDivida(dv){
  normDivida(dv);
  if(ehConsSal(dv)) return estadoCons(dv);
  const total=+dv.total||0, P=+dv.parcela||0, i=(+dv.juros||0)/100, hoje=todayISO();
  let pagas=0; while(pagas<total&&vencDivida(dv,pagas+1)<=hoje) pagas++;
  const n=total-pagas, saldo=saldoPrice(P,i,n);
  return {n,i,P,saldo,jurosRest:Math.max(0,P*n-saldo),pagas,total,fim:ymShift(dv.inicio,Math.max(1,total)-1),
    prox:n>0?{k:pagas+1,d:vencDivida(dv,pagas+1)}:null}; }
/* parcela de consignado no mês (descontada ou prevista); nas dívidas antigas em folha, pelo calendário */
function consignadoNoMes(ym){
  return (S.cfg.dividas||[]).filter(dv=>dv.folha||dv.tipo==="consignado").reduce((s,dv)=>{ normDivida(dv);
    if(ehConsSal(dv)) return s+(consDoMes(ym).some(x=>x.dv.id===dv.id)?(+dv.parcela||0):0);
    return s+(dv.inicio<=ym&&ym<=ymShift(dv.inicio,(+dv.total||1)-1)?(+dv.parcela||0):0); },0); }
/* adiantar 20% da parcela (mínimo R$ 50): quantos meses antes termina e quanto economiza */
function simulacao(e){
  if(!e||!e.n||e.i<=0) return null;
  const E=Math.max(5000,Math.round(e.P*0.2/1000)*1000);
  const base=quitar(e.saldo,e.P,e.i), com=quitar(e.saldo,e.P+E,e.i);
  if(!base||!com) return null;
  const meses=base.meses-com.meses, economia=base.juros-com.juros;
  return (meses<1||economia<1000)?null:{E,meses,economia}; }

    return '<div class="cardbox"><div class="cardbox-h"><span class="cardbox-n">'+esc(dv.nome)+
      (cara&&ativas.length>1&&cara.dv.id===dv.id?'<span class="badge">mais cara</span>':'')+(e.n===0?'<span class="badge info">quitada</span>':'')+'</span>'+
      '<span class="cardbox-v">'+fmtN(e.P)+'/mês</span></div>'+
      '<div class="cardbox-s">'+esc(TIPOS_DIVIDA[dv.tipo]||"")+' · '+(dv.folha?'descontada do salário':'paga com '+esc(cardName(dv.card)||"—"))+(cs&&dv.valor?' · empréstimo de '+fmtN(dv.valor):'')+' · até '+ymLabel(e.fim)+
      (e.i>0?' · juros '+pctBR(e.i)+' ao mês'+(cs&&(dv.juros===""||dv.juros==null)?' (calculado)':''):' · juros não informado')+'</div>'+
      '<div class="meter"><i style="width:'+Math.round(e.pagas/Math.max(1,e.total)*100)+'%"></i></div>'+
      '<div class="meter-s"><span>'+situacao+'</span><span>saldo '+fmtN(e.saldo)+'</span></div>'+
      (e.jurosRest?'<div class="meter-s" style="margin-top:2px"><span>juros que faltam '+fmtN(e.jurosRest)+'</span></div>':'')+
      (sim?'<div class="note" style="margin-top:10px;font-size:12.5px"><b>Adiantando '+fmt(sim.E)+' por mês</b>termina '+sim.meses+(sim.meses===1?' mês':' meses')+' antes e economiza '+fmt(sim.economia)+' de juros.</div>':'')+
      '<div class="cardbox-a">'+(e.n?'<button class="btn sm" data-quit="'+dv.id+'">Quitar antes</button>':'')+
      '<button class="btn ghost sm" data-div="'+dv.id+'">Editar</button></div></div>'; }).join("")+'</div>';
  return h+'<div style="margin-top:10px"><button class="btn ghost sm" data-divnova>Cadastrar outra dívida</button></div>'; }

/* quitação: quanto falta para acabar com a dívida hoje ou em qualquer mês, e quanto pagar por mês para
   terminar antes. Tabela Price: saldo S = P·(1−(1+i)^−n)/i; para quitar em m meses, Q = S·i/(1−(1+i)^−m). */
function mesDaParcela(dv,e,k){
  if(ehConsSal(dv)) return ymShift(e.start,k);
  const d=e.prox?vencDivida(dv,e.pagas+1+k):"";
  return d?ymOf(d):ymShift(ymOf(todayISO()),k); }
const parcelaParaQuitar=(e,m)=>m<1?0:(e.i>0?Math.round(e.saldo*e.i/(1-Math.pow(1+e.i,-m))):Math.round(e.saldo/m));
function openQuitacao(dv){

        '<b style="font-family:var(--f-m);font-weight:600">'+fmtN(Math.max(0,saldoPrice(e.P,e.i,e.n-x.k-1)))+'</b></div>').join("")+
    '</div></div></div>',
    '<button class="btn" id="qtX">Fechar</button>');
  const calc=()=>{ const k=+$("#qtM").value, m=k+1, Q=parcelaParaQuitar(e,m);

/* gastos que se repetem todo mês com o mesmo valor e ainda não estão como fixos */
function recorrentes(){
  const cur=ymOf(todayISO()), meses=[ymShift(cur,-2),ymShift(cur,-1),cur];
  const chave=d=>norm(d).split(" ").filter(w=>w.length>2).slice(0,2).join(" ");
  const jaFixo=new Set((S.cfg.fixed||[]).map(f=>chave(f.name))), mapa={};
  meses.forEach((ym,mi)=>txOf(ym).forEach(t=>{
    if(t.k!=="g"||t.fix||t.aj||(+t.n||1)>1) return;
    const c=chave(t.desc); if(c.length<3||jaFixo.has(c)) return;
    const e=mapa[c]||(mapa[c]={}); (e[mi]=e[mi]||[]).push(t); }));
  const out=[];
  Object.keys(mapa).forEach(c=>{ const e=mapa[c], ms=Object.keys(e);
    if(ms.length<2||ms.some(i=>e[i].length>1)) return;
    const vs=ms.map(i=>e[i][0].v), media=vs.reduce((a,b)=>a+b,0)/vs.length;
    if(vs.every(v=>Math.abs(v-media)<=media*0.15)) out.push({t:e[ms[ms.length-1]][0],meses:ms.length,media:Math.round(media)}); });
  return out.sort((a,b)=>b.media-a.media); }
function tornarFixo(t){
  const fx={id:uid(),name:t.desc,amount:t.v,day:+t.d.slice(8,10)||1,cat:t.cat,card:t.card};
  (S.cfg.fixed=S.cfg.fixed||[]).push(fx);
  const m=S.months[t.ym]; if(m&&m.tx&&m.tx[t.id]){ m.tx[t.id].fix=fx.id; m.tx[t.id].u=Date.now(); saveMonth(t.ym); }
  saveCfg(); render(); toast(t.desc+" agora é fixo todo mês."); }

/* =================== extrato por conta =================== */
/* como o do banco: saldo anterior, cada movimento com o saldo depois dele e o saldo final.
   Mesmas regras de balanceOf. No cartão de crédito, a fatura do mês. */
function movsConta(acctId,ym){
  const a=(S.cfg.accounts||[]).find(x=>x.id===acctId); if(!a) return [];
  const out=[];
  txOf(ym).forEach(t=>{
    if(a.openDate&&t.d<a.openDate) return;
    let v=0;
    if(t.k==="t"){ if(t.acct===acctId) v=-t.v; else if(t.acct2===acctId) v=t.v; }
    else if((t.acct||acctOf(t.card))===acctId){ if(t.k==="e") v=t.v; else if(t.k==="p"||(t.method!=="credito"&&t.method!=="folha")) v=-t.v; }
    if(v) out.push({t,v}); });
  return out.sort((x,y)=>(x.t.d+(x.t.t||"")).localeCompare(y.t.d+(y.t.t||""))); }
const diaMes=s=>s.slice(8,10)+"/"+s.slice(5,7);
function linhaExt(t,v,saldo,hoje){
  const sub=[t.aj?(t.k==="t"?"Acerto de saldo":"Acerto da fatura"):t.k==="t"?"Entre contas":t.k==="p"?"Pagamento de fatura":catLabel(t),t.to?"para "+t.to:"",t.n>1?"parcela "+t.i+"/"+t.n:""].filter(Boolean).join(" · ");
  return '<button class="row" data-ym="'+t.ym+'" data-id="'+t.id+'"><span class="ext-d">'+diaMes(t.d)+'</span>'+
    '<span class="row-m"><span class="row-d">'+esc(t.desc)+'</span><span class="row-s"><span>'+esc(sub)+'</span>'+(t.d>hoje?'<span class="chip">agendado</span>':'')+'</span></span>'+
    '<span class="ext-v"><span class="row-v'+(v>0?' plus':'')+'">'+(v>0?"+":"−")+fmtN(Math.abs(v))+'</span>'+(saldo!=null?'<span class="ext-s">'+fmtN(saldo)+'</span>':'')+'</span></button>'; }
function htmlExtrato(){
  const ops=(S.cfg.accounts||[]).map(a=>({id:a.id,n:a.n})).concat(creditCards().map(c=>({id:"card:"+c.id,n:c.n})));
  if(!ops.length) return "";
  if(!S.ext||!ops.some(o=>o.id===S.ext)) S.ext=ops[0].id;
  const ym=S.ym, hoje=todayISO(), fimMes=ym+"-"+pad(daysIn(ym)), cartao=S.ext.indexOf("card:")===0;
  const linhaSaldo=(rot,v,fim)=>'<div class="ext-h'+(fim?' fim':'')+'"><span>'+rot+'</span><b'+(v<0?' style="color:var(--bad)"':'')+'>'+fmtN(v)+'</b></div>';
  let corpo;
  if(cartao){
    const cid=S.ext.slice(5), inv=cardInvoice(cid,ym);
    const L=comprasDaFatura(cid,ym).sort((a,b)=>(a.d+(a.t||"")).localeCompare(b.d+(b.t||"")));
    const pg=allTx().filter(t=>t.k==="p"&&t.card===cid&&t.ref===ym);
    corpo=linhaSaldo("Fatura de "+esc(ymLabel(ym)),inv.total)+
      (L.length?L.map(t=>linhaExt(t,-t.v,null,hoje)).join(""):'<div class="empty" style="padding:14px">Nenhuma compra nesta fatura. A fatura se importa em Lançar.</div>')+
      pg.map(t=>linhaExt(t,t.v,null,hoje)).join("")+
      linhaSaldo(inv.open>0?(inv.paid>0?"Falta pagar (pago "+fmtN(inv.paid)+" em "+pg.length+(pg.length>1?" pagamentos)":" pagamento)"):"Falta pagar")
        :inv.paid>0&&pg.length>1?"Fatura paga em "+pg.length+" pagamentos":"Fatura paga",Math.max(0,inv.open),true);
  } else {
    const ant=ymShift(ym,-1), ini=balanceOf(S.ext,ant+"-31"), M=movsConta(S.ext,ym); let s=ini;
    const agendado=M.some(m=>m.t.d>hoje);
    const rotFim=fimMes<hoje?"Saldo em "+diaMes(fimMes):(ym>ymOf(hoje)||agendado)?"Saldo previsto em "+diaMes(fimMes):"Saldo hoje";
    corpo=linhaSaldo("Saldo em "+diaMes(ant+"-"+pad(daysIn(ant))),ini)+
      (M.length?M.map(m=>{ s+=m.v; return linhaExt(m.t,m.v,s,hoje); }).join(""):'<div class="empty" style="padding:14px">Nenhum movimento nesta conta em '+esc(ymLabel(ym))+'. O extrato se importa em Ajustes.</div>')+
      linhaSaldo(rotFim,s,true);
    const credito=txOf(ym).filter(t=>t.k==="g"&&t.method==="credito").reduce((x,t)=>x+t.v,0);
    if(credito) corpo+='<div class="ext-p">Compras no crédito em '+esc(ymLabel(ym))+': '+fmtN(credito)+
      '. Elas não aparecem aqui — saem da conta no pagamento da fatura.</div>';
    const pend=fimMes>=hoje?fixedFor(ym).filter(f=>acctOf(f.card)===S.ext&&(S.cfg.cards.find(c=>c.id===f.card)||{}).type!=="credito"):[];
    if(pend.length) corpo+='<div class="ext-p">Fixos ainda não lançados: '+pend.map(f=>esc(f.name)+" "+fmtN(f.amount)+" (dia "+f.day+")").join(" · ")+'</div>';
  }
  return '<div class="sec" id="extSec"><div class="sec-h"><h2 class="sec-t">Extrato de '+esc(ymLabel(ym))+'</h2>'+
    '<span class="sec-as"><button class="sec-a" id="extDup">Repetidos</button></span></div>'+
    '<div class="card pad"><div class="segs">'+ops.map(o=>'<button class="seg'+(o.id===S.ext?' on':'')+'" data-ext="'+o.id+'">'+esc(o.n)+'</button>').join("")+'</div>'+
    corpo+'</div></div>'; }
function bindExtrato(){
  $$("[data-ext]").forEach(b=>b.onclick=()=>{ S.ext=b.dataset.ext; renderContas(); });
  const dp=$("#extDup"); if(dp) dp.onclick=procurarRepetidos;

/* =================== importar, acertar saldo e repetidos =================== */
/* o saldo impresso no extrato vira acerto da conta */
function saldoDoDoc(r,drafts){
  const s=r.saldos||{}, datas=(drafts||[]).map(d=>d.date).filter(Boolean).sort(), rende=!!s.rendeFacil;
  if(s.final&&(s.final.d||datas.length)) return {v:s.final.v, d:s.final.d||datas[datas.length-1], rende};
  if(s.anterior){
    if(s.anterior.d) return {v:s.anterior.v, d:s.anterior.d, rende};
    if(datas.length) return {v:s.anterior.v, d:new Date(Date.parse(datas[0]+"T12:00:00")-86400000).toISOString().slice(0,10), rende}; }
  return null; }
/* o rendimento não vem escrito no extrato: ele volta escondido dentro dos resgates. Se a conta da aplicação
   ficou negativa, o banco devolveu mais do que tirou — a diferença é o rendimento. Nunca lança sozinho. */
function perguntarRendimento(ids,ate){
  for(const id of ids||[]){
    const a=(S.cfg.accounts||[]).find(x=>x.id===id); if(!a) continue;
    const v=-balanceOf(id,ate); if(v<=1) continue;
    setTimeout(()=>{ sheet("Rendimento de "+a.n,
      '<div class="set"><div class="note"><b>'+fmt(v)+'</b>Até '+diaMesAno(ate)+', o banco devolveu para a conta '+fmt(v)+
      ' a mais do que tirou: é o que o dinheiro rendeu enquanto ficou aplicado. O extrato não traz essa linha — o valor vem junto com os resgates.</div>'+
      '<div class="set-f"><span class="hint">Lançando, entra como <b>Rendimentos</b> em '+esc(a.n)+', não conta no teto de gastos e zera a conta da aplicação.</span></div></div>',
      '<button class="btn ghost" id="rdX">Agora não</button><button class="btn good" id="rdOk">Lançar rendimento</button>');
      $("#rdX").onclick=closeSheet;
      $("#rdOk").onclick=async()=>{ await commit({id:uid(),raw:"",v,desc:"Rendimento de "+a.n,cat:"rend",
        method:"pix",cardId:(S.cfg.cards.find(c=>c.type==="pix")||S.cfg.cards[0]||{}).id,acct:a.id,n:1,date:ate,time:"23:59",k:"e"});
        closeSheet(); render(); toast("Rendimento de "+fmt(v)+" lançado em "+esc(a.n)+"."); }; },700);
    return true; }
  return false; }

/* já lançados: dois iguais no mesmo lugar, com até 3 dias de diferença */
function repetidosDe(alvo,ym){
  const cartao=alvo.indexOf("card:")===0, cid=cartao?alvo.slice(5):"";
  const L=(cartao?comprasDaFatura(cid,ym):txOf(ym).filter(t=>(t.acct||acctOf(t.card))===alvo||t.acct2===alvo))
    .slice().sort((a,b)=>a.d.localeCompare(b.d));
  const pares=[], usado={};
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i], b=L[j];
    if(usado[a.id]||usado[b.id]) continue;
    if(a.k!==b.k||Math.abs(a.v-b.v)>1) continue;
    if(a.plan||b.plan||a.cons||b.cons||a.emp||b.emp||a.aj||b.aj) continue;                       /* parcela pertence a uma compra: nunca é repetida */
    if((a.card||"")!==(b.card||"")) continue;
    if(Math.abs(Date.parse(a.d+"T12:00:00")-Date.parse(b.d+"T12:00:00"))>3*86400000) continue;
    const pa=norm(a.desc).split(" ").filter(w=>w.length>3), pb=norm(b.desc).split(" ").filter(w=>w.length>3);
    if(a.cat!==b.cat&&!pa.some(w=>pb.indexOf(w)>=0)) continue;   /* mesma categoria, ou alguma palavra em comum */
    pares.push([a,b]); usado[a.id]=usado[b.id]=1; }
  return pares; }
function procurarRepetidos(){
  const pares=repetidosDe(S.ext,S.ym);
  if(!pares.length){ toast("Nenhum lançamento repetido em "+ymLabel(S.ym)+"."); return; }
  openRepetido(pares,0); }
function openRepetido(pares,i,aoDiferentes){
  if(i>=pares.length){ closeSheet(); render(); toast("Conferência dos repetidos terminada."); return; }
  const par=pares[i], a=par[0], b=par[1];
  const linha=(rot,t)=>'<div class="dup-l"><b>'+rot+':</b> '+esc(t.desc)+' · '+diaMesAno(t.d)+' · '+fmtN(t.v)+' · '+esc(catLabel(t))+
    (t.card?' · '+esc(cardName(t.card)):'')+(t.n>1?' · parcela '+t.i+'/'+t.n:'')+
    (t.k==="p"&&t.ref?' · abate a fatura de '+esc(ymLabel(t.ref)):'')+
    (t.raw?' · '+esc(t.raw.slice(0,60)):'')+'</div>';
  sheet("Parecem o mesmo lançamento ("+(i+1)+" de "+pares.length+")",
    '<div class="set"><div class="dup">'+linha("Primeiro",a)+linha("Segundo",b)+'</div>'+
    '<div class="set-f"><span class="hint">Se foram duas compras de verdade, no mesmo valor e quase no mesmo dia, escolha <b>São diferentes</b>. Só apague se for a mesma coisa lançada duas vezes.</span></div></div>',
    '<button class="btn ghost" id="rpN">São diferentes</button>'+
    '<button class="btn danger" id="rpD1">Apagar o primeiro</button>'+
    '<button class="btn danger" id="rpD">Apagar o segundo</button>');
  $("#rpN").onclick=()=>{ if(aoDiferentes) aoDiferentes(par); openRepetido(pares,i+1,aoDiferentes); };
  const apagar=async t=>{ await removeTx(t.ym,t.id,false); toast("Apagado: "+t.desc+" · "+diaMesAno(t.d)); openRepetido(pares,i+1,aoDiferentes); };
  $("#rpD1").onclick=()=>apagar(a);
  $("#rpD").onclick=()=>apagar(b); }

/* dois pagamentos da mesma fatura: um veio do extrato, outro do botão Pagar fatura. Nunca apaga sozinho:
   mostra os dois e pergunta. Um "são diferentes" fica guardado em cfg.pagPares e não volta a perguntar. */
function pagamentosRepetidos(){
  const L=allTx().filter(t=>t.k==="p").sort((a,b)=>a.d.localeCompare(b.d)), vistos=S.cfg.pagPares||[];
  const dia=x=>Date.parse(x+"T12:00:00"), pares=[], usado={};
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i], b=L[j]; if(usado[a.id]||usado[b.id]) continue;
    if(Math.abs(a.v-b.v)>Math.max(100,Math.round(a.v*0.02))) continue;
    if((a.acct||acctOf(a.card))!==(b.acct||acctOf(b.card))) continue;
    if(Math.abs(dia(a.d)-dia(b.d))>8*86400000) continue;
    /* o banco às vezes debita a fatura em pedaços: somados, cabem na fatura e não são repetição */
    if(a.card&&a.card===b.card&&a.ref&&a.ref===b.ref){ const inv=cardInvoice(a.card,a.ref);
      if(inv.total&&inv.paid<=inv.total+1) continue; }
    if(vistos.indexOf(a.id+"|"+b.id)>=0) continue;
    pares.push([a,b]); usado[a.id]=usado[b.id]=1; }
  return pares; }
/* na partida, só o aviso: conferir dá trabalho e pode depender de olhar o extrato ou a fatura */
function conferirPagamentosRepetidos(aviso){
  const pares=pagamentosRepetidos(); if(!pares.length) return false;
  const marcar=par=>{ S.cfg.pagPares=(S.cfg.pagPares||[]).concat([par[0].id+"|"+par[1].id]).slice(-40); saveCfg(); };
  if(!aviso){ openRepetido(pares,0,marcar); return true; }
  sheet(pares.length>1?"Pagamentos que parecem repetidos":"Um pagamento que parece repetido",
    '<div class="set"><div class="note"><b>'+pares.length+(pares.length>1?" pagamentos de fatura parecem repetidos":" pagamento de fatura parece repetido")+'</b>'+
    'Confira quando puder: pode ser o mesmo pagamento lançado duas vezes, ou uma cobrança que o cartão estornou e cobrou de novo. Nada é apagado sem você mandar.</div>'+
    '<div class="dup">'+pares.map(p=>'<div class="dup-l">'+esc(p[0].desc)+' · '+diaMesAno(p[0].d)+' · '+fmtN(p[0].v)+
      (p[0].card?' · '+esc(cardName(p[0].card)):'')+'</div>').join("")+'</div>'+
    '<div class="set-f"><span class="hint">Para ver depois: aba <b>Contas</b>, escolha a conta e toque em <b>Repetidos</b>, no alto do extrato.</span></div></div>',
    '<button class="btn ghost" id="prDepois">Depois eu vejo</button><button class="btn" id="prAgora">Conferir agora</button>');
  $("#prDepois").onclick=()=>{ closeSheet(); toast("Quando quiser: Contas → Repetidos."); };
  $("#prAgora").onclick=()=>{ closeSheet(); openRepetido(pares,0,marcar); };
  return true; }

/* tudo que vence no mês, em ordem de data: gastos fixos, parcelas de dívidas,
   consignado descontado em folha e a fatura de cada cartão. */
function contasDoMes(ym){
  const out=[], hoje=todayISO(), dim=daysIn(ym), diaDoMes=d=>ym+"-"+pad(Math.max(1,Math.min(+d||1,dim)));
  const feito={}; txOf(ym).forEach(t=>{ if(t.fix) feito[t.fix]=t; });
  (S.cfg.fixed||[]).forEach(f=>{
    if(!f.amount) return;
    if((f.ate&&ym>f.ate)||(f.desde&&ym<f.desde)) return;
    const t=feito[f.id], forma=cardName(f.card)||METODOS[(S.cfg.cards.find(c=>c.id===f.card)||{}).type]||"";
    out.push({tipo:"fixo", id:f.id, nome:f.name, v:t?t.v:f.amount, d:t?t.d:diaDoMes(f.day), pago:!!t,
      sub:(f.divida?"Parcela de dívida":"Gasto fixo")+(forma?" · "+forma:"")}); });
  (S.cfg.dividas||[]).filter(dv=>dv.folha||dv.tipo==="consignado").forEach(dv=>{ normDivida(dv);
    if(ehConsSal(dv)){ const t=txOf(ym).find(x=>x.cons===dv.id);
      if(t) out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:t.v, d:t.d, pago:true, sub:"Descontado do salário"});
      else if(consDoMes(ym).some(x=>x.dv.id===dv.id)) out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:+dv.parcela||0, d:primeiroDiaUtil(ym), pago:false, sub:"Sai do salário do mês"});
      return; }
    if(ym<dv.inicio||ym>ymShift(dv.inicio,Math.max(1,+dv.total||1)-1)) return;
    const d=diaDoMes(dv.dia);
    out.push({tipo:"folha", id:dv.id, nome:dv.nome, v:+dv.parcela||0, d, pago:d<=hoje, sub:"Descontado do salário"}); });
  creditCards().forEach(c=>{
    const inv=cardInvoice(c.id,ym); if(!inv.total) return;
    const outroMes=c.due&&(!c.closing||c.due<c.closing), prox=ymShift(ym,1);
    const venc=outroMes?prox+"-"+pad(Math.min(c.due,daysIn(prox))):diaDoMes(c.due||dim);
    /* sem a fatura do banco importada, o valor é só a previsão pelas compras e parcelas que o app conhece */
    const prevista=!((S.cfg.faturasLidas||{})[c.id+"|"+ym]);
    out.push({tipo:"fatura", id:c.id, nome:"Fatura "+c.n, v:inv.open>0?inv.open:inv.total, d:venc, pago:inv.open<=0, prevista,
      sub:"Fatura de "+ymLabel(ym)+(c.due?" · vence "+venc.slice(8,10)+"/"+venc.slice(5,7):" · sem data de vencimento")+
        (inv.paid>0?(inv.open>0?" · pagamento parcial de "+fmtN(inv.paid)+(pagamentosDaFatura(c.id,ym).length>1?" em "+pagamentosDaFatura(c.id,ym).length+" vezes":""):" · paga"):"")+
        (prevista?" · ainda sem a fatura do banco":"")}); });
  return out.sort((a,b)=>a.d.localeCompare(b.d)||b.v-a.v); }

function linhaConta(x,hoje){
  const atrasada=!x.pago&&x.d<hoje&&x.tipo!=="folha"&&!x.prevista;
  const acao=x.pago?"":x.tipo==="fixo"?'<button class="mini" data-pagafixo="'+x.id+'">Lançar</button>'
    :x.tipo==="fatura"?'<button class="mini" data-pagafat="'+x.id+'">Pagar</button>':"";
  const chip=x.pago?'<span class="chip ok">'+(x.tipo==="folha"?"descontado":"pago")+'</span>'
    :atrasada?'<span class="chip atraso">atrasada</span>':x.prevista&&x.d<hoje?'<span class="chip">prevista</span>'
    :x.d===hoje?'<span class="chip hoje">vence hoje</span>':"";
  return '<div class="cta'+(x.pago?" pago":"")+'" data-cta="'+x.tipo+":"+x.id+'">'+
    '<span class="cta-d">'+x.d.slice(8,10)+"/"+x.d.slice(5,7)+'</span>'+
    '<span class="row-m"><span class="row-d">'+esc(x.nome)+'</span>'+

    '<span class="cta-v"><span class="row-v'+(x.pago?" pay":"")+'">'+fmtN(x.v)+'</span>'+

function htmlContas(ym){

/* no painel: só o que vence nos próximos dias, ou já venceu e não foi pago */

/* =================== salário e consignado =================== */
/* A renda líquida de Ajustes cai no primeiro dia útil do mês. Consignado: o empréstimo cai na conta no dia
   (fora da renda) e, a partir do salário seguinte, o salário entra com a parcela descontada. A parcela vai para
   Dívidas e empréstimos com o método "folha", que não tira dinheiro da conta de novo. Uma por mês. */
const ehConsSal=dv=>!!dv&&dv.tipo==="consignado"&&dv.modo==="salario";
const pctBR=i=>(Math.round(i*10000)/100).toString().replace(".",",")+"%";
const diaAnterior=s=>new Date(Date.parse(s+"T12:00:00")-86400000).toISOString().slice(0,10);
function pascoa(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const x=h+l-7*m+114; return Date.UTC(y,Math.floor(x/31)-1,(x%31)+1); }
/* feriados nacionais e bancários: os de data fixa, carnaval, sexta-feira santa e Corpus Christi */
function feriado(iso){
  if(["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"].indexOf(iso.slice(5))>=0) return true;
  const dif=Math.round((Date.parse(iso+"T00:00:00Z")-pascoa(+iso.slice(0,4)))/86400000);
  return dif===-48||dif===-47||dif===-2||dif===60; }
function primeiroDiaUtil(ym){
  for(let d=1;d<=10;d++){ const iso=ym+"-"+pad(d), w=new Date(iso+"T12:00:00").getDay();
    if(w!==0&&w!==6&&!feriado(iso)) return iso; }
  return ym+"-01"; }
function contaDoSalario(){ const A=S.cfg.accounts||[]; return (A.find(a=>a.id===S.cfg.salConta)||A.find(a=>a.type==="corrente")||A[0]||{}).id||"cc"; }

/* juro ao mês: o informado, ou o que faz as parcelas pagarem o valor recebido (tabela Price) */
function consJuros(dv){
  if(dv.juros!==""&&dv.juros!=null) return +dv.juros||0;
  const V=+dv.valor||0, P=+dv.parcela||0, n=+dv.total||0;
  if(!V||!P||!n||P*n<=V) return 0;
  const pv=i=>P*(1-Math.pow(1+i,-n))/i; let lo=1e-7, hi=1;
  for(let k=0;k<80;k++){ const m=(lo+hi)/2; if(pv(m)>V) lo=m; else hi=m; }
  return Math.round((lo+hi)/2*10000)/100; }
function estadoCons(dv){
  const deds=allTx().filter(t=>t.cons===dv.id).sort((a,b)=>a.d.localeCompare(b.d)), meses={};
  deds.forEach(t=>{ meses[t.ym]=1; });
  const total=+dv.total||0, P=+dv.parcela||0, jd=+dv.jaDesc||0;
  const pagas=Math.min(total,jd+deds.length), n=total-pagas;
  const i=consJuros(dv)/100, saldo=saldoPrice(P,i,n);
  /* o mês do primeiro desconto: o que o dono informou (o banco costuma começar meses depois do empréstimo) ou,
     na falta dele, o salário seguinte ao empréstimo; já descontadas antes disso andam a agenda para a frente */
  const base=dv.data||dv.criado||todayISO(), bm=ymOf(base);
  const primeiro=dv.primeiro?ymShift(dv.primeiro,jd)
    :jd>0?ymOf(dv.criado||todayISO()):(base<primeiroDiaUtil(bm)?bm:ymShift(bm,1));
  const ult=deds.length?deds[deds.length-1].ym:"";
  const start=ult&&ymShift(ult,1)>primeiro?ymShift(ult,1):primeiro;
  const fim=n>0?ymShift(start,n-1):(ult||primeiro);
  return {n,i,P,saldo,jurosRest:Math.max(0,P*n-saldo),pagas,total,fim,start,meses,
    prox:n>0?{k:pagas+1,d:primeiroDiaUtil(start)}:null}; }
/* consignados com parcela no mês: já descontada ou ainda por descontar */
function consDoMes(ym){
  return (S.cfg.dividas||[]).filter(ehConsSal).map(dv=>({dv,e:estadoCons(dv)}))
    .filter(x=>x.e.meses[ym]||(x.e.n>0&&ym>=x.e.start&&ym<=x.e.fim)); }
function rendaPrevista(ym){ return Math.max(0,rendaDoMes(ym)-consDoMes(ym).reduce((s,x)=>s+(+x.dv.parcela||0),0)); }
/* parcela prevista no mês, enquanto não foi lançada: entra como gasto fixo */
function consVirtuais(ym){
  return consDoMes(ym).filter(x=>!x.e.meses[ym]).map(x=>({id:"cons:"+x.dv.id, name:x.dv.nome, amount:+x.dv.parcela||0,
    day:+primeiroDiaUtil(ym).slice(8,10), cat:"divida", card:"", cons:x.dv.id, acct:contaDoSalario()})); }
const idDesconto=(dvId,ym)=>"cons-"+dvId+"-"+ym;
/* a chave existe, mesmo apagada (lápide): não recria o que o dono apagou */
const jaTemChave=(ym,id)=>{ const t=S.months[ym]&&S.months[ym].tx&&S.months[ym].tx[id]; return !!t&&!(t.del&&t.zerado); };   /* lápide de Recomeçar não conta */
async function lancarDesconto(dv,ym,e,data){
  const id=idDesconto(dv.id,ym); if(jaTemChave(ym,id)||e.meses[ym]) return false;
  await commit({id,raw:"",v:+dv.parcela||0,desc:dv.nome+" · parcela "+(e.pagas+1)+"/"+dv.total,cat:"divida",method:"folha",cardId:"",
    acct:contaDoSalario(),n:1,date:data,time:"08:00",fix:"cons:"+dv.id,cons:dv.id,k:"g"});
  return true; }
function lancamentoDoFixo(f,ym){
  if(f.cons){ const dv=(S.cfg.dividas||[]).find(x=>x.id===f.cons), e=dv?estadoCons(dv):{pagas:0};
    return {id:idDesconto(f.cons,ym),raw:"",v:f.amount,desc:f.name+" · parcela "+(e.pagas+1)+"/"+((dv&&dv.total)||"?"),cat:"divida",
      method:"folha",cardId:"",acct:contaDoSalario(),n:1,date:primeiroDiaUtil(ym),time:"08:00",fix:f.id,cons:f.cons,k:"g"}; }
  return {id:uid(),raw:"",v:f.amount,desc:f.name,cat:f.cat,method:(S.cfg.cards.find(c=>c.id===f.card)||{}).type||"debito",
    cardId:f.card,n:1,date:ym+"-"+pad(f.day),time:"",fix:f.id,k:"g"}; }

/* todo mês, a partir do primeiro dia útil: o salário de Ajustes, já sem as parcelas do consignado.
   Chave fixa por mês ("sal-AAAA-MM"): dois aparelhos criam o mesmo lançamento, e a junção fica com um só. */
let salarioRodando=false;
async function garantirSalario(){
  const c=S.cfg; if(salarioRodando||!c||!(+c.income>0||(c.rendas||[]).some(r=>r.v>0))||c.salAuto===false||c.salPausa) return;
  if(S.mode!=="local"&&!S.sincronizado) return;   /* conta Google: só depois de juntar com o Drive, senão duplicaria um salário lançado em outro aparelho */
  const hoje=todayISO(), cur=ymOf(hoje);
  salarioRodando=true;
  try{
    if(!c.salDesde){ c.salDesde=cur; saveCfg(); }
    let criou=false;
    for(const ym of [ymShift(cur,-1),cur]){
      if(ym<c.salDesde||!(rendaDoMes(ym)>0)) continue;
      const dia=primeiroDiaUtil(ym); if(dia>hoje) continue;
      const id="sal-"+ym;
      if(jaTemChave(ym,id)) continue;
      if(txOf(ym).some(t=>t.k==="e"&&t.cat==="sal")) continue;      /* já lançado à mão ou pelo extrato */
      const L=consDoMes(ym), P=L.reduce((s,x)=>s+(+x.dv.parcela||0),0);
      await commit({id,raw:"",v:Math.max(0,rendaDoMes(ym)-P),desc:"Salário",cat:"sal",method:"transferencia",cardId:"",
        acct:contaDoSalario(),n:1,date:dia,time:"08:00",k:"e",auto:1});
      for(const x of L) await lancarDesconto(x.dv,ym,x.e,dia);
      criou=true; }
    if(criou) setTimeout(render,0);
  } finally { salarioRodando=false; } }
/* salário lançado à mão ou pelo extrato: desconta o consignado do mês, se ainda não foi descontado */
async function descontarConsignados(ym,txId){
  const m=S.months[ym], sal=m&&m.tx&&m.tx[txId]; if(!sal||sal.del) return;
  const L=consDoMes(ym).filter(x=>x.e.n>0&&!x.e.meses[ym]&&!jaTemChave(ym,idDesconto(x.dv.id,ym)));
  if(!L.length) return;
  const P=L.reduce((s,x)=>s+(+x.dv.parcela||0),0), liq=rendaDoMes(ym);
  /* veio o valor cheio da renda? tira a parcela. Se já veio com o desconto, fica como está. */
  const cheio=liq>0&&Math.abs(sal.v-liq)<Math.abs(sal.v-(liq-P));
  if(cheio){ sal.v=Math.max(0,sal.v-P); sal.u=Date.now(); await saveMonth(ym); }
  for(const x of L) await lancarDesconto(x.dv,ym,x.e,sal.d);
  const msg="Salário de "+fmt(sal.v)+", já sem o consignado de "+fmt(P)+" — a parcela foi para Dívidas e empréstimos";
  setTimeout(()=>toast(msg),2900); }

/* versões anteriores: consignado contado pelo calendário passa a ser descontado no salário */
function migrar2(c){
  if(c.m2) return;
  c.ecats=c.ecats||ECATS.map(x=>({...x}));
  if(!c.ecats.some(x=>x.id==="emprest")){ const i=c.ecats.findIndex(x=>x.id==="outrae"); c.ecats.splice(i<0?c.ecats.length:i,0,{id:"emprest",n:"Empréstimo recebido"}); }

  (c.dividas||[]).forEach(dv=>{

      data:dv.data||(antes?"":diaAnterior(dv.inicio+"-01")),folha:true});

/* =================== importar meses anteriores =================== */
/* No extrato da conta, pagamento de fatura não é gasto (as compras já vêm da fatura do cartão), e aplicação ou
   resgate é dinheiro mudando de lugar. Os dois viram movimento que não conta como gasto nem como renda. */
function classificarLinhaExtrato(d){
  const s=norm(d.desc), C=creditCards();
  if(d.k!=="e"&&!/\bfatura de (agua|luz|energia|gas|telefone|internet|celular)\b/.test(s)&&
    /\b(pagamento|pagto|pgto|pag)\b.{0,16}\b(fatura|cartao|cartoes)\b|\bfatura\b.{0,16}\b(cartao|visa|master|mastercard|elo)\b|\bcartao de credito\b/.test(s)){
    const palavras=s.split(" "), ym=ymOf(d.date);
    /* sem o nome do cartão ("Pagto cartão crédito"), vale o cartão cuja fatura tem exatamente esse valor */
    const peloValor=C.find(x=>{ const ref=x.due&&x.closing&&x.due>x.closing?ym:ymShift(ym,-1), inv=cardInvoice(x.id,ref); return inv.total&&Math.abs(inv.total-d.v)<=1; });
    /* o extrato do BB escreve "Pagto cartão crédito · Elo Nanquim". O nome do cartão no app pode ser outro
       ("Ourocard", "Nanquim", "Elo"), então compara nos dois sentidos — palavra do app que aparece no extrato
       e palavra do extrato que aparece no nome do app — e ainda usa os apelidos já aprendidos. */
    const pal=palavras.filter(w=>w.length>2);
    const pontua=x=>{ const nome=norm(x.n+" "+(x.alias||"")).split(" ").filter(w=>w.length>2);
      return nome.filter(w=>pal.indexOf(w)>=0).length+pal.filter(w=>nome.indexOf(w)>=0).length; };
    const ranque=C.map(x=>({x,p:pontua(x)})).filter(o=>o.p>0).sort((a,b)=>b.p-a.p);
    const porNome=ranque.length&&(ranque.length===1||ranque[0].p>ranque[1].p)?ranque[0].x:null;
    let porApelido=null;
    Object.keys(S.cfg.kwCard||{}).forEach(w=>{ if(porApelido) return;
      if(pal.indexOf(deacc(String(w).toLowerCase()))>=0) porApelido=C.find(x=>x.id===S.cfg.kwCard[w]); });
    const c=porNome||porApelido||peloValor||(C.length===1?C[0]:null);
    d.k="p"; d.method="debito"; d.n=1;
    /* o BB escreve só "Pagto cartão crédito". Sem saber de qual cartão é, fica em branco: chutar o primeiro
       da lista punha o pagamento no cartão errado e a fatura certa pedia pagamento de novo — foi assim que o
       dono acabou pagando duas vezes a fatura do Elo (set/2026). */
    d.cardId=c?c.id:"";
    d.ref=c&&c.due&&c.closing&&c.due>c.closing?ym:ymShift(ym,-1);      /* paga em setembro a fatura de agosto */
    d.raw="Extrato · pagamento de fatura"+(c?"":" — cartão a confirmar"); return; }
  /* saque (regra do dono): o dinheiro sai da conta e vai para a carteira; gasto é quando sai da carteira */
  if(d.k!=="e"&&/\bsaque\b/.test(s)){
    const car=(S.cfg.accounts||[]).find(a=>a.type==="carteira");
    d.k="t"; d.method="transferencia"; d.cardId="transf"; d.n=1; d.acct2=car?car.id:"";
    d.raw="Extrato · saque, vai para "+(car?car.n:"fora do app"); return; }
  if(d.aplic||/\b(aplic\w*|resgate\w*|poupanca|investimento\w*|rdb|cdb|lci|lca|tesouro|caixinha\w*|cofrinho\w*|porquinho\w*)\b/.test(s)){
    const inv=contaDaAplicacao(d.aplic||"");
    const conta=d.acct, entra=d.k==="e"||/\bresgate/.test(s);
    d.k="t"; d.method="transferencia"; d.cardId="transf"; d.n=1;
    d.acct=entra?(inv?inv.id:""):conta; d.acct2=entra?conta:(inv?inv.id:"");
    d.raw="Extrato · "+(entra?"resgate":"aplicação")+(inv?", entre a conta e "+inv.n:", movimento entre contas"); } }

/* a aplicação automática do saldo (BB Rende Fácil) tem conta própria: o dinheiro continua sendo dele, mas
   sai da conta corrente, que assim fica igual ao extrato do banco. A conta é criada na primeira importação. */
function contaDaAplicacao(nome){
  const A=S.cfg.accounts=S.cfg.accounts||[], alvo=norm(nome||"");
  let c=alvo&&A.find(a=>norm(a.n)===alvo);
  if(!c&&alvo) c=A.find(a=>a.type==="invest"&&norm(a.n).indexOf(alvo)>=0);
  if(!c) c=A.find(a=>a.type==="invest");
  if(!c&&!nome) c=A.find(a=>a.type==="poupanca");
  if(!c&&nome){ c={id:uid(),n:nome,type:"invest",opening:0,openDate:"",adjust:[]}; A.push(c); S.contaCriada=c.n; saveCfg(); }
  return c||null; }

/* extrato importado antes da fatura: o pagamento ficou com "confira o cartão". Quando a fatura chega, ele vai para o
   cartão cuja fatura tem exatamente o valor pago. */
async function religarPagamentos(){
  let n=0; const meses=new Set(), cartoes=creditCards();
  const bate=(a,b)=>b>0&&Math.abs(a-b)<=Math.max(100,Math.round(b*0.02));   /* 2%, no mínimo R$ 1 */
  for(const t of allTx()){
    if(t.k!=="p") continue;
    if(t.card&&!/confira o cart|cart.o a confirmar/.test(t.raw||"")) continue;
    const ym=ymOf(t.d);
    /* procura em qualquer cartão a fatura que fecha com esse valor — a do mês do pagamento ou a do mês
       anterior —, sem depender de o cartão ter dia de fechamento cadastrado */
    let achou=null;
    for(const c of cartoes) for(const ref of [ym,ymShift(ym,-1)]){
      const inv=cardInvoice(c.id,ref);
      if(!inv.total||inv.open<=0) continue;
      if(!bate(t.v,inv.open)&&!bate(t.v,inv.total)) continue;
      const dif=Math.min(Math.abs(t.v-inv.open),Math.abs(t.v-inv.total));
      if(!achou||dif<achou.dif) achou={c,ref,dif}; }
    if(!achou) continue;
    Object.assign(S.months[t.ym].tx[t.id],{card:achou.c.id, ref:achou.ref,
      raw:"Extrato · pagamento de fatura", u:Date.now()});
    meses.add(t.ym); n++; }
  for(const ym of meses) await saveMonth(ym);
  return n; }

/* a fatura vai para o mês da compra mais recente (fora as parcelas de compras antigas), seja qual for o mês na tela */
/* o mês da fatura é o do fechamento impresso nela ("Fatura fechada em 23/12/2025" → dez/2025): juros, IOF e tarifas
   costumam vir com a data do mês seguinte e jogavam a fatura inteira um mês para a frente. Sem o fechamento, vale a
   compra mais recente (fora as parcelas de compras antigas). */
function mesDaFatura(r,padrao){
  if(r.fechada) return ymOf(r.fechada);
  const ds=r.linhas.filter(l=>(+l.i0||1)<=1&&l.d).map(l=>l.d).sort();
  return ds.length?ymOf(ds[ds.length-1]):padrao; }

/* campos da conferência conforme o tipo: gasto, entrada, pagamento de fatura ou movimento entre contas */

  if(d.k==="e") return cat+'<div class="f"><label>Cai em qual conta</label><select data-k="acct">'+optId(A,d.acct||acctOf(d.cardId))+'</select></div>';

/* =================== recomeçar os lançamentos =================== */
/* Apaga os lançamentos para carregar os extratos do zero, sem mexer na configuração. A exclusão é por lápide
   marcada "zerado" (chega aos outros aparelhos e não impede o app de recriar salário e consignado).
   Antes de apagar, guarda um backup completo — no Drive, em conta Google. */
function ehDinheiro(t){
  const A=S.cfg.accounts||[], card=S.cfg.cards.find(c=>c.id===t.card);
  return (t.k||"g")==="g"&&(t.method==="dinheiro"||(!!card&&card.type==="dinheiro")||((A.find(a=>a.id===t.acct)||{}).type==="carteira")); }
async function backupAntesDeRecomecar(){
  const pacote={app:"caderneta",v:1,antesDeRecomecar:true,salvoEm:new Date().toISOString(),cfg:S.cfg,months:S.months};
  const nome="backup-antes-de-recomecar-"+todayISO()+".json";
  if(S.user&&S.user.kind==="google"){
    if(!navigator.onLine||!tokenOk()){ toast("Toque em Sincronizar no topo antes: o backup vai para o seu Drive. Nada foi apagado."); return false; }
    try{ const pasta=await ensureFolder(); await writeJson(nome,pasta,pacote); return nome; }
    catch(e){ toast("Não consegui guardar o backup no Drive. Nada foi apagado."); return false; } }
  try{ await navigator.clipboard.writeText(JSON.stringify(pacote)); return "copiado para a área de transferência"; }
  catch(e){ toast("Não consegui copiar o backup. Use Backup completo em Ajustes antes. Nada foi apagado."); return false; } }
/* conta Google: junta com o Drive antes (senão o que só existe em outro aparelho escaparia da exclusão) */
async function sincronizarAgora(){
  if(!S.user||S.user.kind!=="google") return true;
  if(!navigator.onLine||!tokenOk()) return false;
  const esperar=async()=>{ for(let i=0;i<80&&syncing;i++) await new Promise(r=>setTimeout(r,250)); };
  await esperar(); await syncNow(); await esperar();
  return S.sync.state==="ok"; }
function openRecomecar(){
