<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* ===== tela de entrada ===== */
/* fundo: a pauta da caderneta, bem apagada, com um brilho do azul do app no alto */
#gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#gate::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, var(--accent-soft) 0%, transparent 62%),
    repeating-linear-gradient(to bottom, transparent 0 27px, var(--grid) 27px 28px);
  opacity:.75;mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 96%);
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 96%)}
.gate-in{position:relative;margin:auto;width:100%;max-width:404px;display:flex;flex-direction:column;
  gap:14px;text-align:center}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:30px 26px 26px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
  box-shadow:0 18px 44px -24px rgba(15,23,42,.42), 0 2px 6px -2px rgba(15,23,42,.10)}
/* o fio dourado da fita, no alto do cartão */
.gate-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, transparent, #E8B84B 22%, #E8B84B 78%, transparent)}
.gate-marca{align-self:center;line-height:0;border-radius:16px;
  box-shadow:0 10px 26px -12px rgba(15,23,42,.6)}
.gate-marca svg{display:block;border-radius:16px}
.gate-in h1{font-family:var(--f-s);font-size:30px;font-weight:600;letter-spacing:-.02em;margin:10px 0 0}
.gate-in p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55}
.gate-lead{font-size:14.5px!important;color:var(--ink-2)}
.gate-pts{list-style:none;margin:6px 0 2px;padding:14px 0 0;border-top:1px solid var(--line);
  display:grid;gap:10px;text-align:left}
.gate-pts li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);line-height:1.4}
.gate-pts svg{width:17px;height:17px;flex:none;color:var(--accent)}
.gate-pts b{font-weight:600;color:var(--ink)}
.gate-in .btn{justify-content:center;padding:12px 16px;font-size:15px;border-radius:12px}
/* o botão do Google segue o padrão dele: fundo claro, letra escura, logo colorido */
.gate-in .btn.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);font-weight:600}
.gate-in .btn.gbtn:hover{background:var(--surface-2)}
.gate-s{font-size:12.5px!important;color:var(--ink-3)!important}
.gate-or{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.1em;margin:2px 0}
.gate-or::before,.gate-or::after{content:"";flex:1;height:1px;background:var(--line)}
.gate-pe{font-size:12px;color:var(--ink-3)}
.gate-pe a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line)}
.gate-pe a:hover{color:var(--ink-2)}
@media(max-width:420px){ .gate-card{padding:26px 20px 22px} .gate-in h1{font-size:26px} }
.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.gbtn:hover{background:var(--surface-2);filter:none}
.gbtn svg{width:18px;height:18px;flex:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chipbtn i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.chipbtn.good i{background:var(--good)} .chipbtn.warn i{background:var(--warn)} .chipbtn.bad i{background:var(--bad)}
.chipbtn.busy i{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@media (max-width:520px){.chipbtn span{display:none}.chipbtn{padding:8px}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;
  font-weight:600;font-size:13px;cursor:pointer;flex:none}
</style>
<title>Caderneta</title>
<style>
details.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow)}
details.grp>summary{cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:9px;font-weight:600;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"›";margin-left:8px;color:var(--ink-3);transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(90deg)}
details.grp[open]>summary{border-bottom:1px solid var(--line)}
details.grp>summary .v{margin-left:auto;font-family:var(--f-m);font-weight:500;font-variant-numeric:tabular-nums}
details.grp .in{padding:8px 14px 12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--bad-soft);color:var(--bad);margin-left:6px;vertical-align:1px}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.ins-a{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.ins-t,.ins-s{display:block}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:5px 12px;font:500 12.5px var(--f);cursor:pointer}
.seg:hover{background:var(--surface-2)}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.ext-h{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.ext-h b{font-family:var(--f-m);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ext-h.fim{border-bottom:0;border-top:1px solid var(--line-2);margin-top:-1px}
.ext-d{font-family:var(--f-m);font-size:11.5px;color:var(--ink-3);width:40px;flex:none;font-variant-numeric:tabular-nums}
.ext-v{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.ext-s{font-family:var(--f-m);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ext-p{font-size:12px;color:var(--ink-3);padding:10px 2px 0;line-height:1.5}
.sec-as{display:flex;gap:14px;flex-wrap:wrap}
.dup{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:11px 12px;margin-top:9px;font-size:12.5px;line-height:1.5}
.dup.ok{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.dup-l{margin-top:4px}
.pisca{animation:pisca 1.5s ease-out 1}
@keyframes pisca{0%,100%{box-shadow:var(--shadow)}35%{box-shadow:0 0 0 3px var(--accent-line)}}
.ctas{margin-top:12px}
.cta{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.cta:last-child{border-bottom:0}
.cta:hover{background:var(--surface-2)}
.cta.pago .row-d{color:var(--ink-2);font-weight:400}
.cta-d{font-family:var(--f-m);font-size:11.5px;color:var(--ink-3);width:40px;flex:none;font-variant-numeric:tabular-nums}
.cta-v{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cta-a{display:flex;gap:6px}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.atraso{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.hoje{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
/* ===== tokens: ardósia e azul-aço. Categórica validada (ΔE adjacente 20.9 protan) ===== */
:root{
  --paper:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --surface-3:#E2E7EE;
  --line:#D9DFE7; --line-2:#C2CAD6; --grid:#E6EBF1;
  --ink:#0F172A; --ink-2:#5A6676; --ink-3:#818C9B;
  --accent:#2563A8; --accent-soft:#E3ECF6; --accent-line:#9CBBDC;
  --good:#0F7B54; --good-soft:#DDEFE7;
  --warn:#9A6B10; --warn-soft:#F5EAD1;
  --bad:#B4342A;  --bad-soft:#F7E1DE;
  --c1:#2563A8; --c2:#B0641E; --c3:#6B4E9E;
  --on-accent:#FFFFFF; --on-c:#FFFFFF;
  --r:10px; --r-sm:7px;
  --f:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --f-s:"IBM Plex Serif",Georgia,"Times New Roman",serif;   /* só para o nome do app */
  --shadow:0 1px 2px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1117; --surface:#161B22; --surface-2:#1C2430; --surface-3:#242D3A;
  --line:#28323F; --line-2:#38434F; --grid:#212B36;
  --ink:#E6EDF3; --ink-2:#8B98A8; --ink-3:#6E7B8B;
  --accent:#5B9BD5; --accent-soft:#16263A; --accent-line:#2E5478;
  --good:#4ADE9E; --good-soft:#0E2A20;
  --warn:#E0B45F; --warn-soft:#2E2513;
  --bad:#F1867A;  --bad-soft:#33201D;
  --c1:#4A8AC6; --c2:#BE7A30; --c3:#9077CE;
  --on-accent:#08131F; --on-c:#08131F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#0D1117; --surface:#161B22; --surface-2:#1C2430; --surface-3:#242D3A;
  --line:#28323F; --line-2:#38434F; --grid:#212B36;
  --ink:#E6EDF3; --ink-2:#8B98A8; --ink-3:#6E7B8B;
  --accent:#5B9BD5; --accent-soft:#16263A; --accent-line:#2E5478;
  --good:#4ADE9E; --good-soft:#0E2A20;
  --warn:#E0B45F; --warn-soft:#2E2513;
  --bad:#F1867A;  --bad-soft:#33201D;
  --c1:#4A8AC6; --c2:#BE7A30; --c3:#9077CE;
  --on-accent:#08131F; --on-c:#08131F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== esqueleto ===== */
.app{display:block}
.side{display:none}
main{padding:0 16px calc(76px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:10px;height:54px;max-width:680px;margin:0 auto;padding:0 16px}
.brand{font-family:var(--f-s);font-size:17px;font-weight:600;letter-spacing:-.012em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:9px}
.brand .marca{border-radius:7px;flex:none}
.brand[role="button"]{cursor:pointer;border-radius:8px;padding:3px 6px;margin-left:-6px}
.brand[role="button"]:hover{background:var(--surface-2)}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button,.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.mnav button:hover,.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.mnav .lbl{font-family:var(--f-m);font-size:11.5px;font-weight:500;padding:0 8px;min-width:76px;
  text-align:center;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:18px 12px;
    background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  /* o canto da marca: as duas linhas com o mesmo peso e o mesmo tamanho — nem o app nem o
     nome de quem usa pedem destaque; quem chama a atenção é o ícone. */
  .side-brand{padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:13px;width:100%;
    background:transparent;border:1px solid transparent;border-radius:11px;font-family:inherit;
    text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
  .side-brand:hover{background:var(--surface-2);border-color:var(--line)}
  .side-brand .marca{border-radius:11px;flex:none;box-shadow:0 3px 10px -4px rgba(15,23,42,.55)}
  .side-brand .side-nome{min-width:0;display:grid;gap:1px}
  .side-brand .side-nome>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-brand .side-nome>span:first-child{font-family:var(--f-s);font-size:19px;font-weight:600;
    letter-spacing:-.015em;line-height:1.1;color:var(--ink)}
  /* a linha de baixo é uma assinatura, não uma legenda: caixa alta, miúda e bem espaçada */
  .side-brand .side-nome>span+span{font-size:9.5px;font-weight:600;color:var(--ink-3);line-height:1.2;
    letter-spacing:.17em;text-transform:uppercase;margin-top:4px}
  /* nome comprido: aperta o espaçamento em vez de cortar */
  .side-brand .side-nome>span+span.comprido{font-size:9px;letter-spacing:.075em}
  .side a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);
    color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;border:0;
    background:none;width:100%;text-align:left}
  .side a:hover{background:var(--surface-2);color:var(--ink)}
  .side a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side a svg{width:17px;height:17px;flex:none}
  .side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;
    color:var(--ink-3);line-height:1.5}
  .tabs{display:none}
  main{max-width:1240px;padding:0 28px 40px}
  .top{background:var(--paper)}
  .top-in{max-width:1240px;padding:0 28px;height:62px}
  .brand{display:none}
  .top-title{display:block!important;font-size:19px;font-weight:600;letter-spacing:-.015em;flex:1}
}
.top-title{display:none}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;cursor:pointer;padding:8px 3px 9px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  border-top:2px solid transparent;margin-top:-1px}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}

.panel{padding:18px 0 8px}
.panel[hidden]{display:none}
.sec{margin:0 0 24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec-a{font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:500;padding:0}
.sec-a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:16px}
@media (min-width:960px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g23{grid-template-columns:1.5fr 1fr}
}

/* ===== figuras ===== */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
  box-shadow:var(--shadow)}
.hero-l{font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hero-v{font-size:48px;line-height:1.02;font-weight:600;letter-spacing:-.03em;display:block}
@media (min-width:960px){.hero-v{font-size:56px}}
.hero-s{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);min-width:0}
.tile-l{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.tile-v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;display:block}
.tile-d{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:5px}
.tile-d b{font-weight:600;font-family:var(--f-m);font-size:11px}
.up{color:var(--bad)} .down{color:var(--good)} .flat{color:var(--ink-3)}

/* medidor: trilho é passo claro da mesma rampa */
.meter{height:9px;border-radius:5px;background:var(--accent-soft);overflow:hidden;display:flex;
  border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter-s{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink-3);
  margin-top:6px;font-family:var(--f-m);font-variant-numeric:tabular-nums}

/* ===== gráficos ===== */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.ch-t{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ch-s{font-size:12px;color:var(--ink-3);margin-bottom:14px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;
  border-radius:var(--r-sm);font-size:12px;line-height:1.4;z-index:5;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.22);transform:translate(-50%,-100%)}
.tip[hidden]{display:none}
.tip b{font-family:var(--f-m);font-weight:600;display:block;font-size:12.5px}
.tip .mais{display:block;margin-top:3px;opacity:.75;font-size:11px;white-space:normal}

/* ===== dica ao parar o mouse (3s) ou no toque longo ===== */
[data-dica]{cursor:help}
#dica{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--paper);
  padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.5;
  box-shadow:0 8px 24px rgba(0,0,0,.28);transform:translate(-50%,-100%);pointer-events:none}

/* ---- dinheiro em centavos ---- */
const BRL = new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" });
const NUM = new Intl.NumberFormat("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const INT = new Intl.NumberFormat("pt-BR", { maximumFractionDigits:0 });
const fmt  = c => BRL.format((c || 0) / 100);

const fmtK = c => { const v = (c||0)/100; return Math.abs(v) >= 1000 ? (v/1000).toFixed(Math.abs(v)>=10000?0:1).replace(".",",")+"k" : INT.format(v); };
function toCents(str){
  if (typeof str === "number") return Math.round(str * 100);
  let s = String(str || "").trim().replace(/r\$\s*/i,"").replace(/\s/g,"");
  if (!s) return 0;
  const neg = /^-/.test(s); s = s.replace(/^-/,"");
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d+\.\d{3}$/.test(s)) s = s.replace(".","");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -1 : 1) * Math.round(n * 100);
}

const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };

function loadLocal(){

function saveLocal(){

/* junta duas versões: lançamentos pela união; em conflito, vence o mais recente */
function mergeData(a,b){
  const out={months:{}}, A=a.months||{}, B=b.months||{};
  new Set(Object.keys(A).concat(Object.keys(B))).forEach(ym=>{
    const x=(A[ym]&&A[ym].tx)||{}, y=(B[ym]&&B[ym].tx)||{}, tx={};
    new Set(Object.keys(x).concat(Object.keys(y))).forEach(id=>{
      const p=x[id], q=y[id]; tx[id]=!p?q:!q?p:((q.u||0)>(p.u||0)?q:p); });
    out.months[ym]={tx}; });
  const ca=a.cfg||{}, cb=b.cfg||{};
  out.cfg=(cb.u||0)>(ca.u||0)?cb:ca;
  return out; }

/* ---- login com Google (Google Identity Services) ---- */
let tokenClient=null, tokenWait=null;
const gisReady=()=>!!(window.google&&google.accounts&&google.accounts.oauth2);
const tokenOk=()=>!!(S.token&&Date.now()<S.tokenExp-60000);
function loadGis(){ return new Promise((ok,no)=>{
  if(gisReady()) return ok();
  let s=document.getElementById("gisjs");
  if(!s){ s=document.createElement("script"); s.id="gisjs"; s.src="https://accounts.google.com/gsi/client"; s.async=true; document.head.appendChild(s); }
  s.addEventListener("load",()=>gisReady()?ok():no({code:"gis"}));
  s.addEventListener("error",()=>no({code:"gis"})); }); }
function initTokenClient(){
  if(tokenClient||!gisReady()||!CFG.googleClientId) return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CFG.googleClientId,
    scope:"openid email profile "+SCOPE_DRIVE,
    callback:r=>{ const w=tokenWait; tokenWait=null; if(!w) return;
      if(r.error) return w.no({code:"auth",msg:r.error});
      if(!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE_DRIVE)) return w.no({code:"scope"});
      S.token=r.access_token; S.tokenExp=Date.now()+(+r.expires_in||3600)*1000;
      if(S.user&&S.user.kind==="google") saveToken();
      w.ok(S.token); },
    error_callback:e=>{ const w=tokenWait; tokenWait=null; if(w) w.no({code:"auth",msg:e&&e.type}); } }); }
function ensureGis(){ return CFG.googleClientId?loadGis().then(initTokenClient):Promise.reject({code:"noclient"}); }
/* tem de ser chamado direto do toque, senão o navegador bloqueia a janela do Google */
function getToken(interactive){
  if(tokenOk()) return Promise.resolve(S.token);
  if(!CFG.googleClientId) return Promise.reject({code:"noclient"});
  if(!interactive) return Promise.reject({code:"tap"});
  if(!tokenClient) return Promise.reject({code:"gis"});
  return new Promise((ok,no)=>{ tokenWait={ok,no};
    const known=S.user&&S.user.kind==="google";
    tokenClient.requestAccessToken({prompt:known?"":"select_account",
      login_hint:known?S.user.email:undefined, hint:known?S.user.email:undefined}); }); }
function saveToken(){ if(S.user) lsSet(K.tk(S.user.id),JSON.stringify({t:S.token,e:S.tokenExp})); }
function restoreToken(){ if(!S.user) return;
  try{ const d=JSON.parse(lsGet(K.tk(S.user.id))||"null");
    if(d&&d.t&&Date.now()<d.e-60000){ S.token=d.t; S.tokenExp=d.e; } }catch(e){} }
function authMsg(e){ const c=e&&e.code;
  if(c==="noclient") return "O login com Google ainda não foi configurado neste app.";
  if(c==="gis") return "Não consegui carregar o login do Google. Verifique a internet e tente de novo.";
  if(c==="scope") return "Para guardar no Drive, marque a permissão do Google Drive na tela do Google.";
  if(c==="tap") return "Toque em Sincronizar para enviar ao Drive.";
  if(c==="other") return "Você entrou com outra conta Google ("+(e.email||"")+"). Entre com "+(S.user?S.user.email:"a sua")+".";
  if(c==="auth"&&e.msg==="popup_failed_to_open") return "O navegador bloqueou a janela do Google. Permita janelas pop-up para este site e toque de novo.";
  if(c==="auth"&&e.msg==="popup_closed") return "A janela do Google foi fechada antes de terminar. Toque de novo para entrar.";
  if(c==="auth"&&e.msg==="access_denied") return "Você não autorizou o acesso na tela do Google. Sem ele, os dados não vão para o seu Drive.";
  if(c==="auth") return "O Google não liberou o acesso"+(e.msg?" ("+e.msg+")":"")+".";
  if(c==="http") return "O Drive respondeu com erro "+e.status+". Tente de novo em instantes.";
  return "Algo deu errado. Tente de novo."; }
async function whoAmI(){
  const r=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+S.token}});
  if(!r.ok) throw {code:"http",status:r.status};
  return r.json(); }
function googleSignIn(){
  const err=$("#gErr"); if(err) err.hidden=true;
  getToken(true).then(async()=>{
    const p=await whoAmI(), tk={t:S.token,e:S.tokenExp};
    useUser({id:"g:"+p.sub,email:p.email||"",name:p.given_name||p.name||p.email||"Você",
      full:p.name||p.given_name||"",kind:"google"});
    S.token=tk.t; S.tokenExp=tk.e; saveToken(); syncNow();
  }).catch(e=>{ if(err){ err.hidden=false; err.textContent=authMsg(e); } }); }
function syncTap(){
  if(!S.user) return;
  if(S.user.kind!=="google"){ openAccount(); return; }
  getToken(true).then(async()=>{ const p=await whoAmI();
    if("g:"+p.sub!==S.user.id){ S.token=null; lsDel(K.tk(S.user.id)); throw {code:"other",email:p.email}; }
    await syncNow();
  }).catch(e=>{ S.sync.state=e&&e.code==="tap"?"idle":"erro"; S.sync.err=authMsg(e); renderSyncBadge(); toast(authMsg(e)); }); }

/* ---- Google Drive ---- */
async function gfetch(url,opt){
  const tk=await getToken(false);
  opt=opt||{}; opt.headers=Object.assign({Authorization:"Bearer "+tk},opt.headers||{});
  const r=await fetch(url,opt);
  if(r.status===401){ S.token=null; if(S.user) lsDel(K.tk(S.user.id)); throw {code:"tap"}; }
  if(r.status===403){ const t=await r.text(); throw /insufficient|scope/i.test(t)?{code:"scope"}:{code:"http",status:403}; }
  if(!r.ok) throw {code:"http",status:r.status};
  return r; }
async function findFile(name,parent,folder){
  const q=["name='"+name+"'","trashed=false"];
  if(folder) q.push("mimeType='application/vnd.google-apps.folder'");
  if(parent) q.push("'"+parent+"' in parents");
  const r=await gfetch(DRIVE+"/files?spaces=drive&pageSize=5&fields=files(id,name)&q="+encodeURIComponent(q.join(" and ")));
  return ((await r.json()).files||[])[0]||null; }
async function ensureFolder(){
  if(S.folderId) return S.folderId;
  let f=await findFile("Caderneta",null,true);
  if(!f){ const r=await gfetch(DRIVE+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:"Caderneta",mimeType:"application/vnd.google-apps.folder"})}); f=await r.json(); }
  return (S.folderId=f.id); }
async function readJson(id){ return (await gfetch(DRIVE+"/files/"+id+"?alt=media")).json(); }
async function writeJson(name,parent,data,id){
  const body=JSON.stringify(data);
  if(id){ await gfetch(UPLOAD+"/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body}); return id; }
  const b="caderneta"+Date.now();
  const mp="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,parents:[parent],mimeType:"application/json"})+
    "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";
  const r=await gfetch(UPLOAD+"/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp});
  return (await r.json()).id; }

/* ---- sincronização ---- */
let syncTimer=null, syncing=false, syncAgain=false;
function scheduleSync(){ if(!S.user||S.user.kind!=="google") return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ if(tokenOk()) syncNow(); else renderSyncBadge(); },2000); }
/* o nome completo só chegava no login. Quem já estava logado ficava com o primeiro nome
   guardado — então, com o acesso válido, o app pergunta ao Google uma vez e completa. */
async function garantirNomeCompleto(){
  if(!S.user||S.user.kind!=="google"||S.user.full||!tokenOk()||!navigator.onLine) return;
  try{ const p=await whoAmI();
    const n=(p&&(p.name||p.given_name))||"";
    if(n&&S.user&&S.user.kind==="google"){ S.user.full=n; rememberUser(S.user); renderNav(); }
  }catch(e){ warn(e); } }

async function syncNow(){
  if(!S.user||S.user.kind!=="google") return;
  if(syncing){ syncAgain=true; return; }
  if(!navigator.onLine||!tokenOk()){ renderSyncBadge(); return; }
  syncing=true; S.sync.state="sync"; renderSyncBadge();
  const who=S.user.id, marca=()=>JSON.stringify(S.months)+"|"+(S.cfg.u||0), antes=marca();
  try{
    const pasta=await ensureFolder();
    const f=await findFile("caderneta-dados.json",pasta);
    const remoto=f?await readJson(f.id):null;
    if(!S.user||S.user.id!==who) return;
    /* aparelho zerado (reinstalou, limpou os dados, trocou de celular): o que está no Drive é a verdade.
       Sem isso, a configuração em branco poderia vencer pela data e apagar cartões, categorias e fixos. */
    const baseVazia=!Object.keys(S.months||{}).length&&!S.cfg.seen&&!(S.cfg.dividas||[]).length;
    const junto=!remoto?{cfg:S.cfg,months:S.months}
      :baseVazia?{cfg:remoto.cfg||S.cfg,months:remoto.months||{}}
      :mergeData({cfg:S.cfg,months:S.months},remoto);
    const pacote={app:"caderneta",v:2,conta:S.user.email,salvoEm:new Date().toISOString(),cfg:junto.cfg,months:junto.months};
    await writeJson("caderneta-dados.json",pasta,pacote,f&&f.id);
    const nome="backup-"+ymOf(todayISO())+".json";           /* uma cópia por mês = histórico */
    if(!S.snap||S.snap.name!==nome){ const sf=await findFile(nome,pasta); S.snap={name:nome,id:sf&&sf.id}; }
    S.snap.id=await writeJson(nome,pasta,pacote,S.snap.id);
    if(!S.user||S.user.id!==who) return;
    const mudouNoMeio=marca()!==antes;                        /* lançou algo enquanto sincronizava */
    const fim=baseVazia?junto:mergeData({cfg:S.cfg,months:S.months},junto);
    const chegouNovidade=JSON.stringify(fim.months)!==JSON.stringify(S.months)||(fim.cfg.u||0)!==(S.cfg.u||0);
    S.cfg=Object.assign(DEFAULTS(),fim.cfg); S.months=fim.months; S.sincronizado=true; migrarCfg(); setTimeout(()=>garantirSalario(),0);
    S.sync.last=Date.now(); S.sync.state="ok"; S.sync.err=""; S.dirty=mudouNoMeio; saveLocal();
    garantirNomeCompleto();
    if(chegouNovidade) safeRender(); else renderSyncBadge();
    if(mudouNoMeio) syncAgain=true;
  }catch(e){
    S.sync.state=e&&e.code==="tap"?"idle":"erro"; S.sync.err=authMsg(e); renderSyncBadge(); console.warn("sincronização",e);
  }finally{ syncing=false; if(syncAgain){ syncAgain=false; scheduleSync(); } } }

/* a assinatura embaixo da marca: primeiro e último nome, descartando os do meio
   ("Maria Aparecida de Souza Lima" vira "Maria Lima"). Partículas não contam como sobrenome. */
function nomeAssinatura(u){
  const n=String((u&&(u.full||u.name))||"").replace(/\s+/g," ").trim();
  if(!n) return "";
  const part=/^(de|da|do|das|dos|e|di|du|del|della|van|von|la|le)$/i;
  const p=n.split(" ").filter(x=>x&&!part.test(x));
  if(p.length<2) return p[0]||n;
  return p[0]+" "+p[p.length-1]; }

/* =================== leitura da fala =================== */
const NW = {zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,meia:6,sete:7,oito:8,nove:9,
  dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezasseis:16,dezessete:17,
  dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,
  noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,
  quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,
  oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
const SC = {mil:1000, milhao:1e6, milhoes:1e6};
const MOEDA = /^(reais?|conto|contos|pila|pilas|mango|mangos|pratas)$/;
const CENT  = /^(centavos?)$/;
const STOP  = /^(ah|ai|ei|entao|tipo|assim|olha|opa|beleza|ok|e|de|do|da|no|na|em|com|pra|para|por|foi|um|uma|o|a|os|as|meu|minha|hoje|agora|paguei|gastei|comprei|foram|reais|real|deu|custou|ficou|la|aqui|que|se|ao|aos|recebi|recebido|recebida|caiu|entrou|depositei|ganhei|entrada)$/;
const ENTRADA = /^(recebi|recebido|recebida|receber|caiu|entrou|entrada|depositei|deposito|ganhei|salario|holerite|contracheque|freela|freelance|bolsa|estagio|reembolso|estorno|restituicao|rendimento|rendimentos|dividendo|dividendos|vendi|adiantamento|decimo|prolabore|plr)$/;

/* "trinta e nove" soma; "trinta e nove e noventa" não: em português a composição só desce
   (centena → dezena → unidade). O que vem depois, maior ou igual, já são os centavos. */
function readWords(t,i){ let total=0,cur=0,any=false,j=i,last=Infinity;
  while(j<t.length){ const w=t[j];
    if(w==="e"&&any){ const nx=t[j+1];
      if(nx&&(nx in SC)){ j++; continue; }
      if(nx&&(nx in NW)&&NW[nx]<last){ j++; continue; }
      break; }
    if(w in NW){ if(any&&NW[w]>=last) break; cur+=NW[w]; last=NW[w]; any=true; j++; continue; }
    if(w in SC){ total+=(cur||1)*SC[w]; cur=0; last=Infinity; any=true; j++; continue; }
    break; }
  return any ? {v:total+cur, end:j} : null; }
function readDigits(w){ if(!/\d/.test(w)||!/^\d[\d.,]*$/.test(w)) return null;
  let s=w; if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isNaN(n)?null:n; }

function parseOne(raw,cfg){
  const original = raw.trim();
  const prep = original.replace(/R\$/gi," R$ ").replace(/(\d)\s*[xX]\b/g,"$1 vezes ");
  const orig = prep.split(/\s+/).filter(Boolean);
  const t = orig.map(w=>deacc(w.toLowerCase()).replace(/[^\w$]/g,""));
  const used = new Array(t.length).fill(false);
  const take = (a,b)=>{ for(let k=a;k<b;k++) used[k]=true; };
  const d = {id:uid(), raw:original, v:0, desc:"", cat:"", method:"", cardId:"", n:1,
             date:todayISO(), time:nowTime(), msg:"", k:"g"};

  for(let i=0;i<t.length;i++) if(ENTRADA.test(t[i])){ d.k="e"; break; }

  /* parcelas */
  for(let i=0;i<t.length;i++){
    if(!/^(vezes|parcelas|parcelado|prestacoes)$/.test(t[i])) continue;
    let found=null;
    for(let k=Math.max(0,i-4);k<i;k++){
      const dg=readDigits(t[k]);
      if(dg!==null&&dg>=2&&dg<=60) found={v:dg,a:k,b:k+1};
      else { const w=readWords(t,k); if(w&&w.end===i&&w.v>=2&&w.v<=60) found={v:w.v,a:k,b:w.end}; } }
    if(!found) for(let k=i+1;k<Math.min(t.length,i+4);k++){
      const dg=readDigits(t[k]); if(dg!==null&&dg>=2&&dg<=60){ found={v:dg,a:k,b:k+1}; break; }
      const w=readWords(t,k); if(w&&w.v>=2&&w.v<=60){ found={v:w.v,a:k,b:w.end}; break; } }
    if(found){ d.n=found.v; take(found.a,found.b); take(i,i+1);
      if(found.a>0&&/^(em|de)$/.test(t[found.a-1])) take(found.a-1,found.a); break; } }

  /* forma de pagamento */
  for(let i=0;i<t.length;i++){
    if(used[i]) continue;
    let m="";
    if(/^credito$/.test(t[i])) m="credito";
    else if(/^debito$/.test(t[i])) m="debito";
    else if(/^(dinheiro|especie|vivo)$/.test(t[i])) m="dinheiro";
    else if(/^pix$/.test(t[i])) m="pix";
    else if(/^(transferencia|transferi|transferir|transferido|ted|doc)$/.test(t[i])) m="transferencia";
    else if(/^boleto$/.test(t[i])) m="boleto";
    if(!m) continue;
    d.method=m; take(i,i+1);
    let k=i-1;
    while(k>=0&&/^(de|do|da|no|na|em|o|a)$/.test(t[k])){ take(k,k+1); k--; }
    if(k>=0&&/^(cartao|cartoes)$/.test(t[k])){ take(k,k+1); k--;
      while(k>=0&&/^(no|na|em|o|do)$/.test(t[k])){ take(k,k+1); k--; } }
    break; }

  /* cartão / bandeira */
  const aliasMap=[];
  cfg.cards.forEach(c=>norm(c.alias+" "+c.n).split(" ").filter(w=>w.length>2).forEach(w=>aliasMap.push({w,id:c.id})));
  Object.keys(cfg.kwCard||{}).forEach(w=>aliasMap.push({w:deacc(w), id:cfg.kwCard[w]}));
  const hits={}, cardIdx=[];
  for(let i=0;i<t.length;i++){
    if(used[i]||t[i].length<3) continue;
    const m=aliasMap.filter(a=>a.w===t[i]); if(!m.length) continue;
    m.forEach(a=>{ hits[a.id]=(hits[a.id]||0)+1; }); take(i,i+1); cardIdx.push(i); }
  const best=Object.keys(hits).sort((a,b)=>hits[b]-hits[a])[0];
  if(best){ d.cardId=best; const c=cfg.cards.find(x=>x.id===best); if(c&&!d.method) d.method=c.type;
    const nx=Math.max.apply(null,cardIdx)+1;
    const ban=/^(credito|debito|dinheiro|especie|pix|boleto|cartao|cartoes|vezes|parcelas|reais?)$/;
    if(nx<t.length&&!used[nx]&&t[nx].length>2&&!(t[nx] in NW)&&!(t[nx] in SC)&&!ban.test(t[nx])){
      let tail=true; for(let k=nx+1;k<t.length;k++) if(!used[k]&&t[k]){ tail=false; break; }
      if(tail){ take(nx,nx+1); d.alias=t[nx]; } } }
  if(!d.method) d.method = d.k==="e" ? "pix" : "credito";
  if(!d.cardId){ const c=cfg.cards.find(x=>x.type===d.method); if(c) d.cardId=c.id; }
  if(d.k==="e"){ d.n=1; d.acct=acctOf(d.cardId); }
  /* "saquei duzentos reais": sai da conta corrente e vai para a carteira; não é gasto */
  if(d.k==="g"&&t.some(w=>/^(saque|saquei|sacar|sacou|sacamos)$/.test(w))){
    const A=cfg.accounts||[]; d.k="t"; d.n=1; d.method="transferencia"; d.cardId="transf";
    d.acct=(A.find(a=>a.type==="corrente")||A[0]||{}).id||""; d.acct2=(A.find(a=>a.type==="carteira")||{}).id||""; }

  /* quando vai ser: "dia 10", "amanhã", "dia 5 de outubro", "10/10" — é assim que se agenda falando.
     Vem antes do valor, para o número do dia não virar o valor do lançamento. */
  const quando=dataDaFala(t,orig,used,take);
  if(quando){ d.date=quando; d.agendado=quando>todayISO(); }

  /* valor */
  let cand=null;
  for(let i=0;i<t.length;i++){
    if(used[i]) continue;
    let v=null,a=i,b=i;
    const dg=readDigits(t[i]);
    if(dg!==null){ v=dg; b=i+1; } else { const w=readWords(t,i); if(w){ v=w.v; b=w.end; } }
    if(v===null) continue;
    let score=1,end=b;
    if(b<t.length&&MOEDA.test(t[b])){ score=10; end=b+1; }
    if(a>0&&t[a-1]==="r$"){ score=10; a=a-1; }
    /* centavos: "e noventa centavos" e também o jeito de falar "trinta e nove e noventa" */
    if(end<t.length){ let k=end; const temE=t[k]==="e"; if(temE) k++;
      const cw = readDigits(t[k])!==null ? {v:readDigits(t[k]), end:k+1} : readWords(t,k);
      if(cw&&cw.v<100&&cw.v===Math.round(cw.v)){
        const temCent=CENT.test(t[cw.end]||"");
        if(temCent){ v+=cw.v/100; end=cw.end+1; score=10; }
        else if(temE&&cw.v>=10){ v+=cw.v/100; end=cw.end; if(score<10) score=9; } } }
    const sc=score-i*0.001;
    if(!cand||sc>cand.score) cand={v,a,b:end,score:sc}; }
  if(cand){ d.v=Math.round(cand.v*100); take(cand.a,cand.b); }

function guessCat(text,cfg,kind){

  if(!isE) Object.keys(cfg.kwCat||{}).forEach(w=>consider(cfg.kwCat[w],deacc(w.toLowerCase()),5000));

/* a data dita na frase. Sem mês, "dia 10" é o próximo dia 10 — mas até três dias para trás continua neste mês,

const MESES_FALA={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12,
  jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function dataDaFala(t,orig,used,take){
  const h=new Date(), Y=h.getFullYear(), M=h.getMonth()+1, D=h.getDate();
  const dias=n=>{ const x=new Date(Date.parse(todayISO()+"T12:00:00")+n*86400000); return x.toISOString().slice(0,10); };
  const monta=(dia,mes,ano)=>{
    let mo=mes||M, y=ano||Y;
    if(!mes){ if(dia<D-3) mo=M+1; }
    else if(!ano&&mo<M) y=Y+1;
    if(mo>12){ mo-=12; y++; }
    const dim=new Date(y,mo,0).getDate();
    return y+"-"+pad(mo)+"-"+pad(Math.min(Math.max(1,dia),dim)); };
  for(let i=0;i<t.length;i++){
    if(used[i]) continue;
    if(t[i]==="hoje"){ take(i,i+1); return todayISO(); }
    if(t[i]==="amanha"){ take(i,i+1); return dias(1); }
    if(t[i]==="ontem"){ take(i,i+1); return dias(-1); }
    if(t[i]==="depois"&&t[i+1]==="de"&&t[i+2]==="amanha"){ take(i,i+3); return dias(2); }
    /* 10/10 ou 10/10/2026 (o token normalizado perde a barra: vale o original) */
    const mb=String(orig[i]||"").match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?[.,;]?$/);
    if(mb&&+mb[1]>=1&&+mb[1]<=31&&+mb[2]>=1&&+mb[2]<=12){
      take(i,i+1); const a=mb[3]?(mb[3].length===2?2000+(+mb[3]):+mb[3]):0;
      return monta(+mb[1],+mb[2],a); }
    if(t[i]!=="dia"&&t[i]!=="no") continue;
    let k=i+1; if(t[i]==="no"){ if(t[k]!=="dia") continue; k++; }
    let dia=readDigits(t[k]), fim=k+1;
    if(dia===null){ const w=readWords(t,k); if(w&&w.v>=1&&w.v<=31){ dia=w.v; fim=w.end; } }
    if(dia===null||dia<1||dia>31) continue;
    let mes=0, ano=0;
    let j=fim; if(t[j]==="de"||t[j]==="do") j++;
    if(MESES_FALA[t[j]]){ mes=MESES_FALA[t[j]]; fim=j+1;
      let q=fim; if(t[q]==="de") q++;
      const ay=readDigits(t[q]); if(ay&&ay>2000&&ay<2100){ ano=ay; fim=q+1; } }
    else if((t[j]==="mes"||t[j]==="do"&&t[j+1]==="mes")&&/que/.test(t[j+1]+t[j+2])){ mes=M+1; fim=j+3; }
    take(i,fim);
    return monta(dia,mes,ano); }
  return ""; }

  const parts=porParcela?new Array(n).fill(total):splitCents(total,n); const planTotal=porParcela?total*n:total; const planId=n>1?uid():"";
  const touched=new Set();
  /* compra no crédito: o gasto fica no mês do dia da compra; "fat" é a fatura que a cobra (o fechamento empurra para a seguinte).
     Parcela k: gasto no mês da compra + k-1, fatura na fatura da 1ª + k-1. Numa fatura importada, a linha de uma parcela pode

    let ym = cred ? ymShift(gasto0,i-(i0-1)) : kind==="g" ? txMonth(d.date,d.cardId,i) : ymOf(d.date);

      desc:d.desc||"Sem descrição", cat:d.cat||(kind==="e"?"outrae":"outros"),

      fix:d.fix||"", k:kind, acct:kind==="t"?(d.acct||""):(d.acct||acctOf(d.cardId)), acct2:d.acct2||"", ref:d.ref||"", to:d.to||"", u:Date.now(),
      ...(fat?{fat}:{}), ...(d.aj?{aj:1}:{}), ...(d.cons?{cons:d.cons}:{}), ...(d.emp?{emp:d.emp}:{}) };
    touched.add(ym); }
  if(kind==="g") learn(d);
  for(const ym of touched) await saveMonth(ym);
  if(kind==="e"&&d.cat==="sal"&&!d.auto) await descontarConsignados(ymOf(d.date),d.id);
  return true; }

function monthStats(ym){

  const today=todayISO(), isCur=ym===ymOf(today), dim=daysIn(ym);

function buildInsights(ym){

  const top=ents[0];
  out.push({tone:"", t:catName(top.id)+" lidera o mês",
    s:"Levou <b>"+fmt(top.v)+"</b>, ou <b>"+Math.round(top.v/tot*100)+"%</b> de tudo que saiu."});

  /* comparação com a média dos 3 meses anteriores */
  const prev=[1,2,3].map(i=>monthStats(ymShift(ym,-i))).filter(x=>x.spent>0);

    const med={}; prev.forEach(p=>Object.keys(p.byCat).forEach(c=>{ med[c]=(med[c]||0)+p.byCat[c]/prev.length; }));
    let worst=null;

      s:"Média dos últimos meses: <b>"+fmt(Math.round(worst.base))+"</b>. Neste: <b>"+fmt(worst.v)+"</b>."});
    let bestDrop=null;
    ents.forEach(e=>{ const base=med[e.id]||0; if(base<5000) return;
      const dif=(e.v-base)/base; if(dif<-0.25&&(!bestDrop||dif<bestDrop.dif)) bestDrop={id:e.id,dif,base,v:e.v}; });
    if(bestDrop) out.push({tone:"good", t:catName(bestDrop.id)+" caiu "+Math.round(-bestDrop.dif*100)+"%",
      s:"De <b>"+fmt(Math.round(bestDrop.base))+"</b> na média para <b>"+fmt(bestDrop.v)+"</b>."}); }

      (big.n>1?" — parcela "+big.i+" de "+big.n:"")+"."});

      const diaEstoura=Math.ceil((st.cap-st.commit)/diario);
      if(diaEstoura<st.dim) out.push({tone:"bad", t:"No ritmo atual, o teto acaba no dia "+diaEstoura,
        s:"Você gasta <b>"+fmt(Math.round(diario))+"</b> por dia e o mês tem "+st.dim+" dias."});
      else out.push({tone:"good", t:"O ritmo cabe no teto",
        s:"A <b>"+fmt(Math.round(diario))+"</b> por dia, o mês fecha em <b>"+fmt(Math.round(st.pace))+"</b>."}); } }

  /* categorias com limite estourado */
  const furados=ents.filter(e=>catLimit(e.id)>0&&e.v>catLimit(e.id));
  if(furados.length) out.push({tone:"bad", t:furados.length===1?"1 categoria passou do limite":furados.length+" categorias passaram do limite",
    s:furados.slice(0,3).map(e=>catName(e.id)+" <b>"+fmt(e.v)+"</b> de "+fmt(catLimit(e.id))).join(" · ")});

  /* parcelas comprometendo o futuro */
  const fut=futureMonths(6,ymShift(ymOf(todayISO()),1));
  const parcFut=fut.reduce((s,f)=>s+f.parc,0);
  if(parcFut>0) out.push({tone:"warn", t:"Parcelas já comprometem os próximos 6 meses",
    s:"<b>"+fmt(parcFut)+"</b> reservados antes de você gastar qualquer coisa."});

  /* forma de pagamento dominante */
  const byM={}; st.gastos.forEach(t=>{ byM[t.method]=(byM[t.method]||0)+t.v; });
  const mTop=Object.keys(byM).sort((a,b)=>byM[b]-byM[a])[0];
  if(mTop&&byM[mTop]/tot>0.5) out.push({tone:"", t:"Quase tudo no "+(METODOS[mTop]||mTop).toLowerCase(),
    s:"<b>"+Math.round(byM[mTop]/tot*100)+"%</b> dos gastos passaram por aí."});
  return out; }
/* =================== gráficos =================== */
function niceMax(v){ if(v<=0) return 100;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }
function ticks(max,n){ const out=[]; for(let i=0;i<=n;i++) out.push(max*i/n); return out; }
/* ponta arredondada só no fim do dado; base quadrada */
function pathRight(x,y,w,h,r){ r=Math.min(r,h/2,Math.max(0,w));
  if(w<=r) return "M"+x+" "+y+"h"+w+"v"+h+"h"+(-w)+"z";
  return "M"+x+" "+y+"h"+(w-r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-2*r)+"a"+r+" "+r+" 0 0 1 "+(-r)+" "+r+"h"+(-(w-r))+"z"; }
function pathTop(x,y,w,h,r){ r=Math.min(r,w/2,Math.max(0,h));
  if(h<=r) return "M"+x+" "+(y+h)+"v"+(-h)+"h"+w+"v"+h+"z";
  return "M"+x+" "+(y+h)+"v"+(-(h-r))+"a"+r+" "+r+" 0 0 1 "+r+" "+(-r)+"h"+(w-2*r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-r)+"z"; }

/* barras horizontais, uma cor só: comprimento já codifica magnitude */
function chartBarsH(rows,opt){
  opt=opt||{}; const W=560, RH=38, PAD=2;
  if(!rows.length) return '<div class="empty"><b>Nada para mostrar</b>Lance alguns gastos primeiro.</div>';
  const max=Math.max.apply(null,rows.map(r=>r.v))||1;
  const H=rows.length*RH+PAD;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.alt||"Gastos por categoria")+'">';
  rows.forEach((r,i)=>{
    const y=i*RH+PAD, bw=Math.max(2,(r.v/max)*W);
    s+='<text x="0" y="'+(y+11)+'" style="fill:var(--ink);font:500 12.5px var(--f)">'+esc(r.label)+'</text>';
    s+='<text x="'+W+'" y="'+(y+11)+'" text-anchor="end" style="fill:var(--ink-2);font:500 12px var(--f-m);font-variant-numeric:tabular-nums">'+fmtN(r.v)+(r.pct!=null?'  <tspan style="fill:var(--ink-3)">'+r.pct+'%</tspan>':'')+'</text>';
    s+='<rect x="0" y="'+(y+18)+'" width="'+W+'" height="12" rx="4" style="fill:var(--surface-2)"/>';
    s+='<path d="'+pathRight(0,y+18,bw,12,4)+'" style="fill:var(--accent)"/>';
    if(r.limit>0){ const lx=Math.min(W,(r.limit/max)*W);
      s+='<rect x="'+(lx-1)+'" y="'+(y+15)+'" width="2" height="18" style="fill:var(--ink-3)"/>'; }
    s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+RH+'" style="fill:transparent" data-tip="'+esc(r.tip||(r.label+" — "+fmt(r.v)))+'"'+attrLeitura(r)+'/>'; });
  return s+'</svg>'; }

/* linha: acumulado real contra o ritmo que cabe no teto */
function chartPace(ym){
  const st=monthStats(ym), W=560, H=190, L=44, B=24, T=8;
  const dim=st.dim, cap=st.cap||0;
  const byDay=new Array(dim+1).fill(0);
  st.gastos.forEach(t=>{ const d=+t.d.slice(8,10); if(d>=1&&d<=dim) byDay[d]+=t.v; });
  const acc=[]; let run=0;
  const lastDay=st.isCur?st.dayNow:(ym<ymOf(todayISO())?dim:0);
  for(let d=1;d<=dim;d++){ run+=byDay[d]; if(d<=lastDay||!st.isCur) acc.push({d,v:run}); }
  if(!acc.length) return '<div class="empty"><b>Sem lançamentos ainda</b>A curva aparece no primeiro gasto do mês.</div>';
  const max=niceMax(Math.max(cap,run)||1);
  const X=d=>L+((d-1)/(dim-1))*(W-L-6);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto acumulado contra o ritmo do teto">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  [1,Math.round(dim/2),dim].forEach(d=>{
    s+='<text x="'+X(d)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+d+'</text>'; });
  if(cap>0) s+='<line x1="'+X(1)+'" y1="'+Y(cap/dim)+'" x2="'+X(dim)+'" y2="'+Y(cap)+'" style="stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;opacity:.55"/>';
  const dpath=acc.map((p,i)=>(i?"L":"M")+X(p.d)+" "+Y(p.v)).join(" ");
  s+='<path d="'+dpath+" L"+X(acc[acc.length-1].d)+" "+Y(0)+" L"+X(acc[0].d)+" "+Y(0)+'z" style="fill:var(--accent);opacity:.1"/>';
  s+='<path d="'+dpath+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
  const last=acc[acc.length-1];
  s+='<circle cx="'+X(last.d)+'" cy="'+Y(last.v)+'" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>';
  s+='<text x="'+Math.min(W-4,X(last.d)+10)+'" y="'+(Y(last.v)-9)+'" text-anchor="'+(X(last.d)>W-90?"end":"start")+'" style="fill:var(--ink);font:600 11.5px var(--f-m)">'+fmtN(last.v)+'</text>';
  acc.forEach(p=>{ const bw=(W-L-6)/dim;
    const ritmo=cap?Math.round(cap*p.d/dim):0;
    const f=["No dia "+p.d+" você já tinha gasto "+fmt(p.v)+" no mês."];
    if(cap){ f.push("O ritmo que cabe no teto nesse dia é "+fmtN(ritmo)+", então você estava "+
        (p.v>ritmo?fmtN(p.v-ritmo)+" à frente do ritmo":fmtN(ritmo-p.v)+" dentro do ritmo")+".");
      const resto=dim-p.d; if(resto>0) f.push("Sobravam "+resto+" dias e "+fmtN(Math.max(0,cap-p.v))+" do teto — "+fmtN(Math.max(0,(cap-p.v)/resto))+" por dia.");
      f.push("Mantido esse passo, o mês fecharia em "+fmtN(Math.round(p.v/p.d*dim))+"."); }
    s+='<rect x="'+(X(p.d)-bw/2)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="Dia '+p.d+" — acumulado "+fmt(p.v)+(cap?" · ritmo "+fmt(ritmo):"")+'" data-leitura="'+esc(f.join(" "))+'" data-lt="Dia '+p.d+' de '+esc(ymLabel(ym))+'" style="cursor:pointer"/>'; });
  return s+'</svg>'; }

/* colunas com linha de referência do teto */
function chartCols(rows,opt){
  opt=opt||{}; const W=560,H=180,L=44,B=26,T=10,n=rows.length;
  const ref=opt.ref||0;
  const max=niceMax(Math.max(ref,Math.max.apply(null,rows.map(r=>r.v)))||1);
  const band=(W-L-6)/n, bw=Math.min(24,band-10);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.alt||"Histórico")+'">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  rows.forEach((r,i)=>{
    const cx=L+band*i+band/2, h=Math.max(1,(r.v/max)*(H-T-B)), y=Y(r.v);
    s+='<path d="'+pathTop(cx-bw/2,y,bw,h,4)+'" style="fill:'+(r.color||"var(--accent)")+'"/>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+esc(r.label)+'</text>';
    s+='<rect x="'+(cx-band/2)+'" y="'+T+'" width="'+band+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="'+esc(r.tip||(r.label+" — "+fmt(r.v)))+'"'+attrLeitura(r)+'/>'; });
  if(ref>0){ const y=Y(ref);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--bad);stroke-width:2;stroke-linecap:round"/>';
    s+='<text x="'+W+'" y="'+(y-6)+'" text-anchor="end" style="fill:var(--ink-2);font:600 10.5px var(--f)">teto '+fmtK(ref)+'</text>'; }
  return s+'</svg>'; }

/* colunas empilhadas: ordem fixa azul -> cobre -> roxo (cobre separa o par que colapsa sob CVD) */
function chartStack(rows,series,opt){
  opt=opt||{}; const W=560,H=190,L=44,B=26,T=10,n=rows.length,GAP=2;
  const ref=opt.ref||0;
  const tot=r=>series.reduce((s,k)=>s+(r[k.key]||0),0);
  const max=niceMax(Math.max(ref,Math.max.apply(null,rows.map(tot)))||1);
  const band=(W-L-6)/n, bw=Math.min(24,band-10);
  const Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.alt||"Comprometido")+'">';
  ticks(max,4).forEach(v=>{ const y=Y(v);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--grid);stroke-width:1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--ink-3);font:400 10.5px var(--f-m);font-variant-numeric:tabular-nums">'+fmtK(v)+'</text>'; });
  rows.forEach((r,i)=>{
    const cx=L+band*i+band/2; let acc=0;
    const parts=series.map(k=>({k,v:r[k.key]||0})).filter(p=>p.v>0);
    parts.forEach((p,j)=>{
      const h=(p.v/max)*(H-T-B); const yTop=Y(acc+p.v); const isTop=j===parts.length-1;
      const hh=Math.max(1,h-(j<parts.length-1?GAP:0));
      s+= isTop ? '<path d="'+pathTop(cx-bw/2,yTop,bw,Math.max(1,h),4)+'" style="fill:'+p.k.color+'"/>'
                : '<rect x="'+(cx-bw/2)+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" style="fill:'+p.k.color+'"/>';
      acc+=p.v; });
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--ink-3);font:400 10.5px var(--f)">'+esc(r.label)+'</text>';
    const tip=esc(r.label)+" — "+fmt(tot(r))+"|"+series.map(k=>esc(k.n)+" "+fmtN(r[k.key]||0)).join(" · ");
    s+='<rect x="'+(cx-band/2)+'" y="'+T+'" width="'+band+'" height="'+(H-T-B)+'" style="fill:transparent" data-tip="'+tip+'"'+attrLeitura(r)+'/>'; });
  if(ref>0){ const y=Y(ref);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" style="stroke:var(--bad);stroke-width:2;stroke-linecap:round"/>';
    s+='<text x="'+W+'" y="'+(y-6)+'" text-anchor="end" style="fill:var(--ink-2);font:600 10.5px var(--f)">teto '+fmtK(ref)+'</text>'; }
  return s+'</svg>'; }

/* leitura do empilhado do comprometido: o que pesa em cada mês e o que isso sobra da renda */
function compromissoLido(fut,ym0){
  const linhas=fut.map(f=>({label:ymLabel(f.ym).split(" ")[0],nome:ymLabel(f.ym),ym:f.ym,
    once:f.once,fix:f.fix,parc:f.parc,v:f.total}));
  linhas.forEach((r,i)=>{ const renda=rendaPrevista(r.ym), sobra=renda-r.v;
    const partes=[["parcelas de compras",r.parc],["gastos fixos",r.fix],["gastos à vista já lançados",r.once]]
      .filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const f=[];
    f.push("Em "+r.nome+", "+fmt(r.v)+" já tem dono antes de você gastar mais nada.");
    if(partes.length) f.push("O maior pedaço são "+partes[0][0]+" ("+fmtN(partes[0][1])+")"+
      (partes[1]?", depois "+partes[1][0]+" ("+fmtN(partes[1][1])+")":"")+".");
    if(renda>0) f.push(sobra>=0?"Da renda prevista de "+fmtN(renda)+" sobram "+fmtN(sobra)+" para o resto do mês, "+Math.round(r.v/renda*100)+"% já comprometidos."
      :"Isso passa a renda prevista de "+fmtN(renda)+" em "+fmtN(-sobra)+".");
    if(i>0) f.push("Contra "+linhas[i-1].nome+" ("+fmtN(linhas[i-1].v)+"), "+maisOuMenos(r.v,linhas[i-1].v)+".");
    if(i<linhas.length-1&&linhas[i+1].parc<r.parc) f.push("Em "+linhas[i+1].nome+" as parcelas caem para "+fmtN(linhas[i+1].parc)+": alguma coisa termina aqui.");
    r.leitura=f.join(" "); r.leituraT=r.nome; });
  return linhas; }
function resumoCompromisso(linhas){
  if(linhas.length<2) return "";
  const pico=linhas.reduce((a,b)=>b.v>a.v?b:a), leve=linhas.reduce((a,b)=>b.v<a.v?b:a);
  const f=["<b>O que este gráfico diz</b>"];
  f.push("O mês mais pesado à frente é "+pico.nome+", com "+fmtN(pico.v)+" já comprometidos; o mais leve é "+leve.nome+", com "+fmtN(leve.v)+".");
  const r0=rendaPrevista(linhas[0].ym);
  if(r0>0) f.push("Em "+linhas[0].nome+" isso é "+Math.round(linhas[0].v/r0*100)+"% da renda prevista.");
  const cai=linhas.find((r,i)=>i>0&&r.parc<linhas[i-1].parc-1000);
  if(cai) f.push("As parcelas afrouxam a partir de "+cai.nome+".");
  return '<div class="cardbox-s" style="margin:10px 0 0">'+f.join(" ")+' <i>Toque numa coluna para entender aquele mês.</i></div>'; }

/* um só ouvinte para a página inteira: espera 3s parado no mouse, 0,6s no toque longo */
(function(){
  const caixa=()=>$("#dica");
  let t=null, alvo=null;
  const esconde=()=>{ if(t){ clearTimeout(t); t=null; } alvo=null; const c=caixa(); if(c) c.hidden=true; };
  const mostra=(el,x,y)=>{ const c=caixa(); if(!c) return;
    c.innerHTML='<b>'+esc((el.dataset.dicaT||el.textContent||"").trim().slice(0,60))+'</b>'+esc(el.dataset.dica);
    c.hidden=false;
    const r=c.getBoundingClientRect();
    c.style.left=Math.max(r.width/2+8,Math.min(innerWidth-r.width/2-8,x))+"px";
    c.style.top=Math.max(r.height+10,y-12)+"px"; };
  document.addEventListener("mouseover",e=>{ const el=e.target.closest&&e.target.closest("[data-dica]");
    if(!el||el===alvo) return; esconde(); alvo=el;
    t=setTimeout(()=>{ const b=el.getBoundingClientRect(); mostra(el,b.left+b.width/2,b.top); },3000); });
  document.addEventListener("mouseout",e=>{ const el=e.target.closest&&e.target.closest("[data-dica]");
    if(el&&el===alvo) esconde(); });
  document.addEventListener("scroll",esconde,true);
  document.addEventListener("touchstart",e=>{ const el=e.target.closest&&e.target.closest("[data-dica]");
    if(!el) return; esconde(); alvo=el;
    const p=e.touches&&e.touches[0];
    t=setTimeout(()=>{ mostra(el,p?p.clientX:innerWidth/2,p?p.clientY:120); },600); },{passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>document.addEventListener(ev,esconde,{passive:true}));
})();

/* =================== leitura dos gráficos ===================
   Pedido do dono (27/09/2026): "nos gráficos, você explicasse os gráficos, interpretando os dados
   reais dele; se clicar em algum ponto, você desse a interpretação daquele dado". Cada ponto leva
   um data-leitura pronto; o resumo embaixo do gráfico é montado dos mesmos números. */
const attrLeitura=r=>r&&r.leitura?' data-leitura="'+esc(r.leitura)+'" data-lt="'+esc(r.leituraT||r.label||"")+'" style="cursor:pointer"':"";
const maisOuMenos=(a,b)=>{ if(!b) return ""; const p=Math.round((a-b)/b*100);
  return p===0?"na mesma":(p>0?p+"% acima":Math.abs(p)+"% abaixo"); };
const media=vs=>vs.length?vs.reduce((x,y)=>x+y,0)/vs.length:0;
/* série no tempo (meses ou dias): compara com o anterior, com a média e com o teto */
function leituraSerie(rows,i,opt){
  opt=opt||{}; const r=rows[i], vs=rows.map(x=>x.v), m=media(vs);
  const max=Math.max.apply(null,vs), min=Math.min.apply(null,vs);
  const f=[]; f.push((opt.oque||"Foram")+" "+fmt(r.v)+" em "+(r.nome||r.label)+".");
  if(i>0) f.push("Contra "+(rows[i-1].nome||rows[i-1].label)+" ("+fmtN(rows[i-1].v)+"), "+maisOuMenos(r.v,rows[i-1].v)+".");
  if(rows.length>2) f.push("A média dos "+rows.length+" meses do gráfico é "+fmtN(m)+", então este mês está "+maisOuMenos(r.v,m)+".");
  if(r.v===max&&rows.length>1) f.push("É o maior do período.");
  else if(r.v===min&&rows.length>1) f.push("É o menor do período.");
  if(opt.ref>0) f.push(r.v>opt.ref?"Passou do teto de "+fmtN(opt.ref)+" em "+fmtN(r.v-opt.ref)+".":"Ficou "+fmtN(opt.ref-r.v)+" dentro do teto de "+fmtN(opt.ref)+".");
  if(opt.extra&&opt.extra(r)) f.push(opt.extra(r));
  return f.join(" "); }
function resumoSerie(rows,opt){
  opt=opt||{}; if(rows.length<2) return "";
  const vs=rows.map(r=>r.v), m=media(vs), u=rows[rows.length-1], a=rows[rows.length-2];
  const max=rows.reduce((x,y)=>y.v>x.v?y:x), min=rows.reduce((x,y)=>y.v<x.v?y:x);
  const f=["<b>O que este gráfico diz</b>"];
  f.push((u.nome||u.label)+" fechou em "+fmtN(u.v)+", "+maisOuMenos(u.v,a.v)+" de "+(a.nome||a.label)+
    " e "+maisOuMenos(u.v,m)+" da média do período ("+fmtN(m)+").");
  if(max.v!==min.v) f.push("O maior foi "+(max.nome||max.label)+" ("+fmtN(max.v)+") e o menor, "+(min.nome||min.label)+" ("+fmtN(min.v)+").");
  if(opt.ref>0){ const passou=rows.filter(r=>r.v>opt.ref).length;
    f.push(passou?passou+(passou>1?" desses meses passaram":" desses meses passou")+" do teto de "+fmtN(opt.ref)+".":"Nenhum deles passou do teto de "+fmtN(opt.ref)+"."); }
  if(opt.fim) f.push(opt.fim);
  return '<div class="cardbox-s" style="margin:10px 0 0">'+f.join(" ")+' <i>Toque numa barra para entender aquele mês.</i></div>'; }
/* fatias: o peso de cada uma dentro do total */
function leituraFatia(r,total,opt){
  opt=opt||{}; const f=[];
  f.push(r.label+": "+fmt(r.v)+(total?", "+Math.round(r.v/total*100)+"% "+(opt.de||"do total do mês"):"")+".");
  if(opt.lugar) f.push(opt.lugar);
  if(r.limit>0) f.push(r.v>r.limit?"Passou do limite de "+fmtN(r.limit)+" que você definiu, em "+fmtN(r.v-r.limit)+".":"O limite que você definiu é "+fmtN(r.limit)+"; sobra "+fmtN(r.limit-r.v)+".");
  if(opt.media>0) f.push("Nos meses anteriores a média desta categoria é "+fmtN(opt.media)+", então está "+maisOuMenos(r.v,opt.media)+".");
  if(opt.extra) f.push(opt.extra);
  return f.join(" "); }
function resumoFatias(rows,total,opt){
  opt=opt||{}; if(!rows.length) return "";
  const o=rows.slice().sort((a,b)=>b.v-a.v), top=o[0];
  const tres=o.slice(0,3), soma=tres.reduce((s,r)=>s+r.v,0);
  const f=["<b>O que este gráfico diz</b>"];
  f.push("O maior peso é "+top.label+", com "+fmtN(top.v)+(total?" ("+Math.round(top.v/total*100)+"% "+(opt.de||"do mês")+")":"")+".");
  if(o.length>2&&total) f.push("As três maiores — "+tres.map(r=>r.label).join(", ")+" — somam "+fmtN(soma)+", "+Math.round(soma/total*100)+"% do total.");
  const estourou=rows.filter(r=>r.limit>0&&r.v>r.limit);
  if(estourou.length) f.push(estourou.length===1?estourou[0].label+" passou do limite que você definiu.":estourou.length+" categorias passaram do limite que você definiu.");
  if(opt.fim) f.push(opt.fim);
  return '<div class="cardbox-s" style="margin:10px 0 0">'+f.join(" ")+' <i>Toque numa barra para entender aquela categoria.</i></div>'; }

/* =================== painel =================== */
function tone(v,limit){ return v>limit?"bad":v>limit*0.85?"warn":""; }
/* melhor cartão para comprar hoje: o que demora mais para cobrar. A compra de hoje entra na fatura que ainda
   vai fechar; essa fatura vence no dia do vencimento — no mês seguinte, quando o vencimento vem antes do fechamento. */
function prazoCartao(c,hoje){
  if(!c.due||(!c.closing&&!c.proxFecha)) return null;
  const Y=+hoje.slice(0,4), M=+hoje.slice(5,7), D=+hoje.slice(8,10);
  let fy=Y, fm=M, exata=false;
  if(c.closing&&D>c.closing){ fm++; if(fm>12){ fm=1; fy++; } }
  let fecha=fy+"-"+pad(fm)+"-"+pad(Math.min(c.closing||28,new Date(fy,fm,0).getDate()));
  /* a própria fatura diz quando fecha a próxima: enquanto essa data não passou, é ela que vale */
  if(c.proxFecha&&c.proxFecha>=hoje&&c.proxFecha<=fecha){ fecha=c.proxFecha; fy=+fecha.slice(0,4); fm=+fecha.slice(5,7); exata=true; }
  else if(c.proxFecha&&c.proxFecha>=hoje&&!c.closing){ fecha=c.proxFecha; fy=+fecha.slice(0,4); fm=+fecha.slice(5,7); exata=true; }
  let py=fy, pm=fm;
  if(c.due<=+fecha.slice(8,10)){ pm++; if(pm>12){ pm=1; py++; } }
  const paga=py+"-"+pad(pm)+"-"+pad(Math.min(c.due,new Date(py,pm,0).getDate()));
  const dias=Math.round((Date.parse(paga+"T12:00:00")-Date.parse(hoje+"T12:00:00"))/86400000);
  return {fecha,paga,dias,exata,fat:fy+"-"+pad(fm),melhor:(c.melhorDia&&c.melhorDia>=hoje)?c.melhorDia:""}; }
function melhoresCartoes(){
  const hoje=todayISO();
  return creditCards().map(c=>{ const p=prazoCartao(c,hoje), livre=c.limit?Math.max(0,c.limit-cardOwed(c.id)):null;
    return {c,p,livre}; })
    .sort((a,b)=>{ const fa=a.livre!==null&&a.livre<=0, fb=b.livre!==null&&b.livre<=0;
      if(fa!==fb) return fa?1:-1;
      if(!a.p||!b.p) return a.p?-1:b.p?1:0;
      return b.p.dias-a.p.dias; }); }
function htmlMelhorCartao(){
  const L=melhoresCartoes(); if(!L.length) return "";
  const comData=L.filter(x=>x.p);
  const diaMes2=d=>d.slice(8,10)+"/"+d.slice(5,7);
  const linha=x=>'<div class="linkrow"><div class="m"><div class="t">'+esc(x.c.n)+'</div><div class="s">'+
    (x.p?"fecha "+diaMes2(x.p.fecha)+" · paga "+diaMes2(x.p.paga)+(x.livre!==null?" · livre "+fmtN(x.livre):"")
       :"informe o fechamento e o vencimento em Ajustes")+'</div></div>'+
    '<span class="row-v">'+(x.p?x.p.dias+(x.p.dias===1?" dia":" dias"):"—")+'</span></div>';
  const top=comData.find(x=>!(x.livre!==null&&x.livre<=0))||comData[0];
  return '<div class="sec"><div class="card pad">'+
    '<div class="tile-l">Melhor cartão para comprar hoje</div>'+
    (top
      ? '<span class="tile-v" style="font-size:26px">'+esc(top.c.n)+'</span>'+
        '<div class="tile-s">A compra de hoje entra na fatura de '+esc(ymLabel(top.p.fat))+', que fecha em '+diaMes2(top.p.fecha)+
        (top.p.exata?" (data impressa na fatura)":"")+' e vence em '+diaMes2(top.p.paga)+': são <b>'+top.p.dias+(top.p.dias===1?" dia":" dias")+'</b> até o dinheiro sair da conta.'+
        (top.livre!==null?" Limite livre de "+fmtN(top.livre)+".":"")+
        (top.p.melhor?" O banco indica "+diaMes2(top.p.melhor)+" como melhor data de compra.":"")+'</div>'
      : '<span class="tile-v" style="font-size:20px">Falta o fechamento</span>'+
        '<div class="tile-s">Informe o dia de fechamento e o de vencimento de cada cartão em Ajustes → Formas de pagamento.</div>')+
    (L.length>1?'<div style="margin-top:10px">'+L.map(linha).join("")+'</div>':'')+
    '</div></div>'; }

/* logo de cara no Painel: quanto tem no banco, conta por conta, e quanto já foi lançado em cada cartão */
function htmlBancoCartoes(){
  const hoje=todayISO(), A=S.cfg.accounts||[];
  const linha=(nome,valor,sub,attr)=>'<div class="linkrow'+(attr?' clicavel':'')+'"'+(attr||"")+'><div class="m"><div class="t">'+esc(nome)+'</div>'+
    (sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div><span class="row-v'+(valor<0?' neg':'')+'">'+fmtN(valor)+'</span></div>';
  const contas=A.map(a=>({a, v:balanceOf(a.id,hoje)}));
  const banco=contas.filter(x=>x.a.type!=="carteira").reduce((s,x)=>s+x.v,0);
  const C=creditCards().map(c=>({c, fat:cardInvoice(c.id,S.ym).total, devo:cardOwed(c.id)}));
  const totalFat=C.reduce((s,x)=>s+x.fat,0);
  return '<div class="sec"><div class="grid g2">'+
    '<div class="card pad"><div class="tile-l">No banco hoje</div>'+
    '<span class="tile-v" style="font-size:30px;color:'+(banco<0?"var(--bad)":"var(--ink)")+'">'+fmt(banco)+'</span>'+
    '<div class="tile-s" style="margin-bottom:8px">Somando as contas; o dinheiro da carteira aparece à parte.</div>'+
    (contas.length?contas.map(x=>{ const t=ACCT_TIPO[x.a.type]||x.a.type;
      return linha(x.a.n,x.v,norm(t)===norm(x.a.n)?"":t,' data-irext="'+x.a.id+'"'); }).join("")
      :'<div class="empty" style="padding:14px">Cadastre suas contas em Ajustes.</div>')+
    '</div>'+
    '<div class="card pad"><div class="tile-l">Lançado nos cartões · fatura de '+esc(ymLabel(S.ym))+'</div>'+
    '<span class="tile-v" style="font-size:30px">'+fmt(totalFat)+'</span>'+
    '<div class="tile-s" style="margin-bottom:8px">Compra no crédito só sai da conta quando a fatura é paga.</div>'+
    (C.length?C.map(x=>linha(x.c.n,x.fat,
      "em aberto "+fmtN(x.devo)+(x.c.limit?" · livre "+fmtN(Math.max(0,x.c.limit-x.devo)):""),
      ' data-irext="card:'+x.c.id+'"')).join("")
      :'<div class="empty" style="padding:14px">Cadastre seus cartões em Ajustes.</div>')+
    '</div></div></div>'; }

function renderPainel(){
  const st=monthStats(S.ym), pr=projectMonth(S.ym);
  const usado=st.spent+st.commit, pctTeto=st.cap?Math.min(100,usado/st.cap*100):0;
  const cls=st.cap?tone(usado,st.cap):"";
  const availColor=st.avail<0?"var(--bad)":"var(--ink)";

  /* o mais básico primeiro: dinheiro no banco e o que já está lançado em cada cartão */
  let html=htmlBancoCartoes()+htmlMelhorCartao();

  /* hero + tiles */
  html+='<div class="sec"><div class="grid g23">'+
    '<div class="hero"><div class="hero-l">Disponível até o fim de '+esc(ymLabel(S.ym))+'</div>'+
    '<span class="hero-v" style="color:'+availColor+'">'+fmt(st.avail)+'</span>'+
    '<div class="hero-s">'+(st.cap?("Teto de "+fmt(st.cap)+" · já usou "+fmt(usado)):"Defina seu teto em Ajustes")+'</div>'+
    (st.cap?'<div style="margin-top:13px"><div class="meter"><i class="'+cls+'" style="width:'+pctTeto+'%"></i></div>'+
      '<div class="meter-s"><span>'+Math.round(pctTeto)+'% do teto</span><span>'+
      (st.isCur&&st.left>0?fmt(Math.max(0,Math.round(st.perDay)))+" por dia · "+st.left+" dias":"")+'</span></div></div>':'')+
    '</div>'+
    '<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));align-content:start">'+
      tile("Gasto no mês",fmt(st.spent),st.dayNow>0?("Fecha em "+fmt(Math.round(st.pace))):"",st.cap&&st.pace>st.cap?"up":"flat")+
      tile("Entrou no mês",st.income?"+"+fmt(st.income):fmt(0),S.cfg.income&&!S.cfg.salPausa?("Previsto "+fmt(rendaPrevista(S.ym))):"","down")+
      tile("Saldo hoje",fmt(pr.hoje),(S.cfg.accounts||[]).length+" contas","flat")+
      tile("Previsto dia "+daysIn(S.ym),fmt(pr.fim),pr.goal?("Meta "+fmt(pr.goal)):"",pr.goal?(pr.fim>=pr.goal?"down":"up"):"flat")+
    '</div></div></div>';

  html+=htmlProximas(S.ym);

  /* onde o dinheiro está indo */
  const ents=Object.keys(st.byCat).map(id=>({id,v:st.byCat[id]})).sort((a,b)=>b.v-a.v);
  const tot=ents.reduce((s,e)=>s+e.v,0);
  /* média da categoria nos meses fechados, para a leitura comparar com o histórico */
  const hCat=historicoPlano();
  const mediaCat=id=>{ const c=hCat.cats.find(x=>x.id===id); return c?c.media:0; };
  let rows=ents.slice(0,8).map((e,i)=>{ const r={label:catName(e.id),v:e.v,pct:tot?Math.round(e.v/tot*100):0,
      limit:catLimit(e.id), tip:catName(e.id)+" — "+fmt(e.v)+(catLimit(e.id)?"|limite "+fmtN(catLimit(e.id)):"")};
    r.leitura=leituraFatia(r,tot,{de:"de tudo o que saiu em "+ymLabel(S.ym), media:mediaCat(e.id),
      lugar:i===0?"É a maior do mês.":(i+1)+"ª maior do mês.",
      extra:"No método 50-30-20 ela conta como "+NOMES_GRUPO[grupoDe(e.id)]+"."});
    return r; });
  if(ents.length>8){ const resto=ents.slice(8).reduce((s,e)=>s+e.v,0);
    rows.push({label:"Outras ("+(ents.length-8)+")",v:resto,pct:tot?Math.round(resto/tot*100):0,
      tip:"Outras categorias — "+fmt(resto),
      leitura:"As outras "+(ents.length-8)+" categorias somam "+fmt(resto)+", "+(tot?Math.round(resto/tot*100):0)+"% do mês. Nenhuma delas isolada chega às oito maiores."}); }

  html+='<div class="sec"><div class="grid g23">'+
    '<div class="card pad chart"><div class="ch-h"><span class="ch-t">Onde meu dinheiro está indo</span></div>'+
    '<div class="ch-s">'+esc(ymLabel(S.ym))+' · '+fmt(tot)+' no total. O traço cinza é o limite que você definiu para a categoria.</div>'+
    chartBarsH(rows,{alt:"Gastos por categoria"})+
    resumoFatias(rows,tot,{de:"do mês",fim:st.cap?("O mês todo soma "+fmtN(tot)+" contra um teto de "+fmtN(st.cap)+"."):""})+
    tableView(["Categoria","Valor","% do total"],ents.map(e=>[catName(e.id),fmtN(e.v),(tot?Math.round(e.v/tot*100):0)+"%"]))+
    '</div>'+
    '<div><div class="sec-h"><h2 class="sec-t">O que salta aos olhos</h2></div>'+insHTML(buildInsights(S.ym))+'</div>'+
    '</div></div>';

  /* ritmo + histórico */
  const hist=pastMonths(6);
  html+='<div class="sec"><div class="grid g2">'+
    '<div class="card pad chart"><div class="ch-h"><span class="ch-t">Ritmo do mês</span></div>'+
    '<div class="ch-s">Sua curva de gasto acumulado contra o ritmo que cabe no teto.</div>'+
    chartPace(S.ym)+
    '<div class="legend"><span class="lg"><i style="background:var(--accent)"></i>Acumulado</span>'+
    '<span class="lg"><i style="background:var(--ink-3)"></i>Ritmo do teto</span></div></div>'+
    '<div class="card pad chart"><div class="ch-h"><span class="ch-t">Últimos 6 meses</span></div>'+
    '<div class="ch-s">Quanto saiu por mês, contra a linha do teto.</div>'+
    (()=>{ const linhas=hist.map(h=>({label:ymLabel(h.ym).split(" ")[0],nome:ymLabel(h.ym),v:h.gasto,renda:h.renda,
        tip:ymLabel(h.ym)+" — "+fmt(h.gasto)}));
      linhas.forEach((r,i)=>{ r.leituraT=r.nome;
        r.leitura=leituraSerie(linhas,i,{oque:"Saíram",ref:S.cfg.cap||0,
          extra:x=>x.renda?("Entraram "+fmtN(x.renda)+" nesse mês, então "+(x.v>x.renda?"o mês fechou no vermelho em "+fmtN(x.v-x.renda):"sobraram "+fmtN(x.renda-x.v))+"."):""}); });
      return chartCols(linhas,{ref:S.cfg.cap||0,alt:"Gasto dos últimos seis meses"})+
        resumoSerie(linhas,{ref:S.cfg.cap||0}); })()+
    tableView(["Mês","Gasto","Entrou"],hist.map(h=>[ymLabel(h.ym),fmtN(h.gasto),fmtN(h.renda)]))+
    '</div></div></div>';

  /* comprometido à frente */
  const SER=[{key:"once",n:"À vista",color:"var(--c1)"},{key:"fix",n:"Fixos",color:"var(--c2)"},{key:"parc",n:"Parcelas",color:"var(--c3)"}];
  const fut=futureMonths(6,ymOf(todayISO()));
  html+='<div class="sec"><div class="card pad chart">'+
    '<div class="ch-h"><span class="ch-t">Quanto do futuro já está comprometido</span></div>'+
    '<div class="ch-s">Parcelas e gastos fixos que já estão reservados nos próximos meses, antes de você gastar mais nada.</div>'+
    (()=>{ const L=compromissoLido(fut);
      return chartStack(L,SER,{ref:S.cfg.cap||0,alt:"Comprometido nos próximos seis meses"})+
        legendHTML(SER)+resumoCompromisso(L); })()+
    tableView(["Mês","À vista","Fixos","Parcelas","Total"],
      fut.map(f=>[ymLabel(f.ym),fmtN(f.once),fmtN(f.fix),fmtN(f.parc),fmtN(f.total)]))+
    '</div></div>';

  $("#p-painel").innerHTML=topNotices()+html; bindInstall(); bindContas($("#p-painel"));
  $$("[data-irext]").forEach(b=>b.onclick=()=>{ S.ext=b.dataset.irext; setView("contas");
    setTimeout(()=>{ const x=$("#extSec"); if(x) x.scrollIntoView({behavior:"smooth",block:"start"}); },60); });
  bindTips($("#p-painel"));
}
function tile(l,v,d,dir){
  return '<div class="tile"><div class="tile-l">'+esc(l)+'</div><span class="tile-v">'+esc(v)+'</span>'+
    (d?'<div class="tile-d '+(dir||"flat")+'">'+esc(d)+'</div>':'')+'</div>'; }
function insHTML(list){
  const ic={good:'<path d="M20 6L9 17l-5-5"/>',warn:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    bad:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>',
    "":'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'};
  if(!list.length) return "";
  return '<div class="ins">'+list.map(x=>'<div class="ins-r"><span class="ins-i '+(x.tone||"")+'">'+
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic[x.tone||""]+'</svg>'+
    '</span><span class="ins-m"><span class="ins-t">'+esc(x.t)+'</span><span class="ins-s">'+x.s+'</span></span></div>').join("")+'</div>'; }
/* =================== linhas de extrato =================== */
function catColorOf(t){ return t.k==="e"?"var(--good)":(t.k==="p"||t.k==="t")?"var(--ink-3)":"var(--accent)"; }
function rowHTML(t){
  const isE=t.k==="e",isP=t.k==="p",isT=t.k==="t";
  const meio = isP ? "Fatura de "+ymLabel(t.ref||t.ym)+" · sai de "+acctName(t.acct)
    : isT ? (t.aj?acctName(t.acct||t.acct2):acctName(t.acct)+" → "+acctName(t.acct2))
    : isE ? "cai em "+acctName(t.acct||acctOf(t.card))
    : (cardName(t.card)||METODOS[t.method]||(t.method==="folha"?"Desconto em folha":""))+(t.to?" · para "+t.to:"");
  const rot = t.aj?(isT?"Acerto de saldo":"Acerto da fatura"):isP?"Pagamento de fatura":isT?"Entre contas":catLabel(t);
  return '<button class="row" data-ym="'+t.ym+'" data-id="'+t.id+'">'+
    '<span class="dot" style="background:'+catColorOf(t)+'"></span>'+
    '<span class="row-m"><span class="row-d">'+esc(t.desc)+'</span><span class="row-s"><span>'+esc(rot)+
    '</span><span>·</span><span>'+esc(meio)+'</span>'+
    (t.d>todayISO()?'<span class="chip hoje">agendado</span>':'')+
    (t.k==="g"&&t.method==="credito"?'<span class="chip c">crédito · não sai da conta</span>':'')+
    (t.k==="g"&&t.method==="debito"?'<span class="chip d">débito</span>':'')+
    (t.n>1?'<span class="chip p">'+t.i+"/"+t.n+'</span>':'')+
    (t.fix?'<span class="chip f">fixo</span>':'')+'</span></span>'+
    '<span class="row-v'+(isE?" plus":(isP||isT)?" pay":"")+'">'+(isE?"+":"")+fmtN(t.v)+'</span></button>'; }
const bindRows=root=>$$(".row",root).forEach(b=>b.onclick=()=>openTx(b.dataset.ym,b.dataset.id));

function renderLancar(){
  const hoje=todayISO(), list=txOf(ymOf(hoje)).filter(t=>t.d===hoje);
  const g=list.filter(t=>t.k==="g").reduce((s,t)=>s+t.v,0);
  const e=list.filter(t=>t.k==="e").reduce((s,t)=>s+t.v,0);
  $("#p-lancar").innerHTML=
    htmlMelhorCartao()+
    '<div class="sec"><div class="sec-h"><h2 class="sec-t">Lançar por fala</h2>'+
    '<button class="sec-a" id="exBtn">Ver exemplo</button></div>'+
    '<div class="say-box"><textarea id="say" rows="3" placeholder="Fale ou escreva. Ex.: vinte e três reais, almoço no IFSC, cartão de crédito Visa."></textarea>'+
    '<div class="say-bar"><span class="say-hint" id="sayHint">Toque no <kbd>🎤</kbd> do teclado e fale. Separe lançamentos com ponto final.</span>'+
    '<button class="btn ghost sm" id="micBtn" hidden>Microfone</button>'+
    '<button class="btn ghost sm" id="aiBtn" hidden>Usar IA</button>'+
    '<button class="btn" id="readBtn">Ler</button></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
    '<button class="btn good" id="entBtn">+ Entrada (salário, freela…)</button>'+
    '<button class="btn ghost" id="gasBtn">+ Gasto na mão</button>'+
    '<button class="btn ghost" id="trfBtn">Transferir entre contas</button></div>'+
    htmlLeitorDoc("extrato")+htmlLeitorDoc("gastos")+htmlDividasLancar()+
    '<div id="parseStatus" style="font-size:12px;color:var(--ink-3);margin-top:10px" hidden></div></div>'+
    '<div class="sec" id="draftSec" hidden><div class="sec-h"><h2 class="sec-t">Confira antes de salvar</h2></div>'+
    '<div id="drafts"></div><div class="sheet-acts" style="max-width:420px">'+
    '<button class="btn ghost" id="dCancel">Descartar</button><button class="btn" id="dSave">Salvar</button></div></div>'+
    '<div class="sec"><div class="sec-h"><h2 class="sec-t">Lançado hoje</h2><span class="day-t">'+
    (g?fmt(g):"")+(e?(g?"  ":"")+"+"+fmt(e):"")+'</span></div>'+
    (list.length?'<div class="card pad">'+list.map(rowHTML).join("")+'</div>'
      :'<div class="empty"><b>Nada lançado hoje</b>Diga o valor, onde foi e como pagou.<br>Entrada também: “caiu o salário, dezesseis mil”.</div>')+
    '</div>';
  bindRows($("#p-lancar"));
  $("#readBtn").onclick=readInput;
  $("#dSave").onclick=saveDrafts;
  $("#dCancel").onclick=()=>{ S.drafts=[]; render(); };
  $("#entBtn").onclick=()=>openManual("e");
  $("#gasBtn").onclick=()=>openManual("g");
  $("#trfBtn").onclick=openTransfer; montarLeitorDoc();
  $$("[data-divnova]",$("#p-lancar")).forEach(b=>b.onclick=()=>openDivida(""));
  $$("[data-div]",$("#p-lancar")).forEach(b=>b.onclick=()=>openDivida(b.dataset.div));
  $$("[data-quit]",$("#p-lancar")).forEach(b=>b.onclick=()=>{ const dv=(S.cfg.dividas||[]).find(x=>x.id===b.dataset.quit); if(dv) openQuitacao(dv); });
  $("#aiBtn").hidden=!S.ai; $("#aiBtn").onclick=aiParse;

  setupMic();

      : '<div class="say-hint">Consignado, empréstimo ou financiamento: cadastre uma vez, com o valor da parcela e em qual parcela você está. O app lança sozinho todo mês e acompanha o saldo em Análises.</div>')+
    '</div>'; }

function renderDrafts(){
  const box=$("#drafts"); if(!box) return;
  $("#draftSec").hidden=!S.drafts.length;
  if(!S.drafts.length){ box.innerHTML=""; return; }
  const opt=(arr,sel)=>arr.map(o=>'<option value="'+o.id+'"'+(o.id===sel?" selected":"")+">"+esc(o.n)+"</option>").join("");
  box.innerHTML=S.drafts.map((d,i)=>
    '<div class="draft'+(d.v?(d.k==="e"?" ent":""):" bad")+'" data-i="'+i+'"><div class="draft-top">'+
    '<span class="draft-v"'+(d.k==="e"?' style="color:var(--good)"':'')+'>'+(d.v?(d.k==="e"?"+":"")+fmt(d.v):"—")+'</span>'+
    '<span class="draft-d">'+esc(d.desc||"Sem descrição")+'</span>'+
    '<button class="draft-x" data-x="'+i+'" aria-label="Remover">✕</button></div><div class="fields">'+
    '<div class="f"><label>Tipo</label><select data-k="k">'+[["g","Gasto"],["e","Entrada"],["p","Pagamento de fatura"],["t","Entre contas"]].map(o=>'<option value="'+o[0]+'"'+((d.k||"g")===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>'+
    '<div class="f"><label>Valor</label><input inputmode="decimal" data-k="v" value="'+(d.v?fmtN(d.v):"")+'"></div>'+

  $$(".draft",box).forEach(el=>{ const i=+el.dataset.i;
